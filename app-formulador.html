<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meta Formulador</title>
<meta name="theme-color" content="#052e16">
<link rel="icon" href="meta_logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#f3f6f3;--card:#fff;--border:#e2e8f0;--line:#f1f5f9;--text:#0f172a;--muted:#64748b;--faint:#94a3b8;
--G:#15803d;--GD:#052e16;--GL:#f0fdf4;--amber:#b45309;--amberL:#fffbeb;--red:#dc2626;--redL:#fef2f2;--blue:#2a78d6;
--c-F:#15803d;--c-SM:#65a30d;--c-C:#b45309;--c-P:#7c3aed;--c-X:#0891b2;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--G);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.inp,.sel,textarea.inp{border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:#fff;min-width:0}
.inp:focus,.sel:focus{border-color:var(--G);outline:none}
.btn{border:1px solid transparent;border-radius:9px;padding:8px 13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;justify-content:center}
.btn-g{background:var(--G);color:#fff}.btn-o{background:#fff;border-color:var(--border)}.btn-r{background:#fff;color:var(--red);border-color:#fecaca}
.btn-d{background:var(--GD);color:#fff}
.btn-sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.ico{background:none;border:none;color:var(--faint);padding:4px 6px;border-radius:6px;font-size:15px;line-height:1}.ico:hover{background:var(--line);color:var(--red)}
.ico svg{width:15px;height:15px;vertical-align:-2px}.ico.ed:hover{color:var(--G)}
/* login */
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px;background:var(--GD)}
.lb{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:360px}
.lb h1{font-size:20px;margin-bottom:4px}.lb p{color:var(--muted);font-size:13px;margin-bottom:14px}
.lb .inp{width:100%;padding:12px;margin-bottom:8px;font-size:15px}.lb .btn{width:100%;padding:12px;font-size:15px}
/* topo */
#app{display:none}
.top{background:var(--GD);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand b{font-size:16px}.brand span{font-size:11.5px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.top .btn-o{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.tabs{max-width:1440px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:none;color:#fff;opacity:.7;padding:10px 12px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{opacity:1;border-bottom-color:#4ade80}
.wrap{display:flex;align-items:flex-start;max-width:1600px;margin:0 auto}
main{flex:1;min-width:0;padding:16px 16px 80px}
#side{width:208px;flex-shrink:0;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;background:#fff;border-right:1px solid var(--border);padding:12px 8px}
#side .farm{font-size:11.5px;color:var(--muted);padding:4px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
#side .farm b{display:block;color:var(--text);font-size:13px;margin-top:2px}
#side button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;border-radius:9px;padding:9px 10px;font-weight:600;color:#334155;text-align:left;font-size:14px}
#side button svg{width:20px;height:20px;flex-shrink:0;color:var(--G)}
#side button:hover{background:var(--line)}
#side button.on{background:var(--GL);color:var(--GD);box-shadow:inset 3px 0 0 var(--G)}
#side .grp{font-size:10.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:12px 10px 4px}
@media(min-width:901px){.tabs{display:none}}
@media(max-width:900px){#side{display:none}}
/* barra de ferramentas (estilo AMTS) */
.ribbon{display:flex;gap:2px;flex-wrap:wrap;align-items:stretch;background:#fff;border:1px solid var(--border);border-radius:14px;padding:6px;margin-bottom:12px}
.ribbon .rb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;border-radius:9px;padding:7px 10px;min-width:76px;font-size:11.5px;font-weight:600;color:#334155;line-height:1.15;text-align:center}
.ribbon .rb svg{width:24px;height:24px;color:var(--G)}
.ribbon .rb:hover{background:var(--GL)}
.ribbon .rb.pri{background:var(--G);color:#fff}.ribbon .rb.pri svg{color:#fff}
.ribbon .rb:disabled{opacity:.4}
.ribbon .sep{width:1px;background:var(--border);margin:4px 4px}
.ribbon .grow{flex:1}
/* painel de dados (abas) */
.dtabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--border);margin:0 -16px 12px;padding:0 10px;scrollbar-width:none}
.dtabs button{background:none;border:none;border-bottom:3px solid transparent;padding:9px 11px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.dtabs button.on{color:var(--GD);border-bottom-color:var(--G)}
.kslim{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;margin-bottom:12px}
.kslim>div{background:#f8faf9;border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.kslim .l{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.kslim .v{font-family:var(--mono);font-weight:700;font-size:16px;white-space:nowrap}
.kslim .v.good{color:var(--G)}.kslim .v.bad{color:var(--red)}.kslim .v.warn{color:var(--amber)}
.cmsfoot{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 18px;font-size:12.5px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.cmsfoot div{display:flex;justify-content:space-between;gap:8px}.cmsfoot b{font-variant-numeric:tabular-nums}
.lotebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:8px 12px;background:#f8faf9;border:1px solid var(--line);border-radius:10px}
.lgrid{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:calc(100vh - 290px)}
.lgrid table{border-collapse:collapse;font-size:13px}
.lgrid th,.lgrid td{padding:4px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:right;white-space:nowrap}
.lgrid td.nm{text-align:left;position:sticky;left:0;background:#fff;z-index:1;min-width:210px;font-weight:500}
.lgrid tr.lh th{position:sticky;top:0;background:#f8fafc;z-index:2;font-size:13px;padding:9px 10px;cursor:pointer;width:190px;min-width:190px;text-align:center}
.lgrid tr.lh th:first-child{left:0;z-index:3}
.lgrid tr.lh th.sel{background:#fde68a;color:#78350f}
.lgrid td.sel{background:#fffbeb}
.lgrid tr.gh td{background:#eef6f1;font-weight:700;color:var(--GD);text-align:left;position:sticky;left:0}
.lgrid .inp{width:170px;padding:4px 6px;text-align:right;font-size:13px;border-color:transparent;background:transparent}
.lgrid .inp:hover{border-color:var(--border)}.lgrid .inp:focus{border-color:var(--G);background:#fff}
.lgrid .inp.txt{text-align:left;width:170px}
.lgrid select.inp{text-align:left}
.lgrid{display:inline-block;max-width:100%;vertical-align:top}
.vis-top{display:flex;gap:14px;align-items:center;margin-bottom:4px}
.vis-nota{display:flex;gap:12px;align-items:center}.vis-nota .l{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.vis-fora{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.vis-bul{display:flex;flex-direction:column;gap:2px}
.vb{display:grid;grid-template-columns:minmax(110px,1.1fr) minmax(90px,1.6fr) 104px 74px;gap:8px;align-items:center;background:none;border:none;border-radius:8px;padding:5px 6px;text-align:left;font-size:13px}
.vb:hover:not(:disabled){background:var(--GL)}.vb:disabled{cursor:default}
.vb .vv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.vb .vv small{font-weight:500;color:var(--faint);font-size:10.5px}
.vb .vv.ok{color:var(--G)}.vb .vv.lo{color:var(--red)}.vb .vv.hi{color:var(--amber)}
.vb .vr{font-size:11px;color:var(--faint);text-align:right;white-space:nowrap}
@media(max-width:560px){.vb{grid-template-columns:minmax(80px,1fr) minmax(60px,1fr) 88px}.vb .vr{display:none}}
.pilha{display:flex;border-radius:5px;overflow:hidden;background:#eef2f6;width:100%}.pilha i{display:block;height:100%}
.leg2{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin:5px 0 10px}.leg2 i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.vbar{margin-bottom:6px}.vbh{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:4px}
.vbr{display:grid;grid-template-columns:70px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}
.cmp-imp{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-start;background:var(--GL);border-radius:10px;padding:12px 14px;margin-top:12px}.cmp-imp .l{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}.cmp-imp .v{font-size:20px;font-weight:800;font-family:"JetBrains Mono",monospace}
table.cmpt td.good,.cmp-imp .good{color:var(--G);font-weight:700}table.cmpt td.bad,.cmp-imp .bad{color:var(--red);font-weight:700}
.rel-op{display:flex;flex-direction:column;gap:8px;margin-top:10px}.rel-b{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}.rel-b:hover:not(:disabled){border-color:var(--G);background:var(--GL)}.rel-b svg{width:26px;height:26px;color:var(--G);flex:none}.rel-b small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:1px}.rel-b:disabled{opacity:.5}
/* ===== área de formulação no estilo AMTS ===== */
.fx .card{border-radius:8px}
.stbar{display:flex;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.stbar>div{flex:1 1 96px;padding:6px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:96px}
.stbar>div:last-child{border-right:none}
.stbar .l{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.stbar .v{font-family:var(--mono);font-weight:700;font-size:15px;white-space:nowrap}.stbar .s{font-size:10.5px;color:var(--faint)}
.stbar .good .v{color:var(--G)}.stbar .bad .v{color:var(--red)}.stbar .warn .v{color:var(--amber)}
.stbar .bad{background:#fff5f5}.stbar .good{background:#f6fdf8}
.alert.slim{padding:6px 10px;font-size:12.5px;margin-bottom:8px;border-radius:8px;align-items:center}.alert.slim>div{flex:1}
.fx2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);gap:8px;align-items:start}
.fx2>div{min-width:0}
.fx-nut{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;margin-bottom:14px}
.fxc{padding:8px 10px}
.fxh{display:flex;align-items:center;gap:8px;padding:2px 2px 6px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:13.5px;flex-wrap:wrap}
.fxs{margin:0 0 6px}.fxs .inp{padding:6px 9px;font-size:13px}
.lnk{background:none;border:none;color:var(--G);font-weight:600;font-size:12px;padding:2px 4px}
.fx .tw{margin:0 -10px;padding:0 10px}
.fx table.ing{font-size:12.5px}
.fx table.ing th{background:#eef2f6;color:#475569;font-size:10.5px;padding:5px 4px;border-bottom:1px solid #cbd5e1;position:sticky;top:0}
.fx table.ing th{text-align:left}.fx table.ing th.r{text-align:right}
.fx table.ing td{padding:2px 4px;border-bottom:1px solid #eef2f6;height:30px}
.fx table.ing tbody tr:nth-child(even):not(.sub){background:#fafbfc}
.fx table.ing tbody tr:hover:not(.sub){background:#f0fdf4}
.fx table.ing tr.zero .n{color:var(--muted)}
.fx table.ing .inp{padding:3px 5px;height:25px;border-radius:5px;font-size:12.5px;width:58px}
.fx table.ing .inp.q{width:70px;font-weight:700;background:#fffbea;border-color:#e5d38a}
.fx table.ing .inp.w{width:50px;color:#475569}
.fx table.ing .inp.p{width:58px}
.fx table.ing td.nm{min-width:160px;max-width:260px}
.fx table.ing tfoot td{background:#eef2f6;font-weight:800;border-top:1px solid #cbd5e1}
.fx .cmsfoot{font-size:12px;margin-top:6px;padding-top:6px}
.fx-nut .rs{grid-template-columns:minmax(0,1fr) 54px 62px 54px 26px;gap:0 6px;font-size:12.5px}
.fx-nut .rs>*{padding:3px 0;border-bottom:1px solid #f1f5f9;min-height:26px;display:flex;align-items:center}
.fx-nut .rs>.val,.fx-nut .rs>.r,.fx-nut .rs>.h.r{justify-content:flex-end}
.fx-nut .rs .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:5px}
.fx-nut .rs .nm.cmsr{white-space:normal}
.fx-nut .rs .inp{padding:2px 4px;height:23px;font-size:12px;border-radius:5px}
.fx-nut .rs .h{background:#eef2f6;padding:5px 2px;border-bottom:1px solid #cbd5e1;position:sticky;top:-8px;z-index:1}
.fx-nut .rs .gh{grid-column:1/-1;background:#f8fafc;color:var(--GD);font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:5px 4px;border-bottom:1px solid var(--line);min-height:0}
.fx-nut .rs .val{flex-direction:column;align-items:flex-end;justify-content:center}
.pill.sm button{padding:3px 9px;font-size:11.5px}
@media(max-width:1100px){.fx2{grid-template-columns:1fr}.fx-nut{position:static;max-height:none}}
@media(max-width:560px){.stbar .l{white-space:normal}.fx table.ing td.nm{min-width:0;max-width:150px}.fx table.ing .org{display:none}.fx .mm{display:none}.fx .showlim .mm{display:table-cell}.stbar>div{flex-basis:30%;min-width:0;padding:5px 7px}.stbar .v{font-size:13.5px}.fx-nut .rs{grid-template-columns:minmax(0,1fr) 48px 56px 48px 24px}}
.hchips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}.hchips button{background:#fff;border:1px solid var(--border);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;color:var(--muted)}.hchips button.on{background:var(--GL);border-color:var(--G);color:var(--GD)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.hcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px 4px}.hct{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:600}.hct b{font-family:var(--mono);font-size:16px}
.hpt:hover circle:last-of-type{r:6}
table.htab td.up,table.htab span.up{color:var(--blue)}table.htab td.dn,table.htab span.dn{color:var(--amber)}table.htab td.up,table.htab td.dn{font-weight:700}
table.htab th .lnk{padding:0;font-size:inherit}
.cmsg{display:grid;grid-template-columns:minmax(140px,1.4fr) 56px 52px 84px minmax(90px,1.4fr);gap:0 10px;align-items:center;font-size:12.5px}
.cmsg>*{padding:5px 0;border-bottom:1px solid #f1f5f9;min-height:30px;display:flex;align-items:center}.cmsg .r{justify-content:flex-end}
.cmsg .h{background:#eef2f6;font-size:10.5px;font-weight:700;color:#475569;text-transform:uppercase;padding:5px 2px;min-height:0;border-bottom:1px solid #cbd5e1}
.cmsg .nm{gap:5px;flex-wrap:wrap}.cmsg .nm.alvo{font-weight:700}.cmsg .tot{font-weight:800;background:#f8fafc}
.cmsg .st-hi{color:var(--red)}.cmsg .st-lo{color:var(--amber)}.cmsg .st-ok{color:var(--G)}
.cbar{position:relative;height:14px;background:#f1f5f9;border-radius:4px;min-height:0!important;padding:0!important;align-self:center}
.cbar i{position:absolute;top:0;bottom:0;left:0;border-radius:4px}.cbar i.pr{background:#cbd5e1}.cbar i.dp{background:repeating-linear-gradient(45deg,#e2e8f0 0 3px,#cbd5e1 3px 6px);border-radius:0 4px 4px 0}
.cbar .mk{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;border-radius:2px;background:var(--G)}.cbar .mk.st-hi{background:var(--red)}.cbar .mk.st-lo{background:var(--amber)}
#fx-cms .card{margin-top:0}
@media(max-width:560px){.cmsg{grid-template-columns:minmax(0,1fr) 52px 0 70px;}.cmsg>:nth-child(5n){display:none}.cmsg>:nth-child(5n+3){visibility:hidden}}
.mixt{width:18px;height:18px;border:1px solid var(--border);border-radius:4px;background:#fff;font-weight:800;font-size:12px;line-height:14px;padding:0;color:var(--GD);flex:none}
.fx table.ing tr.sub td{background:#f7faf7;height:27px}.fx table.ing tr.sub .inp{height:22px;font-size:12px}.fx table.ing .inp.q.sub{background:#fff;border-color:var(--border);font-weight:600}
.fx table.ing tr.mixbar td{height:auto;padding:4px 6px}
.sbib{margin:-2px 0 4px 18px;border-left:1px solid var(--line);padding-left:4px}
#side .sbib button{padding:6px 8px;font-size:13px;font-weight:500;gap:7px}#side .sbib button svg{width:15px;height:15px}
#side .sbib .sbn{color:var(--G);font-size:12.5px;padding-left:10px}
.btn .bibn{font-size:11px;margin-left:2px}.btn svg{width:15px;height:15px;vertical-align:-3px}
table.aat th.grpc{text-align:center;background:#fdf2f2;color:#b42318;border-bottom:1px solid #f3c4c4}
.aagrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}@media(max-width:700px){.aagrid{grid-template-columns:1fr}}
#side button.farm{display:block;text-align:left;font-size:11.5px;color:var(--muted);padding:4px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:8px;border-radius:8px 8px 0 0;font-weight:500}#side button.farm:hover{background:var(--GL)}#side button.farm b{display:block;color:var(--text);font-size:13px;margin-top:2px}
.fzrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.fzrow.on{background:var(--GL)}.fzn{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:none;border:none;padding:8px 6px;text-align:left;font-size:13.5px}.fzn:hover{background:#f8faf9}
.fzform{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}.fzform .w2{grid-column:1/-1}.fzform .fld label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}.fzform .inp,.fzform .sel{width:100%}
.locg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 12px;margin-top:10px}.locg .fld{flex-direction:row!important;text-align:left!important;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;border-bottom:1px solid #f1f5f9;padding:3px 0}.locg .inp{width:78px!important;flex:none;padding:3px 6px}.locg .fld>span{flex:1}

/* fórmula do concentrado / premix na MN (L120 / Q120) */
function formulaMistura(R,cats){const l=R.lin.filter(o=>cats.includes(o.cat)&&o.kg>0);const t=l.reduce((s,o)=>s+o.kg,0);return t?l.map(o=>({nome:o.nome,kg:o.kg,pct:o.kg/t})):[]}

/* ED base a partir da bromatologia (aba "Energia digestível base") */
function edBase(x){/* x em % da MS: fdn, dfdn48 (% FDN), lig (opcional), amido, damido (% amido), ag, dag (% AG), pb, cinzas */
  const dF1=(0.12+0.61*(x.dfdn48/100))*100;
  const dF2=x.lig>0?((0.75*(x.fdn-x.lig)*(1-Math.pow(x.lig/x.fdn,0.667)))/x.fdn)*100:null;
  const dF=x.dfdn48>0?dF1:dF2!=null?dF2:52;
  const fdn=x.fdn*0.042*(dF/100),am=x.amido*0.0423*((x.damido||0)/100),ag=x.ag*((x.dag==null?73:x.dag)/100)*0.094;
  const pdr=x.pb*0.67*0.0565,pndr=x.pb*0.33*0.7*0.0565,mor=Math.max(0,100-(x.fdn+x.amido+x.ag+x.pb+x.cinzas))*0.96*0.04;
  return{ed:fdn+am+ag+pdr+pndr+mor,dFDN:dF,dF1,dF2,mor:100-(x.fdn+x.amido+x.ag+x.pb+x.cinzas),cnf:100-(x.fdn+x.ag+x.pb+x.cinzas)}}

/* homogeneidade e seleção (aba "Homogeneidade e seleção") */
function homogeneidade(amostras){/* [[>19,8-19,fundo] %] */const n=amostras.length;const m=[0,1,2].map(j=>amostras.reduce((s,a)=>s+(+a[j]||0),0)/n);
  const dp=[0,1,2].map(j=>Math.sqrt(amostras.reduce((s,a)=>s+Math.pow((+a[j]||0)-m[j],2),0)/(n-1)));return{m,dp,cv:m.map((x,j)=>x?dp[j]/x*100:null)}}
function selecao(ofer,mOfer,sobra,mSobra){const cons=ofer-sobra;return[0,1,2].map(j=>{const pred=mOfer[j]/100*cons,obs=mOfer[j]/100*ofer-mSobra[j]/100*sobra;return{pred,obs,idx:pred?100*obs/pred:null}})}

if(typeof module!=="undefined")module.exports={calcDieta,formulaMistura,edBase,homogeneidade,selecao,D_AMIDO,NUTR_SOMA};

/* ============================================================
   OTIMIZADOR — substitui o Solver da planilha.
   Objetivo da planilha: maximizar RMCA/vaca (leite×preço − custo). Com o leite fixo,
   equivale a minimizar o custo da dieta. Restrições: limites de kg MN e de % da MS por
   alimento, CMS-alvo e limites nutricionais (mín/máx).
   Método: programação linear sequencial (SLP) com região de confiança e restrições
   elásticas — as relações não lineares (kp, amido degradado no rúmen, PB microbiana,
   leite por PM) são linearizadas a cada passo; quando não há solução viável, o
   otimizador devolve a dieta que menos viola e diz quais limites ficaram de fora.
   ============================================================ */

/* ---------- simplex de duas fases (tableau denso, regra de Bland) ----------
   min c·z  s.a.  rows[i]: a·z (<=|>=|=) b,  z >= 0 */
function simplex(c,rows){
  const n=c.length,EPS=1e-9;const R=rows.map(r=>{let a=r.a.slice(),b=r.b,t=r.t;if(b<0){a=a.map(v=>-v);b=-b;t=t==="<="?">=":t===">="?"<=":"="}return{a,b,t}});
  const m=R.length;let nS=0,nA=0;R.forEach(r=>{if(r.t!=="=")nS++;if(r.t!=="<=")nA++});
  const N=n+nS+nA;const T=[];const basis=[];let si=n,ai=n+nS;const art=[];
  R.forEach((r,i)=>{const row=new Float64Array(N+1);for(let j=0;j<n;j++)row[j]=r.a[j];
    if(r.t==="<="){row[si]=1;basis.push(si);si++}else if(r.t===">="){row[si]=-1;si++;row[ai]=1;basis.push(ai);art.push(ai);ai++}else{row[ai]=1;basis.push(ai);art.push(ai);ai++}
    row[N]=r.b;T.push(row)});
  const isArt=new Uint8Array(N);art.forEach(j=>isArt[j]=1);
  function pivot(r,col){const pr=T[r],pv=pr[col];for(let j=0;j<=N;j++)pr[j]/=pv;for(let i=0;i<m;i++){if(i===r)continue;const f=T[i][col];if(Math.abs(f)>1e-15){const ti=T[i];for(let j=0;j<=N;j++)ti[j]-=f*pr[j]}}basis[r]=col}
  function run(cost,allowed){/* reduz custos e itera */
    for(let it=0;it<5000;it++){
      let col=-1;
      for(let j=0;j<N;j++){if(!allowed(j))continue;let rc=cost[j];for(let i=0;i<m;i++)rc-=cost[basis[i]]*T[i][j];if(rc<-EPS){col=j;break}}
      if(col<0)return"ok";
      let r=-1,best=Infinity;for(let i=0;i<m;i++){const a=T[i][col];if(a>EPS){const q=T[i][N]/a;if(q<best-1e-12||(Math.abs(q-best)<=1e-12&&basis[i]<basis[r])){best=q;r=i}}}
      if(r<0)return"ilimitado";pivot(r,col)}
    return"iter"}
  if(art.length){const c1=new Float64Array(N);art.forEach(j=>c1[j]=1);const st=run(c1,()=>true);if(st!=="ok")return{status:st};
    const w=T.reduce((s,row,i)=>s+(isArt[basis[i]]?row[N]:0),0);if(w>1e-7)return{status:"inviavel"};
    for(let i=0;i<m;i++)if(isArt[basis[i]]){let col=-1;for(let j=0;j<n+nS;j++)if(Math.abs(T[i][j])>1e-9){col=j;break}if(col>=0)pivot(i,col)}}
  const c2=new Float64Array(N);for(let j=0;j<n;j++)c2[j]=c[j];
  const st=run(c2,j=>!isArt[j]);if(st!=="ok")return{status:st};
  const z=new Array(n).fill(0);for(let i=0;i<m;i++)if(basis[i]<n)z[basis[i]]=T[i][N];
  return{status:"ok",z};
}

/* alvo de CMS a partir das previsões */
const CMS_ALVOS=[["nasem1","NASEM (animal)"],["nasem2","NASEM (animal + fibra)"],["nrcSeca","NRC 2001 (vaca seca)"],["nrcNov","NRC/NASEM (crescimento)"],["nrc","NRC 2001"],["cncps","CNCPS"],["manual","Manual"]];
function cmsAlvo(rc,R){if(rc.alvo==="manual")return+rc.valor||null;const p=R.prev[rc.alvo||"nasem1"];return p?p[rc.mdp?1:0]:null}

/* ---------- formulação ----------
   itens: [{a, kg, min, max, pmin, pmax, fixo}] (kg MN; pmin/pmax em % da MS)
   restr: lista como restricoesPadrao (on, min, max; cms com alvo) */
function formular(an,itens,restr,opt){opt=opt||{};
  const n=itens.length;if(!n)return{status:"vazio"};
  const lb=itens.map(x=>x.fixo?+x.kg||0:Math.max(0,+x.min||0)),ub=itens.map((x,i)=>x.fixo?+x.kg||0:(x.max!=null&&x.max!==""?+x.max:60));
  const cost=itens.map(x=>+x.a.custo||0);
  const avalia=x=>calcDieta(an,itens.map((it,i)=>({a:it.a,kg:x[i]})));
  /* CMS-alvo calculado uma vez a partir da dieta de partida (as previsões NASEM 1 e CNCPS não dependem da dieta;
     NASEM 2 depende da FDNF/FDA da dieta e é reavaliado a cada passo) */
  let x=itens.map((it,i)=>Math.min(ub[i],Math.max(lb[i],+it.kg||0)));
  const cons=[];
  restr.filter(r=>r.on&&RESTR_BY[r.id]).forEach(r=>{const d=RESTR_BY[r.id];
    if(r.id==="cms"){cons.push({id:"cms",n:d.n,u:d.u,esc:0.2,dec:2,f:R=>R.cms,lo:R=>{if(r.modo==="max")return null;const v=cmsAlvo(r,R);return v==null?null:v-(+r.tol||0)},hi:R=>{const v=cmsAlvo(r,R);return v==null?null:v+(+r.tol||0)}});return}
    const lo=r.min!=null&&r.min!==""?+r.min:null,hi=r.max!=null&&r.max!==""?+r.max:null;if(lo==null&&hi==null)return;
    cons.push({id:r.id,n:d.n,u:d.u,esc:d.esc,dec:d.dec,f:d.f,lo:()=>lo,hi:()=>hi})});
  /* % da MS por alimento: ms_i − p·CMS ≥ 0 (linear) */
  itens.forEach((it,i)=>{const pm=it.pmin!=null&&it.pmin!==""?+it.pmin/100:null,pM=it.pmax!=null&&it.pmax!==""?+it.pmax/100:null;
    if(pm!=null&&pm>0)cons.push({id:"pms"+i,n:"% MS de "+it.a.nome,u:"",esc:0.01,dec:1,f:R=>R.lin[i].ms-pm*R.cms,lo:()=>0,hi:()=>null,item:i,tipo:"pmin",val:pm*100});
    if(pM!=null&&pM<1)cons.push({id:"pMs"+i,n:"% MS de "+it.a.nome,u:"",esc:0.01,dec:1,f:R=>R.lin[i].ms-pM*R.cms,lo:()=>null,hi:()=>0,item:i,tipo:"pmax",val:pM*100})});
  const k=cons.length;
  const viol=R=>cons.map(c=>{const v=c.f(R),lo=c.lo(R),hi=c.hi(R);if(!isFinite(v))return 1e3;let e=0;if(lo!=null&&v<lo)e=lo-v;if(hi!=null&&v>hi)e=v-hi;return e/c.esc});
  const custoX=x=>x.reduce((s,v,i)=>s+v*cost[i],0);
  const cEsc=Math.max(1,custoX(ub.map((u,i)=>Math.min(u,10))));
  const M=opt.M||200;
  const merito=x=>{const R=avalia(x);const v=viol(R);return{R,v,phi:custoX(x)/cEsc+M*v.reduce((a,b)=>a+b,0)}};
  let cur=merito(x);let delta=Math.max(1,ub.reduce((a,b)=>Math.max(a,isFinite(b)?b:0),0)*0.25);let it=0;
  for(;it<(opt.maxIt||150)&&delta>1e-5;it++){
    const R0=cur.R;const g0=cons.map(c=>c.f(R0));
    /* jacobiano por diferenças finitas */
    const J=cons.map(()=>new Array(n).fill(0));
    for(let j=0;j<n;j++){if(ub[j]-lb[j]<1e-12)continue;const h=1e-5*Math.max(1,x[j]);const xp=x.slice();let hh=h;if(xp[j]+h>ub[j])hh=-h;xp[j]+=hh;const Rp=avalia(xp);cons.forEach((c,ci)=>{const v=c.f(Rp);J[ci][j]=isFinite(v)&&isFinite(g0[ci])?(v-g0[ci])/hh:0})}
    /* LP no passo d = y − dl (y ≥ 0), com folgas elásticas e⁺, e⁻ */
    const dl=x.map((v,j)=>Math.max(lb[j]-v,-delta)),du=x.map((v,j)=>Math.min(ub[j]-v,delta));
    const nv=n+2*k;const c=new Array(nv).fill(0);for(let j=0;j<n;j++)c[j]=cost[j]/cEsc;for(let i=0;i<k;i++){c[n+i]=M/cons[i].esc;c[n+k+i]=M/cons[i].esc}
    const rows=[];
    for(let j=0;j<n;j++){const a=new Array(nv).fill(0);a[j]=1;rows.push({a,t:"<=",b:du[j]-dl[j]})}

  an.vitTotal=CUR.an.vitTotal||0;const mudou=Object.keys(an).some(k=>k==="tipo"?an.tipo!==CUR.an.tipo:+an[k]!==+CUR.an[k]);if(mudou){CUR.an=an;if(confereTipoRestr())toast("Restrições trocadas para o modelo de "+TIPO_NOME[tk(an)]);
    else if(an.tipo==="recria"){const g=CUR.restr.find(r=>r.id==="gmdEM");if(g&&g.on){g.min=+an.gmd;g.max=+(an.gmd*1.1).toFixed(2)}const h=CUR.restr.find(r=>r.id==="gmdPM");if(h&&h.on)h.min=+an.gmd}
    ajustaLeiteR(an.leite);CUR.loteNome=l.nomeDieta||l.nome||""}}

function kgKey(e,i){if(e.key!=="Enter")return;e.preventDefault();const n=document.getElementById("ik"+(i+(e.shiftKey?-1:1)));e.target.dispatchEvent(new Event("change"));if(n){n.focus();n.select()}}
let MIX_FECH=new Set();
function togMix(k){if(MIX_FECH.has(k))MIX_FECH.delete(k);else MIX_FECH.add(k);rerenderIng()}
function subLinhas(a,kg,i){const W=a.partes.reduce((s,p)=>s+p.kg,0)||1;const ro=!ADM?" disabled":"";
  return a.partes.map((p,j)=>{const kd=kg*p.kg/W,ms=kd*(+p.a.ms||0),pr=p.custo!=null?p.custo:+p.a.custo||0;
    return'<tr class="sub"><td></td><td class="nm"><div class="nmw" style="padding-left:26px"><span class="n">'+esc(p.nome)+'</span>'+(p.falta?'<span class="chip warn">composição salva</span>':'')+'</div></td>'+
    '<td><input class="inp q sub" type="number" step="0.1" min="0" value="'+(+kd.toFixed(3))+'" title="kg MN deste ingrediente na dieta" onchange="setParte('+i+','+j+',\'kg\',this.value)"'+ro+'></td>'+
    '<td class="num">'+f(ms,2)+'</td><td class="num">'+f(p.kg/W*100,1)+'% mix</td><td><input class="inp p sub" type="number" step="any" value="'+(+(+pr).toFixed(3))+'" onchange="setParte('+i+','+j+',\'custo\',this.value)"'+ro+'></td><td class="num">'+f(kd*pr,2)+'</td><td class="lim"></td><td class="lim"></td><td class="lim"></td><td class="lim"></td>'+
    '<td>'+(ADM?'<button class="ico" title="Tirar do mix nesta dieta" onclick="setParte('+i+','+j+',\'del\')">×</button>':'')+'</td></tr>'}).join("")+
    (a.local&&ADM?'<tr class="sub mixbar"><td></td><td colspan="11"><span class="small" style="color:var(--amber);font-weight:700">Mix alterado nesta dieta.</span> <button class="lnk" onclick="salvarMixLocal('+i+')">Salvar no cadastro do mix</button> · <button class="lnk" onclick="salvarMixLocal('+i+',true)">Salvar como mix novo</button> · <button class="lnk" onclick="voltarMix('+i+')">Voltar ao mix original</button></td></tr>':'')}
/* altera um ingrediente do mix só nesta dieta (como no AMTS): guarda as partes em kg/vaca na própria linha */
function partesLocais(it){const a=foodDe(it);const W=a.partes.reduce((s,p)=>s+p.kg,0)||1;return a.partes.map(p=>{const comp={};COMP_KEYS.forEach(k=>comp[k]=+p.a[k]||0);return{key:p.key,nome:p.nome,kg:(+it.kg||0)*p.kg/W,custo:p.custo!=null?p.custo:+p.a.custo||0,comp}})}
function setParte(i,j,k,v){const it=CUR.itens[i];const ps=partesLocais(it);if(k==="del")ps.splice(j,1);else{const x=num(v);if(x==null&&k==="kg")return;ps[j][k]=k==="kg"?Math.max(0,x):x}
  const tot=ps.reduce((s,p)=>s+p.kg,0);if(!tot){toast("O mix precisa de pelo menos um ingrediente com quantidade",true);rerenderIng();return}
  it.partes=ps;it.kg=+tot.toFixed(4);it.custo=null;OPT=null;rerenderIng()}
function voltarMix(i){const it=CUR.itens[i];delete it.partes;it.custo=null;OPT=null;rerenderIng()}
function desfazerMix(i){const it=CUR.itens[i];const a=foodDe(it);if(!a||!a.partes)return;const W=a.partes.reduce((s,p)=>s+p.kg,0)||1;const novos=[];
  a.partes.forEach(p=>{const kg=(+it.kg||0)*p.kg/W;if(!FOODS[p.key]){CUR.snap=CUR.snap||{};CUR.snap[p.key]=Object.assign({key:p.key,nome:p.nome,cat:p.a.cat||"C",org:"Do mix",custo:p.custo},p.a)}
    const ex=CUR.itens.find(x=>x.key===p.key&&x!==it);if(ex){ex.kg=+(+ex.kg+kg).toFixed(4);return}novos.push({key:p.key,kg:+kg.toFixed(4),custo:p.custo!=null?p.custo:null,min:null,max:null,pmin:null,pmax:null,fixo:false,nomeLote:null})});
  CUR.itens.splice(i,1,...novos);OPT=null;rerenderIng();toast("Mix desfeito em "+a.partes.length+" ingredientes. Ajuste/otimize e depois use “Criar mix” para agrupar de novo.")}
function salvarMixLocal(i,novo){const it=CUR.itens[i];const a=foodDe(it);if(!a||!a.partes)return;
  if(!novo&&!(it.key.startsWith("c:")&&CUST[it.key.slice(2)])){novo=true}
  if(!novo&&!confirm("Gravar estas proporções no cadastro do mix “"+a.nome+"”? Outras dietas que usam este mix também passam a usar a nova composição."))return;
  const nome=novo?prompt("Nome do novo mix:",a.nome+" ("+(CUR.loteNome||"ajustado")+")"):a.nome;if(!nome)return;
  const c=novo?{}:CUST[it.key.slice(2)]||{};
  const doc=limpar({tipo:"composto",nome:nome.trim(),cat:a.cat||"C",custoManual:null,fonte:c.fonte||"",notas:c.notas||"",fazenda:c.fazenda||null,atualizado_em:new Date().toISOString(),autor:NOME,
    partes:it.partes.map(p=>({key:p.key,nome:p.nome,kg:+(+p.kg).toFixed(4),custo:+p.custo||0,cat:(FOODS[p.key]||p.comp||{}).cat||"C",comp:p.comp}))});
  const ref=novo?db.ref("formulador/alimentos").push():db.ref("formulador/alimentos/"+it.key.slice(2));
  ref.set(doc).then(()=>{const k="c:"+ref.key;if(!FOODS[k]){CUR.snap=CUR.snap||{};CUR.snap[k]=Object.assign({},a,{key:k,nome:doc.nome,_tmp:true})}
    it.key=k;const kg=it.kg;delete it.partes;it.kg=kg;it.custo=null;rerenderIng();toast(novo?"Mix novo salvo":"Mix atualizado")}).catch(e=>toast(e.message,true))}
/* criar mix a partir de ingredientes da dieta (ração, núcleo, pré-mistura) */
function criarMix(){const its=CUR.itens.map((it,i)=>({it,i,a:foodDe(it)})).filter(x=>x.a&&+x.it.kg>0&&x.a.cat!=="X");
  if(!its.length){toast("Coloque quantidades nos alimentos primeiro",true);return}
  const exist=Object.entries(CUST||{}).filter(([,c])=>c&&c.tipo==="composto"&&(!c.fazenda||c.fazenda===FARM)).sort((a,b)=>a[1].nome.localeCompare(b[1].nome));
  abrirModal('<h2>Criar mix</h2><p class="small muted">Marque os ingredientes que vão juntos (ração, núcleo, pré-mistura de minerais…). Eles viram <b>um único alimento</b> na dieta, com a proporção atual</p>'+
    '<div class="tw" style="margin-top:8px"><table class="t"><thead><tr><th></th><th>Ingrediente</th><th class="num">kg MN</th><th class="num">% do mix</th></tr></thead><tbody>'+
    its.map(x=>'<tr><td><input type="checkbox" class="mx-c" data-i="'+x.i+'" '+((x.a.cat==="C"||x.a.cat==="P")&&!x.a.partes?"checked":"")+' onchange="mixTot()"></td><td><span class="cat cat-'+esc(x.a.cat)+'">'+esc(x.a.cat)+'</span> '+esc(x.a.nome)+(x.a.partes?' <span class="org">Mix</span>':'')+'</td><td class="num">'+f(x.it.kg,3)+'</td><td class="num" id="mx-p'+x.i+'"></td></tr>').join("")+
    '</tbody><tfoot><tr class="tot"><td></td><td>Total do mix</td><td class="num" id="mx-t">—</td><td></td></tr></tfoot></table></div>'+
    '<div class="row2" style="margin-top:10px"><input class="inp" id="mx-n" style="flex:2;min-width:200px" placeholder="Nome do mix (ex.: Ração Lote 1 — out/26)" value="'+esc("Ração "+(CUR.loteNome||CUR.nome||""))+'">'+
    '<select class="sel" id="mx-dest" style="flex:1;min-width:180px"><option value="">Criar mix novo</option>'+exist.map(([id,c])=>'<option value="'+esc(id)+'">Atualizar: '+esc(c.nome)+'</option>').join("")+'</select></div>'+
    '<div class="row2" style="margin-top:8px;align-items:center"><label class="small" style="display:flex;gap:6px"><input type="checkbox" id="mx-faz" checked> Só para esta fazenda</label><span style="flex:1"></span><label class="small">Guardar na biblioteca <select class="sel" id="mx-bib"><option value="">—</option>'+bibsVisiveis().filter(([,b])=>!b.fixa).map(([id,b])=>'<option value="'+esc(id)+'">'+esc(b.nome)+'</option>').join("")+'</select></label></div>'+
    '<p class="tiny muted" style="margin-top:6px">Depois, os ingredientes do mix aparecem logo abaixo dele na dieta e podem ser ajustados ali mesmo. Para o otimizador mexer em cada ingrediente, use ⇲ (desfazer o mix) e agrupe de novo.</p>'+
    '<div class="md-f"><button class="btn btn-o" onclick="fecharModal()">Cancelar</button><button class="btn btn-g" onclick="confirmarMix()">Criar mix</button></div>',"lg");mixTot()}
function mixSel(){return[...document.querySelectorAll(".mx-c")].filter(c=>c.checked).map(c=>+c.dataset.i)}
function mixTot(){const sel=mixSel();const t=sel.reduce((s,i)=>s+(+CUR.itens[i].kg||0),0);document.querySelectorAll("[id^=mx-p]").forEach(e=>{const i=+e.id.slice(4);e.textContent=sel.includes(i)&&t?f(CUR.itens[i].kg/t*100,1)+"%":""});const e=document.getElementById("mx-t");if(e)e.textContent=f(t,3)}
function confirmarMix(){const sel=mixSel();if(sel.length<2){toast("Marque pelo menos 2 ingredientes",true);return}const nome=document.getElementById("mx-n").value.trim();if(!nome){toast("Dê um nome ao mix",true);return}
  const dest=document.getElementById("mx-dest").value,soFaz=document.getElementById("mx-faz").checked,bibM=(document.getElementById("mx-bib")||{}).value||"";
  /* partes: se algum selecionado já é um mix, entra com os ingredientes dele */
  const partes=[];sel.forEach(i=>{const it=CUR.itens[i],a=foodDe(it);const add=(key,nm,kg,custo,src)=>{const comp={};COMP_KEYS.forEach(k=>comp[k]=+src[k]||0);const ex=partes.find(p=>p.key===key);if(ex){ex.kg+=kg;return}partes.push({key,nome:nm,kg,custo,cat:src.cat||"C",comp})};
    if(a.partes){const W=a.partes.reduce((s,p)=>s+p.kg,0)||1;a.partes.forEach(p=>add(p.key,p.nome,(+it.kg)*p.kg/W,p.custo!=null?+p.custo:+p.a.custo||0,p.a))}
    else add(it.key,a.nome,+it.kg,it.custo!=null?+it.custo:+a.custo||0,a)});
  partes.forEach(p=>p.kg=+p.kg.toFixed(4));
  const c0=dest?CUST[dest]||{}:{};
  const doc=limpar({tipo:"composto",nome,cat:partes.every(p=>p.cat==="P")?"P":"C",custoManual:null,fonte:c0.fonte||"",notas:c0.notas||"",fazenda:soFaz?FARM:null,atualizado_em:new Date().toISOString(),autor:NOME,partes});
  if(dest&&!confirm("Substituir os ingredientes do mix “"+(c0.nome||"")+"”? Outras dietas que usam esse mix também mudam."))return;
  const ref=dest?db.ref("formulador/alimentos/"+dest):db.ref("formulador/alimentos").push();
  ref.set(doc).then(()=>{const k="c:"+ref.key;const tot=sel.reduce((s,i)=>s+(+CUR.itens[i].kg||0),0);
    if(!FOODS[k]){const pr=partes.map(p=>({key:p.key,nome:p.nome,kg:p.kg,custo:p.custo,a:FOODS[p.key]||Object.assign({nome:p.nome},p.comp)}));const r=compostoComp(pr);CUR.snap=CUR.snap||{};CUR.snap[k]=Object.assign(r.comp,{key:k,org:"Composto",nome,cat:doc.cat,custo:r.custo,partes:pr,_tmp:true})}
    const pos=Math.min(...sel);const novo={key:k,kg:+tot.toFixed(4),custo:null,min:null,max:null,pmin:null,pmax:null,fixo:false,nomeLote:null};
    CUR.itens=CUR.itens.filter((x,i)=>!sel.includes(i));CUR.itens.splice(Math.min(pos,CUR.itens.length),0,novo);OPT=null;fecharModal();rerenderIng();if(bibM)db.ref("formulador/bibliotecas/"+bibM+"/alimentos/"+bk(k)).set(true);toast("Mix “"+nome+"” criado com "+partes.length+" ingredientes"+(bibM?" e guardado na biblioteca":""))}).catch(e=>toast("Não salvou: "+e.message,true))}

function atualizarComputados(){const R=RES;CUR.itens.forEach((it,i)=>{const set=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};
    const o=R?R.lin.find((x,j)=>j===i):null;{const e=document.getElementById("ims"+i);if(e&&document.activeElement!==e)e.value=o?+o.ms.toFixed(3):"";}set("ci-p"+i,o?f(o.pMS*100,1)+"%":"—");set("ci-c"+i,o?f(o.custo,2):"—")});
  const set=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};set("ct-mn",R?f(R.cmn,2):"—");set("ct-ms",R?f(R.cms,2):"—");set("ct-c",R?f(R.custo.dia,2):"—");
  const cf=document.getElementById("cmsfoot");if(cf){const t=CUR.an.tipo||"lact";const it=!R||!R.cms?[]:t==="recria"?[["CMS NRC 2001 (novilha)",R.prev.nrcNov[0]],["CMS necessária p/ GMD alvo",R.fase.rec.dmiReq]]:t!=="lact"?[["CMS NRC 2001 (vaca seca)",R.prev.nrcSeca[0]]]:[["CMS predito (CNCPS)",R.prev.cncps[0]],["CMS predito (NRC)",R.prev.nrc[0]],["Predicted DMI (NASEM Animal)",R.prev.nasem1[0]],["Predicted DMI (NASEM Animal/Fiber)",R.prev.nasem2[0]]];
    cf.innerHTML=it.map(([l,v])=>'<div><span class="muted">'+l+':</span><b>'+f(v,2)+'</b></div>').join("")+(()=>{if(!R||!R.cms)return"";const rc=CUR.restr.find(r=>r.id==="cms");const al=rc?cmsAlvo(rc,R):null;return al?'<div><span class="muted">CMS do usuário / CMS predita:</span><b>'+f(R.cms/al*100,1)+'%</b></div>':""})()}}
function setMS(i,v){const it=CUR.itens[i];const a=foodDe(it);const x=num(v);if(x==null||!a||!(+a.ms>0))return;it.kg=+(x/(+a.ms)).toFixed(4);const e=document.getElementById("ik"+i);if(e)e.value=it.kg;OPT=null;recalc()}
let _liveT=null;function setItLive(i,k,v){clearTimeout(_liveT);_liveT=setTimeout(()=>{const x=num(v);if(x==null&&v!=="")return;setIt(i,k,v)},220)}
function setIt(i,k,v){clearTimeout(_liveT);const it=CUR.itens[i];if(k==="fixo")it.fixo=!!v;else{const x=num(v);it[k]=x;if(k==="kg"&&x==null)it.kg=0}recalc()}
function remIt(i){CUR.itens.splice(i,1);OPT=null;rerenderIng()}
function rerenderIng(){const c=document.getElementById("ing-card");if(c&&c.isConnected){try{c.outerHTML=cardIngredientes()}catch(e){setTimeout(()=>{const d=document.getElementById("ing-card");if(d)d.outerHTML=cardIngredientes();recalc()},0);return}}recalc()}
function buscaAl(q){const dd=document.getElementById("al-dd");if(!dd)return;const n=norm(q).trim();const usados=new Set(CUR.itens.map(i=>i.key));const B=BIB_BUSCA&&bibDe(BIB_BUSCA);

function abrirFormulacao(id,copia){const d=FORMS[id];if(!d)return;const snap={};

function ultimaAnalise(tipo){const xs=Object.values(FOODS).filter(a=>a.org==="Análise"&&a.key.split(":")[2]===tipo).sort((a,b)=>String(b.dataAnalise).localeCompare(String(a.dataAnalise)));return xs[0]?xs[0].key:null}
function melhorPalpite(nome){const n=norm(nome).trim();if(MAPA[slug(nome)]&&FOODS[MAPA[slug(nome)]])return MAPA[slug(nome)];
  if(/^agua\b/.test(n))return"u:agua";

  const imp=Object.values(FOODS).filter(a=>a.org==="Importado"||a.org==="Composto").find(a=>norm(a.nome)===n||n.includes(norm(a.nome))||norm(a.nome).includes(n));if(imp)return imp.key;
  if(/silag.*milho|milho.*silag/.test(n)&&!/gr[aã]o|umid/.test(n))return ultimaAnalise("silagemdemilho")||"u:"+slug("Silagem de milho típica");
  if(/pr[eé].?secad|haylage|azev[eé]m|aveia|tifton|gram[ií]nea/.test(n)&&!/alfafa/.test(n))return ultimaAnalise("presecado")||"u:"+slug("Silagem de gramínea temperada");
  if(COMERCIAL.test(n))return"";
  const s=SINONIMOS.find(([re])=>re.test(n));return s&&UFLA["u:"+slug(s[1])]?"u:"+slug(s[1]):""}

const XML_MAP={acucar:["sugar","sugaresc","esc","wsc","simplesugars","sugars"],ms:["dm","drymatter"],pb:["cp","crudeprotein"],ps:["sp_cp","sp","solubleprotein"],pida:["adicp"],pidn:["ndicp"],fda:["adf"],fdn:["andf","ndf"],fdnom:["andfom","ndfom"],lignina:["lignin","lig"],

  amostra:["sample_no","sampleno"],dataColeta:["datesampled","datecollected"],dataEntrada:["datearrived","datereceived"],fazendaLab:["name","farmname"],descricao:["desc_1","description","desc"],lab:["lab_name","labname"]};
function lerXMLLaudo(txt){const doc=new DOMParser().parseFromString(txt,"application/xml");if(doc.querySelector("parsererror"))throw new Error("arquivo XML inválido");
  const r={};const brutos=[];
  doc.querySelectorAll("[Value],[value]").forEach(el=>{const tag=el.tagName.toLowerCase(),nm=(el.getAttribute("Name")||"").toLowerCase().replace(/[\s.]/g,""),val=el.getAttribute("Value")??el.getAttribute("value"),un=(el.getAttribute("unit")||"").toLowerCase();
    brutos.push({tag:el.tagName,nome:el.getAttribute("Name")||el.tagName,un:el.getAttribute("unit")||"",val});
    const k=Object.keys(XML_MAP).find(k=>XML_MAP[k].includes(tag)||XML_MAP[k].includes(nm));if(!k||r[k]!=null)return;
    if(["amostra","dataColeta","dataEntrada","fazendaLab","descricao","lab"].includes(k)){r[k]=val;return}
    let v=parseFloat(String(val).replace(",","."));if(!isFinite(v))return;
    /* alguns laboratórios rotulam "mcal/lb" mas mandam Mcal/kg (ex.: 3R: 1,60 no XML = 1,60 Mcal/kg no PDF); ELl em Mcal/lb fica entre 0,5 e 1,0 */
    if(k==="nel"&&/lb/.test(un)&&v<1.1)v=v*2.20462;
    if(["ca","p","mg","k","s","na","cl"].includes(k)&&/ppm|mg/.test(un))v=v/10000;  /* ppm → % */
    if(["zn","cu","mn","fe"].includes(k)&&/%/.test(un))v=v*10000;               /* % → mg/kg */
    if(k==="pida"&&/cp|pb/.test(un)){r.pida_pb=v;return}
    r[k]=v});
  const dt=s=>{if(!s)return"";const m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");const m2=String(s).match(/(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:""};
  r.data=dt(r.dataColeta)||dt(r.dataEntrada)||hoje();
  if(r.dfdn48!=null){r.dfdn=r.dfdn48;r.dfdn_obs="48h"}else if(r.dfdn30!=null){r.dfdn=r.dfdn30;r.dfdn_obs="30h"}
  return{r,brutos}}

/* lote de recria: média de peso, GMD e altura das novilhas do módulo Recria do painel, por faixa de idade */
function puxarRecria(){const e=loteSel();if(!e)return;const[key,l]=e;const fx=prompt("Faixa de idade das novilhas deste lote, em meses (ex.: 4-12):","4-12");if(!fx)return;
  const m=fx.match(/(\d+(?:[.,]\d+)?)\s*[-a–]\s*(\d+(?:[.,]\d+)?)/);if(!m){toast("Use o formato 4-12",true);return}const i0=num(m[1]),i1=num(m[2]);
  db.ref("recria/"+FARM).once("value").then(s=>{const xs=Object.values(s.val()||{});const hoje_=Date.now();const sel=[];
    xs.forEach(a=>{if(!a||!a.nascimento||a.status==="vendida"||a.status==="morta"||a.status==="baixa")return;const idade=(hoje_-new Date(a.nascimento).getTime())/864e5/30.44;if(idade<i0||idade>i1)return;
      const ps=Object.values(a.pesagens||{}).filter(p=>p&&+p.peso>0&&p.data).sort((x,y)=>String(x.data).localeCompare(String(y.data)));if(!ps.length)return;const u=ps[ps.length-1];
      let gmd=null;if(ps.length>=2){const p0=ps[ps.length-2];const d=(new Date(u.data)-new Date(p0.data))/864e5;if(d>=15)gmd=(u.peso-p0.peso)/d}
      if(gmd==null&&+a.peso_nascimento>0){const d=(new Date(u.data)-new Date(a.nascimento))/864e5;if(d>=15)gmd=(u.peso-a.peso_nascimento)/d}
      sel.push({peso:+u.peso,gmd,altura:+u.altura||null,idade})});
    if(!sel.length){toast("Nenhuma novilha com pesagem nessa faixa de idade",true);return}
    const med=k=>{const v=sel.map(x=>x[k]).filter(x=>x!=null&&isFinite(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
    const pv=med("peso"),g=med("gmd"),al=med("altura"),id=med("idade");
    if(!confirm(sel.length+" novilhas de "+i0+" a "+i1+" meses:\nPeso médio "+f(pv,0)+" kg · GMD médio "+f(g,2)+" kg/d"+(al?" · altura "+f(al,0)+" cm":"")+" · idade "+f(id,1)+" meses\n\nGravar no lote? (o GMD desejado não muda)"))return;
    const up={};up["formulador/lotes/"+FARM+"/"+l.id+"/pv"]=Math.round(pv);if(al)up["formulador/lotes/"+FARM+"/"+l.id+"/altura"]=Math.round(al);up["formulador/lotes/"+FARM+"/"+l.id+"/idade"]=+id.toFixed(1);
    up["formulador/lotes/"+FARM+"/"+l.id+"/gmdAtual"]=g!=null?+g.toFixed(3):null;up["dietas/"+FARM+"/lotes/"+key+"/vacas"]=sel.length;
    db.ref().update(up).then(()=>toast("Lote atualizado com "+sel.length+" novilhas da Recria"))}).catch(x=>toast("Sem acesso à Recria: "+x.message,true))}

function nAnimaisLote(){const l=CUR.loteId&&lotes().find(x=>x.id===CUR.loteId);return l?(+l.vacas||0):0}
function tabComparar(){const src=fontesComparar().find(x=>x.id===CMP_SEL);if(!src)return"";const A=RES,B=calcDieta(CUR.an,itensDeSnap(src.itens));const t=CUR.an.tipo||"lact",lact=t==="lact";
  const nA=notaDieta(A).nota,nB=notaDieta(B).nota;
  /* [rótulo, fn, casas, unidade, sentido bom (+1 maior melhor, -1 menor melhor, 0 neutro)] */
  const L=[["Custo/animal/dia",R=>R.custo.dia,2,"R$",-1]];
  if(lact)L.push(["R$/kg de leite",R=>R.custo.kgLeite,3,"R$",-1],["RSCA na meta de leite",R=>R.custo.rmca,2,"R$",1],["Leite que a dieta sustenta",R=>R.amb.leiteAt,1,"kg",1],["RSCA com o leite sustentado",R=>rscaSust(R),2,"R$",1],["Leite permitido pela ELl",R=>R.en.leiteEL,1,"kg",1],["Leite permitido pela PM",R=>R.pm.leitePM,1,"kg",1]);
  if(t==="recria")L.push(["GMD permitido (EM)",R=>R.fase.rec.gmdEM,2,"kg",1],["GMD permitido (PM)",R=>R.fase.rec.gmdPM,2,"kg",1],["R$/kg ganho",R=>R.fase.custoKgGanho,2,"R$",-1]);
  if(!lact&&t!=="recria")L.push(["ELl atendida",R=>R.fase.elPct,0,"%",0],["PM atendida",R=>R.fase.pmPct,0,"%",0]);
  L.push(["Nota da dieta",R=>R===A?nA:nB,0,"",1],["CMS",R=>R.cms,2,"kg",0],["Matéria natural",R=>R.cmn,1,"kg",0],["MS da dieta",R=>R.msDieta*100,1,"%",0],["Forragem na MS",R=>R.vol.pMS*100,1,"%",0],
    ["PB",R=>R.D.pb*100,1,"% MS",0],["FDN",R=>R.D.fdn*100,1,"% MS",0],["FDN de forragem",R=>R.D.fdnf*100,1,"% MS",0],["Amido",R=>R.D.amido*100,1,"% MS",0],["Extrato etéreo",R=>R.D.ag*100,1,"% MS",0],
    [t==="recria"?"EM":"ELl",R=>t==="recria"?R.en.em:R.en.el,2,"Mcal/kg",0]);
  if(t==="pre")L.push(["DCAD",R=>R.min.dcad1,0,"mEq/kg",-1]);
  if(lact)L.push(["Metano por kg de leite",R=>R.amb.ch4Leite,1,"g",-1],["Eficiência do N",R=>R.amb.nue*100,0,"%",1]);
  let h='<div style="overflow-x:auto"><table class="t cmpt"><thead><tr><th></th><th class="num">Aberta</th><th class="num">Comparada</th><th class="num">Diferença</th></tr></thead><tbody>'+
    L.map(([l,fn,d,u,sen])=>{const a=fn(A),b=fn(B);const dif=a!=null&&b!=null&&isFinite(a)&&isFinite(b)?a-b:null;const m=Math.pow(10,d);const dr=dif==null?null:Math.round(dif*m)/m;
      const cls=dr==null||dr===0||!sen?"":(dr*sen>0?"good":"bad");const fm=v=>v==null||!isFinite(v)?"—":(u==="R$"?"R$ "+f(v,d):f(v,d)+(u&&u!=="R$"?" "+u:""));
      return'<tr><td>'+l+'</td><td class="num"><b>'+fm(a)+'</b></td><td class="num">'+fm(b)+'</td><td class="num '+cls+'">'+(dr==null?"—":(dr>0?"+":dr<0?"−":"")+(u==="R$"?"R$ ":"")+f(Math.abs(dr),d))+'</td></tr>'}).join("")+'</tbody></table></div>';
  /* impacto */
  const n=nAnimaisLote();const dC=A.custo.dia-B.custo.dia,dR=lact?rscaSust(A)-rscaSust(B):-dC;
  h+='<div class="cmp-imp"><div><div class="l">Impacto por '+(t==="recria"?"animal":"vaca")+'/dia</div><div class="v '+(dR>0.005?"good":dR<-0.005?"bad":"")+'">'+(dR>=0?"+":"−")+fR(Math.abs(dR))+'</div><div class="tiny muted">'+(lact?"receita − alimentação, com o leite que cada dieta sustenta":"economia no custo de alimentação")+'</div></div>'+
    '<div><div class="l">Animais</div><input class="inp" type="number" min="0" style="width:90px;font-weight:700" id="cmp-n" value="'+(n||"")+'" placeholder="nº" oninput="impComparar('+dR+')"></div>'+
    '<div><div class="l">Impacto no mês (30 d)</div><div class="v" id="cmp-mes">'+(n?(dR>=0?"+":"−")+fR(Math.abs(dR*n*30)):"—")+'</div><div class="tiny muted" id="cmp-ano">'+(n?"≈ "+(dR>=0?"+":"−")+fR(Math.abs(dR*n*365))+" no ano":"informe o nº de animais")+'</div></div></div>';
  /* ingredientes */
  const mapa={};const add=(lst,ix)=>lst.forEach(o=>{const k=o.nome;mapa[k]=mapa[k]||{nome:k,cat:o.cat,kg:[0,0]};mapa[k].kg[ix]+=o.kg});add(A.lin,0);add(B.lin,1);
  const rows=Object.values(mapa).sort((x,y)=>Math.abs(y.kg[0]-y.kg[1])-Math.abs(x.kg[0]-x.kg[1]));
  h+='<div class="sec" style="margin-top:14px">Ingredientes (kg MN/'+(t==="recria"?"animal":"vaca")+'/dia)</div><div style="overflow-x:auto"><table class="t cmpt"><thead><tr><th>Alimento</th><th class="num">Aberta</th><th class="num">Comparada</th><th class="num">Diferença</th></tr></thead><tbody>'+
    rows.map(r=>{const d=r.kg[0]-r.kg[1];return'<tr><td><span class="cat cat-'+esc(r.cat)+'">'+esc(r.cat)+'</span> '+esc(r.nome)+'</td><td class="num">'+(r.kg[0]?f(r.kg[0],2):"—")+'</td><td class="num">'+(r.kg[1]?f(r.kg[1],2):"—")+'</td><td class="num">'+(Math.abs(d)<0.005?"=":(d>0?"+":"−")+f(Math.abs(d),2))+'</td></tr>'}).join("")+'</tbody></table></div>'+
    '<p class="tiny muted" style="margin-top:8px">As duas dietas são calculadas para o mesmo animal (o da dieta aberta), com os preços e a composição de cada uma.</p>';
  return h}

const BIB_FIXAS=[
  ["__nasem","NASEM 2021","Biblioteca oficial de alimentos do NASEM 2021 (Nutrient Requirements of Dairy Cattle, 8ª ed.) — composição, aminoácidos, minerais e vitaminas.",a=>/^NRC\d/.test(String(a.nasem||""))],
  ["__ufla","UFLA","Alimentos do banco da planilha de formulação da UFLA.",a=>!!a.ufla],
  ["__br","Brasil","Alimentos comuns no Brasil: silagens, pré-secados, fenos e pastos, grãos, farelos e coprodutos (DDG FS e Inpasa), minerais. Valores médios — use o laudo da fazenda quando houver.",a=>!!a.br],
  ["__poli","Polinutri","Núcleos e minerais pelas fichas técnicas (níveis de garantia). Preencha o preço de cada produto.",a=>a.fornecedor==="Polinutri"],
  ["__adit","Aditivos","Colina e aminoácidos protegidos (ReaShure, Ruprocol, CholiPEARL, Smartamine M, AminoShure), monensina e biotina.",a=>!!a.aditLib]];
const _BF={};function bibFixa(id){const f=BIB_FIXAS.find(x=>x[0]===id);if(!f)return null;const al={};Object.values(FOODS).forEach(a=>{if(a.org==="UFLA"&&f[3](a))al[bk(a.key)]=true});const c=_BF[id];if(!c||Object.keys(c.alimentos).length!==Object.keys(al).length)_BF[id]={nome:f[1],descricao:f[2],alimentos:al,fixa:true};return _BF[id]}
function bibNasem(){return bibFixa("__nasem")}function bibPoli(){return bibFixa("__poli")}function bibBr(){return bibFixa("__br")}
function bibsVisiveis(){return BIB_FIXAS.map(f=>[f[0],bibFixa(f[0])]).concat(Object.entries(BIBS||{}).filter(([,b])=>b&&b.nome&&(!b.fazenda||b.fazenda===FARM)).sort((a,b)=>a[1].nome.localeCompare(b[1].nome)))}
function bibDe(id){return /^__/.test(id)?bibFixa(id):BIBS[id]}
function naBib(B,key){return!!(B&&B.alimentos&&B.alimentos[bk(key)])}
function nBibs(key){return bibsVisiveis().filter(([,b])=>!b.fixa&&naBib(b,key)).length}
function sideBibs(){const bs=bibsVisiveis();if(!bs.length&&!ADM)return"";
  return'<div class="sbib">'+bs.map(([id,b])=>{const n=Object.keys(b.alimentos||{}).filter(k=>FOODS[k.replace(/~/g,":")]).length;return'<button class="'+(TAB==="alimentos"&&BIB_SEL===id?"on":"")+'" onclick="BIB_SEL=\''+esc(id)+'\';setTab(\'alimentos\')">'+ico("bib")+'<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(b.nome)+'</span><span class="muted small">'+n+'</span></button>'}).join("")+
    (ADM?'<button class="sbn" onclick="novaBib()">+ Nova biblioteca</button>':'')+'</div>'}
function cabBib(B,n){return'<div class="card" style="padding:12px 16px"><div class="row2" style="align-items:center"><div style="flex:1;min-width:200px"><div class="tiny muted" style="text-transform:uppercase;font-weight:700;letter-spacing:.04em">Biblioteca</div><h3 style="font-size:17px">'+esc(B.nome)+'</h3>'+(B.descricao?'<div class="small muted">'+esc(B.descricao)+'</div>':'')+'<div class="tiny muted">'+n+' alimento'+(n===1?"":"s")+(B.fixa?' · biblioteca de referência (somente leitura)':B.fazenda?' · só '+esc(nomeFarm(B.fazenda)):' · todas as fazendas')+'</div></div>'+
  (ADM&&!B.fixa?'<div class="srch" style="min-width:260px;flex:1"><input class="inp" id="bib-q" placeholder="+ Incluir alimento na biblioteca…" oninput="buscaBib(this.value)" onfocus="buscaBib(this.value)" onkeydown="ddKey(event,\'bib-dd\')" autocomplete="off"><div class="dd" id="bib-dd"></div></div><button class="btn btn-o btn-sm" onclick="novaBib(\''+esc(BIB_SEL)+'\')">Editar</button><button class="btn btn-o btn-sm" onclick="excluirBib()">Excluir</button>':'')+'</div></div>'}
function buscaBib(q){const dd=document.getElementById("bib-dd");const B=BIBS[BIB_SEL];if(!dd||!B)return;const n=norm(q).trim();
  const xs=Object.values(FOODS).filter(a=>!naBib(B,a.key)&&(!n||n.split(/\s+/).every(w=>norm(a.nome).includes(w)))).sort((a,b)=>a.nome.localeCompare(b.nome)).slice(0,50);
  dd.innerHTML=xs.map(a=>'<button onmousedown="event.preventDefault();togBib(\''+esc(BIB_SEL)+'\',\''+esc(a.key)+'\',true)"><span class="cat cat-'+esc(a.cat)+'">'+esc(a.cat)+'</span><span style="flex:1">'+esc(a.nome)+'</span><span class="org">'+esc(a.org)+'</span></button>').join("")||'<div class="g">Nada encontrado</div>';dd.classList.add("on");document.getElementById("bib-q").onblur=()=>setTimeout(()=>dd.classList.remove("on"),150)}
function togBib(id,key,on){db.ref("formulador/bibliotecas/"+id+"/alimentos/"+bk(key)).set(on?true:null).then(()=>{if(on){const q=document.getElementById("bib-q");if(q){q.value="";q.focus()}}toast(on?"Incluído na biblioteca":"Retirado da biblioteca")}).catch(e=>toast(e.message,true))}
function novaBib(id){const b=id?BIBS[id]:null;
  abrirModal('<h2>'+(b?"Editar biblioteca":"Nova biblioteca")+'</h2><p class="small muted">Agrupe os alimentos que você usa de verdade — por fazenda, por fornecedor (ex.: rações Ultramax), por categoria (pré-parto, recria) — para achar rápido na hora de formular.</p>'+
    '<div class="fld" style="margin-top:10px"><label>Nome</label><input class="inp" id="bb-n" style="width:100%" value="'+esc(b?b.nome:"")+'" placeholder="Ex.: Biblioteca META, Rações Ultramax, Fazenda Rio Branco"></div>'+
    '<div class="fld" style="margin-top:8px"><label>Descrição</label><input class="inp" id="bb-d" style="width:100%" value="'+esc(b?b.descricao||"":"")+'"></div>'+
    '<label class="small" style="display:flex;gap:6px;margin-top:8px"><input type="checkbox" id="bb-f" '+(b&&b.fazenda?"checked":"")+'> Só para esta fazenda ('+esc(nomeFarm(FARM))+')</label>'+
    (!b&&TAB==="formular"&&CUR.itens.length?'<label class="small" style="display:flex;gap:6px;margin-top:6px"><input type="checkbox" id="bb-dieta" checked> Já incluir os '+CUR.itens.length+' alimentos da dieta aberta</label>':'')+
    '<div class="md-f"><button class="btn btn-o" onclick="fecharModal()">Cancelar</button><button class="btn btn-g" onclick="salvarBib(\''+esc(id||"")+'\')">Salvar</button></div>')}
function salvarBib(id){const nome=document.getElementById("bb-n").value.trim();if(!nome){toast("Dê um nome",true);return}
  const up={nome,descricao:document.getElementById("bb-d").value.trim()||null,fazenda:document.getElementById("bb-f").checked?FARM:null,atualizado_em:new Date().toISOString(),autor:NOME};
  const ref=id?db.ref("formulador/bibliotecas/"+id):db.ref("formulador/bibliotecas").push();
  if(!id){up.criado_em=up.atualizado_em;const al={};const cb=document.getElementById("bb-dieta");if(cb&&cb.checked)CUR.itens.forEach(it=>{al[bk(it.key)]=true});up.alimentos=al}
  (id?ref.update(up):ref.set(limpar(up))).then(()=>{fecharModal();BIB_SEL=ref.key;TAB="alimentos";render();toast("Biblioteca salva")}).catch(e=>toast(e.message,true))}
function excluirBib(){const b=BIBS[BIB_SEL];if(!b||!confirm("Excluir a biblioteca “"+b.nome+"”? Os alimentos continuam no banco."))return;db.ref("formulador/bibliotecas/"+BIB_SEL).remove().then(()=>{BIB_SEL="";render();toast("Biblioteca excluída")})}
function bibsDoAlimento(key){const a=FOODS[key];const bs=bibsVisiveis().filter(([,b])=>!b.fixa);
  abrirModal('<h2>Bibliotecas</h2><p class="small muted">'+esc(a?a.nome:"")+'</p>'+(bs.length?'<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">'+bs.map(([id,b])=>'<label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" '+(naBib(b,key)?"checked":"")+' onchange="togBib(\''+esc(id)+'\',\''+esc(key)+'\',this.checked)"> '+esc(b.nome)+'</label>').join("")+'</div>':'<p class="small" style="margin-top:8px">Nenhuma biblioteca ainda.</p>')+
    '<div class="md-f"><button class="btn btn-o" onclick="fecharModal();novaBib()">+ Nova biblioteca</button><button class="btn btn-g" onclick="fecharModal();render()">Pronto</button></div>')}

/* ============================================================
   BALANÇO DE AMINOÁCIDOS (como o relatório de AA do AMTS)
   requerido = exigência líquida ÷ eficiência-alvo NASEM 2021 (His 0,75 · Ile 0,71 · Leu 0,73 · Lys 0,72 · Met 0,73)
   ============================================================ */
const AA_NOME={arg:["ARG","Arginina"],his:["HIS","Histidina"],ile:["ILE","Isoleucina"],leu:["LEU","Leucina"],lis:["LIS","Lisina"],met:["MET","Metionina"],phe:["PHE","Fenilalanina"],thr:["THR","Treonina"],trp:["TRP","Triptofano"],val:["VAL","Valina"]};
/* faixas de % PM usadas pelo AMTS/CNCPS (relatório de aminoácidos) */
const AA_AMTS={met:[2.1,2.5],lis:[6.15,7.2],arg:[5,null],thr:[4.6,null],leu:[null,8.7],ile:[4.7,5.0],val:[5.8,null],his:[2.5,5.1],phe:[4.9,5.1],trp:[null,1.4]};
function resAA(R){const A=R.aaN;const ord=["met","lis","arg","thr","leu","ile","val","his","phe","trp"];const rows=ord.map(k=>A.rows.find(r=>r.k===k));
  const cor=p=>p==null?"#94a3b8":p<97?"var(--red)":p<=115?"var(--G)":"var(--amber)";
  let h='<div class="sec">Balanço de aminoácidos — NASEM 2021 (10 AA essenciais)</div><div class="tw"><table class="t aat"><thead><tr><th rowspan="2">AA</th><th rowspan="2" class="num">Dieta<br>% PM</th><th colspan="3" class="grpc">PM</th><th colspan="3" class="grpc">Suprimento de AA absorvido (g/d)</th><th rowspan="2" class="num">Faixa de<br>referência % PM</th></tr><tr><th class="num">% requerido</th><th class="num">Balanço (g/d)</th><th class="num">Requerido (g/d)</th><th class="num">Total</th><th class="num">Bact.</th><th class="num">PNDR</th></tr></thead><tbody>'+
    rows.map(r=>{const rf=AA_AMTS[r.k];const st=stRef(r.pm,rf[0],rf[1],2);const nm=AA_NOME[r.k];return'<tr><td><b>'+nm[0]+'</b> <span class="muted small">'+nm[1]+'</span></td><td class="num"><span class="st '+st+'"></span><b>'+f(r.pm,2)+'</b></td><td class="num" style="color:'+cor(r.pct)+';font-weight:700">'+(r.pct!=null?f(r.pct,1)+'%':'—')+'</td><td class="num">'+(r.bal!=null?(r.bal>=0?"+":"−")+f(Math.abs(r.bal),1):'—')+'</td><td class="num">'+(r.req!=null?f(r.req,1):'<span class="tiny muted">não definido</span>')+'</td><td class="num">'+f(r.abs,1)+'</td><td class="num">'+f(r.mic,1)+'</td><td class="num">'+f(r.rup,1)+'</td><td class="num ref">'+refTxt(rf[0],rf[1],2)+'</td></tr>'}).join("")+
    '</tbody></table></div><div class="small" style="margin:6px 0 10px"><b>LIS : MET '+f(A.lisMet,2)+'</b> <span class="muted">(referência 2,7–3,0) · Met '+f(R.amts.metEM,2)+' g/Mcal EM · Lis '+f(R.amts.lisEM,2)+' g/Mcal EM</span></div>'+
    (A.semAA>0.001?'<div class="alert slim"><div>'+f(A.semAA*1000,0)+' g/d de PNDR vêm de alimentos sem perfil de aminoácidos no cadastro (alimentos importados). Eles entram como zero no suprimento de AA da PNDR.</div></div>':'');
  const W=620,H=220,pl=40,pb=26,pt=14,vs=rows.filter(r=>r.pct!=null);const mx=Math.max(160,...vs.map(r=>r.pct))*1.05,bw=(W-pl-10)/vs.length;const Y=v=>pt+(1-v/mx)*(H-pt-pb);
  let g='';[0,50,100,150].filter(v=>v<=mx).forEach(v=>{g+='<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="'+(v===100?"#94a3b8":"#eef2f6")+'"'+(v===100?' stroke-dasharray="4 3"':'')+'/><text x="'+(pl-6)+'" y="'+(Y(v)+3)+'" text-anchor="end" font-size="10" fill="#94a3b8">'+v+'</text>'});
  vs.forEach((r,i)=>{const x=pl+i*bw+bw*0.2,w=bw*0.6;g+='<rect x="'+x+'" y="'+Y(r.pct)+'" width="'+w+'" height="'+(Y(0)-Y(r.pct))+'" rx="4" fill="'+cor(r.pct)+'" opacity=".85"><title>'+AA_NOME[r.k][1]+': '+f(r.pct,1)+'% do requerido</title></rect><text x="'+(x+w/2)+'" y="'+(Y(r.pct)-4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">'+f(r.pct,0)+'</text><text x="'+(x+w/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="#475569">'+AA_NOME[r.k][0]+'</text>'});
  h+='<div class="aagrid"><div><div class="small" style="font-weight:700;margin-bottom:4px">% do requerido (suprimento ÷ requerido)</div><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:640px">'+g+'</svg></div>'+
    '<div class="tiny muted"><p>Verde: 97–115% · vermelho: abaixo de 97% · laranja: acima de 115% do requerido.</p><p style="margin-top:6px"><b>Suprimento</b> = proteína verdadeira microbiana (82,4% da PB microbiana) × perfil de AA microbiano (Sok et al., 2017) × 0,80 + PNDR digestível de cada alimento × perfil de AA da biblioteca NASEM (corrigido pela recuperação da hidrólise).</p><p style="margin-top:6px"><b>Requerido</b> = (leite + descamação + fecal metabólico) ÷ eficiência-alvo NASEM + urinário endógeno + gestação ÷ 0,33 + ganho ÷ eficiência do ganho. Eficiências: His 0,75 · Ile 0,71 · Leu 0,73 · Lys 0,72 · Met 0,73 · Phe 0,60 · Thr 0,64 · Trp 0,86 · Val 0,74. A arginina é parcialmente sintetizada e o NASEM não define requerimento.</p></div></div>';
  return h}
/* PDR e PNDR: de onde vêm, quanto da PNDR é digestível */
function secPDR(R){const T=R.T;const ls=R.lin.filter(o=>o.pb>0.0005).sort((a,b)=>b.pndr-a.pndr);const tp=T.pb||1,tn=T.pndr||1;
  const rows=ls.map(o=>'<tr><td><span class="cat cat-'+esc(o.cat)+'">'+esc(o.cat)+'</span> '+esc(o.nome)+'</td><td class="num">'+f(o.pb*1000,0)+'</td><td class="num">'+f(o.pb>0?o.pdr/o.pb*100:0,0)+'%</td><td class="num">'+f(o.pdr*1000,0)+'</td><td class="num"><b>'+f(o.pndr*1000,0)+'</b></td><td class="num">'+f(o.pndr>0?o.dpndr/o.pndr*100:0,0)+'%</td><td class="num">'+f(o.dpndr*1000,0)+'</td><td class="num">'+f(o.pndr/tn*100,0)+'%</td></tr>').join("");
  const pmM=R.pm.pmMic,pmP=R.pm.pmPndr,tot=pmM+pmP||1;
  return'<div class="sec">PDR e PNDR da dieta</div><div class="kslim">'+[["PB",f(T.pb*1000,0)+" g/d",f(R.D.pb*100,1)+"% MS"],["PDR",f(T.pdr*1000,0)+" g/d",f(T.pdr/tp*100,0)+"% da PB · "+f(R.D.pdr*100,1)+"% MS"],["PNDR",f(T.pndr*1000,0)+" g/d",f(T.pndr/tp*100,0)+"% da PB · "+f(R.D.pndr*100,1)+"% MS"],["PNDR digestível",f(T.dpndr*1000,0)+" g/d",f(T.pndr>0?T.dpndr/T.pndr*100:0,0)+"% da PNDR"],["PDR usada pelos micróbios",f(R.pm.pbMic,0)+" g/d","balanço "+(R.pm.balPDR>=0?"+":"−")+f(Math.abs(R.pm.balPDR*1000),0)+" g/d"]].map(([l,v,s])=>'<div><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="tiny muted">'+s+'</div></div>').join("")+'</div>'+
    '<div class="small" style="margin:2px 0 4px">Proteína metabolizável: <b>'+f(pmM/tot*100,0)+'%</b> microbiana ('+f(pmM,0)+' g) · <b>'+f(pmP/tot*100,0)+'%</b> da PNDR ('+f(pmP,0)+' g)</div>'+pilha([{l:"PM microbiana",v:pmM,cor:"#15803d",dec:0},{l:"PM da PNDR",v:pmP,cor:"#65a30d",dec:0}],tot,12)+
    '<div class="tw" style="margin-top:8px"><table class="t"><thead><tr><th>Alimento</th><th class="num">PB g/d</th><th class="num">PDR % PB</th><th class="num">PDR g/d</th><th class="num">PNDR g/d</th><th class="num">Digest. PNDR</th><th class="num">PNDR dig. g/d</th><th class="num">% da PNDR</th></tr></thead><tbody>'+rows+
    '</tbody><tfoot><tr class="tot"><td>Total</td><td class="num">'+f(T.pb*1000,0)+'</td><td class="num">'+f(T.pdr/tp*100,0)+'%</td><td class="num">'+f(T.pdr*1000,0)+'</td><td class="num">'+f(T.pndr*1000,0)+'</td><td class="num">'+f(T.pndr>0?T.dpndr/T.pndr*100:0,0)+'%</td><td class="num">'+f(T.dpndr*1000,0)+'</td><td class="num">100%</td></tr></tfoot></table></div>'+
    '<div class="tiny muted" style="margin-top:4px">PDR = proteína degradada no rúmen (alimenta os micróbios); PNDR = proteína que escapa do rúmen e é digerida no intestino conforme a digestibilidade de cada alimento. A PM é a soma da proteína microbiana digestível com a PNDR digestível.</div>'}

/* ============================================================
   FAZENDAS (abrir / criar) — clientes do Meta Gestão + fazendas criadas no formulador
   ============================================================ */
function mergeFazF(v){FAZF=v||{};Object.keys(PROPS).forEach(k=>{if(k.startsWith("fz_"))delete PROPS[k]});Object.entries(FAZF).forEach(([id,d])=>{if(d&&(d.propriedade||d.produtor))PROPS["fz_"+id]=Object.assign({},d,{_form:true})})}
let FAZ_Q="";
function abrirFazendas(){abrirModal('<h2>Fazendas</h2><div class="row2" style="margin:8px 0"><input class="inp" id="fz-q" style="flex:1" placeholder="Buscar por fazenda, produtor ou cidade…" value="'+esc(FAZ_Q)+'" oninput="FAZ_Q=this.value;listaFaz()" autocomplete="off">'+(ADM?'<button class="btn btn-g" onclick="novaFazenda()">+ Nova fazenda</button>':'')+'</div><div id="fz-l" style="max-height:60vh;overflow:auto"></div><div class="md-f"><button class="btn btn-o" onclick="fecharModal()">Fechar</button></div>',"lg");listaFaz();setTimeout(()=>{const q=document.getElementById("fz-q");if(q)q.focus()},50)}
function listaFaz(){const n=norm(FAZ_Q);const ids=Object.keys(PROPS).filter(id=>{const p=PROPS[id]||{};return(p.propriedade||p.produtor)&&(!n||norm(nomeFarm(id)+" "+(p.cidade||"")+" "+(p.estado||"")).includes(n))}).sort((a,b)=>nomeFarm(a).localeCompare(nomeFarm(b)));
  const grp=(t,xs)=>xs.length?'<div class="sec">'+t+' <span class="muted">'+xs.length+'</span></div>'+xs.slice(0,150).map(id=>{const p=PROPS[id];return'<div class="fzrow'+(id===FARM?" on":"")+'"><button class="fzn" onclick="fecharModal();selFarm(\''+esc(id)+'\')"><b>'+esc(nomeFarm(id))+'</b><span class="tiny muted">'+esc([p.cidade,p.estado].filter(Boolean).join(" · "))+(p.vacas?' · '+esc(p.vacas)+' vacas':'')+(p.sistema?' · '+esc(p.sistema):'')+'</span></button>'+(p._form&&ADM?'<button class="btn btn-o btn-sm" onclick="novaFazenda(\''+esc(id.slice(3))+'\')">Editar</button>':'')+'</div>'}).join(""):"";
  document.getElementById("fz-l").innerHTML=(grp("Fazendas criadas no formulador",ids.filter(i=>PROPS[i]._form))+grp("Clientes do Meta Gestão",ids.filter(i=>!PROPS[i]._form)))||'<div class="empty"><b>Nenhuma fazenda encontrada</b></div>'}
const FAZ_CAMPOS=[["propriedade","Nome da fazenda","t"],["produtor","Produtor","t"],["cidade","Cidade","t"],["estado","UF","t"],["sistema","Sistema","sel",["","Free stall","Compost barn","Tie stall","Pasto","Semiconfinado","Confinamento (engorda)"]],["tecnico","Técnico responsável","t"],["vacas","Vacas em lactação","n"],["preco_litro","Preço do leite (R$/L)","n"],["gordura","Gordura do leite (%)","n"],["proteina","Proteína do leite (%)","n"],["obs","Observações","t"]];
function novaFazenda(id){const d=id?FAZF[id]||{}:{};
  abrirModal('<h2>'+(id?"Editar fazenda":"Nova fazenda")+'</h2><p class="small muted">Fazenda do formulador (fica fora da carteira do Meta Gestão). Os lotes, dietas, laudos e localizações dela funcionam igual às demais.</p><div class="fzform">'+
    FAZ_CAMPOS.map(([k,l,t,op])=>'<div class="fld'+(k==="obs"||k==="propriedade"?" w2":"")+'"><label>'+l+'</label>'+(t==="sel"?'<select class="sel" id="fz-'+k+'">'+op.map(o=>'<option'+(o===(d[k]||"")?" selected":"")+'>'+esc(o)+'</option>').join("")+'</select>':'<input class="inp" id="fz-'+k+'" '+(t==="n"?'type="number" step="any"':'')+' value="'+esc(d[k]!=null?d[k]:"")+'">')+'</div>').join("")+'</div>'+
    '<div class="md-f">'+(id?'<button class="btn btn-o" style="margin-right:auto;color:var(--red)" onclick="excluirFazenda(\''+esc(id)+'\')">Excluir</button>':'')+'<button class="btn btn-o" onclick="abrirFazendas()">Voltar</button><button class="btn btn-g" onclick="salvarFazenda(\''+esc(id||"")+'\')">Salvar e abrir</button></div>',"lg")}
function salvarFazenda(id){const d={};FAZ_CAMPOS.forEach(([k,,t])=>{const v=document.getElementById("fz-"+k).value;d[k]=t==="n"?num(v):String(v).trim()||null});
  if(!d.propriedade&&!d.produtor){toast("Informe o nome da fazenda ou do produtor",true);return}
  d.atualizado_em=new Date().toISOString();d.autor=NOME;const ref=id?db.ref("formulador/fazendas/"+id):db.ref("formulador/fazendas").push();if(!id)d.criado_em=d.atualizado_em;
  (id?ref.update(d):ref.set(limpar(d))).then(()=>{mergeFazF(Object.assign({},FAZF,{[ref.key]:Object.assign({},FAZF[ref.key]||{},d)}));fecharModal();selFarm("fz_"+ref.key);toast(id?"Fazenda atualizada":"Fazenda criada")}).catch(e=>toast(e.message,true))}
function excluirFazenda(id){const temLotes=FARM==="fz_"+id&&loteEntries().length;if(!confirm("Excluir a fazenda “"+((FAZF[id]||{}).propriedade||"")+"”?"+(temLotes?" Ela tem lotes cadastrados; eles ficam guardados, mas sem fazenda.":"")))return;
  db.ref("formulador/fazendas/"+id).remove().then(()=>{if(FARM==="fz_"+id)selFarm(null);fecharModal();toast("Fazenda excluída")})}

/* ============================================================
   LOCALIZAÇÕES (barracões) — como "Barns/Groups" do AMTS: ambiente e ITU
   ============================================================ */
const LOC_CAMPOS=[["temp","Temperatura média","°C"],["tmin","Temperatura mínima","°C"],["tempAnt","Temperatura anterior","°C"],["ur","Umidade relativa","%"],["urAnt","Umidade relativa anterior","%"],["vento","Velocidade do vento","km/h"],["ventoAnt","Vento anterior","km/h"],["horasSol","Horas no sol","h/dia"],["tempestade","Exposto a tempestade","chk"],["noturna","Temperatura noturna < 20 °C","chk"]];
function locsOrd(){return Object.entries(LOCS||{}).filter(([,o])=>o&&o.nome).sort((a,b)=>a[1].nome.localeCompare(b[1].nome))}
function itu(o){if(!o||o.temp==null||o.temp===""||o.ur==null||o.ur==="")return null;const T=+o.temp,U=+o.ur;return(1.8*T+32)-(0.55-0.0055*U)*(1.8*T-26)}
function ituClasse(v){return v==null?null:v<68?["Sem estresse","ok"]:v<72?["Estresse leve","warn"]:v<80?["Estresse moderado","warn"]:["Estresse severo","bad"]}
function locTxt(){const lid=CUR&&CUR.loteId&&(LOTF[CUR.loteId]||{}).local;const o=lid&&LOCS[lid];if(!o)return"";const v=itu(o),c=ituClasse(v);return" · "+o.nome+(v!=null?" (ITU "+f(v,0)+" — "+c[0].toLowerCase()+")":"")}
function cardLocais(){const L=locsOrd();const o=LOC_SEL&&LOCS[LOC_SEL];const v=itu(o),c=ituClasse(v);const nL=id=>loteEntries().filter(([,l])=>(LOTF[l.id]||{}).local===id).length;
  let h='<div class="card" style="padding:10px 14px"><div class="row2" style="align-items:center"><b style="font-size:13.5px">Localização</b><div class="pill"><button class="'+(!LOC_SEL?"on":"")+'" onclick="LOC_SEL=\'\';render()">Todas</button>'+L.map(([id,x])=>'<button class="'+(LOC_SEL===id?"on":"")+'" onclick="LOC_SEL=\''+esc(id)+'\';render()">'+esc(x.nome)+' <span class="muted">'+nL(id)+'</span></button>').join("")+'</div><span style="flex:1"></span>'+
    (ADM?'<button class="btn btn-o btn-sm" onclick="criarLocal()">+ Localização</button>'+(o?'<button class="btn btn-o btn-sm" onclick="renomearLocal()">Renomear</button><button class="btn btn-o btn-sm" onclick="removerLocal()">Remover</button>':''):'')+'</div>';
  if(o){h+='<div class="locg">'+LOC_CAMPOS.map(([k,l,u])=>'<label class="fld"><span>'+l+(u!=="chk"?' <span class="ref">'+u+'</span>':'')+'</span>'+(u==="chk"?'<input type="checkbox" '+(o[k]?"checked":"")+(ADM?'':' disabled')+' onchange="setLocal(\''+k+'\',this.checked)">':'<input class="inp num" type="number" step="any" value="'+esc(o[k]!=null?o[k]:"")+'"'+(ADM?'':' disabled')+' onchange="setLocal(\''+k+'\',this.value)">')+'</label>').join("")+
    '<div class="fld itu"><span>ITU (temperatura e umidade)</span><b class="'+(c?c[1]:"")+'">'+(v!=null?f(v,0)+' · '+c[0]:'informe temperatura e umidade')+'</b></div></div><div class="tiny muted" style="margin-top:4px">A temperatura mínima do barracão entra no cálculo de água dos lotes dele (se o lote não tiver a sua). ITU ≥ 68 já reduz consumo e produção em vacas de alta.</div>'}
  return h+'</div>'}
function criarLocal(){const nome=prompt("Nome da localização (ex.: Barracão 1, Compost 2, Piquete maternidade):","Barracão "+(locsOrd().length+1));if(!nome)return;const ref=db.ref("formulador/locais/"+FARM).push();ref.set({nome:nome.trim(),temp:25,ur:60,vento:1,horasSol:0,criado_em:new Date().toISOString()}).then(()=>{LOC_SEL=ref.key;render();toast("Localização criada")})}
function renomearLocal(){const o=LOCS[LOC_SEL];if(!o)return;const n=prompt("Novo nome:",o.nome);if(!n)return;db.ref("formulador/locais/"+FARM+"/"+LOC_SEL+"/nome").set(n.trim())}
function removerLocal(){const o=LOCS[LOC_SEL];if(!o||!confirm("Remover a localização “"+o.nome+"”? Os lotes continuam, sem localização."))return;const up={};up["formulador/locais/"+FARM+"/"+LOC_SEL]=null;loteEntries().forEach(([,l])=>{if((LOTF[l.id]||{}).local===LOC_SEL)up["formulador/lotes/"+FARM+"/"+l.id+"/local"]=null});db.ref().update(up).then(()=>{LOC_SEL="";render()})}
function setLocal(k,v){const val=typeof v==="boolean"?v:num(v);db.ref("formulador/locais/"+FARM+"/"+LOC_SEL+"/"+k).set(val==null?null:val)}

function recarregarLote(){const l=lotes().find(x=>x.id===CUR.loteId);if(!l)return;if(CUR.itens.length&&!confirm("Descartar as alterações e voltar à dieta atual do lote?"))return;abrirDietaAtual(l)}
function salvarNoLote(){if(!CUR.loteId){toast("Escolha o lote para salvar a dieta",true);const s=document.querySelector("main .card select.sel");if(s)s.focus();return}aplicarNoLote()}

/* amido fermentável por alimento: kd do amido (%/h) × passagem (kp) — total = rápido (fermentado no rúmen) + lento */
function secAmido(R){const ls=R.lin.filter(o=>o.amido>0.001).sort((a,b)=>b.amido-a.amido);if(!ls.length)return"";const tf=R.amidoF.ferm||1;
  return'<div class="sec">Amido fermentável por alimento</div><div class="tw"><table class="t"><thead><tr><th>Alimento</th><th class="num">Amido g/d</th><th class="num">kd %/h</th><th class="num">kp %/h</th><th class="num">Fermentável</th><th class="num">Rápido g/d</th><th class="num">Lento g/d</th><th class="num">% do fermentável</th></tr></thead><tbody>'+
    ls.map(o=>'<tr><td><span class="cat cat-'+esc(o.cat)+'">'+esc(o.cat)+'</span> '+esc(o.nome)+'</td><td class="num">'+f(o.amido*1000,0)+'</td><td class="num">'+f(o.kdAm*100,0)+'</td><td class="num">'+f(o.kpAm*100,1)+'</td><td class="num"><b>'+f(o.amido>0?o.amFerm/o.amido*100:0,0)+'%</b></td><td class="num">'+f(o.amFerm*1000,0)+'</td><td class="num">'+f((o.amido-o.amFerm)*1000,0)+'</td><td class="num">'+f(o.amFerm/tf*100,0)+'%</td></tr>').join("")+
    '</tbody><tfoot><tr class="tot"><td>Total</td><td class="num">'+f(R.T.amido*1000,0)+'</td><td></td><td></td><td class="num">'+f(R.amidoF.pct,0)+'%</td><td class="num">'+f(R.amidoF.ferm*1000,0)+'</td><td class="num">'+f(R.amidoF.lento*1000,0)+'</td><td class="num">100%</td></tr></tfoot></table></div>'+
    '<div class="tiny muted" style="margin-top:4px">Fermentável = amido × kd ÷ (kd + kp): a parte que fermenta rápido no rúmen; o restante (lento) escapa para o intestino. O kd vem do laudo (kd dinâmico do amido) quando houver; nos alimentos de tabela é uma referência por tipo de processamento (ex.: milho seco moído fino 18%/h, grosso 10%/h, grão úmido 30–40%/h, floculado 30%/h) — ajuste no ✎ do alimento. kp de forragem para silagens e de concentrado para grãos.</div>'}


</script>
