<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meta Formulador</title>
<meta name="theme-color" content="#052e16">
<link rel="icon" href="meta_logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#f3f6f3;--card:#fff;--border:#e2e8f0;--line:#f1f5f9;--text:#0f172a;--muted:#64748b;--faint:#94a3b8;
--G:#15803d;--GD:#052e16;--GL:#f0fdf4;--amber:#b45309;--amberL:#fffbeb;--red:#dc2626;--redL:#fef2f2;--blue:#2a78d6;
--c-F:#15803d;--c-SM:#65a30d;--c-C:#b45309;--c-P:#7c3aed;--c-X:#0891b2;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--G);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.inp,.sel,textarea.inp{border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:#fff;min-width:0}
.inp:focus,.sel:focus{border-color:var(--G);outline:none}
.btn{border:1px solid transparent;border-radius:9px;padding:8px 13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;justify-content:center}
.btn-g{background:var(--G);color:#fff}.btn-o{background:#fff;border-color:var(--border)}.btn-r{background:#fff;color:var(--red);border-color:#fecaca}
.btn-d{background:var(--GD);color:#fff}
.btn-sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.ico{background:none;border:none;color:var(--faint);padding:4px 6px;border-radius:6px;font-size:15px;line-height:1}.ico:hover{background:var(--line);color:var(--red)}
/* login */
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px;background:var(--GD)}
.lb{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:360px}
.lb h1{font-size:20px;margin-bottom:4px}.lb p{color:var(--muted);font-size:13px;margin-bottom:14px}
.lb .inp{width:100%;padding:12px;margin-bottom:8px;font-size:15px}.lb .btn{width:100%;padding:12px;font-size:15px}
/* topo */
#app{display:none}
.top{background:var(--GD);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand b{font-size:16px}.brand span{font-size:11.5px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.top .btn-o{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.tabs{max-width:1440px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:none;color:#fff;opacity:.7;padding:10px 12px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{opacity:1;border-bottom-color:#4ade80}
main{max-width:1440px;margin:0 auto;padding:16px 16px 80px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;min-width:0;margin-bottom:14px}
.card h3{font-size:14.5px;font-weight:700}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.ch-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}.ch-h>div:first-child{flex:1;min-width:180px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13.5px;background:var(--amberL);border:1px solid #fde68a;color:#78350f}
.alert.ok{background:var(--GL);border-color:#bbf7d0;color:#14532d}.alert.bad{background:var(--redL);border-color:#fecaca;color:#7f1d1d}
.alert ul{margin:4px 0 0 16px}
/* layout de formulação */
.fgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.fgrid>div{min-width:0}
.sticky{position:sticky;top:104px}
@media(max-width:1100px){.fgrid{grid-template-columns:1fr}.sticky{position:static}}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px 10px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:11.5px;color:var(--muted);font-weight:600}
.fld .inp,.fld .sel{width:100%;padding:7px 9px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* tabela de ingredientes */
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700;text-align:right;padding:6px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
table.t tr.tot td{font-weight:800;border-top:2px solid var(--border);border-bottom:none}
table.ing .inp{padding:5px 6px;width:70px;text-align:right;border-radius:7px;font-size:13px}
table.ing .inp.w{width:62px}
table.ing td.nm{min-width:200px;max-width:280px}
.nmw{display:flex;align-items:center;gap:6px}.nmw span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat{display:inline-block;font-size:10px;font-weight:800;border-radius:5px;padding:1px 5px;color:#fff;flex-shrink:0;min-width:22px;text-align:center}
.cat-F{background:var(--c-F)}.cat-SM{background:var(--c-SM)}.cat-C{background:var(--c-C)}.cat-P{background:var(--c-P)}.cat-X{background:var(--c-X)}
.org{font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:0 4px;flex-shrink:0}
.lim{display:none}.showlim .lim{display:table-cell}
.fix{accent-color:var(--G)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:40px}.bar i{display:block;height:100%;background:var(--G)}
/* busca de alimento */
.srch{position:relative}
.srch .inp{width:100%}
.dd{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(15,23,42,.14);max-height:320px;overflow:auto;z-index:30;display:none}
.dd.on{display:block}
.dd button{display:flex;width:100%;text-align:left;background:none;border:none;padding:8px 10px;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.dd button:hover,.dd button.hi{background:var(--GL)}
.dd .g{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;padding:6px 10px;background:#f8fafc;letter-spacing:.04em}
/* restrições */
.rs{display:grid;grid-template-columns:22px minmax(0,1fr) 74px 74px;gap:6px 8px;align-items:center;font-size:13px}
.rs .inp{padding:5px 6px;text-align:right;width:100%;font-size:13px}
.rs .h{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.rs .u{color:var(--faint);font-size:11.5px}
.rs .off{opacity:.45}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--mono);font-size:20px;font-weight:700;margin-top:2px;white-space:nowrap}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.good{border-color:#bbf7d0;background:linear-gradient(#fff,#f7fdf9)}.kpi.bad{border-color:#fecaca;background:linear-gradient(#fff,#fff8f8)}.kpi.warn{border-color:#fde68a}
.kpi.good .v{color:var(--G)}.kpi.bad .v{color:var(--red)}
/* tabela de nutrientes */
.sec{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 4px}
details.box{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:#fff}
details.box>summary{list-style:none;cursor:pointer;padding:10px 14px;font-weight:700;display:flex;align-items:center;gap:8px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary:after{content:"▸";margin-left:auto;color:var(--faint)}details.box[open]>summary:after{content:"▾"}
details.box>div{padding:0 14px 12px;overflow-x:auto}
#res .card{overflow-x:auto}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.st.ok{background:var(--G)}.st.lo{background:var(--red)}.st.hi{background:var(--amber)}.st.na{background:#e2e8f0}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.chip.ok{background:var(--GL);color:var(--G)}.chip.bad{background:var(--redL);color:var(--red)}.chip.warn{background:var(--amberL);color:var(--amber)}.chip.neu{background:var(--line);color:var(--muted)}
.ref{color:var(--faint);font-size:11.5px}
/* ações */
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fab{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--border);padding:10px 16px;display:none;z-index:15;backdrop-filter:blur(6px)}
@media(max-width:1100px){.fab{display:flex;gap:8px}.fab .btn{flex:1}}
/* listas */
.lst .it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lst .it:last-child{border-bottom:none}
.lst .it .f{flex:1;min-width:200px}
.lst .it b{font-weight:700}
/* modal */
#mdw{position:fixed;inset:0;background:rgba(2,6,23,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
#md{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:640px}
#md.lg{max-width:980px}
#md h2{font-size:17px;margin-bottom:4px}
.md-f{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
/* toast */
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);background:var(--G);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.pill{display:inline-flex;gap:4px;background:var(--line);border-radius:9px;padding:3px}
.pill button{background:none;border:none;padding:5px 10px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted)}
.pill button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 64px;gap:4px 10px;align-items:center;font-size:12.5px}
.hbar .b{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.hbar .b i{display:block;height:100%}
@media(max-width:560px){table.ing td.nm{min-width:150px;max-width:170px}.top-in{gap:8px}.brand span{display:none}.kpi .v{font-size:17px}main{padding:12px 12px 90px}.card{padding:14px}.tw{margin:0 -14px;padding:0 14px}.rs{grid-template-columns:22px minmax(0,1fr) 62px 62px}}
@media print{.top,.fab,.actions,.noprint{display:none!important}body{background:#fff}.card{border:none;padding:0}.fgrid{display:block}.sticky{position:static}}
</style>
</head>
<body>
<div id="login"><div class="lb"><h1>Meta Formulador</h1><p>Formulação de dietas — META Nutrição</p>
<input class="inp" id="l-e" type="email" placeholder="E-mail" autocomplete="username"><input class="inp" id="l-s" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
<button class="btn btn-g" onclick="login()">Entrar</button><p id="l-m" style="color:var(--red);margin:10px 0 0"></p></div></div>
<div id="app">
 <div class="top"><div class="top-in"><div class="brand"><b>Meta Formulador</b><span id="sub-top">Formulação de dietas · NASEM 2021 / UFLA</span></div>
  <button class="btn btn-o btn-sm" onclick="logout()">Sair</button></div>
  <div class="tabs" id="tabs"></div></div>
 <main id="m"></main>
</div>
<div class="fab" id="fab"></div>
<div id="mdw" onclick="if(event.target===this)fecharModal()"><div id="md"></div></div>
<div id="toast"></div>

/* ============================================================
   OTIMIZADOR — substitui o Solver da planilha.
   Objetivo da planilha: maximizar RMCA/vaca (leite×preço − custo). Com o leite fixo,
   equivale a minimizar o custo da dieta. Restrições: limites de kg MN e de % da MS por
   alimento, CMS-alvo e limites nutricionais (mín/máx).
   Método: programação linear sequencial (SLP) com região de confiança e restrições
   elásticas — as relações não lineares (kp, amido degradado no rúmen, PB microbiana,
   leite por PM) são linearizadas a cada passo; quando não há solução viável, o
   otimizador devolve a dieta que menos viola e diz quais limites ficaram de fora.
   ============================================================ */

/* ---------- simplex de duas fases (tableau denso, regra de Bland) ----------
   min c·z  s.a.  rows[i]: a·z (<=|>=|=) b,  z >= 0 */
function simplex(c,rows){
  const n=c.length,EPS=1e-9;const R=rows.map(r=>{let a=r.a.slice(),b=r.b,t=r.t;if(b<0){a=a.map(v=>-v);b=-b;t=t==="<="?">=":t===">="?"<=":"="}return{a,b,t}});
  const m=R.length;let nS=0,nA=0;R.forEach(r=>{if(r.t!=="=")nS++;if(r.t!=="<=")nA++});
  const N=n+nS+nA;const T=[];const basis=[];let si=n,ai=n+nS;const art=[];
  R.forEach((r,i)=>{const row=new Float64Array(N+1);for(let j=0;j<n;j++)row[j]=r.a[j];
    if(r.t==="<="){row[si]=1;basis.push(si);si++}else if(r.t===">="){row[si]=-1;si++;row[ai]=1;basis.push(ai);art.push(ai);ai++}else{row[ai]=1;basis.push(ai);art.push(ai);ai++}
    row[N]=r.b;T.push(row)});
  const isArt=new Uint8Array(N);art.forEach(j=>isArt[j]=1);
  function pivot(r,col){const pr=T[r],pv=pr[col];for(let j=0;j<=N;j++)pr[j]/=pv;for(let i=0;i<m;i++){if(i===r)continue;const f=T[i][col];if(Math.abs(f)>1e-15){const ti=T[i];for(let j=0;j<=N;j++)ti[j]-=f*pr[j]}}basis[r]=col}
  function run(cost,allowed){/* reduz custos e itera */
    for(let it=0;it<5000;it++){
      let col=-1;
      for(let j=0;j<N;j++){if(!allowed(j))continue;let rc=cost[j];for(let i=0;i<m;i++)rc-=cost[basis[i]]*T[i][j];if(rc<-EPS){col=j;break}}
      if(col<0)return"ok";
      let r=-1,best=Infinity;for(let i=0;i<m;i++){const a=T[i][col];if(a>EPS){const q=T[i][N]/a;if(q<best-1e-12||(Math.abs(q-best)<=1e-12&&basis[i]<basis[r])){best=q;r=i}}}
      if(r<0)return"ilimitado";pivot(r,col)}
    return"iter"}
  if(art.length){const c1=new Float64Array(N);art.forEach(j=>c1[j]=1);const st=run(c1,()=>true);if(st!=="ok")return{status:st};
    const w=T.reduce((s,row,i)=>s+(isArt[basis[i]]?row[N]:0),0);if(w>1e-7)return{status:"inviavel"};
    for(let i=0;i<m;i++)if(isArt[basis[i]]){let col=-1;for(let j=0;j<n+nS;j++)if(Math.abs(T[i][j])>1e-9){col=j;break}if(col>=0)pivot(i,col)}}
  const c2=new Float64Array(N);for(let j=0;j<n;j++)c2[j]=c[j];
  const st=run(c2,j=>!isArt[j]);if(st!=="ok")return{status:st};
  const z=new Array(n).fill(0);for(let i=0;i<m;i++)if(basis[i]<n)z[basis[i]]=T[i][N];
  return{status:"ok",z};
}

function formular(an,itens,restr,opt){opt=opt||{};
  const n=itens.length;if(!n)return{status:"vazio"};
  const lb=itens.map(x=>x.fixo?+x.kg||0:Math.max(0,+x.min||0)),ub=itens.map((x,i)=>x.fixo?+x.kg||0:(x.max!=null&&x.max!==""?+x.max:60));
  const cost=itens.map(x=>+x.a.custo||0);
  const avalia=x=>calcDieta(an,itens.map((it,i)=>({a:it.a,kg:x[i]})));
  /* CMS-alvo calculado uma vez a partir da dieta de partida (as previsões NASEM 1 e CNCPS não dependem da dieta;
     NASEM 2 depende da FDNF/FDA da dieta e é reavaliado a cada passo) */
  let x=itens.map((it,i)=>Math.min(ub[i],Math.max(lb[i],+it.kg||0)));
  const cons=[];
  restr.filter(r=>r.on&&RESTR_BY[r.id]).forEach(r=>{const d=RESTR_BY[r.id];
    if(r.id==="cms"){cons.push({id:"cms",n:d.n,u:d.u,esc:0.2,dec:2,f:R=>R.cms,lo:R=>{const v=cmsAlvo(r,R);return v==null?null:v-(+r.tol||0)},hi:R=>{const v=cmsAlvo(r,R);return v==null?null:v+(+r.tol||0)}});return}
    const lo=r.min!=null&&r.min!==""?+r.min:null,hi=r.max!=null&&r.max!==""?+r.max:null;if(lo==null&&hi==null)return;
    cons.push({id:r.id,n:d.n,u:d.u,esc:d.esc,dec:d.dec,f:d.f,lo:()=>lo,hi:()=>hi})});
  /* % da MS por alimento: ms_i − p·CMS ≥ 0 (linear) */
  itens.forEach((it,i)=>{const pm=it.pmin!=null&&it.pmin!==""?+it.pmin/100:null,pM=it.pmax!=null&&it.pmax!==""?+it.pmax/100:null;
    if(pm!=null&&pm>0)cons.push({id:"pms"+i,n:"% MS de "+it.a.nome,u:"",esc:0.01,dec:1,f:R=>R.lin[i].ms-pm*R.cms,lo:()=>0,hi:()=>null,item:i,tipo:"pmin",val:pm*100});
    if(pM!=null&&pM<1)cons.push({id:"pMs"+i,n:"% MS de "+it.a.nome,u:"",esc:0.01,dec:1,f:R=>R.lin[i].ms-pM*R.cms,lo:()=>null,hi:()=>0,item:i,tipo:"pmax",val:pM*100})});
  const k=cons.length;
  const viol=R=>cons.map(c=>{const v=c.f(R),lo=c.lo(R),hi=c.hi(R);if(!isFinite(v))return 1e3;let e=0;if(lo!=null&&v<lo)e=lo-v;if(hi!=null&&v>hi)e=v-hi;return e/c.esc});
  const custoX=x=>x.reduce((s,v,i)=>s+v*cost[i],0);
  const cEsc=Math.max(1,custoX(ub.map((u,i)=>Math.min(u,10))));
  const M=opt.M||200;
  const merito=x=>{const R=avalia(x);const v=viol(R);return{R,v,phi:custoX(x)/cEsc+M*v.reduce((a,b)=>a+b,0)}};
  let cur=merito(x);let delta=Math.max(1,ub.reduce((a,b)=>Math.max(a,isFinite(b)?b:0),0)*0.25);let it=0;
  for(;it<(opt.maxIt||150)&&delta>1e-5;it++){
    const R0=cur.R;const g0=cons.map(c=>c.f(R0));
    /* jacobiano por diferenças finitas */
    const J=cons.map(()=>new Array(n).fill(0));
    for(let j=0;j<n;j++){if(ub[j]-lb[j]<1e-12)continue;const h=1e-5*Math.max(1,x[j]);const xp=x.slice();let hh=h;if(xp[j]+h>ub[j])hh=-h;xp[j]+=hh;const Rp=avalia(xp);cons.forEach((c,ci)=>{const v=c.f(Rp);J[ci][j]=isFinite(v)&&isFinite(g0[ci])?(v-g0[ci])/hh:0})}
    /* LP no passo d = y − dl (y ≥ 0), com folgas elásticas e⁺, e⁻ */
    const dl=x.map((v,j)=>Math.max(lb[j]-v,-delta)),du=x.map((v,j)=>Math.min(ub[j]-v,delta));
    const nv=n+2*k;const c=new Array(nv).fill(0);for(let j=0;j<n;j++)c[j]=cost[j]/cEsc;for(let i=0;i<k;i++){c[n+i]=M/cons[i].esc;c[n+k+i]=M/cons[i].esc}
    const rows=[];
    for(let j=0;j<n;j++){const a=new Array(nv).fill(0);a[j]=1;rows.push({a,t:"<=",b:du[j]-dl[j]})}
    cons.forEach((cc,i)=>{const lo=cc.lo(R0),hi=cc.hi(R0);const base=g0[i]+J[i].reduce((s,v,j)=>s+v*dl[j],0);
      if(lo!=null){const a=new Array(nv).fill(0);for(let j=0;j<n;j++)a[j]=J[i][j];a[n+i]=1;rows.push({a,t:">=",b:lo-base})}
      if(hi!=null){const a=new Array(nv).fill(0);for(let j=0;j<n;j++)a[j]=J[i][j];a[n+k+i]=-1;rows.push({a,t:"<=",b:hi-base})}});
    const lp=simplex(c,rows);
    if(lp.status!=="ok"){delta*=0.5;continue}
    const xn=x.map((v,j)=>Math.min(ub[j],Math.max(lb[j],v+dl[j]+lp.z[j])));
    const passo=xn.reduce((s,v,j)=>Math.max(s,Math.abs(v-x[j])),0);
    const nw=merito(xn);
    /* redução prevista pelo modelo linear */
    const pred=cur.phi-(lp.z.slice(0,n).reduce((s,v,j)=>s+cost[j]*(v+dl[j]),custoX(x))/cEsc+lp.z.slice(n).reduce((s,v,i)=>s+v*M/cons[i%k].esc,0));
    const real=cur.phi-nw.phi;
    if(real>0&&(pred<=1e-12||real>=0.1*pred)){x=xn;cur=nw;if(real>=0.75*pred&&passo>=0.9*delta)delta*=2}
    else delta*=0.4;
    if(passo<1e-7&&real<=1e-10)break;
  }
  const R=cur.R;const v=viol(R);
  const falhas=cons.map((c,i)=>({c,e:v[i],val:c.f(R),lo:c.lo(R),hi:c.hi(R)})).filter(o=>o.e>1e-3);
  return{status:falhas.length?"parcial":"ok",x,R,falhas,iter:it,cons}}

/* análise de bromatologia → alimento: o que a análise mede substitui o alimento de referência */
function alimentoBroma(farmId,tipo,data,b){
  const baseKey=BASE_BROMA[tipo]||("u:"+slug(/milho/i.test(b.tipo||"")?"Silagem de milho típica":"Silagem de gramínea temperada"));const base=UFLA[baseKey];if(!base)return null;
  const a=Object.assign({},base);const pct=v=>v!=null&&v!==""&&isFinite(+v)?+v/100:null;const set=(k,v)=>{if(v!=null)a[k]=v};
  set("ms",pct(b.ms));set("pb",pct(b.pb));set("fdn",pct(b.fdn));set("fda",pct(b.fda));set("amido",pct(b.amido));set("cinzas",pct(b.cinzas));set("ca",pct(b.ca));set("p",pct(b.p));set("ufdn",pct(b.ufdn240));
  if(b.kd_amido!=null&&+b.kd_amido>0)a.kd=+b.kd_amido/100;
  a.fdnf=a.fdn;a.efdn=a.fdn*(base.fdn?base.efdn/base.fdn:1);a.efdn2=(a.fdn*a.mn8)+(a.fdn*(1-a.mn8)*0.33);
  a.cnf=Math.max(0,1-(a.fdn+a.ag+a.cinzas+a.pb));a.mor=Math.max(0,a.cnf-a.amido);
  /* digestibilidade da FDN: o laboratório costuma mandar 30 h; a equação usa 48 h (≈ +6 pontos) */
  let dF=+b.dfdn||0;const obs=String(b.dfdn_obs||"").toLowerCase();let nota="";
  if(dF>0&&/30/.test(obs)){dF+=6;nota="dFDN 30 h convertida para 48 h (+6 pontos)"}else if(dF>0&&/240|tt/i.test(obs)){dF=0;nota="dFDN informada não é de 48 h — usada a estimativa pela FDN"}
  const ms=(a.ms||0)*100;const dAm=tipo==="silagemdemilho"?(ms<31?91:ms<=38?89:85):90;
  const e=edBase({fdn:a.fdn*100,dfdn48:dF,amido:a.amido*100,damido:dAm,ag:a.ag*100,pb:a.pb*100,cinzas:a.cinzas*100});
  a.ed=Math.round(e.ed*1000)/1000;a.ell=a.ed*0.82*0.66;
  const nome=(b.tipo||tipo)+" — análise "+fData(data);
  return Object.assign(a,{key:"b:"+farmId+":"+tipo+":"+data,nome,org:"Análise",custo:0,baseNome:base.nome,notaBroma:nota,dAmido:dAm,dFDN48:e.dFDN,dataAnalise:data})}

/* ---------- otimizar ---------- */
function otimizar(){if(!ADM)return;if(!CUR.itens.length){toast("Adicione alimentos primeiro",true);return}
  const itens=CUR.itens.map(it=>{const a=foodDe(it);return{a:Object.assign({},a,{custo:it.custo!=null?+it.custo:+a.custo||0}),kg:+it.kg||0,min:it.min,max:it.max,pmin:it.pmin,pmax:it.pmax,fixo:it.fixo}});
  const t0=performance.now();const r=formular(CUR.an,itens,CUR.restr);
  if(r.status==="vazio")return;
  r.x.forEach((v,i)=>CUR.itens[i].kg=Math.round(v*1000)/1000);
  r.ms=Math.round(performance.now()-t0);OPT=r;rerenderIng();
  document.getElementById("rs-box").outerHTML=cardRestricoes();
  toast(r.status==="ok"?"Dieta otimizada: "+fR(RES.custo.dia)+"/vaca/dia":"Nem todas as restrições foram atendidas",r.status!=="ok");
  if(innerWidth<1100)document.getElementById("res").scrollIntoView({behavior:"smooth"})}
function limitantes(r){const R=RES;const out=[];r.cons.forEach(c=>{const v=c.f(R),lo=c.lo(R),hi=c.hi(R);const tol=x=>Math.max(1e-3,Math.abs(x)*2e-3);
  if(lo!=null&&Math.abs(v-lo)<=tol(lo))out.push({n:c.n,lado:"mín"});else if(hi!=null&&Math.abs(v-hi)<=tol(hi))out.push({n:c.n,lado:"máx"})});
  CUR.itens.forEach((it,i)=>{const a=foodDe(it);if(it.fixo||!a)return;const kg=+it.kg||0;if(it.max!=null&&kg>=it.max-1e-3&&it.max>0)out.push({n:a.nome,lado:"máx kg"});else if(it.min!=null&&it.min>0&&kg<=it.min+1e-3)out.push({n:a.nome,lado:"mín kg"})});return out}

function stRef(v,lo,hi,dec){if(v==null||!isFinite(v))return"na";if(dec!=null){const m=Math.pow(10,dec);v=Math.round(v*m)/m}if(lo!=null&&v<lo-1e-9)return"lo";if(hi!=null&&v>hi+1e-9)return"hi";return(lo!=null||hi!=null)?"ok":"na"}
function refTxt(lo,hi,d){return lo!=null&&hi!=null?f(lo,d)+"–"+f(hi,d):lo!=null?"≥ "+f(lo,d):hi!=null?"≤ "+f(hi,d):""}

function faixa(id,ref){const r=CUR.restr.find(x=>x.id===id&&x.on);if(r&&(r.min!=null||r.max!=null))return[r.min,r.max,true];return ref?[ref[0],ref[1],false]:[null,null,false]}

  h+='<div class="kpis">'+

  if(temCab){map=h.map(c=>{const e=Object.entries(IMP_ALIAS).find(([k,al])=>al.includes(c));return e?e[0]:null})}else map=UFLA_COLS;
  const out=[];(temCab?linhas.slice(1):linhas).forEach(cols=>{const o={comp:{}};map.forEach((k,j)=>{if(!k||k==="_")return;const v=cols[j];if(k==="nome"||k==="nasem")o[k]=v||"";else if(k==="cat")o.cat=(v||"").toUpperCase();else if(k==="custo")o.custo=num(v)||0;else{const x=num(v);if(x==null)return;const[,,pct]=COMP_INFO[k];o.comp[k]=(!temCab||frac||!pct)?x:x/100}});
    if(!o.nome)return;if(!CATS[o.cat])o.cat=/silagem de milho/i.test(o.nome)?"SM":/silagem|feno|pr[eé].?secado|palha|pastagem|capim/i.test(o.nome)?"F":/mineral|n[uú]cleo|premix|sal |calc[aá]rio|bicarbonato|fosfato|ureia|óxido|oxido/i.test(o.nome)?"P":"C";
    COMP_KEYS.forEach(k=>{if(o.comp[k]==null)o.comp[k]=0});if(o.comp.pb&&!o.comp.pdr&&!o.comp.pndr){o.comp.pdr=0.65;o.comp.pndr=0.35}if(!o.comp.cnf)o.comp.cnf=Math.max(0,1-(o.comp.fdn+o.comp.ag+o.comp.cinzas+o.comp.pb));if(!o.comp.ell&&o.comp.ed)o.comp.ell=o.comp.ed*0.82*0.66;if(!o.comp.kd)o.comp.kd=0.3;
    out.push(o)});return out}
function previaImport(){const xs=lerImport();document.getElementById("imp-prev").innerHTML=xs.length?'<div class="tw" style="margin-top:10px"><table class="t"><thead><tr><th>Alimento</th><th>Cat</th><th>MS %</th><th>PB %MS</th><th>FDN</th><th>Amido</th><th>ELl</th><th>R$</th></tr></thead><tbody>'+xs.map(o=>'<tr><td>'+esc(o.nome)+'</td><td class="num">'+o.cat+'</td><td class="num">'+f(o.comp.ms*100,1)+'</td><td class="num">'+f(o.comp.pb*100,1)+'</td><td class="num">'+f(o.comp.fdn*100,1)+'</td><td class="num">'+f(o.comp.amido*100,1)+'</td><td class="num">'+f(o.comp.ell,2)+(o.comp.ell?'':' <span class="chip warn">sem energia</span>')+'</td><td class="num">'+f(o.custo,2)+'</td></tr>').join("")+'</tbody></table></div>':'<p class="small" style="color:var(--red);margin-top:8px">Nada reconhecido. Confira se as colunas estão separadas por tabulação (copiar do Excel faz isso).</p>';return xs}
function gravarImport(){const xs=previaImport();if(!xs.length)return;const semMS=xs.filter(o=>!o.comp.ms);if(semMS.length){toast(semMS.length+" alimento(s) sem MS — confira",true);return}
  const up={};const now=new Date().toISOString();xs.forEach(o=>{up["formulador/alimentos/"+db.ref().push().key]={nome:o.nome,cat:o.cat,custo:o.custo||0,nasem:o.nasem||"",fonte:"importação",comp:o.comp,atualizado_em:now,autor:NOME}});
  db.ref().update(up).then(()=>{fecharModal();toast(xs.length+" alimento(s) importado(s)")}).catch(e=>toast(e.message,true))}

/* ============================================================
   ABA FERRAMENTAS
   ============================================================ */
let HOMO={amostras:[[19,50,31],[16,53,32],[15,53,33],[11,57,33],[13,57,30],[9,59,32],[12,56,32],[14,55,31],[11,56,33],[14,55,31]],sobras:[[21,57,22],[23,60,17],[18,56,26]],ofer:11760,sobra:670};
function renderFerramentas(m){
  const edF=[["fdn","FDN","% MS",41.8],["dfdn48","dFDN 48 h","% FDN",57.7],["lig","Lignina","% MS",5.02],["amido","Amido","% MS",30],["damido","Digest. do amido","% amido",85],["ag","AG (EE)","% MS",1.97],["pb","PB","% MS",7.26],["cinzas","Cinzas","% MS",3.79]];
  m.innerHTML='<div class="fgrid"><div><div class="card"><h3>Energia digestível base</h3><div class="sub">Mesma conta da aba "Energia digestível base" da planilha (NASEM 2021). Sem dFDN in vitro, usa a lignina.</div><div class="agrid" style="margin-top:10px">'+
    edF.map(([k,l,u,v])=>'<div class="fld"><label>'+l+' <span class="ref">'+u+'</span></label><input class="inp num" type="number" step="any" id="ed-'+k+'" value="'+v+'" oninput="calcED()"></div>').join("")+'</div><div id="ed-out" style="margin-top:12px"></div>'+
    '<div class="sec">Digestibilidade do amido (referência)</div><div class="small">'+D_AMIDO.map(([n,v])=>n+" <b>"+v+"%</b>").join(" · ")+'</div></div></div>'+
    '<div><div class="card"><h3>Homogeneidade da mistura e seleção</h3><div class="sub">Peneira Penn State em 10 pontos do cocho (CV) e oferecido × sobra (índice de seleção), como na aba da planilha.</div><div id="homo"></div></div></div></div>';
  calcED();renderHomo()}
function calcED(){const g=k=>num((document.getElementById("ed-"+k)||{}).value)||0;const e=edBase({fdn:g("fdn"),dfdn48:g("dfdn48"),lig:g("lig"),amido:g("amido"),damido:g("damido"),ag:g("ag"),pb:g("pb"),cinzas:g("cinzas")});
  document.getElementById("ed-out").innerHTML='<div class="kpis"><div class="kpi"><div class="l">ED base</div><div class="v">'+f(e.ed,3)+'</div><div class="d">Mcal/kg MS</div></div><div class="kpi"><div class="l">EM</div><div class="v">'+f(e.ed*0.82,3)+'</div><div class="d">Mcal/kg MS</div></div><div class="kpi"><div class="l">ELl</div><div class="v">'+f(e.ed*0.82*0.66,3)+'</div><div class="d">Mcal/kg MS</div></div><div class="kpi"><div class="l">dFDN usada</div><div class="v">'+f(e.dFDN,1)+'%</div><div class="d">'+(g("dfdn48")?"in vitro 48 h":"pela lignina")+(e.dF2!=null?" · lignina "+f(e.dF2,1)+"%":"")+'</div></div></div><div class="small muted">MOR '+f(e.mor,1)+'% · CNF '+f(e.cnf,1)+'%</div>'}
function renderHomo(){const H=HOMO;const hm=homogeneidade(H.amostras);const ms=[0,1,2].map(j=>H.sobras.reduce((s,a)=>s+(+a[j]||0),0)/H.sobras.length);const sel=selecao(H.ofer,hm.m,H.sobra,ms);
  const tab=(arr,nm)=>'<table class="t"><thead><tr><th>'+nm+'</th><th>>19 mm</th><th>8–19 mm</th><th>Fundo</th><th></th></tr></thead><tbody>'+arr.map((a,i)=>'<tr><td>'+(i+1)+'</td>'+a.map((v,j)=>'<td><input class="inp num" style="width:64px;padding:4px 6px" type="number" step="any" value="'+v+'" onchange="HOMO.'+(nm==="Amostra"?"amostras":"sobras")+'['+i+']['+j+']=num(this.value)||0;renderHomo()"></td>').join("")+'<td><button class="ico" onclick="HOMO.'+(nm==="Amostra"?"amostras":"sobras")+'.splice('+i+',1);renderHomo()">×</button></td></tr>').join("")+'</tbody></table><button class="btn btn-o btn-sm" style="margin-top:6px" onclick="HOMO.'+(nm==="Amostra"?"amostras":"sobras")+'.push([0,0,0]);renderHomo()">+ linha</button>';
  document.getElementById("homo").innerHTML='<div class="sec">Amostras do cocho (% retido)</div>'+tab(H.amostras,"Amostra")+
    '<table class="t" style="margin-top:8px"><tbody><tr><td>Média</td>'+hm.m.map(x=>'<td class="num">'+f(x,1)+'</td>').join("")+'</tr><tr><td>CV (%)</td>'+hm.cv.map(x=>'<td class="num"><span class="chip '+(x<2.5?"ok":x<4?"ok":"bad")+'">'+f(x,1)+'</span></td>').join("")+'</tr></tbody></table><div class="tiny muted">CV &lt; 4% ótimo · &lt; 2,5% excelente (por peneira)</div>'+
    '<div class="sec">Sobra</div><div class="row2" style="margin-bottom:6px"><div class="fld"><label>Oferecido (kg)</label><input class="inp num" type="number" value="'+H.ofer+'" onchange="HOMO.ofer=num(this.value)||0;renderHomo()"></div><div class="fld"><label>Sobra (kg)</label><input class="inp num" type="number" value="'+H.sobra+'" onchange="HOMO.sobra=num(this.value)||0;renderHomo()"></div><div class="small muted">Sobra = '+f(H.ofer?H.sobra/H.ofer*100:null,1)+'%</div></div>'+tab(H.sobras,"Sobra")+
    '<table class="t" style="margin-top:8px"><thead><tr><th>Seleção</th><th>>19 mm</th><th>8–19 mm</th><th>Fundo</th></tr></thead><tbody><tr><td>Previsto (kg)</td>'+sel.map(s=>'<td class="num">'+f(s.pred,0)+'</td>').join("")+'</tr><tr><td>Consumido (kg)</td>'+sel.map(s=>'<td class="num">'+f(s.obs,0)+'</td>').join("")+'</tr><tr><td><b>Índice</b></td>'+sel.map(s=>'<td class="num"><span class="chip '+(s.idx<95?"bad":s.idx>105?"warn":"ok")+'">'+f(s.idx,0)+'</span></td>').join("")+'</tr></tbody></table><div class="tiny muted">&lt; 100 recusa · 100 sem seleção · &gt; 100 procura</div>'}


</script>
