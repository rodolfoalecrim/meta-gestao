<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meta Financeiro</title>
<meta name="theme-color" content="#052e16">
<link rel="icon" href="meta_logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#f3f6f3;--card:#fff;--border:#e2e8f0;--line:#f1f5f9;--text:#0f172a;--muted:#64748b;--faint:#94a3b8;
--G:#15803d;--GD:#052e16;--GL:#f0fdf4;--amber:#b45309;--amberL:#fffbeb;--red:#dc2626;--redL:#fef2f2;
--s-rec:#1baf7a;--s-cus:#eb6834;--s-res:#2a78d6;--d-acima:#e34948;--d-abaixo:#2a78d6;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--G);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12.5px}
.inp,.sel{border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:#fff;min-width:0}
.inp:focus,.sel:focus{border-color:var(--G);outline:none}
.btn{border:1px solid transparent;border-radius:9px;padding:8px 13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-g{background:var(--G);color:#fff}.btn-o{background:#fff;border-color:var(--border)}.btn-r{background:#fff;color:var(--red);border-color:#fecaca}
.btn-sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
/* login */
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px;background:var(--GD)}
.lb{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:360px}
.lb h1{font-size:20px;margin-bottom:4px}.lb p{color:var(--muted);font-size:13px;margin-bottom:14px}
.lb .inp{width:100%;padding:12px;margin-bottom:8px;font-size:15px}.lb .btn{width:100%;justify-content:center;padding:12px;font-size:15px}
/* topo */
#app{display:none}
.top{background:var(--GD);color:#fff;position:sticky;top:0;z-index:10}
.top-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand b{font-size:16px}.brand span{font-size:11.5px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.per{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.per .sel{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;padding:6px 8px}
.per .sel option{color:var(--text)}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:9px;padding:3px}
.seg button{background:none;border:none;color:#fff;opacity:.75;padding:5px 10px;border-radius:7px;font-weight:600;font-size:13px}
.seg button.on{background:#fff;color:var(--GD);opacity:1}
.top .btn-o{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.tabs{max-width:1320px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:none;color:#fff;opacity:.7;padding:10px 12px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{opacity:1;border-bottom-color:#4ade80}
.tabs .cnt{display:inline-block;background:#fbbf24;color:#451a03;border-radius:999px;font-size:11px;padding:0 6px;margin-left:5px;font-weight:800}
main{max-width:1320px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:14px;font-weight:700}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.ch-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}.ch-h>div:first-child{flex:1;min-width:180px}
.alert{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;background:var(--amberL);border:1px solid #fde68a;color:#78350f;flex-wrap:wrap}
.alert b{font-weight:700}.alert .btn{margin-left:auto}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 15px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:700;margin:6px 0 4px;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v.neg{color:var(--red)}
.kpi .d{font-size:12.5px;color:var(--muted);line-height:1.45}
.bdg{display:inline-flex;align-items:center;gap:3px;font-weight:700;border-radius:6px;padding:1px 6px;font-size:12px}
.bdg.good{background:var(--GL);color:var(--G)}.bdg.bad{background:var(--redL);color:var(--red)}.bdg.neu{background:#f1f5f9;color:#475569}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.grid2b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
/* gráficos */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:Inter,sans-serif;font-size:11px;fill:var(--muted)}
.chart .tv{font-family:var(--mono);font-size:11px;fill:var(--text)}
.chart .gl{stroke:#eef2f6;stroke-width:1}.chart .zl{stroke:#cbd5e1;stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}.chart .hit:hover{fill:rgba(15,23,42,.04)}
.chart .sel-m{fill:rgba(21,128,61,.07)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.leg i.ln{height:3px;border-radius:2px;width:14px;vertical-align:3px}
#tip{position:fixed;z-index:50;pointer-events:none;background:#0f172a;color:#fff;border-radius:9px;padding:8px 10px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.18);display:none;max-width:280px}
#tip b{font-weight:700}#tip .r{display:flex;justify-content:space-between;gap:14px}#tip .r span:last-child{font-family:var(--mono)}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
/* tabelas */
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:700;text-align:right;padding:8px 8px;border-bottom:1px solid var(--border);white-space:nowrap;background:#fff;position:sticky;top:0}
.t th:first-child,.t td:first-child{text-align:left}
.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.t td.num{font-size:12.5px}
.t tr.ln{cursor:pointer}.t tr.cx-h td:first-child{white-space:normal}.t tr.ln:hover td{background:#f8fafc}
.t tr.grp td{background:#f8fafc;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#334155;padding-top:12px}
.t tr.tot td{font-weight:700;border-top:1px solid var(--border);background:#fcfdfc}
.t tr.big td{font-size:14px;background:var(--GL)}
.t td.nm{white-space:normal;min-width:220px}
.t .pos{color:var(--G)}.t .neg{color:var(--red)}
.t .tag{font-size:11px;font-weight:700;border-radius:5px;padding:1px 5px;background:var(--amberL);color:var(--amber);margin-left:6px}
.bar-in{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-right:6px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 11px;font-weight:600;font-size:12.5px}
.chip.on{background:var(--GD);border-color:var(--GD);color:#fff}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.empty .btns{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
/* painel lateral e modal */
#drawer{position:fixed;inset:0;z-index:30;display:none;background:rgba(15,23,42,.35)}
#drawer.on{display:block}
.dw{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:#fff;overflow:auto;padding:18px 18px 40px;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.dw-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}.dw-h h2{font-size:17px;flex:1}
.x{background:#f1f5f9;border:none;border-radius:8px;width:32px;height:32px;font-size:18px;line-height:1}
.sec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:18px 0 8px}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.row .f{flex:1;min-width:0}.row .f .small{margin-top:1px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:8px}
.frm label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:3px}
.frm .full{grid-column:1/-1}.frm .inp,.frm .sel{width:100%}
#modal{position:fixed;inset:0;z-index:40;display:none;background:rgba(15,23,42,.45);align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
#modal.on{display:flex}
.md{background:#fff;border-radius:16px;width:100%;max-width:720px;padding:20px}
.md h2{font-size:18px;margin-bottom:4px}
.drop{display:block;border:2px dashed #cbd5e1;border-radius:14px;padding:30px 16px;text-align:center;cursor:pointer;margin-top:14px;color:var(--muted);font-weight:600}
.drop:hover,.drop.ov{border-color:var(--G);background:var(--GL);color:var(--G)}
.drop input{display:none}
.chk{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0;padding:12px;background:#f8fafc;border-radius:12px}
.chk>div{min-width:130px}.chk .l{font-size:12px;color:var(--muted);font-weight:600}.chk .v{font-family:var(--mono);font-weight:700;font-size:15px;margin-top:2px}
.ok{color:var(--G);font-weight:700}.err{color:var(--red);font-weight:700}
.md-f{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(100px);background:var(--G);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;z-index:99;transition:transform .25s;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
.kf{display:flex;align-items:flex-end;gap:8px;margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.spk{flex:1;min-width:0}.spk svg{display:block;width:100%}
.cmp{font-size:11.5px;color:var(--muted);white-space:nowrap;text-align:right}
.vs{font-weight:700;font-family:var(--mono);font-size:11.5px}.vs.good{color:var(--G)}.vs.bad{color:var(--red)}
.sec-t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:2px 2px 8px}
.kpis.ef .v{font-size:21px}
.leg.tog span{cursor:pointer;user-select:none}.leg.tog span.off{opacity:.35;text-decoration:line-through}
.leg i.ln.dot{background:none!important;border-top:2px dotted;height:0;border-radius:0}
.leg i.ln.dash{background:repeating-linear-gradient(90deg,var(--faint) 0 5px,transparent 5px 8px)!important}
.leg i.hatch{background:repeating-linear-gradient(45deg,#f8fafc 0 2px,#cbd5e1 2px 4px);border:1px solid #e2e8f0}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid2b{grid-template-columns:minmax(0,1fr)}}
@media(max-width:560px){.kpi .v{font-size:19px}.top-in{gap:8px}.brand span{display:none}.frm{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login"><div class="lb"><h1>Meta Financeiro</h1><p>Acesso restrito à diretoria e ao financeiro.</p><input class="inp" id="l-e" type="email" placeholder="E-mail" autocomplete="username"><input class="inp" id="l-s" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="btn btn-g" onclick="login()">Entrar</button><p id="l-m" style="margin:12px 0 0;color:var(--red)"></p></div></div>
<div id="app">
  <header class="top">
    <div class="top-in">
      <div class="brand"><b>Meta Financeiro</b><span id="emp">Estrutura gerencial de resultados</span></div>
      <div class="per">
        <select class="sel" id="s-ano" onchange="setAno(this.value)" aria-label="Ano"></select>
        <select class="sel" id="s-mes" onchange="setMes(this.value)" aria-label="Mês"></select>
        <div class="seg" role="group" aria-label="Visão" title="Gerencial: resultado da operação separado do caixa. Planilha: método da planilha original."><button id="v-G" onclick="setVisao('G')">Gerencial</button><button id="v-P" onclick="setVisao('P')">Planilha</button></div><div class="seg" role="group" aria-label="Período"><button id="m-mes" onclick="setModo('mes')">Mês</button><button id="m-acum" onclick="setModo('acum')">Acumulado</button></div>
      </div>
      <button class="btn btn-g" onclick="abrirImport()">⬆ Importar FI-025</button>
      <button class="btn btn-o btn-sm" onclick="logout()" title="Sair">Sair</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="m"></main>
</div>
<div id="drawer" onclick="if(event.target===this)fecharDrawer()"><div class="dw" id="dw"></div></div>
<div id="modal"><div class="md" id="md"></div></div>
<div id="tip"></div>
<div id="toast"></div>
<script>
/* ---------- leitura do FI-025 (DRE Fluxo Ajustado) ---------- */
function brNum(s){return parseFloat(String(s).replace(/\./g,"").replace(",","."))}
function linhasPdf(pages){/* agrupa itens de texto por linha (y com tolerância) */
  const out=[];pages.forEach(items=>{const rows=[];items.filter(i=>i.s&&i.s.trim()).sort((a,b)=>b.y-a.y||a.x-b.x).forEach(i=>{let r=rows.find(r=>Math.abs(r.y-i.y)<=3);if(!r){r={y:i.y,it:[]};rows.push(r)}r.it.push(i)});rows.sort((a,b)=>b.y-a.y).forEach(r=>out.push(r.it.sort((a,b)=>a.x-b.x).map(i=>i.s.trim())))});return out}
function parseFI025(pages){
  const L=linhasPdf(pages);const res={empresa:"",ini:"",fim:"",contas:[],totR:null,totD:null,saldo:null,ccs:{}};let cc="";
  const MONEY=/^-?[\d.]+,\d{2}$/;
  L.forEach((t,ix)=>{const j=t.join(" ");
    if(!res.empresa&&ix===0){res.empresa=t.filter(x=>!/^(Data:|Hora:|Pag:)/.test(x))[0]||""}
    let m=j.match(/Per[ií]odo:\s*(\d\d)\/(\d\d)\/(\d{4})\s*a\s*(\d\d)\/(\d\d)\/(\d{4})/);if(m&&!res.ini){res.ini=m[3]+"-"+m[2]+"-"+m[1];res.fim=m[6]+"-"+m[5]+"-"+m[4];return}
    m=j.match(/^Centro de Custo:\s*(\d+)\s*-\s*(.*)$/);if(m){cc=m[1];res.ccs[cc]=m[2].trim();return}
    m=j.match(/Total geral de Receitas:\s*(-?[\d.]+,\d{2})/);if(m){res.totR=brNum(m[1]);return}
    m=j.match(/Total geral de Despesas:\s*(-?[\d.]+,\d{2})/);if(m){res.totD=brNum(m[1]);return}
    m=j.match(/Saldo geral do Per[ií]odo:\s*(-?[\d.]+,\d{2})/);if(m){res.saldo=brNum(m[1]);return}
    const ac=t.findIndex(x=>/^\d+\s+-\s+\S/.test(x));if(ac<0)return;
    const val=t.find(x=>MONEY.test(x));const tp=t.find(x=>/^[RD]$/.test(x));if(!val||!tp)return;
    const am=t[ac].match(/^(\d+)\s+-\s+(.+)$/);const nums=t.filter((x,i)=>i!==ac&&/^\d+$/.test(x));
    res.contas.push({cod:am[1],desc:am[2].trim(),v:brNum(val),t:tp,cc,grp:nums.length?nums[nums.length-1]:""});
  });
  const sR=res.contas.filter(c=>c.t==="R").reduce((s,c)=>s+c.v,0),sD=res.contas.filter(c=>c.t==="D").reduce((s,c)=>s+c.v,0);
  res.somaR=Math.round(sR*100)/100;res.somaD=Math.round(sD*100)/100;
  res.confere=res.totR!=null&&res.totD!=null&&Math.abs(res.somaR-res.totR)<0.05&&Math.abs(res.somaD-res.totD)<0.05;
  return res;
}

/* ---------- estrutura gerencial (mesma da planilha "Estudo mensal") ---------- */
const GRUPOS=[["rec","Receitas"],["cv","Custos variáveis"],["cf","Custos fixos"],["ext","Extra-operacional"]];
const LINHAS=[
["r4","rec","Recebimentos financeiros de operação","R"],["r5","rec","Transferência entre unidades (receita)","R"],["r6","rec","(−) Devolução de vendas","D"],["r7","rec","Adiantamentos a fornec./funcion. (receita)","R"],["r8","rec","Outras receitas, descontos obtidos e fundo calamidade","R"],

function dpNorm(v){if(!v)return null;if(Array.isArray(v))return{l:v[0],s:v[1]||""};if(typeof v==="string")return{l:v,s:""};return{l:v.l,s:v.s||""}}

function valoresMes(mes,depara){
  const v={};LINHAS.forEach(l=>v[l.id]=0);const pend={};
  if(!mes)return{v,pend};
  if(mes.linhas)Object.entries(mes.linhas).forEach(([k,x])=>{if(k in v)v[k]+=+x||0});
  if(mes.contas)Object.entries(mes.contas).forEach(([cod,c])=>{const d=dpNorm(depara[cod]);
    if(!d||!d.l||(d.l!=="ign"&&!LIN[d.l])){pend[cod]=c;return}if(d.l==="ign")return;
    const nat=LIN[d.l].nat;let sg=d.s==="+"?1:d.s==="-"?-1:(c.t===nat?1:-1);v[d.l]+=sg*(+c.v||0)});
  Object.values(mes.ajustes||{}).forEach(a=>{const x=+a.v||0;if(a.para&&a.para in v)v[a.para]+=x;if(a.de&&a.de in v)v[a.de]-=x});
  Object.keys(v).forEach(k=>v[k]=Math.round(v[k]*100)/100);

function extrasMes(mk,v){const mes=S.meses[mk]||{};let jur=0;

function blocoConta(k,dp){const d=dpNorm(dp[k]);if(!d||!d.l)return"pend";if(d.l==="ign")return CAIXA_IGN[k]||"out";if(G_UNID.includes(d.l))return"uni";if(G_AMORT.includes(d.l)||G_DISTRIB.includes(d.l))return"fin";if(G_INVEST.includes(d.l))return"inv";return"ope"}

function indicadoresPos(mk){const p=posicao(mk);if(!p)return null;const caixa=BANCOS.reduce((s,[k])=>s+(+((p.bancos||{})[k])||0),0);

  const ks=Object.keys(S.meses).filter(k=>k<=mk).sort().slice(-12);let eb=0,rl=0,jur=0;ks.forEach(k=>{const g=periodoG([k]).d;eb+=g.ebitda;rl+=g.tot;jur+=g.despFin});const n=ks.length||1;const eb12=eb*12/n,rl12=rl*12/n,jur12=jur*12/n;

function cronograma(meses){const out=Array.from({length:meses},()=>({j:0,a:0}));Object.values(S.dividas||{}).forEach(d=>{let s=+d.saldo||0;const tx=(+d.taxa||0)/100,parc=+d.parcela||0,rest=d.restantes?+d.restantes:999;if(!parc)return;
  const semSaldo=!(s>0);/* saldo não informado: projeta a parcela inteira, sem separar juros */
  for(let i=0;i<meses&&i<rest;i++){if(semSaldo||d.tipo==="consorcio"){if(!semSaldo&&s<=0.005)break;const a=semSaldo?parc:Math.min(parc,s);out[i].a+=a;s-=a;continue}if(s<=0.005)break;const j=s*tx;const a=Math.min(parc-j,s);out[i].j+=j;out[i].a+=Math.max(0,a);s-=Math.max(0,a)}});return out}

function gCron(el,cr){if(!el)return;const W=el.clientWidth||700,H=220,L=52,R=8,T=12,B=24;const base=MES?new Date(MES+"-15"):new Date();const mx=Math.max(1,...cr.map(x=>x.j+x.a));const sc=escala(0,mx,4);const y=v=>T+(H-T-B)*(1-(v-sc.lo)/(sc.hi-sc.lo));const cw=(W-L-R)/12,bw=Math.min(30,cw*.6);
  const lab=i=>{const d=new Date(base);d.setMonth(d.getMonth()+i+1);return{t:MESES[d.getMonth()],k:MESES_L[d.getMonth()]+"/"+d.getFullYear()}};

  el.innerHTML=s+'</svg>';ligar(el,{tip:i=>'<b>'+lab(i).k+'</b>'+tipRow("var(--d-acima)","Juros",fK(cr[i].j))+tipRow("var(--faint)","Amortização",fK(cr[i].a))+tipRow("","Total",fK(cr[i].j+cr[i].a))});

function deparaEf(){const d=Object.assign({},DEPARA_PADRAO);Object.entries(S.depara||{}).forEach(([k,v])=>{if(v)d[k]=v});return d}
function metasAno(a){return(S.metas||{})[a]||null}
function histAno(a){return(S.hist||{})[a]||null}

/* ---------- cálculo com cache ---------- */
function calcMes(mk){if(CACHE[mk])return CACHE[mk];const mes=S.meses[mk];const{v,pend}=valoresMes(mes,deparaEf());const metas=metasAno(mk.slice(0,4));const p=previstoMes(metas,v);
  const ex=VISAO==="G"?extrasMes(mk,v):null;return CACHE[mk]={mk,v,pend,d:D(v,ex),p,dp:D(p,ex?Object.assign({},ex,{perdas:null}):null),ex,fonte:mes&&mes.fonte}}
function mesesAno(a){return Object.keys(S.meses||{}).filter(k=>k.startsWith(a+"-")).sort()}
function anos(){const s=new Set(Object.keys(S.meses||{}).map(k=>k.slice(0,4)));Object.keys(S.metas||{}).forEach(a=>s.add(a));if(!s.size)s.add(String(new Date().getFullYear()));return[...s].sort()}
function somaV(lista,campo){const o={};LINHAS.forEach(l=>o[l.id]=lista.reduce((s,c)=>s+(c[campo][l.id]||0),0));return o}
/* período em análise: mês ou acumulado do ano até o mês */
function periodo(){const ms=MODO==="acum"?mesesAno(ANO).filter(k=>k<=MES):(S.meses[MES]?[MES]:[]);const cs=ms.map(calcMes);
  const v=somaV(cs,"v"),p=somaV(cs,"p");const metas=metasAno(ANO);const mm=metaMensal(metas);const n=ms.length;const meta={};LINHAS.forEach(l=>meta[l.id]=(mm[l.id]||0)*n);
  const h=histAno(String(+ANO-1));const hm={};LINHAS.forEach(l=>hm[l.id]=h&&h.linhas&&h.linhas[l.id]!=null?h.linhas[l.id]/12*n:null);
  const pend={};cs.forEach(c=>Object.entries(c.pend).forEach(([k,x])=>{pend[k]=pend[k]||{d:x.d,t:x.t,v:0,meses:[]};pend[k].v+=x.v;pend[k].meses.push(c.mk)}));
  let exR=null,exP=null;if(VISAO==="G"){const xs=cs.map(c=>Object.assign({},c.ex,{perdasEf:c.ex.perdas!=null?c.ex.perdas:(c.v.r27||0)+(c.v.r28||0)}));exR=somaEx(xs);exP={depr:exR.depr,jurosEmb:exR.jurosEmb,perdas:null}}
  const d=D(v,exR);if(exR&&cs.some(c=>c.ex.perdas==null))d.perdasEst=true;
  return{ms,n,v,p,meta,hm,d,dp:D(p,exP),dm:D(meta,exPadrao(n)),dh:h?D(Object.fromEntries(LINHAS.map(l=>[l.id,hm[l.id]||0])),exPadrao(n)):null,pend,metas}}
function perLabel(){if(!MES)return"";return MODO==="acum"?"Acumulado jan–"+MESES[+MES.slice(5)-1].toLowerCase()+"/"+ANO:mkLong(MES)}

    const as=anos();if(!ANO||!as.includes(ANO))ANO=as[as.length-1];const ms=mesesAno(ANO);if(!MES||!S.meses[MES]||!MES.startsWith(ANO))MES=ms[ms.length-1]||null;render()},
    e=>{document.getElementById("m").innerHTML='<div class="empty"><b>Sem permissão para ler os dados financeiros</b>Confira as regras do nó <code>fin</code> no Firebase.</div>'});
  let t;window.addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(()=>{if(TAB==="geral")desenharGraficos()},150)});
}

  const T=[["geral","Visão geral"],["dre","DRE"],["caixa","Caixa"],["posicao","Posição do mês"],["dividas","Dívidas e bens"],["metas","Metas"],["contas","Contas do relatório"+(nPend?'<span class="cnt">'+nPend+'</span>':"")],["imp","Importações"]];
  document.getElementById("v-G").classList.toggle("on",VISAO==="G");document.getElementById("v-P").classList.toggle("on",VISAO==="P");
  document.getElementById("tabs").innerHTML=T.map(([k,l])=>'<button class="'+(TAB===k?"on":"")+'" onclick="setTab(\''+k+'\')">'+l+'</button>').join("");
  const m=document.getElementById("m");

function bdg(delta,bomSeMaior,txt){if(delta==null||!isFinite(delta)||Math.abs(delta)<0.5)return'<span class="bdg neu">'+(txt||"no previsto")+'</span>';const good=bomSeMaior?delta>0:delta<0;return'<span class="bdg '+(good?"good":"bad")+'">'+(delta>0?"▲ ":"▼ ")+fK(Math.abs(delta))+'</span>'}
/* ---------- VISÃO GERAL ---------- */
const GRUPOS_EF={pes:["r63","r64","r67","r12","r40","r25","r16","r26","r43"],log:["r13","r15","r24","r22","r17","r23","r42"],fin:["r89","r21","r48","r70"]};

 {id:"rec",l:"Recebimentos de operação",fmt:"k",bom:1,f:(v,d)=>d.rec},
 {id:"mc",l:"Margem de contribuição",fmt:"k",bom:1,f:(v,d)=>d.mc},
 {id:"cf",l:"Custos fixos",fmt:"k",bom:0,f:(v,d)=>d.cf},

 {id:"mb",l:"Margem bruta",fmt:"p",bom:1,f:(v,d)=>d.base?d.mb/d.base:null},
 {id:"mc",l:"Margem de contribuição",fmt:"k",bom:1,f:(v,d)=>d.mc},

 {id:"cx",l:"Geração de caixa",fmt:"k",bom:1,f:(v,d,ms)=>{const cs=(ms||[]).map(caixaMes).filter(Boolean);return cs.length?cs.reduce((s,c)=>s+c.tot,0):null}},
 {id:"dl",l:"Dívida líquida ÷ EBITDA",fmt:"x",bom:0,f:(v,d,ms)=>{const k=(ms||[]).slice(-1)[0];const I=k?indicadoresPos(k):null;return I?I.dlE:null}}];

 {id:"mbp",l:"Margem bruta (após CMV)",fmt:"p",bom:1,f:(v,d)=>d.base?(d.base-d.cmv)/d.base:null},
 {id:"pes",l:"Pessoal e comissões",fmt:"p",bom:0,f:(v,d)=>d.base?somaG(v,GRUPOS_EF.pes)/d.base:null},
 {id:"log",l:"Logística e frota",fmt:"p",bom:0,f:(v,d)=>d.base?somaG(v,GRUPOS_EF.log)/d.base:null},
 {id:"fin",l:"Custo financeiro",fmt:"p",bom:0,f:(v,d)=>d.base?somaG(v,GRUPOS_EF.fin)/d.base:null},
 {id:"fix",l:"Despesas fixas",fmt:"p",bom:0,f:(v,d)=>d.base?d.cf/d.base:null}];
function kpisAtivos(){return(VISAO==="G"?KPI_G:KPI_P).concat(KPI_EF.filter(k=>VISAO==="G"?k.id!=="mbp":k.id!=="fix"))}
const KPI_SUB={pes:"salários, encargos, pró-labore, comissões, alimentação, saúde e cursos",log:"combustível, veículos, frete, viagens, IPVA, multas e empilhadeira",fin:"juros pagos, taxas bancárias, IOF e cartão",mbp:"o que sobra do recebido depois das compras",fix:"água, luz, salários fixos, aluguel, contador, software"};
let SERIES_OFF={};
function fmtK(k,x){return k.fmt==="p"?fP(x):k.fmt==="x"?(x==null||!isFinite(x)?"—":x.toLocaleString("pt-BR",{maximumFractionDigits:1})+" anos"):fK(x)}
function mesesSerie(){const ms=[];for(let i=1;i<=12;i++){const k=ANO+"-"+String(i).padStart(2,"0");ms.push({k,i,c:S.meses[k]?calcMes(k):null})}return ms}
function mesAnterior(mk){const ks=Object.keys(S.meses).sort();const i=ks.indexOf(mk);return i>0?ks[i-1]:null}
function kpiCard(k,P,extra){const x=k.f(P.v,P.d,P.ms);let cmp="";
  if(MODO==="mes"){const pm=mesAnterior(MES);if(pm){const c=calcMes(pm);const y=k.f(c.v,c.d,[pm]);if(x!=null&&y!=null&&isFinite(x)&&isFinite(y)){const dd=x-y;const good=k.bom?dd>0:dd<0;const txt=k.fmt==="p"?Math.abs(dd*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+" p.p.":k.fmt==="x"?Math.abs(dd).toLocaleString("pt-BR",{maximumFractionDigits:1}):(x>0&&y>0?Math.abs(dd/y*100).toLocaleString("pt-BR",{maximumFractionDigits:0})+"%":fK(Math.abs(dd)));cmp='<span class="vs '+(Math.abs(dd)<1e-9?"":good?"good":"bad")+'">'+(dd>0?"▲":dd<0?"▼":"=")+" "+txt+'</span> vs '+MESES[+pm.slice(5)-1].toLowerCase()}}}
  else cmp='<span class="vs">'+P.n+' '+(P.n>1?"meses":"mês")+'</span>';
  const neg=k.fmt==="k"&&x!=null&&x<0;
  return'<div class="kpi" data-k="'+k.id+'"><div class="l">'+k.l+'</div><div class="v'+(neg?" neg":"")+'"><span class="cnt-up" data-n="'+(x==null||!isFinite(x)?"":x)+'" data-f="'+k.fmt+'">'+(x==null||!isFinite(x)?"—":fmtK(k,x))+'</span></div><div class="d">'+extra+'</div><div class="kf"><div class="spk chart" id="spk-'+k.id+'"></div><div class="cmp">'+cmp+'</div></div></div>'}

function tipShow(ev,html){const t=document.getElementById("tip");t.innerHTML=html;t.style.display="block";const r=t.getBoundingClientRect();let x=ev.clientX+14,y=ev.clientY+14;if(x+r.width>innerWidth-8)x=ev.clientX-r.width-14;if(y+r.height>innerHeight-8)y=ev.clientY-r.height-14;t.style.left=Math.max(8,x)+"px";t.style.top=Math.max(8,y)+"px"}

function tipRow(cor,l,v,ln){return'<div class="r"><span>'+(cor?'<i style="background:'+cor+(ln?';height:3px;vertical-align:3px':'')+'"></i>':"")+l+'</span><span>'+v+'</span></div>'}
function escala(min,max,n){if(min===max){max=min+1}const span=max-min;const step0=span/n;const mag=Math.pow(10,Math.floor(Math.log10(step0)));const st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=step0);const lo=Math.floor(min/st)*st,hi=Math.ceil(max/st)*st;const t=[];for(let v=lo;v<=hi+st/2;v+=st)t.push(Math.round(v*1e6)/1e6);return{lo,hi,t}}

function barPath(x,y,w,h,up){const r=Math.min(4,w/2,h);if(h<=0)return"";if(up)return"M"+x+","+(y+h)+"V"+(y+r)+"Q"+x+","+y+" "+(x+r)+","+y+"H"+(x+w-r)+"Q"+(x+w)+","+y+" "+(x+w)+","+(y+r)+"V"+(y+h)+"Z";return"M"+x+","+y+"V"+(y+h-r)+"Q"+x+","+(y+h)+" "+(x+r)+","+(y+h)+"H"+(x+w-r)+"Q"+(x+w)+","+(y+h)+" "+(x+w)+","+(y+h-r)+"V"+y+"Z"}

function renderDRE(m){

  const cel=(x,cls)=>'<td class="num '+(cls||"")+'">'+(x==null||!isFinite(x)?"—":fR(x))+'</td>';

    const bom=l.nat==="R";const dif=r-p;const cls=Math.abs(dif)<0.5?"":(bom?dif>0:dif<0)?"pos":"neg";

  const d=P.d,dp=P.dp,dm=P.dm,dh=P.dh||{};

  rows+='<tr class="grp"><td colspan="8">Receitas</td></tr>'+LINHAS.filter(l=>l.g==="rec").map(linha).join("")+tot("Total recebido",d.tot,dp.tot,dm.tot,dh.tot,true);

  rows+='<tr class="grp"><td colspan="8">Extra-operacional</td></tr>'+LINHAS.filter(l=>l.g==="ext").map(linha).join("")+tot("Resultado extra-operacional",d.ext,dp.ext,dm.ext,dh.ext,true)+tot("Resultado líquido",d.rl,dp.rl,dm.rl,dh.rl,true,"big");
  rows+='<tr class="grp"><td colspan="8">Pontos de equilíbrio</td></tr>'+tot("Ponto de equilíbrio operacional",d.peOp,dp.peOp,dm.peOp,dh.peOp,false)+tot("Ponto de equilíbrio financeiro",d.peFin,dp.peFin,dm.peFin,dh.peFin,false);}
  const subG=VISAO==="G"?'Visão gerencial: só o que a operação gera. Transferências, adiantamentos, amortização de empréstimos, consórcios e compra de bens ficam no fim, fora do resultado. Previsto = metas ajustadas à receita do mês. Clique numa linha para ver as contas do relatório.':null;

function salvarAjuste(){const t=document.getElementById("aj-t").value,v=parseFloat(document.getElementById("aj-v").value),o=document.getElementById("aj-o").value.trim();
  if(!v){toast("Informe o valor",true);return}if(!o){toast("Escreva uma observação — é o que explica o ajuste depois",true);return}
  const a={para:LINHA_ABERTA,v,obs:o,por:NOME,ts:Date.now()};if(t==="rec"){a.de=document.getElementById("aj-de").value;if(a.de===a.para){toast("Escolha outra linha de origem",true);return}}
  db.ref("fin/meses/"+MES+"/ajustes").push(a).then(()=>{toast("Ajuste lançado");setTimeout(renderLinha,50)}).catch(e=>toast("Não salvou: "+e.message,true))}
function excluirAjuste(k){if(!confirm("Excluir este ajuste?"))return;db.ref("fin/meses/"+MES+"/ajustes/"+k).remove().then(()=>{toast("Ajuste excluído");setTimeout(renderLinha,50)})}
function salvarDepara(cod,l,s){const pad=dpNorm(DEPARA_PADRAO[cod]);const novo={l,s:s||""};const igual=pad&&pad.l===novo.l&&(pad.s||"")===novo.s;
  db.ref("fin/depara/"+cod).set(igual?null:novo).then(()=>{toast("Conta "+cod.slice(1)+" → "+(l==="ign"?"não entra no resultado":LIN[l]?LIN[l].nome:l)+" (vale para todos os meses)");if(LINHA_ABERTA)setTimeout(renderLinha,50)}).catch(e=>toast("Não salvou: "+e.message,true))}

/* ---------- METAS ---------- */
function renderMetas(m){const mt=metasAno(ANO);
  if(!mt){const ant=anos().filter(a=>a<ANO&&metasAno(a)).pop();m.innerHTML='<div class="card empty"><b>Sem metas para '+ANO+'</b>'+(ant?'Comece copiando as metas de '+ant+' e ajuste o que mudou.<div class="btns"><button class="btn btn-g" onclick="copiarMetas(\''+ant+'\')">Copiar metas de '+ant+'</button></div>':'Carregue o histórico da planilha, que já traz as metas.')+'</div>';return}
  const ms=mesesAno(ANO);const med=id=>ms.length?ms.reduce((s,k)=>s+calcMes(k).v[id],0)/ms.length:null;const h=histAno(String(+ANO-1));
  let rows='';GRUPOS.forEach(([g,gn])=>{if(g==="rec"){return}rows+='<tr class="grp"><td colspan="6">'+gn+'</td></tr>';LINHAS.filter(l=>l.g===g).forEach(l=>{const x=(mt.linhas||{})[l.id]||{m:g==="cf"?"fixo":"pct",v:0};const rs=metaLinha({linhas:{[l.id]:x}},l.id,+mt.receita||0);
    rows+='<tr><td class="nm">'+esc(l.nome)+'</td><td><select class="sel btn-sm" data-l="'+l.id+'" data-k="m" onchange="metaEdit(this)"><option value="pct"'+(x.m==="pct"?" selected":"")+'>% do recebimento</option><option value="fixo"'+(x.m==="fixo"?" selected":"")+'>R$ fixo por mês</option></select></td><td><input class="inp num" style="width:120px;text-align:right" type="number" step="0.01" data-l="'+l.id+'" data-k="v" value="'+(x.m==="pct"?+((+x.v||0)*100).toFixed(4):(+x.v||0))+'" onchange="metaEdit(this)"></td><td class="num">'+fR(rs)+'</td><td class="num">'+fR(med(l.id))+'</td><td class="num">'+(h&&h.linhas&&h.linhas[l.id]!=null?fR(h.linhas[l.id]/12):"—")+'</td></tr>'})});
  m.innerHTML='<div class="card"><div class="ch-h"><div><h3>Metas de '+ANO+'</h3><div class="sub">O previsto de cada mês usa estas metas: linhas em % são aplicadas sobre o recebimento realizado do mês; linhas em R$ entram fixas. Alterações valem na hora para todos os meses do ano.</div></div></div>'+
   '<div class="tools"><label class="small" style="font-weight:700">Meta mensal de recebimentos de operação</label><input class="inp num" id="mt-rec" type="number" step="1" style="width:160px;text-align:right" value="'+(+mt.receita||0)+'" onchange="db.ref(\'fin/metas/'+ANO+'/receita\').set(+this.value||0).then(()=>toast(\'Meta de recebimento salva\'))"><span class="small muted">= '+fR((+mt.receita||0)*12)+' no ano</span></div>'+
   '<div class="tw"><table class="t"><thead><tr><th>Linha</th><th>Tipo</th><th>Valor (% ou R$)</th><th>Meta mensal</th><th>Média '+ANO+'</th><th>Média '+(+ANO-1)+'</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function metaEdit(el){const l=el.dataset.l;const mt=metasAno(ANO);const x=Object.assign({m:LIN[l].g==="cf"?"fixo":"pct",v:0},(mt.linhas||{})[l]);
  if(el.dataset.k==="m"){const rec=+mt.receita||0;const rs=metaLinha({linhas:{[l]:x}},l,rec);x.m=el.value;x.v=x.m==="pct"?(rec?rs/rec:0):rs}else{const n=parseFloat(el.value)||0;x.v=x.m==="pct"?n/100:n}
  db.ref("fin/metas/"+ANO+"/linhas/"+l).set(x).then(()=>toast("Meta salva")).catch(e=>toast("Não salvou: "+e.message,true))}
function copiarMetas(a){db.ref("fin/metas/"+ANO).set(JSON.parse(JSON.stringify(metasAno(a)))).then(()=>toast("Metas copiadas de "+a))}

/* ---------- CONTAS (de-para) ---------- */
function contasVistas(){const o={};Object.keys(S.meses||{}).sort().forEach(mk=>{const c=S.meses[mk].contas||{};Object.entries(c).forEach(([k,x])=>{o[k]={cod:k,d:x.d,t:x.t,v:x.v,mk}})});const dp=deparaEf();return Object.values(o).map(c=>Object.assign(c,{dp:dpNorm(dp[c.cod]),alt:!!(S.depara||{})[c.cod]}))}
function renderContas(m){let cs=contasVistas();const nP=cs.filter(c=>!c.dp||!c.dp.l).length,nA=cs.filter(c=>c.alt).length;
  if(FILTRO_CONTAS==="pend"&&!nP)FILTRO_CONTAS="todas";
  if(FILTRO_CONTAS==="pend")cs=cs.filter(c=>!c.dp||!c.dp.l);else if(FILTRO_CONTAS==="alt")cs=cs.filter(c=>c.alt);else if(FILTRO_CONTAS==="ign")cs=cs.filter(c=>c.dp&&c.dp.l==="ign");
  const q=BUSCA.trim().toUpperCase();if(q)cs=cs.filter(c=>c.cod.slice(1)===q||c.d.toUpperCase().includes(q)||(c.dp&&LIN[c.dp.l]&&LIN[c.dp.l].nome.toUpperCase().includes(q)));
  cs.sort((a,b)=>(+a.cod.slice(1))-(+b.cod.slice(1)));
  const rows=cs.map(c=>'<tr><td class="num">'+c.cod.slice(1)+'</td><td class="nm">'+esc(c.d)+(c.alt?'<span class="tag" style="background:#eff6ff;color:#1d4ed8">alterada</span>':"")+'</td><td>'+c.t+'</td><td class="num">'+fR(c.v,2)+' <span class="muted small">'+mkLabel(c.mk)+'</span></td><td style="text-align:left"><select class="sel btn-sm" style="max-width:280px'+(!c.dp||!c.dp.l?";border-color:#f59e0b;background:var(--amberL)":"")+'" onchange="salvarDepara(\''+c.cod+'\',this.value,\''+((c.dp&&c.dp.s)||"")+'\')">'+(!c.dp||!c.dp.l?'<option value="" selected>— escolha a linha —</option>':"")+optsLinhas(c.dp&&c.dp.l,'<option value="ign"'+(c.dp&&c.dp.l==="ign"?" selected":"")+'>Não entra no resultado (transferência, empréstimo recebido…)</option>')+'</select></td><td style="text-align:left">'+(c.dp&&c.dp.l&&c.dp.l!=="ign"?'<select class="sel btn-sm" onchange="salvarDepara(\''+c.cod+'\',\''+c.dp.l+'\',this.value)"><option value=""'+(!c.dp.s?" selected":"")+'>Pelo tipo (R/D)</option><option value="+"'+(c.dp.s==="+"?" selected":"")+'>Sempre soma</option><option value="-"'+(c.dp.s==="-"?" selected":"")+'>Sempre subtrai</option></select>':"")+'</td></tr>').join("");
  m.innerHTML='<div class="card"><div class="ch-h"><div><h3>Contas do relatório FI-025 → linhas da DRE gerencial</h3><div class="sub">Cada conta do relatório cai numa linha da estrutura. Mudar aqui recalcula todos os meses importados. "Pelo tipo": conta R soma em linha de receita e subtrai em linha de custo; conta D faz o contrário.</div></div></div>'+
   '<div class="tools"><div class="chips">'+[["pend","Sem linha ("+nP+")"],["todas","Todas"],["alt","Alteradas ("+nA+")"],["ign","Fora do resultado"]].map(([k,l])=>'<button class="chip'+(FILTRO_CONTAS===k?" on":"")+'" onclick="FILTRO_CONTAS=\''+k+'\';render()">'+l+'</button>').join("")+'</div><input class="inp" placeholder="Buscar código, conta ou linha" value="'+esc(BUSCA)+'" oninput="BUSCA=this.value;clearTimeout(window._bt);window._bt=setTimeout(()=>{render();const i=document.querySelector(\'.tools .inp\');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)" style="flex:1;min-width:180px;max-width:320px"></div>'+
   (cs.length?'<div class="tw"><table class="t"><thead><tr><th style="width:60px">Cód.</th><th>Conta no relatório</th><th>T</th><th>Último valor</th><th style="text-align:left">Linha da DRE</th><th style="text-align:left">Sinal</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty" style="padding:30px"><b>Nada aqui</b>'+(FILTRO_CONTAS==="pend"?"Todas as contas importadas já têm linha.":"")+'</div>')+'</div>';
}

/* ---------- IMPORTAÇÕES ---------- */
function renderImp(m){const ks=Object.keys(S.meses).sort().reverse();
  const rows=ks.map(k=>{const x=S.meses[k];const c=calcMes(k);const inf=x.info||{};return'<tr><td><b>'+mkLabel(k)+'</b></td><td style="text-align:left">'+(x.fonte==="pdf"?"Relatório FI-025":"Planilha")+'</td><td style="text-align:left" class="small">'+esc(inf.arquivo||"")+'</td><td class="small">'+(inf.importadoEm?new Date(inf.importadoEm).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"})+(inf.por?" · "+esc(inf.por):""):"—")+'</td><td class="num">'+fK(c.d.tot)+'</td><td class="num '+(c.d.rl<0?"neg":"pos")+'">'+fK(c.d.rl)+'</td><td class="num">'+(Object.keys(c.pend).length?'<span class="tag">'+Object.keys(c.pend).length+' sem linha</span>':"")+(Object.keys(x.ajustes||{}).length?'<span class="tag" style="background:#f1f5f9;color:#475569">'+Object.keys(x.ajustes).length+' ajuste(s)</span>':"")+'</td><td><button class="btn btn-r btn-sm" onclick="excluirMes(\''+k+'\')">Excluir</button></td></tr>'}).join("");
  m.innerHTML='<div class="card"><div class="ch-h"><div><h3>Meses carregados</h3><div class="sub">Importe o FI-025 (DRE Fluxo Ajustado) de cada mês. Reimportar um mês substitui as contas e mantém os ajustes manuais.</div></div><button class="btn btn-o" onclick="document.getElementById(\'f-hist2\').click()">Carregar histórico (.json)</button><button class="btn btn-g" onclick="abrirImport()">⬆ Importar FI-025</button><input type="file" id="f-hist2" accept=".json,application/json" style="display:none" onchange="carregarHistorico(this)"></div>'+
   (ks.length?'<div class="tw"><table class="t"><thead><tr><th>Mês</th><th style="text-align:left">Fonte</th><th style="text-align:left">Arquivo</th><th>Importado</th><th>Total recebido</th><th>Resultado líquido</th><th></th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty" style="padding:30px"><b>Nenhum mês ainda</b></div>')+'</div>';
}
function excluirMes(k){if(!confirm("Excluir "+mkLong(k)+"? As contas e os ajustes deste mês serão apagados."))return;db.ref("fin/meses/"+k).remove().then(()=>toast("Mês excluído"))}
function carregarHistorico(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let j;try{j=JSON.parse(r.result)}catch(e){toast("Arquivo inválido",true);return}
  if(j.tipo!=="meta-financeiro-historico"){toast("Esse arquivo não é o histórico do Meta Financeiro",true);return}
  const up={};let n=0,pul=0;Object.entries(j.meses||{}).forEach(([k,x])=>{const ex=S.meses[k];if(ex&&ex.fonte==="pdf"&&x.fonte!=="pdf"){pul++;return}if(ex&&!confirm("Já existe "+mkLong(k)+". Substituir pelo do arquivo?")){pul++;return}x.info=Object.assign({},x.info,{importadoEm:Date.now(),por:NOME});up["fin/meses/"+k]=x;n++});
  Object.entries(j.metas||{}).forEach(([a,x])=>{if(!S.metas[a]||confirm("Substituir as metas de "+a+" pelas do arquivo?"))up["fin/metas/"+a]=x});
  Object.entries(j.hist||{}).forEach(([a,x])=>{up["fin/hist/"+a]=x});
  if(j.deprec&&!Object.keys(S.deprec||{}).length)up["fin/deprec"]=j.deprec;if(j.dividas&&!Object.keys(S.dividas||{}).length)up["fin/dividas"]=j.dividas;
  if(j.empresa&&!S.config.empresa)up["fin/config/empresa"]=j.empresa;
  db.ref().update(up).then(()=>toast((n?n+" mês(es) carregado(s)":"Arquivo carregado")+(pul?", "+pul+" mantido(s)":"")+(up["fin/deprec"]?" · bens cadastrados":"")+(up["fin/dividas"]?" · contratos cadastrados":""))).catch(e=>toast("Não salvou: "+e.message,true))};r.readAsText(f);inp.value=""}

/* ---------- IMPORTAR FI-025 ---------- */
function abrirImport(){IMP=null;document.getElementById("md").innerHTML='<h2>Importar relatório FI-025</h2><div class="muted small">DRE Fluxo Ajustado do mês, em PDF, como sai do sistema. O sistema lê as contas, confere com os totais do relatório e classifica cada conta na linha da DRE gerencial.</div><label class="drop" id="drop"><input type="file" accept="application/pdf,.pdf" onchange="lerPdf(this.files[0])"><div style="font-size:26px">📄</div>Toque para escolher o PDF ou arraste aqui</label><div id="imp-r"></div><div class="md-f"><button class="btn btn-o" onclick="fecharModal()">Cancelar</button></div>';
  document.getElementById("modal").classList.add("on");const d=document.getElementById("drop");["dragover","dragenter"].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add("ov")}));["dragleave","drop"].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove("ov")}));d.addEventListener("drop",ev=>{const f=ev.dataTransfer.files[0];if(f)lerPdf(f)})}
function fecharModal(){document.getElementById("modal").classList.remove("on");IMP=null}
let _pdfjs=null;async function pdfjs(){if(_pdfjs)return _pdfjs;_pdfjs=await import(PDFJS_URL);_pdfjs.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;return _pdfjs}
async function lerPdf(f){if(!f)return;const out=document.getElementById("imp-r");out.innerHTML='<p class="muted" style="margin-top:14px">Lendo '+esc(f.name)+'…</p>';
  try{const lib=await pdfjs();const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;const pages=[];
    for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p);const tc=await pg.getTextContent();pages.push(tc.items.filter(i=>i.str!=null).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5]})))}
    const r=parseFI025(pages);r.arquivo=f.name;prepararImport(r)}
  catch(e){console.error(e);out.innerHTML='<p class="err" style="margin-top:14px">Não consegui ler esse PDF ('+esc(e.message||e)+').</p>'}}
function prepararImport(r){const out=document.getElementById("imp-r");
  if(!r.contas.length||!r.ini){out.innerHTML='<p class="err" style="margin-top:14px">Não encontrei as contas do FI-025 neste arquivo. Confira se é o relatório "DRE FLUXO AJUSTADO".</p>';return}
  if(r.ini.slice(0,7)!==r.fim.slice(0,7)){out.innerHTML='<p class="err" style="margin-top:14px">O relatório cobre '+r.ini.split("-").reverse().join("/")+' a '+r.fim.split("-").reverse().join("/")+'. Gere o FI-025 de um mês só (dia 1 ao último dia).</p>';return}
  const mk=r.ini.slice(0,7);const contas={};r.contas.forEach(c=>{const k="c"+c.cod;const x=contas[k]=contas[k]||{d:c.desc,v:0,t:c.t};x.v=Math.round((x.v+(c.t===x.t?c.v:-c.v))*100)/100});
  IMP={r,mk,contas,escolhas:{}};desenharImport()}
function desenharImport(){const{r,mk,contas}=IMP;const out=document.getElementById("imp-r");const ex=S.meses[mk];
  const dp=Object.assign(deparaEf());Object.entries(IMP.escolhas).forEach(([k,v])=>{if(v)dp[k]={l:v,s:""}});
  const pend=Object.entries(contas).filter(([k])=>{const d=dpNorm(dp[k]);return!d||!d.l});
  const{v}=valoresMes({contas},dp);const d=D(v);
  let h='<div class="chk"><div><div class="l">Empresa</div><div style="font-weight:700;margin-top:2px">'+esc(r.empresa||"—")+'</div></div><div><div class="l">Mês</div><div class="v">'+mkLabel(mk)+'</div></div><div><div class="l">Contas lidas</div><div class="v">'+r.contas.length+'</div></div><div><div class="l">Receitas</div><div class="v">'+fR(r.somaR,2)+'</div></div><div><div class="l">Despesas</div><div class="v">'+fR(r.somaD,2)+'</div></div></div>';
  h+=r.confere?'<p class="ok">✓ A soma das contas confere com os totais gerais do relatório.</p>':'<p class="err">✗ A soma das contas não bate com os totais do relatório (receitas '+fR(r.totR,2)+', despesas '+fR(r.totD,2)+'). Algumas linhas podem não ter sido lidas — confira antes de salvar.</p>';
  if(S.config.empresa&&r.empresa&&S.config.empresa!==r.empresa)h+='<p class="err" style="margin-top:6px">Atenção: este relatório é de '+esc(r.empresa)+', e os meses já carregados são de '+esc(S.config.empresa)+'.</p>';
  if(ex)h+='<p style="margin-top:8px;color:var(--amber);font-weight:600">'+mkLong(mk).replace(/^./,c=>c.toUpperCase())+' já está carregado ('+(ex.fonte==="pdf"?"relatório":"planilha")+'). Ao salvar, as contas são substituídas'+(Object.keys(ex.ajustes||{}).length?" e os "+Object.keys(ex.ajustes).length+" ajuste(s) manuais são mantidos":"")+(ex.fonte==="planilha"?"; linhas que vinham só da planilha (ex: inadimplência) viram ajustes manuais para não se perderem":"")+'.</p>';
  if(pend.length)h+='<div class="sec">'+pend.length+' conta'+(pend.length>1?"s":"")+' nova'+(pend.length>1?"s":"")+' — escolha a linha</div>'+pend.map(([k,x])=>'<div class="row"><div class="f"><b>'+k.slice(1)+'</b> · '+esc(x.d)+'<div class="small muted">tipo '+x.t+'</div></div><span class="num">'+fR(x.v,2)+'</span><select class="sel btn-sm" style="max-width:220px" onchange="IMP.escolhas[\''+k+'\']=this.value;desenharImport()"><option value="">— decidir depois —</option>'+optsLinhas(IMP.escolhas[k],'<option value="ign"'+(IMP.escolhas[k]==="ign"?" selected":"")+'>Não entra no resultado</option>')+'</select></div>').join("")+'<div class="small muted" style="margin-top:6px">Contas sem linha ficam fora do resultado e aparecem em "Contas do relatório" para classificar depois.</div>';
  h+='<div class="sec">Prévia do mês</div><div class="chk" style="margin-top:0"><div><div class="l">Total recebido</div><div class="v">'+fK(d.tot)+'</div></div><div><div class="l">Custos variáveis</div><div class="v">'+fK(d.cv)+'</div></div><div><div class="l">Custos fixos</div><div class="v">'+fK(d.cf)+'</div></div><div><div class="l">Resultado líquido</div><div class="v" style="color:'+(d.rl<0?"var(--red)":"var(--G)")+'">'+fK(d.rl)+'</div></div></div><div class="small muted">Prévia sem os ajustes manuais do mês.</div>';
  out.innerHTML=h;document.querySelector("#md .md-f").innerHTML='<button class="btn btn-o" onclick="fecharModal()">Cancelar</button><button class="btn btn-g" onclick="salvarImport()">Salvar '+mkLabel(mk)+'</button>'}
function salvarImport(){const{r,mk,contas}=IMP;const ex=S.meses[mk];const up={};const b="fin/meses/"+mk+"/";
  up[b+"fonte"]="pdf";up[b+"contas"]=contas;up[b+"linhas"]=null;up[b+"info"]={empresa:r.empresa,ini:r.ini,fim:r.fim,totR:r.totR,totD:r.totD,saldo:r.saldo,confere:r.confere,arquivo:r.arquivo||"",importadoEm:Date.now(),por:NOME};
  Object.entries(IMP.escolhas).forEach(([k,l])=>{if(l)up["fin/depara/"+k]={l,s:""}});
  if(ex&&ex.fonte==="planilha"&&ex.linhas){const dp=deparaEf();Object.entries(IMP.escolhas).forEach(([k,l])=>{if(l)dp[k]={l,s:""}});const{v}=valoresMes({contas},dp);
    Object.entries(ex.linhas).forEach(([l,x])=>{if(LIN[l]&&Math.abs(+x)>0.005&&Math.abs(v[l])<0.005)up[b+"ajustes/"+db.ref().push().key]={para:l,v:+x,obs:"Trazido da planilha (linha sem conta no relatório)",por:NOME,ts:Date.now()}})}
  if(!S.config.empresa&&r.empresa)up["fin/config/empresa"]=r.empresa;
  db.ref().update(up).then(()=>{fecharModal();ANO=mk.slice(0,4);MES=mk;MODO="mes";TAB="geral";toast(mkLabel(mk)+" importado");render()}).catch(e=>toast("Não salvou: "+e.message,true))}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(document.getElementById("modal").classList.contains("on"))fecharModal();else fecharDrawer()}});

</script>
