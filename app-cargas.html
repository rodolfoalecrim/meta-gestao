<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meta Cargas</title>
<meta name="theme-color" content="#052e16">
<link rel="icon" href="meta_logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f6f3;--surface:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--dim:#94a3b8;--G:#15803d;--GD:#052e16;--GL:#f0fdf4;--amber:#d97706;--amberL:#fffbeb;--red:#dc2626;--redL:#fef2f2;--blue:#2563eb;--blueL:#eff6ff;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
:focus-visible{outline:2px solid var(--G);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* login */
#login{display:none;min-height:100%;align-items:center;justify-content:center;padding:24px;background:var(--GD)}
.login-box{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:360px}
.login-box img{height:42px;margin-bottom:14px}
.login-box h1{font-size:20px;margin-bottom:4px}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:18px}
/* shell */
#app{display:none;min-height:100%;flex-direction:column}
.top{background:var(--GD);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;position:sticky;top:0;z-index:20}
.top-row{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto}
.top-row img{height:28px;border-radius:6px;background:#fff;padding:2px}
.top-row h1{font-size:16px;font-weight:800;flex:1}
.top-row .who{font-size:12px;opacity:.75}
.top-row .ic{background:rgba(255,255,255,.1);border:none;color:#fff;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600}
.tabs{display:flex;gap:2px;max-width:1180px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;color:rgba(255,255,255,.65);padding:10px 14px;font-size:13.5px;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:#4ade80}
.tab .badge{background:var(--red);color:#fff;border-radius:9px;padding:1px 6px;font-size:10.5px;margin-left:4px}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.view{display:none}.view.on{display:block}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{font-size:18px;font-weight:800;margin-right:auto}
.btn{border:none;border-radius:11px;padding:10px 14px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-g{background:var(--G);color:#fff}.btn-g:hover{background:#166534}
.btn-o{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-r{background:var(--redL);color:var(--red)}
.btn-a{background:var(--amberL);color:#92400e}
.btn-sm{padding:7px 10px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--GD);border-color:var(--GD);color:#fff}
.inp{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;color:var(--text)}
.inp:focus{border-color:var(--G);outline:none}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.muted{color:var(--muted)}.small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-montagem{background:#f1f5f9;color:#475569}
.p-fechada{background:var(--blueL);color:var(--blue)}
.p-carregada{background:#ecfeff;color:#0e7490}
.p-a_caminho{background:var(--amberL);color:#b45309}
.p-entregue{background:var(--GL);color:var(--G)}
.p-atraso{background:var(--redL);color:var(--red)}
.p-aberto{background:#f1f5f9;color:#475569}
.p-cancelado{background:#f1f5f9;color:var(--dim);text-decoration:line-through}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.group-h{font-size:12.5px;font-weight:800;color:var(--muted);margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.group-h.red{color:var(--red)}
/* day strip */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:58px;border:1px solid var(--border);background:#fff;border-radius:12px;padding:7px 8px;text-align:center}
.day .w{font-size:11px;color:var(--muted);font-weight:600;text-transform:capitalize}
.day .d{font-size:17px;font-weight:800}
.day .n{font-size:10.5px;color:var(--G);font-weight:700;min-height:13px}
.day.on{background:var(--GD);border-color:var(--GD);color:#fff}.day.on .w,.day.on .n{color:#bbf7d0}
.day.today:not(.on){border-color:var(--G)}
/* truck — signature element */
.truck{display:flex;align-items:stretch;gap:4px;overflow-x:auto;padding:2px 2px 6px}
.cab{flex:0 0 34px;border-radius:12px 4px 4px 12px;background:var(--GD);position:relative}
.cab:after{content:"";position:absolute;left:6px;right:10px;top:8px;height:14px;border-radius:5px;background:#86efac;opacity:.5}
.box{flex:1 0 74px;min-width:74px;border-radius:6px;border:1.5px solid transparent;background:#fff;position:relative;overflow:hidden;padding:7px 7px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:92px}
.box .cx{font-size:10.5px;font-weight:800;opacity:.8}
.box .cl{font-size:11.5px;font-weight:700;line-height:1.2;max-height:28px;overflow:hidden}
.box .kg{font-family:var(--mono);font-size:12.5px;font-weight:700;margin-top:auto}
.box .fill{position:absolute;left:0;bottom:0;height:5px;background:currentColor;opacity:.55}
.box .ok{position:absolute;top:5px;right:6px;font-size:10px;font-weight:800;background:#fff;border-radius:6px;padding:1px 4px}
.box.free{border:1.5px dashed #cbd5e1;background:repeating-linear-gradient(135deg,#f8fafc 0 6px,#f1f5f9 6px 12px);color:var(--dim)}
.box.over{box-shadow:inset 0 0 0 2px var(--red)}
.truck.mini .box{min-height:44px;min-width:30px;flex-basis:30px;padding:4px}
.truck.mini .box .cl,.truck.mini .box .kg{display:none}
.truck.mini .cab{flex-basis:18px}
.truck.mini .cab:after{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* carga card */
.cc{cursor:pointer}
.cc-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.cc-h .t{flex:1}
.cc-h .t b{font-size:15px}
.cc-h .t div{font-size:12px;color:var(--muted);margin-top:2px}
.warn{font-size:12px;font-weight:700;color:var(--amber);margin-top:8px}
.warn.red{color:var(--red)}
/* list rows */
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f1f5f9}
.row:last-child{border-bottom:none}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main span{font-size:12px;color:var(--muted)}
.row .r{text-align:right;flex-shrink:0}
.t-big{font-family:var(--mono);font-weight:700;font-size:14px}
.why{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.why em{font-style:normal;font-size:10.5px;font-weight:700;background:var(--GL);color:var(--G);border-radius:6px;padding:2px 6px}
.why em.a{background:var(--amberL);color:#92400e}
/* progress */
.prog{height:10px;border-radius:6px;background:#f1f5f9;overflow:hidden;display:flex;margin:10px 0 6px}
.prog i{display:block;height:100%}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.kv div{font-size:11px;color:var(--muted)}
.kv b{display:block;font-family:var(--mono);font-size:14px;color:var(--text)}
/* editor layout */
.ed{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.ed{grid-template-columns:1.25fr 1fr}.ed .side{position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto}}
.stops .row{gap:8px}
.oc-row{gap:8px}.oc-row .main span{display:block}
.ed>div,.card,main{min-width:0}
@media(max-width:600px){.top-row .who{display:none}.box{min-width:58px;flex-basis:58px;padding:6px 5px 11px}.box .cl{font-size:10.5px}.box .kg{font-size:11.5px}}
.mv{border:1px solid var(--border);background:#fff;border-radius:8px;width:28px;height:28px;font-size:13px}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:50;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.sh{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media(min-width:700px){#sheet{align-items:center}.sh{border-radius:18px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sh{animation:none}}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sh-h h3{font-size:17px;flex:1}
.x{border:none;background:#f1f5f9;border-radius:9px;width:32px;height:32px;font-size:16px}
.sh-f{display:flex;gap:8px;margin-top:18px}
.sh-f .btn{flex:1}
.ac{position:relative}
.ac-l{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);z-index:5;max-height:240px;overflow:auto;display:none}
.ac-l div{padding:9px 12px;font-size:13px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.ac-l div:hover{background:var(--GL)}
.ac-l small{color:var(--muted);margin-left:6px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(80px);background:var(--G);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:13px;z-index:99;transition:transform .25s;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.stat div{font-size:12px;color:var(--muted)}.stat b{display:block;font-family:var(--mono);font-size:18px;color:var(--text)}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}.kv{grid-template-columns:1fr 1fr}}

/* ===== painel de despacho ===== */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{font-size:21px;line-height:1.2}
.kpi small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.warnk{border-color:#fcd34d;background:#fffdf5}.kpi.warnk b{color:#b45309}
.kpi.redk{border-color:#fca5a5;background:#fffafa}.kpi.redk b{color:var(--red)}
.painel{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.seg{display:inline-flex;background:#e7ece8;border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{border:none;background:none;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.fila{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 14px;position:sticky;top:112px;max-height:calc(100vh - 130px);overflow:auto}
.fila-h{display:flex;align-items:baseline;gap:8px}.fila-h b{flex:1;font-size:14.5px}
.fq{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid #f1f5f9}.fq:last-child{border:none}
.fq .main{flex:1;min-width:0}.fq .main b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fq .main span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fq .main span.late{color:var(--red);font-weight:700}
.fq .r{text-align:right}.fq .t-big{font-size:13px}
.fr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.fr-t .tk{font-weight:800;font-size:14px}.fr-c{min-width:0;display:flex;flex-direction:column;gap:8px}
.livre{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1.5px dashed #cbd5e1;border-radius:11px;padding:10px 12px;color:var(--muted);font-size:13px;font-weight:600;height:100%}
.cb{border:1px solid var(--border);border-radius:11px;padding:10px 11px;cursor:pointer;background:#fff;min-width:0}
.cb:hover{border-color:#86efac}
.fr .cb{border:none;padding:0}
.cb-h{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}.cb-h b{font-size:13.5px}
.truck.mini .box{min-height:30px;border-radius:5px}
.truck.mini .box .cx{font-size:9px}
.truck.mini .box .ok{top:2px;right:2px;font-size:8.5px;padding:0 2px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:7px 0 6px;font-size:12.5px;font-weight:600}
.chain .st{display:inline-flex;align-items:center;gap:5px}
.chain .st i{font-style:normal;width:17px;height:17px;border-radius:50%;color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center}
.chain .st small{font-weight:500;color:var(--muted);text-transform:capitalize}
.chain .st.done{opacity:.55;text-decoration:line-through}
.chain .arr{color:var(--dim)}
.mets{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px}
.oc{display:flex;align-items:center;gap:8px;flex:1;min-width:220px}
.ocb{flex:1;height:7px;border-radius:4px;background:#eef2f0;overflow:hidden;max-width:180px}.ocb i{display:block;height:100%}
.kan{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kc{background:#eef2ef;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kc-h{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 0}
.kc .chain{font-size:11.5px}.kc .oc{min-width:0}
.wk{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:14px}
.wk table{border-collapse:collapse;width:100%;min-width:760px;font-size:12.5px}
.wk th,.wk td{border-bottom:1px solid #f1f5f9;padding:8px;text-align:left;vertical-align:top}
.wk th{font-size:12px;color:var(--muted);cursor:pointer;text-transform:capitalize;white-space:nowrap}
.wk th.on{color:var(--G)}
.wk tr.tot td{background:#f8faf9;font-size:12px;color:var(--muted)}
.wc{border-radius:8px;padding:5px 7px;margin-bottom:4px;cursor:pointer;display:flex;flex-direction:column}
.wc span{font-size:10.5px;font-weight:600;opacity:.85;text-transform:capitalize}
.mapa{height:540px;border-radius:14px;border:1px solid var(--border);overflow:hidden;background:#e5ebe7;z-index:0}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);font-family:Inter,sans-serif}
.pin.ho{background:#fff;border-width:2.5px}
.pin.ax{opacity:.72;border-style:dashed}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.painel{grid-template-columns:1fr}.fila{position:static;max-height:none}}
@media(max-width:600px){.kpis{grid-template-columns:1fr 1fr}.fr{grid-template-columns:1fr}.mapa{height:420px}.seg{display:flex}.seg button{flex:1;padding:7px 6px}}


/* ===== frota ===== */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.fgrid .card{margin:0}
.kv small{display:block;font-size:10.5px;color:var(--muted)}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl .inp{padding:6px 8px;font-size:13px;min-width:80px}

/* ===================== VISÃO GERAL ===================== */
.sbusca{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.75);border-radius:10px;padding:9px 11px;font-size:13px;font-family:inherit;margin:0 0 12px;cursor:pointer}
.sbusca:hover{background:rgba(255,255,255,.13);color:#fff}
.sbusca kbd,.srch kbd{font-family:var(--mono);font-size:10.5px;border:1px solid currentColor;border-radius:5px;padding:1px 5px;opacity:.7}
.dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.dh>div{margin-right:auto}
.dh h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.dh p{color:var(--muted);font-size:13px;margin-top:2px}
.dh p::first-letter{text-transform:uppercase}
.srch{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:11px;padding:9px 12px;color:var(--muted);font-size:13px;font-family:inherit;cursor:pointer;min-width:280px;justify-content:space-between}
.srch:hover{border-color:#86efac}
/* fluxo do dia: o elemento marcante */
.flow{background:var(--GD);color:#fff;border-radius:18px;padding:16px 16px 14px;margin-bottom:14px}
.flow-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.flow-h h2{font-size:16px;font-weight:800}
.flow-h .muted{color:#a7c4b0!important}
.flow-h .lnk{margin-left:auto;color:#bbf7d0}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:relative}
.lane{background:rgba(255,255,255,.05);border-radius:13px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px;position:relative}
.lane:not(:last-child)::after{content:"";position:absolute;right:-9px;top:20px;width:8px;height:2px;background:rgba(187,247,208,.35)}

const firebaseConfig={apiKey:"AIzaSyClpsHjO8OLThD--hDOfg7Fg3t6hhuM-To",authDomain:"meta-gestao-608d7.firebaseapp.com",databaseURL:"https://meta-gestao-608d7-default-rtdb.firebaseio.com",projectId:"meta-gestao-608d7",storageBucket:"meta-gestao-608d7.firebasestorage.app",messagingSenderId:"318618053627",appId:"1:318618053627:web:ae289200bd1e87be29395e"};

/* ================= Helpers ================= */
const S={ind:{},pn:{},vs:{},vc:{},ve:{},kl:{},km:{},ab:{},dp:{},sv:{},pl:{},doc:{},config:{},cargas:{},pedidos:{},clientes:{},caminhoes:{},contratos:{},motoristas:{},props:null};
let USER=null,ROLE=null,NOME="";
const STATUS_TXT={montagem:"Montando",fechada:"Aguardando carregamento",carregada:"Carregada",a_caminho:"A caminho",entregue:"Entregue",aberto:"A montar",cancelado:"Cancelado"};
const STAGE={aberto:0,montagem:1,fechada:1,carregada:2,a_caminho:3,entregue:4};
const CORES=["#15803d","#2563eb","#b45309","#7c3aed","#0e7490","#be123c","#4d7c0f","#475569"];
const VEND_SUG=["ALEXANDRE","VAGNER","ROBSON","JOZIEL","VANDRIGO","ARTHUR","MAICON","JULIO","PAULO","JOSE LUCAS","JULIA","MARCELO"];

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim()}
function slug(s){return norm(s).replace(/[^A-Z0-9]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase().slice(0,60)}
function iso(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+dd}
function hoje(){return iso(new Date())}
function addDias(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function difDias(a,b){return Math.round((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/864e5)}
function fData(s){if(!s)return"—";const[y,m,d]=s.split("-");return d+"/"+m}
function fDataL(s){if(!s)return"—";return new Date(s+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"})}
function t(kg,dec){const v=(Number(kg)||0)/1000;return v.toLocaleString("pt-BR",{minimumFractionDigits:dec==null?1:dec,maximumFractionDigits:dec==null?1:dec})+" t"}
function toast(m,err){const e=document.getElementById("toast");e.textContent=m;e.style.background=err?"var(--red)":"var(--G)";e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2800)}
function farelado(p){return /FAREL/i.test(p||"")&&!/PELET/i.test(p||"")}
function capCaixa(cam,i,produto){if(!cam)return 3000;const base=(cam.caixas||[])[i]||3000;if(farelado(produto)){const f=(cam.caixasFarel||[])[i];return f||Math.round(base*0.9)}return base}
function arr(o){if(!o)return[];return Array.isArray(o)?o.filter(x=>x!=null):Object.keys(o).sort((a,b)=>a-b).map(k=>o[k])}
function corCliente(carga,clienteId){const ids=clientesDaCarga(carga);const i=ids.indexOf(clienteId);return CORES[(i<0?0:i)%CORES.length]}
function clientesDaCarga(c){const ids=[];arr(c.caixas).forEach(b=>{if(b&&b.clienteId&&!ids.includes(b.clienteId))ids.push(b.clienteId)});const ord=arr(c.ordem).filter(x=>ids.includes(x));ids.forEach(x=>{if(!ord.includes(x))ord.push(x)});return ord}
function kgTotal(c){return arr(c.caixas).reduce((s,b)=>s+(b&&b.clienteId?(+b.kg||0):0),0)}

/* status da carga: mesma regra no app do motorista */
function calcStatus(c){
  const cx=arr(c.caixas);const usadas=cx.filter(b=>b&&b.clienteId);
  const ids=clientesDaCarga(c);const ent=c.entregas||{};
  if(ids.length&&ids.every(id=>ent[id]&&ent[id].status==="entregue"))return"entregue";
  if(c.saidaEm)return"a_caminho";
  const livres=cx.length-usadas.length;
  const fechada=usadas.length>0&&(livres===0||c.fechadaComVazia);
  if(fechada&&usadas.every(b=>b.carregada))return"carregada";
  if(fechada)return"fechada";
  return"montagem";
}
function cargaAtrasada(c){return c.status!=="entregue"&&c.data&&c.data<hoje()}

/* alocação dos pedidos a partir das cargas carregadas na memória */
function alocacoes(){
  const m={};
  Object.entries(S.cargas).forEach(([cid,c])=>{
    const ent=c.entregas||{};
    arr(c.caixas).forEach(b=>{
      if(!b||!b.pedidoId)return;
      const a=m[b.pedidoId]||(m[b.pedidoId]={aloc:0,entregue:0,cargas:{},minStage:9,caixas:[]});
      const kg=+b.kg||0;a.aloc+=kg;
      const st=ent[b.clienteId]&&ent[b.clienteId].status==="entregue"?"entregue":c.status;
      if(st==="entregue")a.entregue+=kg;
      a.cargas[cid]=true;a.minStage=Math.min(a.minStage,STAGE[st]||1);a.caixas.push({cid,cx:b.cx});
    });
  });
  return m;
}
function statusPedido(p,al){
  if(p.cancelado)return{k:"cancelado",txt:"Cancelado"};
  const a=al||{aloc:0,entregue:0,minStage:9};const kg=+p.kg||0;
  if(kg>0&&a.entregue>=kg-1)return{k:"entregue",txt:"Entregue"};
  if(!a.aloc)return{k:"aberto",txt:"A montar"};
  const nome=["aberto","montagem","carregada","a_caminho","entregue"][a.minStage]||"montagem";
  let txt=STATUS_TXT[nome==="montagem"?"montagem":nome];if(nome==="montagem")txt="Na carga";
  if(a.aloc<kg-1)txt+=" · faltam "+t(kg-a.aloc);
  return{k:nome==="montagem"?"fechada":nome,txt};
}
function pedidoAtrasado(p,st){return!p.cancelado&&st.k!=="entregue"&&p.dataEntrega&&p.dataEntrega<hoje()}

function login(){const e=document.getElementById("l-email").value.trim(),s=document.getElementById("l-senha").value;if(!e||!s)return;auth.signInWithEmailAndPassword(e,s).catch(()=>{document.getElementById("l-msg").textContent="E-mail ou senha incorretos."})}

  if(!u){document.getElementById("login").style.display="flex";document.getElementById("app").style.display="none";return}
  USER=u;
  try{ROLE=(await db.ref("usuarios/"+u.uid+"/role").once("value")).val()}catch(e){ROLE=null}

  NOME=(u.email||"").split("@")[0];
  document.getElementById("who").textContent=u.email;document.getElementById("who2").textContent=u.email;
  document.getElementById("login").style.display="none";document.getElementById("app").style.display="flex";

  setTimeout(migrarRioBonito,2500);
});
function iniciarFinanceiro(){document.querySelectorAll("[data-v]").forEach(b=>{if(b.dataset.v!=="despviagem"&&b.dataset.v!=="comissoes")b.style.display="none"});comfIniciar();document.querySelectorAll(".side-sec").forEach(x=>x.style.display="none");const sb=document.querySelector(".sbusca");if(sb)sb.style.display="none";dvfIniciar();tab("despviagem")}
function iniciar(){
  const ini=addDias(hoje(),-120);
  db.ref("cargas").orderByChild("data").startAt(ini).on("value",s=>{S.cargas=s.val()||{};render()});
  db.ref("cargas_pedidos").orderByChild("dataEntrega").startAt(ini).on("value",s=>{S.pedidos=s.val()||{};render()});
  db.ref("cargas_clientes").on("value",s=>{S.clientes=s.val()||{};render()});
  db.ref("cargas_caminhoes").on("value",s=>{const v=s.val()||{};Object.values(v).forEach(c=>{c.caixas=arr(c.caixas);c.caixasFarel=arr(c.caixasFarel)});S.caminhoes=v;render()});
  db.ref("cargas_contratos").on("value",s=>{S.contratos=s.val()||{};render()});
  db.ref("cargas_motoristas").on("value",s=>{S.motoristas=s.val()||{}});
  db.ref("cargas_config").on("value",s=>{S.config=s.val()||{};render()});
  const ff=(n,k,q)=>{(q||db.ref(n)).on("value",x=>{S[k]=x.val()||{};render()},e=>console.warn(n,e.message))};
  ff("frota_abastecimentos","ab",db.ref("frota_abastecimentos").orderByChild("data").startAt(addDias(hoje(),-400)));
  ff("frota_despesas","dp",db.ref("frota_despesas").orderByChild("data").startAt(addDias(hoje(),-400)));
  ff("frota_servicos","sv",db.ref("frota_servicos").orderByChild("data").startAt(addDias(hoje(),-730)));
  ff("frota_planos","pl");ff("frota_documentos","doc");ff("frota_indisp","ind");ff("frota_pneus","pn");
  if(ROLE==="admin"){ff("veiculos_equipe","ve");ff("km_lancamentos","kl");ff("km_metas","km");ff("veiculos_servicos","vs");ff("veiculos_config","vc")}else{document.querySelectorAll('[data-v="carros"]').forEach(b=>b.style.display="none")}
}

/* ================= Navegação ================= */
let VIEW="inicio",DIA=(()=>{let d=hoje();while(fimDeSemana(d))d=addDias(d,1);return d})(),EDIT=null,_rt=null;
function tab(v){VIEW=v;document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));render(true);window.scrollTo(0,0)}

  doDia.forEach(([,c])=>{kg+=kgTotal(c);cap+=capTotal(c);fr+=freteCarga(c);const r=rotaInfo(c);if(r.ok)km+=r.total;else semKm++;const ids=clientesDaCarga(c);paradas+=ids.length;feitas+=ids.filter(i=>(c.entregas||{})[i]&&c.entregas[i].status==="entregue").length;st[c.status]=(st[c.status]||0)+1});
  const usados=new Set(doDia.map(([,c])=>camKey(c)).filter(Boolean)).size;const frota=Object.keys(S.caminhoes).length;
  const pt=pend.reduce((s,x)=>s+x.resta,0),atr=pend.filter(x=>x.p.dataEntrega<hoje()).length;const oc=cap?Math.round(kg/cap*100):0;
  const tile=(lb,v,sub,cls)=>'<div class="kpi'+(cls?" "+cls:"")+'"><span>'+lb+'</span><b class="num">'+v+'</b><small>'+sub+'</small></div>';
  return'<div class="kpis">'+
   tile("Programado",t(kg,1),"ocupação média "+oc+"%",oc&&oc<80?"warnk":"")+
   tile("Frota em uso",usados+"/"+frota,doDia.length+" carga"+(doDia.length!==1?"s":"")+" no dia")+
   tile("Sem carga até "+fData(DIA),t(pt,1),pend.length+" pedido"+(pend.length!==1?"s":"")+(atr?" · "+atr+" atrasado"+(atr>1?"s":""):""),atr?"redk":pt?"warnk":"")+
   tile("Entregas",feitas+"/"+paradas,st.a_caminho+" a caminho · "+(st.carregada)+" prontas")+
   tile("Km estimados",km?Math.round(km).toLocaleString("pt-BR"):"—",semKm?semKm+" carga"+(semKm>1?"s":"")+" sem cidade conhecida":"ida e volta a partir de Candói")+
   tile("Frete estimado",fr?brl(fr):"—",fr&&km?"R$ "+(fr/km).toFixed(2).replace(".",",")+" por km":"pelo R$/t do cliente")+
  '</div>';
}

function pinIcon(txt,cor,hollow,aprox){return L.divIcon({className:"",html:'<div class="pin'+(hollow?" ho":"")+(aprox?" ax":"")+'" style="'+(hollow?"border-color:"+cor+";color:"+cor:"background:"+cor)+'">'+txt+'</div>',iconSize:[26,26],iconAnchor:[13,13]})}
function desenharMapa(elId,cargas,pend){
  const el=document.getElementById(elId);if(!el)return;
  if(!window.L){el.innerHTML='<div class="empty"><b>Mapa indisponível</b>Sem conexão para carregar o mapa.</div>';return}
  const m=L.map(el,{scrollWheelZoom:false});L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(m);
  const bounds=[];const o=origem();let semLoc=0;
  if(o){L.marker([o.lat,o.lng],{icon:pinIcon("F","#052e16")}).addTo(m).bindPopup("<b>"+esc(o.nome)+"</b><br>ponto de saída");bounds.push([o.lat,o.lng])}
  cargas.forEach(([id,c],ci)=>{const cor=CORES[ci%CORES.length];const pts=o?[[o.lat,o.lng]]:[];const r=rotaInfo(c);
    r.legs.forEach((lg,i)=>{const p=ptCliente(lg.id);if(!p){semLoc++;return}const b=arr(c.caixas).find(x=>x&&x.clienteId===lg.id);pts.push([p.lat,p.lng]);bounds.push([p.lat,p.lng]);
      L.marker([p.lat,p.lng],{icon:pinIcon(i+1,cor,false,p.aprox),title:p.aprox?"Posição aproximada (centro da cidade)":""}).addTo(m).bindPopup("<b>"+esc(b.cliente)+"</b><br>"+esc(c.numero?"Carga "+c.numero:(S.caminhoes[c.caminhaoId]||{}).apelido||"")+" · parada "+(i+1)+(lg.eta!=null?"<br>chegada ~"+fmtHora(lg.eta):"")+'<br><a href="#" onclick="abrirEditor(\''+id+'\');return false">abrir carga</a>')});
    if(pts.length>1)L.polyline(pts,{color:cor,weight:4,opacity:.85}).addTo(m)});
  pend.forEach(x=>{const p=ptCliente(x.p.clienteId);if(!p){semLoc++;return}bounds.push([p.lat,p.lng]);L.marker([p.lat,p.lng],{icon:pinIcon("•","#64748b",true)}).addTo(m).bindPopup("<b>"+esc(x.p.cliente)+"</b><br>"+t(x.resta)+" sem carga · "+fData(x.p.dataEntrega)+'<br><a href="#" onclick="escolherCargaPara(\''+x.id+'\');return false">encaixar numa carga</a>')});
  if(bounds.length)m.fitBounds(bounds,{padding:[30,30],maxZoom:12});else m.setView([-26.08,-53.05],8);
  setTimeout(()=>m.invalidateSize(),60);
  const n=document.getElementById(elId+"-nota");if(n)n.textContent="Pino tracejado = posição aproximada pelo centro da cidade (o motorista fixa a exata na entrega). "+(semLoc?semLoc+" cliente(s) sem cidade conhecida não aparecem. ":"")+"Pontos cinza = pedidos ainda sem carga.";
}

/* ================= SUGESTÃO AUTOMÁTICA DE CARGAS ================= */
function planejarCargas(dia){
  if(!diaUtil(dia))return[];
  const fila=pendentesAte(addDias(proxDiaUtil(dia,1),0)).map(x=>Object.assign({},x));
  const ocupados=new Set(Object.values(S.cargas).filter(c=>c.data===dia).map(c=>camKey(c)));
  const trucks=Object.entries(S.caminhoes).filter(([k])=>!ocupados.has(k)&&!indisp(k,dia)).sort((a,b)=>(b[1].caixas||[]).reduce((s,x)=>s+x,0)-(a[1].caixas||[]).reduce((s,x)=>s+x,0));
  const props=[];const h=hoje();
  const prio=x=>(x.p.dataEntrega<h?1000+difDias(h,x.p.dataEntrega)*20:0)+(x.p.dataEntrega<=dia?300:0)+x.resta/100;
  for(const [tk,cam] of trucks){
    const vivos=fila.filter(x=>x.resta>=50&&!restricoes(x.p.clienteId,x.p.cidade,tk,dia).length);if(!vivos.length)continue;vivos.sort((a,b)=>prio(b)-prio(a));
    const boxes=(cam.caixas||[]).map(()=>null);const sel=[];
    const encher=x=>{let r=x.resta;for(let i=0;i<boxes.length&&r>0;i++){if(boxes[i])continue;const kg=Math.min(capCaixa(cam,i,x.p.produto),r);boxes[i]={x,kg};r-=kg}const u=x.resta-r;x.resta=r;return u};
    const capT=boxes.reduce((s,_,i)=>s+capCaixa(cam,i,""),0);
    let u=encher(vivos[0]);sel.push({x:vivos[0],kg:u,why:[vivos[0].p.dataEntrega<h?"atrasado":"prioridade da fila"]});
    while(boxes.some(b=>!b)){
      const ids=sel.map(s=>s.x.p.clienteId);const pts=ids.map(ptCliente).filter(Boolean);const cids=new Set(sel.map(s=>norm(s.x.p.cidade)));
      let best=null,bs=-1e9,bw=[];
      fila.forEach(x=>{if(x.resta<50||sel.some(s=>s.x===x)||restricoes(x.p.clienteId,x.p.cidade,tk,dia).length)return;let sc=0;const w=[];
        let pa=0;ids.forEach(k=>{pa+=((S.clientes[x.p.clienteId]||{}).parceiros||{})[k]||0});if(pa){sc+=Math.min(pa,15)*2;w.push("já foi junto "+pa+"×")}
        if(cids.has(norm(x.p.cidade))){sc+=12;w.push("mesma cidade")}
        const p=ptCliente(x.p.clienteId);let afin=pa>0||cids.has(norm(x.p.cidade));const semGeo=!p||!pts.length;
        if(!semGeo){const d=Math.min(...pts.map(q=>kmEntre(p,q)));if(d<20){sc+=10;w.push(Math.round(d)+" km");afin=true}else if(d<45){sc+=4;w.push(Math.round(d)+" km");afin=true}else if(d>90)sc-=30}
        if(!afin){if(!semGeo)return;w.push("completa a carga")}
        if(x.p.dataEntrega<h){sc+=8;w.push("atrasado")}else if(x.p.dataEntrega===dia)sc+=5;
        x._afin=afin;if(sc>bs){bs=sc;best=x;bw=w}});
      const ocAtual=boxes.reduce((s,b)=>s+(b?b.kg:0),0)/capT;
      if(!best||bs<0||(!best._afin&&ocAtual>=0.6))break;
      u=encher(best);if(!u)break;sel.push({x:best,kg:u,why:bw});
    }
    const kg=sel.reduce((s,x)=>s+x.kg,0);
    const caixas={};boxes.forEach((b,i)=>{caixas[i]=b?linhaCaixa(i,b.x.p,b.x.id,b.kg,cam):{cx:i+1,cap:cam.caixas[i]}});
    const ids=[];sel.forEach(s=>{if(!ids.includes(s.x.p.clienteId))ids.push(s.x.p.clienteId)});
    const carga={data:dia,caminhaoId:tk,placa:cam.placa||"",motoristaUid:cam.motoristaUid||"",motoristaNome:cam.motoristaNome||"",numero:"",regiao:"",caixas,ordem:otimizarOrdemIds(ids),status:"montagem",fechadaComVazia:false};
    props.push({tk,cam,sel,kg,cap:capTotal(carga)||capT,carga});
  }
  return props;
}

function historicoClientes(){
  const H={};Object.values(Object.assign({},(typeof IND!=="undefined"&&IND.dados)||{},S.cargas)).forEach(c=>{const kgCli={};const prod={};arr(c.caixas).forEach(b=>{if(b&&b.clienteId){kgCli[b.clienteId]=(kgCli[b.clienteId]||0)+(+b.kg||0);(prod[b.clienteId]=prod[b.clienteId]||{})[b.produto]=((prod[b.clienteId]||{})[b.produto]||0)+(+b.kg||0)}});
    Object.entries(kgCli).forEach(([k,kg])=>{const h=H[k]||(H[k]={dias:{},prod:{}});h.dias[c.data]=(h.dias[c.data]||0)+kg;Object.entries(prod[k]||{}).forEach(([p,v])=>h.prod[p]=(h.prod[p]||0)+v)})});
  const med=a=>{const s=a.slice().sort((x,y)=>x-y);const n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0};
  Object.values(H).forEach(h=>{const ds=Object.keys(h.dias).sort();h.ult=ds[ds.length-1];const iv=[];for(let i=1;i<ds.length;i++){const d=difDias(ds[i],ds[i-1]);if(d>0)iv.push(d)}h.freq=iv.length?Math.round(med(iv)):null;h.kg=med(Object.values(h.dias));h.produto=Object.entries(h.prod).sort((a,b)=>b[1]-a[1])[0][0]});
  return H;
}

/* a IA propõe; o código confere caixas, capacidade e restrições antes de mostrar */
function validarPropostaIA(resp,dia){
  const props=[];const usado={};const avisos=[];
  (resp.cargas||[]).forEach(cg=>{
    const tk=cg.caminhao_id;const cam=S.caminhoes[tk];if(!cam){avisos.push("Caminhão desconhecido ignorado: "+tk);return}
    const boxes=(cam.caixas||[]).map(()=>null);const sel=[];
    (cg.pedidos||[]).forEach(pp=>{const p=S.pedidos[pp.pedido_id];if(!p){avisos.push("Pedido inexistente ignorado");return}
      const rs=restricoes(p.clienteId,p.cidade,tk,dia);if(rs.length){avisos.push(p.cliente+" fora do "+(cam.apelido||tk)+": "+rs.join(", "));return}
      const al=alocacoes()[pp.pedido_id];let resta=Math.min(+pp.kg||Infinity,(+p.kg||0)-((al||{}).aloc||0)-(usado[pp.pedido_id]||0));if(resta<50)return;const r0=resta;
      for(let i=0;i<boxes.length&&resta>1;i++){if(boxes[i])continue;const kg=Math.min(capCaixa(cam,i,p.produto),resta);boxes[i]={pid:pp.pedido_id,p,kg};resta-=kg}
      const u=r0-resta;if(u>0){usado[pp.pedido_id]=(usado[pp.pedido_id]||0)+u;sel.push({x:{id:pp.pedido_id,p,resta:resta},kg:u,why:[]})}
      if(resta>50)avisos.push("Não coube tudo de "+p.cliente+" no "+(cam.apelido||tk)+" ("+t(resta)+" ficam na fila)")});
    if(!sel.length)return;
    const caixas={};boxes.forEach((b,i)=>{caixas[i]=b?linhaCaixa(i,b.p,b.pid,b.kg,cam):{cx:i+1,cap:cam.caixas[i]}});
    const cliIds=[];sel.forEach(s=>{if(!cliIds.includes(s.x.p.clienteId))cliIds.push(s.x.p.clienteId)});
    const ordIA=(cg.ordem_entrega||[]).filter(x=>cliIds.includes(x));const ordem=ordIA.length===cliIds.length?ordIA:otimizarOrdemIds(cliIds);
    const carga={data:dia,caminhaoId:tk,placa:cam.placa||"",motoristaUid:cam.motoristaUid||"",motoristaNome:cam.motoristaNome||"",numero:"",regiao:"",caixas,ordem,status:"montagem",fechadaComVazia:false};
    const kg=sel.reduce((s,x)=>s+x.kg,0);sel.forEach(s=>s.why=cg.motivo?[]:[]);
    props.push({tk,cam,sel,kg,cap:capTotal(carga)||1,carga,motivo:cg.motivo||"",ia:true});
  });
  return{props,avisos};
}

/* refaz a distribuição nas caixas do caminhão de destino, mantendo a ordem de entrega e um pedido por caixa */
function redistribuir(c,camIdDest){
  const cam=S.caminhoes[camIdDest];const n=(cam.caixas||[]).length;const ordem=clientesDaCarga(c);
  const grupos=[];ordem.forEach(cid=>{const por={};arr(c.caixas).forEach(b=>{if(b&&b.clienteId===cid){const k=b.pedidoId||("sem:"+b.produto);(por[k]=por[k]||{b,kg:0}).kg+=(+b.kg||0)}});Object.entries(por).forEach(([pid,g])=>grupos.push({pid:pid.startsWith("sem:")?null:pid,b:g.b,kg:g.kg}))});
  const cx={};let i=0;const sobra=[];const al=alocacoes();
  grupos.forEach(g=>{const orig=g.kg;const p=g.pid&&S.pedidos[g.pid];const extra=p?Math.max(0,(+p.kg||0)-((al[g.pid]||{}).aloc||0)):0;let r=orig+extra;const r0=r;while(r>1&&i<n){const cap=capCaixa(cam,i,g.b.produto);const kg=Math.min(cap,r);cx[i]=Object.assign({},g.b,{cx:i+1,cap:cam.caixas[i],kg,carregada:false});if(!g.pid)delete cx[i].pedidoId;r-=kg;i++}const colocado=r0-r;if(orig-colocado>1)sobra.push({cliente:g.b.cliente,produto:g.b.produto,kg:orig-colocado})});
  for(;i<n;i++)cx[i]={cx:i+1,cap:cam.caixas[i]};
  return{caixas:cx,sobra,ordem};
}

/* ================= CONTRATOS ================= */
function saldoContrato(id,ignorarPedido){
  const c=S.contratos[id]||{};const al=alocacoes();let entregue=+c.retiradoAnteriorKg||0,pend=0;
  Object.entries(S.pedidos).forEach(([pid,p])=>{if(p.contratoId!==id||p.cancelado||pid===ignorarPedido)return;const a=al[pid]||{entregue:0};entregue+=Math.min(a.entregue,+p.kg||0);pend+=Math.max(0,(+p.kg||0)-a.entregue)});
  const total=+c.totalKg||0;return{total,entregue,pendente:pend,aRetirar:Math.max(0,total-entregue),livre:Math.max(0,total-entregue-pend)};
}

  let l=Object.entries(S.contratos).filter(([,c])=>CF==="todos"||(CF==="ativos"?c.ativo!==false:c.ativo===false));

  l=l.map(([id,c])=>({id,c,s:saldoContrato(id)})).sort((a,b)=>b.s.aRetirar-a.s.aRetirar);
  const tot=l.reduce((a,x)=>({r:a.r+x.s.aRetirar,p:a.p+x.s.pendente,l:a.l+x.s.livre}),{r:0,p:0,l:0});
  let html='<div class="bar"><h2>Contratos</h2><button class="btn btn-g" onclick="abrirContrato()">+ Novo contrato</button></div><div class="bar"><div class="chips">'+[["ativos","Ativos"],["encerrados","Encerrados"],["todos","Todos"]].map(([k,lb])=>'<button class="chip'+(CF===k?" on":"")+'" onclick="CF=\''+k+'\';renderContratos()">'+lb+'</button>').join("")+'</div><input class="inp" style="max-width:260px" placeholder="Buscar" value="'+esc(CQ)+'" oninput="CQ=this.value;clearTimeout(this._t);this._t=setTimeout(renderContratos,250)"></div>';
  if(l.length)html+='<div class="stat"><div>Saldo a retirar<b>'+t(tot.r)+'</b></div><div>Pendente de entrega (já programado)<b>'+t(tot.p)+'</b></div><div>Sem programação<b>'+t(tot.l)+'</b></div></div>';
  html+=l.length?l.map(({id,c,s})=>{const pe=s.total?s.entregue/s.total*100:0,pp=s.total?s.pendente/s.total*100:0;return'<div class="card" style="cursor:pointer" onclick="abrirContrato(\''+id+'\')"><div class="row" style="padding:0;border:none"><div class="main"><b>'+esc(c.cliente)+'</b><span>Contrato '+esc(c.numero||"s/nº")+' · '+esc(c.produto)+' · '+esc(c.cidade||"")+' · '+esc(c.vendedor||"")+'</span></div><div class="r t-big">'+t(s.total)+'</div></div><div class="prog"><i style="width:'+pe+'%;background:var(--G)"></i><i style="width:'+pp+'%;background:#fbbf24"></i></div><div class="kv"><div>Entregue<b>'+t(s.entregue)+'</b></div><div>Pendente de entrega<b>'+t(s.pendente)+'</b></div><div>Saldo a retirar<b>'+t(s.aRetirar)+'</b></div><div>Sem programação<b>'+t(s.livre)+'</b></div></div></div>'}).join(""):'<div class="empty"><b>Nenhum contrato</b>Cadastre os contratos para acompanhar o saldo de retirada.</div>';
  el.innerHTML=html;
}
function abrirContrato(id){

function camDaCarga(c){return S.caminhoes[camKey(c)]||null}
function capCargaH(c){const cam=camDaCarga(c);if(!cam)return 0;return arr(c.caixas).reduce((s,b,i)=>s+capCaixa(cam,i,b&&b.produto),0)}

function catProd(p){p=norm(p);if(/MILHO/.test(p))return"Milho";if(/PNDR|FARELO|SOJA/.test(p))return"Farelos / PNDR";if(/PRE.?PARTO|BEZERR|CORTE|AVES|SUIN|POEDEIR/.test(p))return"Outras rações";if(/FAREL/.test(p))return"Ração farelada";if(/PELET|ORION|LEITE/.test(p))return"Ração peletizada";return"Outros"}
function prodNome(p){return norm(p).replace(/^\d+\s*-\s*/,"").slice(0,32)}
function addTo(o,k,v){o[k]=(o[k]||0)+v}
function cargasIndicadores(){const C=Object.assign({},IND.dados||{});Object.entries(S.cargas).forEach(([k,c])=>{if(c.data>=IND.ini&&c.data<=IND.fim)C[k]=c});return C}

function statsMes(C,m,ateDia){
  const ini=mesIni(m);let fim=mesFim(m);if(ateDia){const f=m+"-"+String(ateDia).padStart(2,"0");if(f<fim)fim=f}const L=Object.entries(C).filter(([,c])=>c.data>=ini&&c.data<=fim);
  const r={kgKm:0,nKm:0,nKmReal:0,custo:0,desp:0,n:L.length,kg:0,kgEnt:0,ocS:0,ocN:0,baixa:0,km:0,fr:0,paradas:0,atrasoReg:0,cli:new Set(),noPrazo:0,avaliadas:0,leadS:0,leadN:0,porDia:{},porDiaEnt:{},porCam:{},camOc:{},porCli:{},porCid:{},porVend:{},porProd:{},porCat:{}};
  L.forEach(([id,c])=>{const k=kgTotal(c);r.kg+=k;const ent=c.entregas||{};
    const cap=capCargaH(c);if(cap&&k){const o=Math.min(1,k/cap);r.ocS+=o;r.ocN++;if(o<0.8)r.baixa++;const lb=camLabel(c);(r.camOc[lb]=r.camOc[lb]||[]).push(o)}
    const cc=custoCarga(id,c);if(cc.km){r.km+=cc.km;r.kgKm+=k;r.nKm++;if(cc.kmReal)r.nKmReal++}r.custo+=cc.total;r.desp+=cc.desp;r.fr+=freteCarga(c);if(Object.keys(c.atrasos||{}).length)r.atrasoReg++;
    const ids=clientesDaCarga(c);r.paradas+=ids.length;
    ids.forEach(cid=>{const e=ent[cid];if(!e||e.status!=="entregue"||!e.ts)return;const pz=arr(c.caixas).filter(b=>b&&b.clienteId===cid&&b.pedidoId).map(b=>pedidoPorId(b.pedidoId)).filter(Boolean);if(!pz.length)return;const prazo=pz.map(p=>p.dataEntrega).sort().pop();r.avaliadas++;if(iso(new Date(e.ts))<=prazo)r.noPrazo++;pz.forEach(p=>{if(p.criadoEm){r.leadS+=(e.ts-p.criadoEm)/864e5;r.leadN++}})});
    arr(c.caixas).forEach(b=>{if(!b||!b.clienteId)return;const q=+b.kg||0;const isEnt=ent[b.clienteId]&&ent[b.clienteId].status==="entregue";if(isEnt){r.kgEnt+=q;addTo(r.porDiaEnt,c.data,q)}
      r.cli.add(b.clienteId);addTo(r.porDia,c.data,q);addTo(r.porCam,camLabel(c),q);addTo(r.porCli,b.clienteId,q);addTo(r.porCid,b.cidade||"—",q);addTo(r.porVend,b.vendedor||"Sem vendedor",q);addTo(r.porProd,prodNome(b.produto),q);addTo(r.porCat,catProd(b.produto),q)})});
  r.oc=r.ocN?r.ocS/r.ocN:null;r.pont=r.avaliadas?r.noPrazo/r.avaliadas:null;r.lead=r.leadN?r.leadS/r.leadN:null;r.media=r.n?r.kg/r.n:0;
  return r;
}
function delta(a,b,inverso,pp){if(a==null||b==null||!b&&!pp)return"";const d=pp?(a-b)*100:(a-b)/b*100;if(!isFinite(d)||Math.abs(d)<0.5)return'<small class="dl">= mês anterior</small>';const bom=inverso?d<0:d>0;return'<small class="dl '+(bom?"up":"down")+'">'+(d>0?"▲ ":"▼ ")+Math.abs(d).toFixed(0)+(pp?" p.p.":"%")+' vs '+IND.cmp+'</small>'}

  html+='<div class="charts"><div class="chc"><div class="chh"><b>Custo por caminhão</b><span class="small muted">'+nomeMes(FM.mes)+'</span></div><div class="cv"><canvas id="fc-custo"></canvas></div></div><div class="chc"><div class="chh"><b>km/L — últimos 6 meses</b></div><div class="cv"><canvas id="fc-kml"></canvas></div></div></div>';

  el.innerHTML=html;
}

function aplicarPlanoPadrao(){const k=FM.cam;const km=kmAtualCam(k);const up={};PLANO_PADRAO.forEach(([n,ck,cd])=>{up[db.ref().push().key]={nome:n,cadaKm:ck,cadaDias:cd}});db.ref("frota_planos/"+k).set(up).then(()=>toast("Plano criado. Registre a última vez que cada item foi feito."))}
function editarPlano(){const k=FM.cam;const pl=(S.pl||{})[k]||{};const linhas=Object.entries(pl).map(([id,it])=>[id,it]).concat([["novo",{}]]);
  abrirSheet('<div class="sh-h"><h3>Plano de '+esc(nomeCam(k))+'</h3><button class="x" onclick="fecharSheet()">×</button></div><div class="small muted">Deixe o nome vazio para remover um item. "Último" é quando foi feito pela última vez.</div><div class="tbl"><table><thead><tr><th>Item</th><th>A cada km</th><th>A cada dias</th><th>Último km</th><th>Última data</th></tr></thead><tbody>'+linhas.map(([id,it])=>'<tr data-id="'+id+'"><td><input class="inp" value="'+esc(it.nome||"")+'" placeholder="Novo item"></td><td><input class="inp num" type="number" value="'+(it.cadaKm||"")+'"></td><td><input class="inp num" type="number" value="'+(it.cadaDias||"")+'"></td><td><input class="inp num" type="number" value="'+(it.ultimoKm||"")+'"></td><td><input class="inp" type="date" value="'+(it.ultimaData||"")+'"></td></tr>').join("")+'</tbody></table></div><div class="sh-f"><button class="btn btn-g" onclick="salvarPlano()">Salvar plano</button></div>')}
function salvarPlano(){const k=FM.cam;const o={};document.querySelectorAll("#sh tr[data-id]").forEach(tr=>{const v=[...tr.querySelectorAll("input")].map(i=>i.value.trim());if(!v[0])return;const id=tr.dataset.id==="novo"?db.ref().push().key:tr.dataset.id;o[id]={nome:v[0],cadaKm:+v[1]||null,cadaDias:+v[2]||null,ultimoKm:+v[3]||null,ultimaData:v[4]||null}});db.ref("frota_planos/"+k).set(o).then(()=>{fecharSheet();toast("Plano salvo")})}

function salvarServico(svId){const d={caminhaoId:document.getElementById("sv-c").value,data:document.getElementById("sv-d").value,km:parseInt(document.getElementById("sv-km").value,10)||null,tipo:document.getElementById("sv-t").value,valor:parseFloat(document.getElementById("sv-v").value)||0,oficina:document.getElementById("sv-o").value.trim(),descricao:document.getElementById("sv-ds").value.trim(),itens:{}};document.querySelectorAll(".sv-it").forEach(i=>{if(i.checked)d.itens[i.value]=true});if(!d.descricao&&!Object.keys(d.itens).length){toast("Descreva o serviço",true);return}

/* km por mês a partir das leituras semanais do odômetro: cada intervalo entre duas leituras é dividido igualmente pelos dias */
function kmCarroMes(lanc,mes){
  const L=Object.values(lanc||{});const tot=L.find(x=>x.tipo==="total"&&x.mes===mes);
  const porDia={};L.forEach(x=>{if(x.tipo!=="total"&&x.km&&x.data&&(!porDia[x.data]||(x.ts||0)>=(porDia[x.data].ts||0)))porDia[x.data]=x});
  const R=Object.values(porDia).sort((a,b)=>a.data.localeCompare(b.data));
  const ini=mes+"-01";const d=new Date(mes+"-15T12:00:00");d.setMonth(d.getMonth()+1);d.setDate(0);const fim=KMC.iso(d);const nd=+fim.slice(8);
  let km=0,cobIni=null,cobFim=null;
  for(let i=1;i<R.length;i++){const a=R[i-1],b=R[i];const dias=KMC.dif(b.data,a.data);if(dias<=0)continue;const por=(b.km-a.km)/dias;
    const s=a.data>=ini?a.data:KMC.add(ini,-1),e=b.data<=fim?b.data:fim;const ov=KMC.dif(e,s);if(ov>0){km+=por*ov;cobIni=cobIni&&cobIni<s?cobIni:s;cobFim=cobFim&&cobFim>e?cobFim:e}}
  const ult=R[R.length-1];
  if(tot)return{km:+tot.km,proj:null,fechado:true,total:true,ult,leituras:R};
  const cob=cobIni?KMC.dif(cobFim,cobIni):0;const hoje=KMC.hoje();const atual=hoje>=ini&&hoje<=fim;
  const proj=cob>=7&&(atual||cobFim<fim)?km/cob*nd:null;
  return{km,proj,cob,fechado:!atual&&cobFim===fim,ult,leituras:R};
}
const KMC={iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")},hoje(){return KMC.iso(new Date())},add(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return KMC.iso(d)},dif(a,b){return Math.round((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/864e5)},segunda(){const d=new Date();const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return KMC.iso(d)}};

function planoCarro(serv,kmAtual,plano){

    if(!ult)return{tipo,it,k:"sem",txt:"sem registro"};const prox=(+ult.km)+(+it.cadaKm);const rest=prox-kmAtual;

/* pneus: cada troca fecha o jogo anterior daquela posição e dá o rendimento em km */
function pneusCarro(serv,kmAtual){
  const T=Object.values(serv||{}).filter(x=>x.tipo==="pneus"&&x.km).sort((a,b)=>a.km-b.km);const pos={dianteiros:null,traseiros:null};const jogos=[];
  T.forEach(t=>{(t.posicao==="todos"?["dianteiros","traseiros"]:[t.posicao]).forEach(p=>{if(!(p in pos))return;if(pos[p])jogos.push({pos:p,km:t.km-pos[p].km,ini:pos[p],fim:t});pos[p]=t})});
  const atual=Object.entries(pos).filter(([,v])=>v).map(([p,v])=>({pos:p,desde:v,rodou:Math.max(0,kmAtual-v.km)}));
  const media=jogos.length?jogos.reduce((s,j)=>s+j.km,0)/jogos.length:null;
  const custo=T.reduce((s,x)=>s+(+x.valor||0),0);
  return{atual,jogos,media,custo,trocas:T};
}

function abrirBusca(){let o=document.getElementById("busca");if(!o){o=document.createElement("div");o.id="busca";o.innerHTML='<div class="bx" role="dialog" aria-label="Buscar"><input id="bx-q" placeholder="Cliente, pedido, nº da carga, caminhão ou tela…" autocomplete="off"><div id="bx-r" class="bx-r"></div><div class="bx-f"><span>↑↓ navegar</span><span>Enter abrir</span><span>Esc fechar</span></div></div>';o.onclick=e=>{if(e.target===o)fecharBusca()};document.body.appendChild(o);
  const q=document.getElementById("bx-q");q.oninput=()=>{BQ.sel=0;buscar(q.value)};q.onkeydown=e=>{if(e.key==="ArrowDown"){BQ.sel=Math.min(BQ.res.length-1,BQ.sel+1);pintaBusca();e.preventDefault()}else if(e.key==="ArrowUp"){BQ.sel=Math.max(0,BQ.sel-1);pintaBusca();e.preventDefault()}else if(e.key==="Enter"){const r=BQ.res[BQ.sel];if(r){fecharBusca();r.go()}}else if(e.key==="Escape")fecharBusca()}}
  o.classList.add("on");const q=document.getElementById("bx-q");q.value="";buscar("");setTimeout(()=>q.focus(),20)}
function fecharBusca(){const o=document.getElementById("busca");if(o)o.classList.remove("on")}
function buscar(txt){
  const q=norm(txt);const r=[];
  NAV_CMD.forEach(([v,l])=>{if((!q||norm(l).includes(q))&&(v!=="carros"||ROLE==="admin")&&(v!=="despviagem"||ROLE==="admin"||ROLE==="financeiro")&&(v!=="comissoes"||ROLE==="admin"||ROLE==="financeiro"))r.push({g:"Ir para",t:l,s:"",go:()=>tab(v)})});
  if(!q||norm("nova carga").includes(q))r.push({g:"Ações",t:"Nova carga",s:"monta uma carga para hoje",go:()=>{DIA=hoje();tab("cargas");novaCarga()}});
  if(!q||norm("novo pedido").includes(q))r.push({g:"Ações",t:"Novo pedido",s:"",go:()=>abrirPedido()});
  if(q.length>=2){
    Object.entries(S.clientes).filter(([k,c])=>norm(c.nome).includes(q)||Object.keys(c.codigos||{}).some(x=>x.startsWith(q))).map(([k,c])=>{const n=norm(c.nome);const ped=Object.values(S.pedidos).some(p=>p.clienteId===k&&!p.cancelado&&p.dataEntrega>=addDias(hoje(),-7));return[k,c,(n.startsWith(q)?100:0)+(ped?50:0)+Math.min(40,c.nCargas||0)+(c.ultimaCarga>=addDias(hoje(),-60)?20:0)]}).sort((a,b)=>b[2]-a[2]).slice(0,6).forEach(([k,c])=>r.push({g:"Clientes",t:c.nome,s:(c.cidade||"")+(c.vendedor?" · "+c.vendedor:""),go:()=>{tab("clientes");abrirCliente(k)}}));
    Object.entries(S.pedidos).filter(([,p])=>!p.cancelado&&norm(p.cliente+" "+p.produto).includes(q)).sort((a,b)=>(b[1].dataEntrega||"").localeCompare(a[1].dataEntrega||"")).slice(0,5).forEach(([id,p])=>r.push({g:"Pedidos",t:p.cliente+" · "+t(p.kg),s:(p.produto||"")+" · entrega "+fData(p.dataEntrega),go:()=>abrirPedido(id)}));
    Object.entries(S.cargas).filter(([,c])=>norm((c.numero||"")+" "+camLabel(c)+" "+clientesDaCarga(c).map(i=>(S.clientes[i]||{}).nome||"").join(" ")).includes(q)).sort((a,b)=>(b[1].data||"").localeCompare(a[1].data||"")).slice(0,5).forEach(([id,c])=>r.push({g:"Cargas",t:(c.numero?"Carga "+c.numero+" · ":"")+camLabel(c)+" · "+fData(c.data),s:clientesDaCarga(c).map(i=>(S.clientes[i]||{}).nome||"").join(", "),go:()=>abrirEditor(id)}));
  }
  BQ.res=r.slice(0,18);pintaBusca();
}
function pintaBusca(){let g="";document.getElementById("bx-r").innerHTML=BQ.res.map((x,i)=>{const hd=x.g!==g?'<div class="bx-g">'+x.g+'</div>':"";g=x.g;return hd+'<button class="bx-i'+(i===BQ.sel?" on":"")+'" onmouseenter="BQ.sel='+i+';pintaBusca()" onclick="fecharBusca();BQ.res['+i+'].go()"><b>'+esc(x.t)+'</b>'+(x.s?'<span>'+esc(x.s)+'</span>':"")+'</button>'}).join("")||'<div class="vazio">Nada encontrado para essa busca.</div>';const on=document.querySelector(".bx-i.on");if(on)on.scrollIntoView({block:"nearest"})}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();abrirBusca()}});

/* ===== Volume de ração por vendedor (mesma regra no app de cargas e no app do vendedor) ===== */
const VOL_ALIAS={"DALMOLIN":"MAICON","ALE":"ALEXANDRE","VICTOR":"VITOR","LUCAS":"ROBSON"};
function volNormV(v){v=String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();return VOL_ALIAS[v]||v}
function volCat(p){p=String(p||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();if(/MILHO/.test(p))return"Milho";if(/PNDR|FARELO|SOJA/.test(p))return"Farelos/PNDR";if(/FAREL/.test(p))return"Farelada";if(/PELET|ORION|LEITE/.test(p))return"Peletizada";return"Outros"}
function volIso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function volMesFim(m){const d=new Date(m+"-15T12:00:00");d.setMonth(d.getMonth()+1);d.setDate(0);return volIso(d)}
function volAddMes(m,n){const d=new Date(m+"-15T12:00:00");d.setMonth(d.getMonth()+n);return volIso(d).slice(0,7)}
function volDif(a,b){return Math.round((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/864e5)}
/* conta como carregado: carga importada da planilha, ou que já carregou/saiu/entregou, ou de dia passado que não ficou em montagem */
function volConta(c,hj){return!!c.importado||["carregada","a_caminho","entregue"].includes(c.status)||(c.data<hj&&c.status!=="montagem")}
function volArr(o){if(!o)return[];return Array.isArray(o)?o.filter(x=>x!=null):Object.keys(o).sort((a,b)=>a-b).map(k=>o[k])}
function volumesMes(cargas,mes,hj){
  const ini=mes+"-01",fim=volMesFim(mes);const porV={};let tot=0,prog=0;
  Object.values(cargas).forEach(c=>{if(!c||c.data<ini||c.data>fim)return;const conta=volConta(c,hj);
    volArr(c.caixas).forEach(b=>{if(!b||!b.clienteId)return;const kg=+b.kg||0;const v=volNormV(b.vendedor)||"SEM VENDEDOR";const x=porV[v]||(porV[v]={kg:0,prog:0,cli:{},cat:{},ent:{}});
      if(!conta){x.prog+=kg;prog+=kg;return}x.kg+=kg;tot+=kg;const cl=x.cli[b.clienteId]||(x.cli[b.clienteId]={kg:0,nome:b.cliente||b.clienteId,cidade:b.cidade||""});cl.kg+=kg;const k=volCat(b.produto);x.cat[k]=(x.cat[k]||0)+kg;x.ent[c.data+"|"+b.clienteId]=1})});
  Object.values(porV).forEach(x=>{x.nCli=Object.keys(x.cli).length;x.nEnt=Object.keys(x.ent).length});
  return{porV,tot,prog};
}
/* histórico por cliente (para clientes novos e parados) */
function volHistorico(cargas,hj){
  const H={};Object.values(cargas).forEach(c=>{if(!c||!volConta(c,hj))return;volArr(c.caixas).forEach(b=>{if(!b||!b.clienteId)return;const h=H[b.clienteId]||(H[b.clienteId]={dias:{},nome:b.cliente||b.clienteId,cidade:b.cidade||"",vend:"",ultV:""});h.dias[c.data]=(h.dias[c.data]||0)+(+b.kg||0);if(c.data>=h.ultV){h.ultV=c.data;h.vend=volNormV(b.vendedor)||h.vend;if(b.cidade)h.cidade=b.cidade}})});
  const med=a=>{const s=a.slice().sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0};
  Object.values(H).forEach(h=>{const ds=Object.keys(h.dias).sort();h.prim=ds[0];h.ult=ds[ds.length-1];h.n=ds.length;const iv=[];for(let i=1;i<ds.length;i++){const d=volDif(ds[i],ds[i-1]);if(d>0)iv.push(d)}h.freq=iv.length?Math.round(med(iv)):null;h.kgTip=med(Object.values(h.dias))});
  return H;
}
/* parou de comprar: comprou 2+ vezes, a última carga foi nos últimos 6 meses e já passou de 1,5× o ciclo dele (mínimo 45 dias) */
function volParados(H,hj,v,comPedido){
  return Object.entries(H).filter(([id,h])=>(!v||h.vend===v)&&h.n>=2&&volDif(hj,h.ult)<=180&&!(comPedido&&comPedido.has(id))).map(([id,h])=>{const lim=Math.max(45,Math.round((h.freq||30)*1.5));return Object.assign({},h,{id,diasSem:volDif(hj,h.ult),lim})}).filter(x=>x.diasSem>x.lim).sort((a,b)=>b.kgTip-a.kgTip);
}
function vNome(v){return String(v||"").toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase())}
function volNovos(H,mes,v){const ini=mes+"-01",fim=volMesFim(mes);return Object.entries(H).filter(([,h])=>(!v||h.vend===v)&&h.prim>=ini&&h.prim<=fim).map(([id,h])=>Object.assign({id},h))}
/* ================= VENDAS POR VENDEDOR (fechamento do mês) ================= */
const VEN={mes:hoje().slice(0,7),dados:null,ini:null,fim:null,carregando:false};let VCH=[];
async function carregarVendas(forcar){
  const ini=volAddMes(VEN.mes,-12)+"-01",fim=volMesFim(VEN.mes);
  if(!forcar&&VEN.dados&&VEN.ini===ini&&VEN.fim===fim){renderVendas();return}
  VEN.carregando=true;renderVendas();
  try{const s=await db.ref("cargas").orderByChild("data").startAt(ini).endAt(fim).once("value");VEN.dados=s.val()||{};VEN.ini=ini;VEN.fim=fim}catch(e){toast("Não consegui carregar: "+e.message,true)}
  VEN.carregando=false;renderVendas();
}
function cargasVendas(){const C=Object.assign({},VEN.dados||{});Object.entries(S.cargas).forEach(([k,c])=>{if(c.data>=VEN.ini&&c.data<=VEN.fim)C[k]=c});return C}
function pedidosAbertosClientes(){const al=alocacoes();const s=new Set();Object.entries(S.pedidos).forEach(([id,p])=>{if(!p.cancelado&&p.dataEntrega>=addDias(hoje(),-3)&&(+p.kg||0)-((al[id]||{}).entregue||0)>50)s.add(p.clienteId)});return s}
function pctDelta(a,b){if(!b)return a?'<span class="dl up">novo</span>':"—";const d=(a-b)/b*100;if(Math.abs(d)<1)return'<span class="dl">=</span>';return'<span class="dl '+(d>0?"up":"down")+'">'+(d>0?"▲":"▼")+Math.abs(d).toFixed(0)+'%</span>'}
function renderVendas(){
  const el=document.getElementById("v-vendas");if(!el)return;VCH.forEach(c=>{try{c.destroy()}catch(e){}});VCH=[];const m=VEN.mes;const hj=hoje();
  let html='<div class="bar"><h2>Vendas por vendedor — '+nomeMes(m)+'</h2><button class="btn btn-o btn-sm" onclick="VEN.mes=volAddMes(VEN.mes,-1);carregarVendas()" aria-label="Mês anterior">←</button><input class="inp" type="month" value="'+m+'" style="width:auto" onchange="if(this.value){VEN.mes=this.value;carregarVendas()}"><button class="btn btn-o btn-sm" onclick="VEN.mes=volAddMes(VEN.mes,1);carregarVendas()" aria-label="Próximo mês">→</button><button class="btn btn-o btn-sm" onclick="carregarVendas(true)">Atualizar</button><button class="btn btn-g btn-sm" onclick="pdfFechamentoVendas()">Fechamento do mês (PDF)</button></div>';
  if(!VEN.dados){el.innerHTML=html+'<div class="empty"><b>Carregando…</b></div>';return}
  const C=cargasVendas();const A=volumesMes(C,m,hj),P=volumesMes(C,volAddMes(m,-1),hj),Y=volumesMes(C,volAddMes(m,-12),hj);const H=volHistorico(C,hj);const cp=pedidosAbertosClientes();
  const vends=Object.keys(Object.assign({},A.porV,P.porV)).filter(v=>v!=="SEM VENDEDOR"&&((A.porV[v]||{}).kg||(A.porV[v]||{}).prog||(P.porV[v]||{}).kg)).sort((a,b)=>((A.porV[b]||{}).kg||0)-((A.porV[a]||{}).kg||0));
  const par=volParados(H,hj,null,cp);const nov=volNovos(H,m,null);const atual=m===hj.slice(0,7);
  const kp=(lb,v,sub,cls)=>'<div class="kpi'+(cls?" "+cls:"")+'"><span>'+lb+'</span><b class="num">'+v+'</b><small>'+sub+'</small></div>';
  const lider=vends[0];
  html+='<div class="kpis">'+kp("Carregado no mês",t(A.tot,0),"vs "+nomeMes(volAddMes(m,-1),true)+": "+pctDelta(A.tot,P.tot).replace(/<[^>]+>/g,""))+kp("Programado até o fim do mês",atual&&A.prog?t(A.prog,0):"—",atual?"cargas montadas que ainda não saíram":"mês encerrado")+kp("Mesmo mês do ano passado",Y.tot?t(Y.tot,0):"—",Y.tot?pctDelta(A.tot,Y.tot).replace(/<[^>]+>/g,""):"sem histórico")+kp("Maior volume",lider?vNome(lider):"—",lider?t(A.porV[lider].kg,0)+" · "+Math.round(A.porV[lider].kg/(A.tot||1)*100)+"% do total":"")+kp("Clientes novos no mês",nov.length,nov.length?"primeira carga em 12 meses":"nenhum")+kp("Pararam de comprar",par.length,par.length?"~"+t(par.reduce((s,x)=>s+x.kgTip,0),0)+" por ciclo em risco":"ninguém",par.length?"warnk":"")+'</div>';
  html+='<div class="card tbl"><table><thead><tr><th>Vendedor</th><th class="r">Carregado</th><th class="r">%</th><th>vs mês ant.</th><th>vs ano ant.</th>'+(atual?'<th class="r">Programado</th>':"")+'<th class="r">Clientes</th><th class="r">t/cliente</th><th style="min-width:140px">Mix</th><th class="r">Novos</th><th class="r">Parados</th></tr></thead><tbody>'+vends.map(v=>{const x=A.porV[v]||{kg:0,prog:0,nCli:0,cat:{}};const p=(P.porV[v]||{}).kg||0,y=(Y.porV[v]||{}).kg||0;const nv=nov.filter(n=>n.vend===v).length,pr=par.filter(n=>n.vend===v).length;const cats=Object.entries(x.cat).sort((a,b)=>b[1]-a[1]);const cor={"Farelada":"#15803d","Peletizada":"#65a30d","Milho":"#d97706","Farelos/PNDR":"#0e7490","Outros":"#94a3b8"};
    return'<tr style="cursor:pointer" onclick="detalheVendedor(\''+v+'\')"><td><b>'+esc(vNome(v))+'</b></td><td class="r num"><b>'+t(x.kg,1)+'</b></td><td class="r num">'+Math.round(x.kg/(A.tot||1)*100)+'%</td><td>'+pctDelta(x.kg,p)+'</td><td>'+pctDelta(x.kg,y)+'</td>'+(atual?'<td class="r num muted">'+(x.prog?t(x.prog,1):"—")+'</td>':"")+'<td class="r num">'+(x.nCli||0)+'</td><td class="r num">'+(x.nCli?t(x.kg/x.nCli,1):"—")+'</td><td><div class="mixb" title="'+esc(cats.map(([k,n])=>k+" "+Math.round(n/(x.kg||1)*100)+"%").join(" · "))+'">'+cats.map(([k,n])=>'<i style="width:'+(n/(x.kg||1)*100)+'%;background:'+cor[k]+'"></i>').join("")+'</div><span class="small muted">'+(cats[0]?cats[0][0]+" "+Math.round(cats[0][1]/(x.kg||1)*100)+"%":"")+'</span></td><td class="r num">'+(nv||"—")+'</td><td class="r num" style="'+(pr?"color:var(--red);font-weight:700":"")+'">'+(pr||"—")+'</td></tr>'}).join("")+'</tbody></table></div>'+(A.porV["SEM VENDEDOR"]&&A.porV["SEM VENDEDOR"].kg?'<div class="small muted" style="margin:-4px 0 12px">'+t(A.porV["SEM VENDEDOR"].kg,1)+' carregados sem vendedor informado no pedido.</div>':'<div class="small muted" style="margin:-4px 0 12px">Conta como carregado o que já saiu ou foi carregado na fábrica. Clique num vendedor para ver os clientes.</div>');
  html+='<div class="charts"><div class="chc wide"><div class="chh"><b>Toneladas por vendedor — 12 meses</b></div><div class="cv" style="height:280px"><canvas id="vc-12"></canvas></div></div></div>';
  el.innerHTML=html;
  if(!window.Chart)return;const ms=[];for(let i=11;i>=0;i--)ms.push(volAddMes(m,-i));const V12=ms.map(mm=>volumesMes(C,mm,hj));const top=vends.slice(0,8);const pal=["#15803d","#2563eb","#d97706","#7c3aed","#0e7490","#be123c","#65a30d","#475569"];
  VCH.push(new Chart(document.getElementById("vc-12"),{type:"bar",data:{labels:ms.map(mm=>nomeMes(mm,true)),datasets:top.map((v,i)=>({label:vNome(v),data:V12.map(x=>((x.porV[v]||{}).kg||0)),backgroundColor:pal[i],stack:"a"})).concat([{label:"Outros",data:V12.map(x=>Object.entries(x.porV).filter(([v])=>!top.includes(v)).reduce((s,[,y])=>s+y.kg,0)),backgroundColor:"#cbd5e1",stack:"a"}])},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10}},tooltip:{callbacks:{label:c=>c.dataset.label+": "+(c.raw/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" t"}}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,ticks:{callback:v=>(v/1000).toLocaleString("pt-BR")+" t"}}}}}));
}
function detalheVendedor(v){
  const C=cargasVendas();const hj=hoje();const m=VEN.mes;const x=volumesMes(C,m,hj).porV[v]||{kg:0,cli:{},cat:{}};const H=volHistorico(C,hj);const par=volParados(H,hj,v,pedidosAbertosClientes());const nov=volNovos(H,m,v);
  const ms=[];for(let i=5;i>=0;i--)ms.push(volAddMes(m,-i));const ev=ms.map(mm=>(volumesMes(C,mm,hj).porV[v]||{}).kg||0);const mx=Math.max(...ev,1);

function pdfFechamentoVendas(){
  const C=cargasVendas();const hj=hoje();const m=VEN.mes;const A=volumesMes(C,m,hj),P=volumesMes(C,volAddMes(m,-1),hj);const H=volHistorico(C,hj);const cp=pedidosAbertosClientes();
  const vends=Object.keys(A.porV).filter(v=>v!=="SEM VENDEDOR"&&A.porV[v].kg).sort((a,b)=>A.porV[b].kg-A.porV[a].kg);const w=window.open("","_blank");if(!w){toast("Libere pop-ups para gerar o PDF",true);return}

/* ===== Despesas de viagem: regra de reembolso (idêntica no app dos vendedores e no app de cargas) ===== */
const DV_TIPOS={alimentacao:{l:"Alimentação",ic:"🍽️"},hospedagem:{l:"Hospedagem",ic:"🛏️"},combustivel:{l:"Combustível",ic:"⛽"},outro:{l:"Pedágio / outros",ic:"🧾"}};
const DV_PADRAO={alimentacaoDia:35,hospedagemDia:145};
const DV_ST={lancada:{l:"Aguardando",c:"#b45309",bg:"#fffbeb"},aprovada:{l:"Aprovada",c:"#15803d",bg:"#f0fdf4"},glosada:{l:"Não aprovada",c:"#dc2626",bg:"#fef2f2"}};
function dvEsc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dvBrl(v){return"R$ "+(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function dvLista(map){return Object.entries(map||{}).map(([id,v])=>Object.assign({id},v)).filter(x=>x&&x.data)}
function dvDoMes(itens,mes){return itens.filter(x=>(x.data||"").slice(0,7)===mes).sort((a,b)=>a.data===b.data?(a.ts||0)-(b.ts||0):a.data.localeCompare(b.data))}
/* aplica os limites diários: alimentação e hospedagem por dia; combustível e pedágio pelo valor da nota.
   Se o financeiro ajustou o valor aprovado, vale o valor dele; nota não aprovada vale zero. */
function dvCalcular(itens,cfg){
  cfg=Object.assign({},DV_PADRAO,cfg||{});const usado={};const res={};
  itens.slice().sort((a,b)=>a.data===b.data?(a.ts||0)-(b.ts||0):a.data.localeCompare(b.data)).forEach(it=>{
    const v=+it.valor||0;let r=v,obs="";
    if(it.status==="glosada"){r=0;obs=it.motivoGlosa?"Não aprovada: "+it.motivoGlosa:"Não aprovada"}
    else if(it.valorAprovado!=null&&it.valorAprovado!==""){r=Math.max(0,+it.valorAprovado);if(r<v)obs="Valor ajustado pelo financeiro"}
    else if(it.tipo==="alimentacao"||it.tipo==="hospedagem"){const k=it.data+"|"+it.tipo;const lim=it.tipo==="alimentacao"?+cfg.alimentacaoDia:+cfg.hospedagemDia;const u=usado[k]||0;r=Math.max(0,Math.min(v,lim-u));usado[k]=u+r;if(r<v)obs="Acima do limite de "+dvBrl(lim)+(it.tipo==="alimentacao"?" por dia":" por diária")}
    res[it.id]={reemb:Math.round(r*100)/100,excesso:Math.round((v-r)*100)/100,obs};
  });
  return res;
}
function dvResumo(itens,cfg){
  const c=dvCalcular(itens,cfg);const s={n:itens.length,lancado:0,reemb:0,excesso:0,glosado:0,pend:0,aprov:0,semFoto:0,porTipo:{}};
  itens.forEach(it=>{const v=+it.valor||0,r=c[it.id].reemb;s.lancado+=v;s.reemb+=r;if(it.status==="glosada")s.glosado+=v;else s.excesso+=c[it.id].excesso;if(it.status==="aprovada")s.aprov++;else if(it.status!=="glosada")s.pend++;if(!it.temFoto)s.semFoto++;const t=s.porTipo[it.tipo]||(s.porTipo[it.tipo]={n:0,lancado:0,reemb:0});t.n++;t.lancado+=v;t.reemb+=r});
  return s;
}
function dvNomeMes(m){const d=new Date(m+"-15T12:00:00");const s=d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});return s.charAt(0).toUpperCase()+s.slice(1)}
function dvAddMes(m,n){const d=new Date(m+"-15T12:00:00");d.setMonth(d.getMonth()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function dvFData(s){return s?s.slice(8,10)+"/"+s.slice(5,7):""}
/* relatório em PDF (janela de impressão): resumo, notas e as fotos das notas */

   '<div class="s">Limites: alimentação '+dvBrl((cfg||DV_PADRAO).alimentacaoDia||DV_PADRAO.alimentacaoDia)+' por dia · hospedagem '+dvBrl((cfg||DV_PADRAO).hospedagemDia||DV_PADRAO.hospedagemDia)+' por diária · combustível e pedágio pelo valor da nota.</div>'+
   '<div class="ass"><div>'+dvEsc(nome)+'</div><div>Financeiro</div></div>'+(fts?'<h2 class="pb">Fotos das notas</h2><div class="fot">'+fts+'</div>':"")+'<script>setTimeout(function(){print()},600)<\/script></body></html>');w.document.close();

/* ===== Leitura do PDF de pedido do CRM da fábrica (Coacan) — mesma regra no app de cargas e no dos vendedores ===== */
function crmNorm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim()}
function crmNum(s){s=String(s||"").trim();if(!s)return 0;return parseFloat(s.replace(/\./g,"").replace(",","."))||0}
function crmIso(d){const m=String(d||"").match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+"-"+m[2]+"-"+m[1]:""}
function crmTiraAcento(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").normalize("NFC")}
function crmParse(linhas){
  /* sem acento antes de procurar: algumas versões do leitor devolvem "ó" como "o" + acento separado */
  const L=linhas.map(l=>crmTiraAcento(l).replace(/\uFB01/g,"fi").replace(/ fi /g,"fi").replace(/\s+/g," ").trim()).filter(Boolean);const T=L.join("\n");const S=L.join(" ");const r={itens:[],vencimentos:[],avisos:[]};

  r.cpf=(cli.match(/CPF\/CNPJ:\s*([\d.\/-]+)/)||[])[1]||"";
  const mc=cli.match(/Cidade:\s*(.+?)\s*-\s*([A-Z]{2})\b/);if(mc){r.cidade=crmNorm(mc[1]);r.uf=mc[2]}
  r.tabela=g(/Tabela de preco:\s*\d+\s*-\s*([A-Z0-9.,]+)/i);
  r.emissao=crmIso(g(/Emissao em:\s*(\d{2}\/\d{2}\/\d{4})/));
  let prev=g(/Previsao\s*(?:de\s*)?Entrega:\s*(\d{2}\/\d{2}\/\d{4})/i);
  if(!prev)prev=g(/Previsao de\s+(?:\d{2}\/\d{2}\/\d{4}\s+)?(\d{2}\/\d{2}\/\d{4})/i);
  r.previsao=crmIso(prev);
  r.prazo=crmIso(g(/Prazo\s*(?:de\s*)?Pagamento:\s*(\d{2}\/\d{2}\/\d{4})/i));
  r.parcelamento=g(/Parcelamento:\s*(.+?)(?:\s+Previs|\s+E-mail|\s+DADOS|$)/i);
  /* itens: o bloco entre o cabeçalho da tabela e "Itens", lido como texto corrido — não depende de como as linhas foram quebradas */
  const bloco=(S.match(/Codigo\s*Descricao.*?Vl\.?\s*tot\.?\s*(.*?)\s+Itens:?\s*\d/i)||S.match(/DADOS DOS ITENS\s*(.*?)\s+Itens:?\s*\d/i)||[])[1]||"";
  const re=/(?:^|\s)(\d{3,7})\s+(.*?)\s*(\d{1,3}(?:\.\d{3})*,\d+)\s*(KG|TON|TN|T|SC|UN)\s+(\d[\d.]*,\d+)\s+(\d[\d.]*,\d+)\s+(\d{1,3}(?:\.\d{3})*,\d{2})(?=\s|$)/gi;
  let m,ult=0,prevIt=null;const aberto=s=>(s.match(/\(/g)||[]).length>(s.match(/\)/g)||[]).length;
  while((m=re.exec(bloco))){let gap=bloco.slice(ult,m.index).trim();
    if(prevIt&&aberto(prevIt.descricao)&&gap){const k=gap.indexOf(")");const suf=k>=0?gap.slice(0,k+1):gap;prevIt.descricao=(prevIt.descricao+" "+suf).trim();gap=k>=0?gap.slice(k+1).trim():""}
    const un=m[4].toUpperCase();const q=crmNum(m[3]);const kg=un==="KG"?q:(un==="TON"||un==="TN"||un==="T")?q*1000:q;
    const d=((m[2]||"").trim()||gap).trim();const it={codigo:m[1],descricao:d,kg:Math.round(kg),un,vlUn:crmNum(m[5]),desc:crmNum(m[6]),total:crmNum(m[7])};r.itens.push(it);prevIt=it;ult=re.lastIndex}
  if(prevIt&&aberto(prevIt.descricao)){const resto=bloco.slice(ult).trim();const k=resto.indexOf(")");if(k>=0)prevIt.descricao=(prevIt.descricao+" "+resto.slice(0,k+1)).trim()}

  const mm=S.match(/Mensagem\s+(?:de\s+)?transbordo:?\s*(.*?)\s*Declaro/i);if(mm&&mm[1].trim())r.mensagem=mm[1].trim();
  if(!r.controle)r.avisos.push("Número do pedido (controle) não encontrado");
  if(!r.cliente)r.avisos.push("Cliente não encontrado no PDF");
  if(!r.itens.length)r.avisos.push("Nenhum item de ração encontrado");

  const nIt=parseInt((S.match(/Itens:?\s*(\d+)/i)||[])[1]||"0",10);if(nIt&&nIt!==r.itens.length)r.avisos.push("O pedido diz "+nIt+" ite"+(nIt>1?"ns":"m")+", mas foram lidos "+r.itens.length+".");
  r.contratoSugerido=/CONTRATO/i.test((r.mensagem||"")+" "+S.slice(0,400))||r.itens.reduce((a,x)=>a+x.kg,0)>=30000;
  r.textoLido=L.slice(0,80).join("\n");
  r.ok=!!(r.controle&&r.cliente&&r.itens.length);
  return r;
}

function crmParcelasItem(r,it){const tot=r.total||r.itens.reduce((a,x)=>a+x.total,0)||it.total;const f=tot?it.total/tot:1;const V=(r.vencimentos||[]).length?r.vencimentos:(r.prazo?[{data:r.prazo,valor:tot}]:[]);return V.map(v=>({data:v.data,valor:Math.round(v.valor*f*100)/100}))}

const CRM_PDFJS=[["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js","https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"],["https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js","https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"]];

function crmLinhas(items){const P=items.filter(it=>it.str&&it.str.trim()).map(it=>({x:it.transform[4],y:it.transform[5],s:it.str})).sort((a,b)=>b.y-a.y||a.x-b.x);const G=[];

function verPdfPedido(id){db.ref("cargas_pedidos_pdf/"+id).once("value").then(s=>{const v=s.val();if(!v||!v.b64){toast("PDF não encontrado",true);return}const bin=atob(v.b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const url=URL.createObjectURL(new Blob([u8],{type:"application/pdf"}));window.open(url,"_blank")||toast("Libere pop-ups para abrir o PDF",true)})}

/* ===== Comissões: regra única (app de cargas e app dos vendedores) =====
   Taxa: milho moído 1%; demais rações pela tabela A 1,5% · B 2,5% · C 3,5% (editável em comissao_config).
   A comissão de cada parcela é prevista no mês do vencimento daquela parcela. */
const COM_PADRAO={A:1.5,B:2.5,C:3.5,milho:1};
function comPct(p,cfg){cfg=Object.assign({},COM_PADRAO,cfg||{});if(p.comissaoPct!=null&&p.comissaoPct!=="")return +p.comissaoPct;if(/MILHO/i.test(p.produto||""))return +cfg.milho;const t=String(p.tabela||"").toUpperCase().trim().charAt(0);return cfg[t]!=null?+cfg[t]:null}
function comIso(d,ref){const m=String(d||"").match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);if(!m)return"";let y=m[3]?(m[3].length===2?"20"+m[3]:m[3]):"";if(!y){const r=ref||new Date().toISOString().slice(0,10);y=r.slice(0,4);const iso=y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");if(iso<r)y=String(+y+1)}return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0")}
/* parcelas do pedido: as gravadas do PDF; para pedidos antigos, divide o valor igualmente pelas datas do campo "prazo" */
function comParcelas(p){if(Array.isArray(p.crmVencimentos)&&p.crmVencimentos.length)return p.crmVencimentos.filter(v=>v&&v.data);const tot=+p.crmTotal||0;if(!tot)return[];const ref=p.crmEmissao||(p.criadoEm?new Date(p.criadoEm).toISOString().slice(0,10):"");
  const ds=(String(p.prazo||"").replace(/\([^)]*\)/g,"").match(/\d{1,2}\/\d{1,2}(?:\/\d{2,4})?/g)||[]).map(d=>comIso(d,ref)).filter(Boolean);if(!ds.length)return[];return ds.map(d=>({data:d,valor:Math.round(tot/ds.length*100)/100}))}
function comNormV(v){return(typeof volNormV==="function"?volNormV(v):String(v||"").toUpperCase().trim())||"SEM VENDEDOR"}
function comLista(pedidos,contratos,cfg){const out=[];
  const add=(tipo,id,p)=>{if(!p||p.cancelado||!(+p.crmTotal>0))return;const pct=comPct(p,cfg);const kg=tipo==="contrato"?(+p.totalKg||0):(+p.kg||0);
    const emis=p.crmEmissao||(p.criadoEm?new Date(p.criadoEm).toISOString().slice(0,10):"");
    out.push({tipo,id,vendedor:comNormV(p.vendedor),cliente:p.cliente||"",cidade:p.cidade||"",produto:p.produto||"",crm:p.crmControle||"",emissao:emis,tabela:p.tabela||"",total:+p.crmTotal,kg,pct,parcelas:comParcelas(p).map(v=>({data:v.data,valor:+v.valor,comissao:pct!=null?Math.round(+v.valor*pct)/100:0}))})};
  Object.entries(pedidos||{}).forEach(([id,p])=>add("pedido",id,p));Object.entries(contratos||{}).forEach(([id,p])=>add("contrato",id,p));return out}
function comResumo(lista,mes,vend){const L=vend?lista.filter(x=>x.vendedor===vend):lista;const vend_m=L.filter(x=>(x.emissao||"").slice(0,7)===mes);
  const r={nPed:new Set(vend_m.map(x=>x.tipo+(x.crm||x.id))).size,kg:vend_m.reduce((a,x)=>a+x.kg,0),valor:vend_m.reduce((a,x)=>a+x.total,0),comVendida:vend_m.reduce((a,x)=>a+(x.pct!=null?x.total*x.pct/100:0),0),parcelas:[],receb:0,comMes:0,semPct:L.filter(x=>x.pct==null).length};
  L.forEach(x=>x.parcelas.forEach(v=>{if(v.data.slice(0,7)===mes){r.parcelas.push(Object.assign({},v,{cliente:x.cliente,crm:x.crm,produto:x.produto,pct:x.pct,vendedor:x.vendedor,tipo:x.tipo}));r.receb+=v.valor;r.comMes+=v.comissao}}));
  r.parcelas.sort((a,b)=>a.data.localeCompare(b.data));r.ticket=r.nPed?r.valor/r.nPed:0;r.precoT=r.kg?r.valor/(r.kg/1000):0;return r}
function comBrl(v){return"R$ "+(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function comNomeMes(m){const d=new Date(m+"-15T12:00:00");const s=d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});return s.charAt(0).toUpperCase()+s.slice(1)}
function comAddMes(m,n){const d=new Date(m+"-15T12:00:00");d.setMonth(d.getMonth()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function comNome(v){return String(v||"").toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase())}
function comEsc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
/* PDF da previsão de recebimento do mês (uma pessoa ou a equipe toda) */
function comPdf(lista,mes,vends,cfg){const w=window.open("","_blank");if(!w){alert("Libere as janelas pop-up para gerar o PDF");return}cfg=Object.assign({},COM_PADRAO,cfg||{});
