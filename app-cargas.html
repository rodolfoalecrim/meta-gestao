<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meta Cargas</title>
<meta name="theme-color" content="#052e16">
<link rel="icon" href="meta_logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f6f3;--surface:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--dim:#94a3b8;--G:#15803d;--GD:#052e16;--GL:#f0fdf4;--amber:#d97706;--amberL:#fffbeb;--red:#dc2626;--redL:#fef2f2;--blue:#2563eb;--blueL:#eff6ff;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
:focus-visible{outline:2px solid var(--G);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* login */
#login{display:none;min-height:100%;align-items:center;justify-content:center;padding:24px;background:var(--GD)}
.login-box{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:360px}
.login-box img{height:42px;margin-bottom:14px}
.login-box h1{font-size:20px;margin-bottom:4px}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:18px}
/* shell */
#app{display:none;min-height:100%;flex-direction:column}
.top{background:var(--GD);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;position:sticky;top:0;z-index:20}
.top-row{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto}
.top-row img{height:28px;border-radius:6px;background:#fff;padding:2px}
.top-row h1{font-size:16px;font-weight:800;flex:1}
.top-row .who{font-size:12px;opacity:.75}
.top-row .ic{background:rgba(255,255,255,.1);border:none;color:#fff;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600}
.tabs{display:flex;gap:2px;max-width:1180px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;color:rgba(255,255,255,.65);padding:10px 14px;font-size:13.5px;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:#4ade80}
.tab .badge{background:var(--red);color:#fff;border-radius:9px;padding:1px 6px;font-size:10.5px;margin-left:4px}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.view{display:none}.view.on{display:block}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{font-size:18px;font-weight:800;margin-right:auto}
.btn{border:none;border-radius:11px;padding:10px 14px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-g{background:var(--G);color:#fff}.btn-g:hover{background:#166534}
.btn-o{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-r{background:var(--redL);color:var(--red)}
.btn-a{background:var(--amberL);color:#92400e}
.btn-sm{padding:7px 10px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--GD);border-color:var(--GD);color:#fff}
.inp{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;color:var(--text)}
.inp:focus{border-color:var(--G);outline:none}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.muted{color:var(--muted)}.small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-montagem{background:#f1f5f9;color:#475569}
.p-fechada{background:var(--blueL);color:var(--blue)}
.p-carregada{background:#ecfeff;color:#0e7490}
.p-a_caminho{background:var(--amberL);color:#b45309}
.p-entregue{background:var(--GL);color:var(--G)}
.p-atraso{background:var(--redL);color:var(--red)}
.p-aberto{background:#f1f5f9;color:#475569}
.p-cancelado{background:#f1f5f9;color:var(--dim);text-decoration:line-through}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.group-h{font-size:12.5px;font-weight:800;color:var(--muted);margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.group-h.red{color:var(--red)}
/* day strip */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:58px;border:1px solid var(--border);background:#fff;border-radius:12px;padding:7px 8px;text-align:center}
.day .w{font-size:11px;color:var(--muted);font-weight:600;text-transform:capitalize}
.day .d{font-size:17px;font-weight:800}
.day .n{font-size:10.5px;color:var(--G);font-weight:700;min-height:13px}
.day.on{background:var(--GD);border-color:var(--GD);color:#fff}.day.on .w,.day.on .n{color:#bbf7d0}
.day.today:not(.on){border-color:var(--G)}
/* truck — signature element */
.truck{display:flex;align-items:stretch;gap:4px;overflow-x:auto;padding:2px 2px 6px}
.cab{flex:0 0 34px;border-radius:12px 4px 4px 12px;background:var(--GD);position:relative}
.cab:after{content:"";position:absolute;left:6px;right:10px;top:8px;height:14px;border-radius:5px;background:#86efac;opacity:.5}
.box{flex:1 0 74px;min-width:74px;border-radius:6px;border:1.5px solid transparent;background:#fff;position:relative;overflow:hidden;padding:7px 7px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:92px}
.box .cx{font-size:10.5px;font-weight:800;opacity:.8}
.box .cl{font-size:11.5px;font-weight:700;line-height:1.2;max-height:28px;overflow:hidden}
.box .kg{font-family:var(--mono);font-size:12.5px;font-weight:700;margin-top:auto}
.box .fill{position:absolute;left:0;bottom:0;height:5px;background:currentColor;opacity:.55}
.box .ok{position:absolute;top:5px;right:6px;font-size:10px;font-weight:800;background:#fff;border-radius:6px;padding:1px 4px}
.box.free{border:1.5px dashed #cbd5e1;background:repeating-linear-gradient(135deg,#f8fafc 0 6px,#f1f5f9 6px 12px);color:var(--dim)}
.box.over{box-shadow:inset 0 0 0 2px var(--red)}
.truck.mini .box{min-height:44px;min-width:30px;flex-basis:30px;padding:4px}
.truck.mini .box .cl,.truck.mini .box .kg{display:none}
.truck.mini .cab{flex-basis:18px}
.truck.mini .cab:after{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* carga card */
.cc{cursor:pointer}
.cc-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.cc-h .t{flex:1}
.cc-h .t b{font-size:15px}
.cc-h .t div{font-size:12px;color:var(--muted);margin-top:2px}
.warn{font-size:12px;font-weight:700;color:var(--amber);margin-top:8px}
.warn.red{color:var(--red)}
/* list rows */
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f1f5f9}
.row:last-child{border-bottom:none}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main span{font-size:12px;color:var(--muted)}
.row .r{text-align:right;flex-shrink:0}
.t-big{font-family:var(--mono);font-weight:700;font-size:14px}
.why{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.why em{font-style:normal;font-size:10.5px;font-weight:700;background:var(--GL);color:var(--G);border-radius:6px;padding:2px 6px}
.why em.a{background:var(--amberL);color:#92400e}
/* progress */
.prog{height:10px;border-radius:6px;background:#f1f5f9;overflow:hidden;display:flex;margin:10px 0 6px}
.prog i{display:block;height:100%}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.kv div{font-size:11px;color:var(--muted)}
.kv b{display:block;font-family:var(--mono);font-size:14px;color:var(--text)}
/* editor layout */
.ed{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.ed{grid-template-columns:1.25fr 1fr}.ed .side{position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto}}
.stops .row{gap:8px}
.ed>div,.card,main{min-width:0}
@media(max-width:600px){.top-row .who{display:none}.box{min-width:58px;flex-basis:58px;padding:6px 5px 11px}.box .cl{font-size:10.5px}.box .kg{font-size:11.5px}}
.mv{border:1px solid var(--border);background:#fff;border-radius:8px;width:28px;height:28px;font-size:13px}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:50;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.sh{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media(min-width:700px){#sheet{align-items:center}.sh{border-radius:18px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sh{animation:none}}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sh-h h3{font-size:17px;flex:1}
.x{border:none;background:#f1f5f9;border-radius:9px;width:32px;height:32px;font-size:16px}
.sh-f{display:flex;gap:8px;margin-top:18px}
.sh-f .btn{flex:1}
.ac{position:relative}
.ac-l{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);z-index:5;max-height:240px;overflow:auto;display:none}
.ac-l div{padding:9px 12px;font-size:13px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.ac-l div:hover{background:var(--GL)}
.ac-l small{color:var(--muted);margin-left:6px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(80px);background:var(--G);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:13px;z-index:99;transition:transform .25s;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.stat div{font-size:12px;color:var(--muted)}.stat b{display:block;font-family:var(--mono);font-size:18px;color:var(--text)}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}.kv{grid-template-columns:1fr 1fr}}

/* ===== painel de despacho ===== */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{font-size:21px;line-height:1.2}
.kpi small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.warnk{border-color:#fcd34d;background:#fffdf5}.kpi.warnk b{color:#b45309}
.kpi.redk{border-color:#fca5a5;background:#fffafa}.kpi.redk b{color:var(--red)}
.painel{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.seg{display:inline-flex;background:#e7ece8;border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{border:none;background:none;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.fila{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 14px;position:sticky;top:112px;max-height:calc(100vh - 130px);overflow:auto}
.fila-h{display:flex;align-items:baseline;gap:8px}.fila-h b{flex:1;font-size:14.5px}
.fq{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid #f1f5f9}.fq:last-child{border:none}
.fq .main{flex:1;min-width:0}.fq .main b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fq .main span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fq .main span.late{color:var(--red);font-weight:700}
.fq .r{text-align:right}.fq .t-big{font-size:13px}
.fr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.fr-t .tk{font-weight:800;font-size:14px}.fr-c{min-width:0;display:flex;flex-direction:column;gap:8px}
.livre{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1.5px dashed #cbd5e1;border-radius:11px;padding:10px 12px;color:var(--muted);font-size:13px;font-weight:600;height:100%}
.cb{border:1px solid var(--border);border-radius:11px;padding:10px 11px;cursor:pointer;background:#fff;min-width:0}
.cb:hover{border-color:#86efac}
.fr .cb{border:none;padding:0}
.cb-h{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}.cb-h b{font-size:13.5px}
.truck.mini .box{min-height:30px;border-radius:5px}
.truck.mini .box .cx{font-size:9px}
.truck.mini .box .ok{top:2px;right:2px;font-size:8.5px;padding:0 2px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:7px 0 6px;font-size:12.5px;font-weight:600}
.chain .st{display:inline-flex;align-items:center;gap:5px}
.chain .st i{font-style:normal;width:17px;height:17px;border-radius:50%;color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center}
.chain .st small{font-weight:500;color:var(--muted);text-transform:capitalize}
.chain .st.done{opacity:.55;text-decoration:line-through}
.chain .arr{color:var(--dim)}
.mets{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px}
.oc{display:flex;align-items:center;gap:8px;flex:1;min-width:220px}
.ocb{flex:1;height:7px;border-radius:4px;background:#eef2f0;overflow:hidden;max-width:180px}.ocb i{display:block;height:100%}
.kan{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kc{background:#eef2ef;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kc-h{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 0}
.kc .chain{font-size:11.5px}.kc .oc{min-width:0}
.wk{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:14px}
.wk table{border-collapse:collapse;width:100%;min-width:760px;font-size:12.5px}
.wk th,.wk td{border-bottom:1px solid #f1f5f9;padding:8px;text-align:left;vertical-align:top}
.wk th{font-size:12px;color:var(--muted);cursor:pointer;text-transform:capitalize;white-space:nowrap}
.wk th.on{color:var(--G)}
.wk tr.tot td{background:#f8faf9;font-size:12px;color:var(--muted)}
.wc{border-radius:8px;padding:5px 7px;margin-bottom:4px;cursor:pointer;display:flex;flex-direction:column}
.wc span{font-size:10.5px;font-weight:600;opacity:.85;text-transform:capitalize}
.mapa{height:540px;border-radius:14px;border:1px solid var(--border);overflow:hidden;background:#e5ebe7;z-index:0}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);font-family:Inter,sans-serif}
.pin.ho{background:#fff;border-width:2.5px}
.pin.ax{opacity:.72;border-style:dashed}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.painel{grid-template-columns:1fr}.fila{position:static;max-height:none}}
@media(max-width:600px){.kpis{grid-template-columns:1fr 1fr}.fr{grid-template-columns:1fr}.mapa{height:420px}.seg{display:flex}.seg button{flex:1;padding:7px 6px}}


/* ===== frota ===== */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.fgrid .card{margin:0}
.kv small{display:block;font-size:10.5px;color:var(--muted)}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl .inp{padding:6px 8px;font-size:13px;min-width:80px}
/* ===== indicadores ===== */
.kpis8{grid-template-columns:repeat(5,1fr)}
.kpi .dl{font-size:10.5px;font-weight:700;color:var(--muted)}.kpi .dl.up{color:var(--G)}.kpi .dl.down{color:var(--red)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.chc{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 14px;min-width:0}
.chc.wide{grid-column:1/-1}
.chh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}.chh b{font-size:14px}
.cv{position:relative;height:250px}.chc.wide .cv{height:230px}
.rks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rst{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:13px;font-weight:600}.rst label{display:flex;gap:6px;align-items:center}
label.chip{cursor:pointer}
.rk{display:grid;grid-template-columns:22px 1fr auto 40px;gap:8px;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:12.5px;align-items:center}
.rk:last-child{border:none}.rk .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.rk span:last-child{text-align:right}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.al{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px}.al:last-child{border:none}
.al i{width:8px;height:8px;border-radius:50%;flex-shrink:0}.al span{flex:1}
.pv-l{max-height:460px;overflow:auto}
.pvr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9}.pvr .main{flex:1;min-width:0}
.pvr .main b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pvr .main span{font-size:11.5px;color:var(--muted)}
.pvr .r{text-align:right;white-space:nowrap}.pvr .late{color:var(--red);font-weight:700}

<script>
/* ================= Firebase ================= */
const firebaseConfig={apiKey:"AIzaSyClpsHjO8OLThD--hDOfg7Fg3t6hhuM-To",authDomain:"meta-gestao-608d7.firebaseapp.com",databaseURL:"https://meta-gestao-608d7-default-rtdb.firebaseio.com",projectId:"meta-gestao-608d7",storageBucket:"meta-gestao-608d7.firebasestorage.app",messagingSenderId:"318618053627",appId:"1:318618053627:web:ae289200bd1e87be29395e"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
const INC=n=>firebase.database.ServerValue.increment(n);

/* ================= Helpers ================= */
const S={ve:{},kl:{},km:{},ab:{},dp:{},sv:{},pl:{},doc:{},config:{},cargas:{},pedidos:{},clientes:{},caminhoes:{},contratos:{},motoristas:{},props:null};
let USER=null,ROLE=null,NOME="";
const STATUS_TXT={montagem:"Montando",fechada:"Aguardando carregamento",carregada:"Carregada",a_caminho:"A caminho",entregue:"Entregue",aberto:"A montar",cancelado:"Cancelado"};
const STAGE={aberto:0,montagem:1,fechada:1,carregada:2,a_caminho:3,entregue:4};
const CORES=["#15803d","#2563eb","#b45309","#7c3aed","#0e7490","#be123c","#4d7c0f","#475569"];
const VEND_SUG=["ALEXANDRE","VAGNER","LUCAS","JOZIEL","VANDRIGO","ARTHUR","MAICON","JULIO","PAULO","JOSE LUCAS","JULIA","MARCELO"];
const TAB_SUG=["A","B","C","3","2.5"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim()}
function slug(s){return norm(s).replace(/[^A-Z0-9]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase().slice(0,60)}
function iso(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+dd}
function hoje(){return iso(new Date())}
function addDias(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function difDias(a,b){return Math.round((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/864e5)}
function fData(s){if(!s)return"—";const[y,m,d]=s.split("-");return d+"/"+m}
function fDataL(s){if(!s)return"—";return new Date(s+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"})}
function t(kg,dec){const v=(Number(kg)||0)/1000;return v.toLocaleString("pt-BR",{minimumFractionDigits:dec==null?1:dec,maximumFractionDigits:dec==null?1:dec})+" t"}
function toast(m,err){const e=document.getElementById("toast");e.textContent=m;e.style.background=err?"var(--red)":"var(--G)";e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2800)}
function farelado(p){return /FAREL/i.test(p||"")&&!/PELET/i.test(p||"")}
function capCaixa(cam,i,produto){if(!cam)return 3000;const base=(cam.caixas||[])[i]||3000;if(farelado(produto)){const f=(cam.caixasFarel||[])[i];return f||Math.round(base*0.9)}return base}
function arr(o){if(!o)return[];return Array.isArray(o)?o.filter(x=>x!=null):Object.keys(o).sort((a,b)=>a-b).map(k=>o[k])}
function corCliente(carga,clienteId){const ids=clientesDaCarga(carga);const i=ids.indexOf(clienteId);return CORES[(i<0?0:i)%CORES.length]}
function clientesDaCarga(c){const ids=[];arr(c.caixas).forEach(b=>{if(b&&b.clienteId&&!ids.includes(b.clienteId))ids.push(b.clienteId)});const ord=arr(c.ordem).filter(x=>ids.includes(x));ids.forEach(x=>{if(!ord.includes(x))ord.push(x)});return ord}
function kgTotal(c){return arr(c.caixas).reduce((s,b)=>s+(b&&b.clienteId?(+b.kg||0):0),0)}

/* status da carga: mesma regra no app do motorista */
function calcStatus(c){
  const cx=arr(c.caixas);const usadas=cx.filter(b=>b&&b.clienteId);
  const ids=clientesDaCarga(c);const ent=c.entregas||{};
  if(ids.length&&ids.every(id=>ent[id]&&ent[id].status==="entregue"))return"entregue";
  if(c.saidaEm)return"a_caminho";
  const livres=cx.length-usadas.length;
  const fechada=usadas.length>0&&(livres===0||c.fechadaComVazia);
  if(fechada&&usadas.every(b=>b.carregada))return"carregada";
  if(fechada)return"fechada";
  return"montagem";
}
function cargaAtrasada(c){return c.status!=="entregue"&&c.data&&c.data<hoje()}

/* alocação dos pedidos a partir das cargas carregadas na memória */
function alocacoes(){
  const m={};
  Object.entries(S.cargas).forEach(([cid,c])=>{
    const ent=c.entregas||{};
    arr(c.caixas).forEach(b=>{
      if(!b||!b.pedidoId)return;
      const a=m[b.pedidoId]||(m[b.pedidoId]={aloc:0,entregue:0,cargas:{},minStage:9,caixas:[]});
      const kg=+b.kg||0;a.aloc+=kg;
      const st=ent[b.clienteId]&&ent[b.clienteId].status==="entregue"?"entregue":c.status;
      if(st==="entregue")a.entregue+=kg;
      a.cargas[cid]=true;a.minStage=Math.min(a.minStage,STAGE[st]||1);a.caixas.push({cid,cx:b.cx});
    });
  });
  return m;
}
function statusPedido(p,al){
  if(p.cancelado)return{k:"cancelado",txt:"Cancelado"};
  const a=al||{aloc:0,entregue:0,minStage:9};const kg=+p.kg||0;
  if(kg>0&&a.entregue>=kg-1)return{k:"entregue",txt:"Entregue"};
  if(!a.aloc)return{k:"aberto",txt:"A montar"};
  const nome=["aberto","montagem","carregada","a_caminho","entregue"][a.minStage]||"montagem";
  let txt=STATUS_TXT[nome==="montagem"?"montagem":nome];if(nome==="montagem")txt="Na carga";
  if(a.aloc<kg-1)txt+=" · faltam "+t(kg-a.aloc);
  return{k:nome==="montagem"?"fechada":nome,txt};
}
function pedidoAtrasado(p,st){return!p.cancelado&&st.k!=="entregue"&&p.dataEntrega&&p.dataEntrega<hoje()}

/* ================= Auth ================= */
function login(){const e=document.getElementById("l-email").value.trim(),s=document.getElementById("l-senha").value;if(!e||!s)return;auth.signInWithEmailAndPassword(e,s).catch(()=>{document.getElementById("l-msg").textContent="E-mail ou senha incorretos."})}
function logout(){if(confirm("Sair do app de cargas?"))auth.signOut()}
auth.onAuthStateChanged(async u=>{
  if(!u){document.getElementById("login").style.display="flex";document.getElementById("app").style.display="none";return}
  USER=u;
  try{ROLE=(await db.ref("usuarios/"+u.uid+"/role").once("value")).val()}catch(e){ROLE=null}
  if(ROLE!=="admin"&&ROLE!=="logistica"){document.getElementById("login").style.display="flex";document.getElementById("l-msg").textContent="Seu usuário não tem perfil de logística. Peça ao administrador para liberar (role: logistica).";auth.signOut();return}
  NOME=(u.email||"").split("@")[0];
  document.getElementById("who").textContent=u.email;document.getElementById("who2").textContent=u.email;
  document.getElementById("login").style.display="none";document.getElementById("app").style.display="flex";
  iniciar();
});
function iniciar(){
  const ini=addDias(hoje(),-120);
  db.ref("cargas").orderByChild("data").startAt(ini).on("value",s=>{S.cargas=s.val()||{};render()});
  db.ref("cargas_pedidos").orderByChild("dataEntrega").startAt(ini).on("value",s=>{S.pedidos=s.val()||{};render()});
  db.ref("cargas_clientes").on("value",s=>{S.clientes=s.val()||{};render()});
  db.ref("cargas_caminhoes").on("value",s=>{const v=s.val()||{};Object.values(v).forEach(c=>{c.caixas=arr(c.caixas);c.caixasFarel=arr(c.caixasFarel)});S.caminhoes=v;render()});
  db.ref("cargas_contratos").on("value",s=>{S.contratos=s.val()||{};render()});
  db.ref("cargas_motoristas").on("value",s=>{S.motoristas=s.val()||{}});
  db.ref("cargas_config").on("value",s=>{S.config=s.val()||{};render()});
  const ff=(n,k,q)=>{(q||db.ref(n)).on("value",x=>{S[k]=x.val()||{};render()},e=>console.warn(n,e.message))};
  ff("frota_abastecimentos","ab",db.ref("frota_abastecimentos").orderByChild("data").startAt(addDias(hoje(),-400)));
  ff("frota_despesas","dp",db.ref("frota_despesas").orderByChild("data").startAt(addDias(hoje(),-400)));
  ff("frota_servicos","sv",db.ref("frota_servicos").orderByChild("data").startAt(addDias(hoje(),-730)));
  ff("frota_planos","pl");ff("frota_documentos","doc");
  if(ROLE==="admin"){ff("veiculos_equipe","ve");ff("km_lancamentos","kl");ff("km_metas","km")}else{document.querySelectorAll('[data-v="carros"]').forEach(b=>b.style.display="none")}
}

/* ================= Navegação ================= */
let VIEW="cargas",DIA=hoje(),EDIT=null,_rt=null;

  if(o){L.marker([o.lat,o.lng],{icon:pinIcon("F","#052e16")}).addTo(m).bindPopup("<b>"+esc(o.nome)+"</b><br>ponto de saída");bounds.push([o.lat,o.lng])}
  cargas.forEach(([id,c],ci)=>{const cor=CORES[ci%CORES.length];const pts=o?[[o.lat,o.lng]]:[];const r=rotaInfo(c);
    r.legs.forEach((lg,i)=>{const p=ptCliente(lg.id);if(!p){semLoc++;return}const b=arr(c.caixas).find(x=>x&&x.clienteId===lg.id);pts.push([p.lat,p.lng]);bounds.push([p.lat,p.lng]);
      L.marker([p.lat,p.lng],{icon:pinIcon(i+1,cor,false,p.aprox),title:p.aprox?"Posição aproximada (centro da cidade)":""}).addTo(m).bindPopup("<b>"+esc(b.cliente)+"</b><br>"+esc(c.numero?"Carga "+c.numero:(S.caminhoes[c.caminhaoId]||{}).apelido||"")+" · parada "+(i+1)+(lg.eta!=null?"<br>chegada ~"+fmtHora(lg.eta):"")+'<br><a href="#" onclick="abrirEditor(\''+id+'\');return false">abrir carga</a>')});
    if(pts.length>1)L.polyline(pts,{color:cor,weight:4,opacity:.85}).addTo(m)});
  pend.forEach(x=>{const p=ptCliente(x.p.clienteId);if(!p){semLoc++;return}bounds.push([p.lat,p.lng]);L.marker([p.lat,p.lng],{icon:pinIcon("•","#64748b",true)}).addTo(m).bindPopup("<b>"+esc(x.p.cliente)+"</b><br>"+t(x.resta)+" sem carga · "+fData(x.p.dataEntrega)+'<br><a href="#" onclick="escolherCargaPara(\''+x.id+'\');return false">encaixar numa carga</a>')});
  if(bounds.length)m.fitBounds(bounds,{padding:[30,30],maxZoom:12});else m.setView([-26.08,-53.05],8);
  setTimeout(()=>m.invalidateSize(),60);
  const n=document.getElementById(elId+"-nota");if(n)n.textContent="Pino tracejado = posição aproximada pelo centro da cidade (o motorista fixa a exata na entrega). "+(semLoc?semLoc+" cliente(s) sem cidade conhecida não aparecem. ":"")+"Pontos cinza = pedidos ainda sem carga.";
}

/* ================= SUGESTÃO AUTOMÁTICA DE CARGAS ================= */
function planejarCargas(dia){
  const fila=pendentesAte(addDias(dia,1)).map(x=>Object.assign({},x));
  const ocupados=new Set(Object.values(S.cargas).filter(c=>c.data===dia).map(c=>camKey(c)));
  const trucks=Object.entries(S.caminhoes).filter(([k])=>!ocupados.has(k)).sort((a,b)=>(b[1].caixas||[]).reduce((s,x)=>s+x,0)-(a[1].caixas||[]).reduce((s,x)=>s+x,0));
  const props=[];const h=hoje();
  const prio=x=>(x.p.dataEntrega<h?1000+difDias(h,x.p.dataEntrega)*20:0)+(x.p.dataEntrega<=dia?300:0)+x.resta/100;
  for(const [tk,cam] of trucks){
    const vivos=fila.filter(x=>x.resta>=50&&!restricoes(x.p.clienteId,x.p.cidade,tk,dia).length);if(!vivos.length)continue;vivos.sort((a,b)=>prio(b)-prio(a));
    const boxes=(cam.caixas||[]).map(()=>null);const sel=[];
    const encher=x=>{let r=x.resta;for(let i=0;i<boxes.length&&r>0;i++){if(boxes[i])continue;const kg=Math.min(capCaixa(cam,i,x.p.produto),r);boxes[i]={x,kg};r-=kg}const u=x.resta-r;x.resta=r;return u};
    const capT=boxes.reduce((s,_,i)=>s+capCaixa(cam,i,""),0);
    let u=encher(vivos[0]);sel.push({x:vivos[0],kg:u,why:[vivos[0].p.dataEntrega<h?"atrasado":"prioridade da fila"]});
    while(boxes.some(b=>!b)){
      const ids=sel.map(s=>s.x.p.clienteId);const pts=ids.map(ptCliente).filter(Boolean);const cids=new Set(sel.map(s=>norm(s.x.p.cidade)));
      let best=null,bs=-1e9,bw=[];
      fila.forEach(x=>{if(x.resta<50||sel.some(s=>s.x===x)||restricoes(x.p.clienteId,x.p.cidade,tk,dia).length)return;let sc=0;const w=[];
        let pa=0;ids.forEach(k=>{pa+=((S.clientes[x.p.clienteId]||{}).parceiros||{})[k]||0});if(pa){sc+=Math.min(pa,15)*2;w.push("já foi junto "+pa+"×")}
        if(cids.has(norm(x.p.cidade))){sc+=12;w.push("mesma cidade")}
        const p=ptCliente(x.p.clienteId);let afin=pa>0||cids.has(norm(x.p.cidade));const semGeo=!p||!pts.length;
        if(!semGeo){const d=Math.min(...pts.map(q=>kmEntre(p,q)));if(d<20){sc+=10;w.push(Math.round(d)+" km");afin=true}else if(d<45){sc+=4;w.push(Math.round(d)+" km");afin=true}else if(d>90)sc-=30}
        if(!afin){if(!semGeo)return;w.push("completa a carga")}
        if(x.p.dataEntrega<h){sc+=8;w.push("atrasado")}else if(x.p.dataEntrega===dia)sc+=5;
        x._afin=afin;if(sc>bs){bs=sc;best=x;bw=w}});
      const ocAtual=boxes.reduce((s,b)=>s+(b?b.kg:0),0)/capT;
      if(!best||bs<0||(!best._afin&&ocAtual>=0.6))break;
      u=encher(best);if(!u)break;sel.push({x:best,kg:u,why:bw});
    }
    const kg=sel.reduce((s,x)=>s+x.kg,0);
    const caixas={};boxes.forEach((b,i)=>{caixas[i]=b?linhaCaixa(i,b.x.p,b.x.id,b.kg,cam):{cx:i+1,cap:cam.caixas[i]}});
    const ids=[];sel.forEach(s=>{if(!ids.includes(s.x.p.clienteId))ids.push(s.x.p.clienteId)});
    const carga={data:dia,caminhaoId:tk,placa:cam.placa||"",motoristaUid:cam.motoristaUid||"",motoristaNome:cam.motoristaNome||"",numero:"",regiao:"",caixas,ordem:otimizarOrdemIds(ids),status:"montagem",fechadaComVazia:false};
    props.push({tk,cam,sel,kg,cap:capTotal(carga)||capT,carga});
  }
  return props;
}
let _props=[];

  _props=planejarCargas(DIA);const livres=Object.keys(S.caminhoes).length-new Set(Object.values(S.cargas).filter(c=>c.data===DIA).map(c=>c.caminhaoId)).size;
  let html='<div class="sh-h"><h3>Sugestão de cargas para '+fData(DIA)+'</h3><button class="x" onclick="fecharSheet()">×</button></div><div class="small muted">Usa os pedidos sem carga até '+fData(addDias(DIA,1))+', os caminhões livres no dia ('+livres+'), quem costuma ir junto, cidade e distância. A ordem de entrega já vem otimizada. Revise antes de criar.</div>';
  if(!_props.length)html+='<div class="empty"><b>Nada a sugerir</b>'+(livres?"Não há pedidos sem carga até "+fData(addDias(DIA,1))+".":"Todos os caminhões já têm carga neste dia.")+'</div>';

  if(_props.filter(p=>p.kg/p.cap>=0.5).length>1)html+='<div class="sh-f"><button class="btn btn-o" onclick="fecharSheet()">Fechar</button><button class="btn btn-g" onclick="_props.forEach((p,i)=>{if(p.kg/p.cap>=0.5)criarProposta(i)})">Criar as com ocupação ≥ 50%</button></div>';
  abrirSheet(html);
}
function criarProposta(i){
  const pr=_props[i];if(!pr||pr.criada)return;pr.criada=true;const b=document.getElementById("pp-"+i);if(b){b.disabled=true;b.textContent="Criada"}
  const c=Object.assign({},pr.carga,{criadoEm:Date.now(),criadoPor:USER.email,origemSugestao:true});c.status=calcStatus(c);
  db.ref("cargas").push(c).then(()=>toast("Carga criada para "+(pr.cam.apelido||pr.cam.placa))).catch(e=>{pr.criada=false;toast("Não salvou: "+e.message,true)});
}

  const resta=Math.max(0,(+p.kg||0)-(al?al.aloc:0));const kg=Math.min(resta||capCaixa(cam,i,p.produto),capCaixa(cam,i,p.produto));

/* encaixe automático: enche as caixas livres em ordem até completar o pedido */
function encaixar(pid,cargaId){
  cargaId=cargaId||EDIT;const c=S.cargas[cargaId];if(!c)return;const p=S.pedidos[pid];{const rs=restricoes(p.clienteId,p.cidade,camKey(c),c.data);if(rs.length&&!confirm("Atenção: "+p.cliente+" — "+rs.join("; ")+". Encaixar mesmo assim?"))return}const cam=S.caminhoes[c.caminhaoId];const al=alocacoes()[pid];
  let resta=Math.max(0,(+p.kg||0)-(al?al.aloc:0));if(resta<=0){toast("Esse pedido já está todo em carga");return}
  const cx=arr(c.caixas);let usadas=0;
  for(let i=0;i<cx.length&&resta>0;i++){if(cx[i]&&cx[i].clienteId)continue;const cap=capCaixa(cam,i,p.produto);const kg=Math.min(cap,resta);cx[i]=linhaCaixa(i,p,pid,kg,cam);resta-=kg;usadas++}
  if(!usadas){toast("Não há caixa livre neste caminhão",true);return}
  c.caixas=cx;if(!c.ordemManual)c.ordem=otimizarOrdemIds(clientesDaCarga(c));salvarCarga(cargaId,c,usadas+" caixa"+(usadas>1?"s":"")+" com "+p.cliente.split(" ")[0]+(resta>0?" · sobraram "+t(resta)+" do pedido":""));
}
/* restrições: caminhão bloqueado no cliente, cidade bloqueada no caminhão, chuva */
function diaChuva(d){return!!(S.config.chuva&&S.config.chuva[d])}
function restricoes(clienteId,cidade,camId,dia){
  const out=[];const c=S.clientes[clienteId]||{};const cam=S.caminhoes[camId];
  if(camId&&c.camBloq&&c.camBloq[camId])out.push((cam?cam.apelido||cam.placa:"este caminhão")+" não entra no cliente");
  const cbStr=cam&&(cam.cidadesBloq||((String(cam.obs||"").match(/n[aã]o vai (?:para|pra) ([^.;]+)/i)||[])[1]));
  if(cam&&cbStr){const cn=norm(cidade||c.cidade);const cb=String(cbStr).split(",").map(norm).filter(Boolean);if(cn&&cb.some(x=>cn.includes(x)||x.includes(cn)))out.push((cam.apelido||cam.placa)+" não vai para "+(cidade||c.cidade))}
  if(c.naoChuva&&diaChuva(dia))out.push("não recebe em dia de chuva");
  return out;
}
function restricoesCarga(c){const k=camKey(c);const out=[];clientesDaCarga(c).forEach(id=>{const b=arr(c.caixas).find(x=>x&&x.clienteId===id);restricoes(id,b.cidade,k,c.data).forEach(r=>out.push(b.cliente.split(" ").slice(0,2).join(" ")+": "+r))});return out}
function janelaTxt(id){const j=(S.clientes[id]||{}).janela;return j==="manha"?"recebe só de manhã":j==="tarde"?"recebe só à tarde":""}
function foraJanela(id,eta){const j=(S.clientes[id]||{}).janela;if(eta==null||!j)return false;const m=((eta%1440)+1440)%1440;return j==="manha"?m>12*60:m<13*60}
/* sugestões: parceiros históricos + mesma cidade + data */
function pedidosDisponiveis(c,al){
  const ids=clientesDaCarga(c);const cidades=new Set(arr(c.caixas).filter(b=>b&&b.cidade).map(b=>norm(b.cidade)));const out=[];
  Object.entries(S.pedidos).forEach(([id,p])=>{
    if(p.cancelado)return;const a=al[id];const resta=(+p.kg||0)-(a?a.aloc:0);if(resta<50)return;
    let sc=0;const why=[];
    ids.forEach(k=>{const n=((S.clientes[p.clienteId]||{}).parceiros||{})[k];if(n){sc+=Math.min(n,20)*2;why.push({t:"já foi com "+(S.clientes[k]?S.clientes[k].nome.split(" ")[0]:k)+" "+n+"×"})}});
    if(ids.includes(p.clienteId)){sc+=15;why.push({t:"restante do pedido"})}
    else if(cidades.has(norm(p.cidade))){sc+=12;why.push({t:"mesma cidade"})}
    const dd=p.dataEntrega?difDias(p.dataEntrega,c.data):99;
    if(p.dataEntrega&&p.dataEntrega<hoje()){sc+=10;why.push({t:"atrasado "+difDias(hoje(),p.dataEntrega)+"d",a:1})}
    const rs=restricoes(p.clienteId,p.cidade,camKey(c),c.data);if(rs.length){sc-=100;rs.forEach(r=>why.unshift({t:"⛔ "+r,a:1}))}
    else if(dd<0){sc+=6;why.push({t:"previsto p/ "+fData(p.dataEntrega)})}else if(dd===0){sc+=8;why.push({t:"entrega no dia"})}else if(dd<=2){sc+=4}else if(dd>7)sc-=8;
    if(p.programado&&dd>0)sc-=4;
    out.push({id,p,resta,sc,why});
  });
  return out.sort((a,b)=>b.sc-a.sc||(a.p.dataEntrega||"").localeCompare(b.p.dataEntrega||""));
}

/* ================= PEDIDOS ================= */
let PF="montar",PQ="",PCID="";
function renderPedidos(){
  const el=document.getElementById("v-pedidos");const al=alocacoes();const h=hoje();
  const rows=Object.entries(S.pedidos).map(([id,p])=>{const st=statusPedido(p,al[id]);return{id,p,st,late:pedidoAtrasado(p,st)}});
  const cidades=[...new Set(rows.map(r=>norm(r.p.cidade)).filter(Boolean))].sort();
  let f=rows.filter(r=>{
    if(PF==="montar")return r.st.k==="aberto"||(r.st.k!=="cancelado"&&r.st.k!=="entregue"&&((al[r.id]||{}).aloc||0)<(+r.p.kg||0)-1);
    if(PF==="andamento")return["fechada","carregada","a_caminho"].includes(r.st.k);
    if(PF==="entregues")return r.st.k==="entregue";
    if(PF==="cancelados")return r.st.k==="cancelado";return true});
  if(PQ){const q=norm(PQ);f=f.filter(r=>norm(r.p.cliente+" "+r.p.produto+" "+r.p.vendedor+" "+r.p.cidade).includes(q))}
  if(PCID)f=f.filter(r=>norm(r.p.cidade)===PCID);
  f.sort((a,b)=>(a.p.dataEntrega||"").localeCompare(b.p.dataEntrega||""));if(PF==="entregues"||PF==="cancelados")f.reverse();
  const grp=r=>{if(PF==="entregues"||PF==="cancelados")return fDataL(r.p.dataEntrega);const d=r.p.dataEntrega;if(!d)return"Sem data";if(d<h)return"Atrasados";if(d===h)return"Hoje";if(d===addDias(h,1))return"Amanhã";if(d<=addDias(h,7))return"Próximos 7 dias";return"Programados — "+new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{month:"long"})};
  let html='<div class="bar"><h2>Pedidos</h2><button class="btn btn-o" onclick="abrirProgramacao()">Programar várias datas</button><button class="btn btn-g" onclick="abrirPedido()">+ Novo pedido</button></div><div class="bar"><div class="chips">'+[["montar","A montar"],["andamento","Em andamento"],["entregues","Entregues"],["cancelados","Cancelados"]].map(([k,l])=>'<button class="chip'+(PF===k?" on":"")+'" onclick="PF=\''+k+'\';renderPedidos()">'+l+'</button>').join("")+'</div><select class="inp" style="width:auto" onchange="PCID=this.value;renderPedidos()"><option value="">Todas as cidades</option>'+cidades.map(c=>'<option'+(c===PCID?" selected":"")+'>'+esc(c)+'</option>').join("")+'</select><input class="inp" style="max-width:260px" placeholder="Buscar cliente, produto, vendedor" value="'+esc(PQ)+'" oninput="PQ=this.value;clearTimeout(this._t);this._t=setTimeout(renderPedidos,250)"></div>';
  if(!f.length){html+='<div class="empty"><b>Nenhum pedido aqui</b>'+(PF==="montar"?"Cadastre um pedido para começar a montar cargas.":"")+'</div>';el.innerHTML=html;return}
  let last=null;
  f.forEach(r=>{const g=grp(r);if(g!==last){const tot=f.filter(x=>grp(x)===g).reduce((s,x)=>s+(+x.p.kg||0),0);html+='<div class="group-h'+(g==="Atrasados"?" red":"")+'">'+esc(g)+' <span class="num muted">'+t(tot)+'</span></div>';last=g}
    const p=r.p;const ct=p.contratoId&&S.contratos[p.contratoId];
    html+='<div class="card" style="padding:10px 14px;cursor:pointer" onclick="abrirPedido(\''+r.id+'\')"><div class="row" style="padding:0;border:none"><div class="main"><b>'+esc(p.cliente)+'</b><span>'+esc(p.produto)+' · '+esc(p.cidade||"")+' · '+esc(p.vendedor||"sem vendedor")+' · tab. '+esc(p.tabela||"—")+'</span><div class="small muted" style="margin-top:2px">Entrega '+fData(p.dataEntrega)+(p.dataTexto?" ("+esc(p.dataTexto)+")":"")+' · prazo '+esc(p.prazo||"—")+(ct?' · contrato '+esc(ct.numero||""):"")+(p.programado?' · programado':"")+'</div>'+(p.obs?'<div class="small" style="margin-top:2px">'+esc(p.obs)+'</div>':"")+'</div><div class="r"><div class="t-big">'+t(p.kg)+'</div><span class="pill p-'+(r.late?"atraso":r.st.k)+'" style="margin-top:4px">'+(r.late?"Atrasado · ":"")+esc(r.st.txt)+'</span></div></div></div>'});
  el.innerHTML=html;
}

/* formulário de pedido */
function acCliente(inp){
  const q=norm(inp.value);const box=inp.nextElementSibling;if(q.length<2){box.style.display="none";return}
  const l=Object.entries(S.clientes).filter(([k,c])=>norm(c.nome).includes(q)||Object.keys(c.codigos||{}).some(x=>x.startsWith(q))).sort((a,b)=>(b[1].nCargas||0)-(a[1].nCargas||0)).slice(0,12);
  box.innerHTML=l.map(([k,c])=>'<div onmousedown="escolherCliente(\''+k+'\')">'+esc(c.nome)+'<small>'+esc(c.cidade||"")+(c.vendedor?" · "+esc(c.vendedor):"")+'</small></div>').join("")||'<div style="color:var(--muted)">Cliente novo — será cadastrado ao salvar</div>';box.style.display="block";
}
function escolherCliente(k){const c=S.clientes[k];const f=document.getElementById("pf");f.cliente.value=c.nome;f.clienteId.value=k;if(c.cidade)f.cidade.value=c.cidade;if(c.vendedor&&!f.vendedor.value)f.vendedor.value=c.vendedor;document.querySelectorAll(".ac-l").forEach(x=>x.style.display="none");atualizarContratosForm(k);
  const ult=Object.values(S.pedidos).filter(p=>p.clienteId===k).sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0))[0];if(ult){if(!f.produto.value)f.produto.value=ult.produto||"";if(!f.tabela.value)f.tabela.value=ult.tabela||""}}
function atualizarContratosForm(k){const sel=document.getElementById("pf").contratoId;const cur=sel.value;sel.innerHTML='<option value="">Sem contrato</option>'+Object.entries(S.contratos).filter(([,c])=>c.ativo!==false&&c.clienteId===k).map(([id,c])=>{const s=saldoContrato(id);return'<option value="'+id+'"'+(id===cur?" selected":"")+'>'+esc(c.numero||"s/nº")+' — '+esc(c.produto)+' · livre '+t(s.livre)+'</option>'}).join("")}
function produtosConhecidos(){const s=new Set();Object.values(S.pedidos).forEach(p=>p.produto&&s.add(p.produto));Object.values(S.cargas).forEach(c=>arr(c.caixas).forEach(b=>b&&b.produto&&s.add(b.produto)));Object.values(S.contratos).forEach(c=>c.produto&&s.add(c.produto));return[...s].sort()}
function formPedidoHTML(p,id){
  p=p||{};
  return'<form id="pf" onsubmit="return false"><input type="hidden" name="clienteId" value="'+esc(p.clienteId||"")+'"><label class="f">Cliente</label><div class="ac"><input class="inp" name="cliente" autocomplete="off" value="'+esc(p.cliente||"")+'" placeholder="Nome ou código" oninput="this.form.clienteId.value=\'\';acCliente(this)" onblur="setTimeout(()=>this.nextElementSibling.style.display=\'none\',150)"><div class="ac-l"></div></div><div class="grid2"><div><label class="f">Cidade</label><input class="inp" name="cidade" value="'+esc(p.cidade||"")+'"></div><div><label class="f">Vendedor</label><input class="inp" name="vendedor" list="dl-vend" value="'+esc(p.vendedor||"")+'"></div></div><label class="f">Produto</label><input class="inp" name="produto" list="dl-prod" value="'+esc(p.produto||"")+'" placeholder="ex: 4507 - MILHO MOÍDO"><div class="grid3"><div><label class="f">Toneladas</label><input class="inp num" name="ton" type="number" step="0.05" min="0" value="'+(p.kg?(+p.kg/1000):"")+'"></div><div><label class="f">Data de entrega</label><input class="inp" name="dataEntrega" type="date" value="'+esc(p.dataEntrega||addDias(hoje(),1))+'"></div><div><label class="f">Janela (texto)</label><input class="inp" name="dataTexto" value="'+esc(p.dataTexto||"")+'" placeholder="ex: 02 ou 05/10"></div></div><div class="grid3"><div><label class="f">Prazo / vencimento</label><input class="inp" name="prazo" value="'+esc(p.prazo||"")+'" placeholder="ex: 20/11 ou 30/60"></div><div><label class="f">Tabela</label><input class="inp" name="tabela" list="dl-tab" value="'+esc(p.tabela||"")+'"></div><div><label class="f">Contrato</label><select class="inp" name="contratoId"><option value="'+esc(p.contratoId||"")+'">'+(p.contratoId&&S.contratos[p.contratoId]?esc(S.contratos[p.contratoId].numero):"Sem contrato")+'</option></select></div></div><label class="f">Observação</label><input class="inp" name="obs" value="'+esc(p.obs||"")+'" placeholder="ex: não vai com chuva"><datalist id="dl-prod">'+produtosConhecidos().map(x=>'<option value="'+esc(x)+'">').join("")+'</datalist><datalist id="dl-vend">'+VEND_SUG.map(x=>'<option value="'+x+'">').join("")+'</datalist><datalist id="dl-tab">'+TAB_SUG.map(x=>'<option value="'+x+'">').join("")+'</datalist></form>';
}
function lerFormPedido(){
  const f=document.getElementById("pf");const nome=norm(f.cliente.value);const kg=Math.round((parseFloat(String(f.ton.value).replace(",","."))||0)*1000);
  if(!nome||!kg||!f.produto.value.trim()){toast("Preencha cliente, produto e toneladas",true);return null}
  let cid=f.clienteId.value;if(!cid){const ex=Object.entries(S.clientes).find(([,c])=>norm(c.nome)===nome);cid=ex?ex[0]:slug(nome)}
  return{clienteId:cid,cliente:nome,cidade:norm(f.cidade.value),vendedor:norm(f.vendedor.value),produto:f.produto.value.trim().toUpperCase(),kg,dataEntrega:f.dataEntrega.value,dataTexto:f.dataTexto.value.trim(),prazo:f.prazo.value.trim(),tabela:f.tabela.value.trim().toUpperCase(),contratoId:f.contratoId.value||"",obs:f.obs.value.trim()};
}
function garantirCliente(p){const c=S.clientes[p.clienteId];const up={};if(!c){up.nome=p.cliente;up.cidade=p.cidade;up.vendedor=p.vendedor;up.nCargas=0;up.criadoEm=Date.now()}else{if(p.cidade&&!c.cidade)up.cidade=p.cidade;if(p.vendedor&&!c.vendedor)up.vendedor=p.vendedor}return Object.keys(up).length?db.ref("cargas_clientes/"+p.clienteId).update(up):Promise.resolve()}
function abrirPedido(id){
  const p=id?S.pedidos[id]:null;const al=id?alocacoes()[id]:null;
  abrirSheet('<div class="sh-h"><h3>'+(id?"Editar pedido":"Novo pedido")+'</h3><button class="x" onclick="fecharSheet()">×</button></div>'+(al&&al.aloc?'<div class="warn">Este pedido já está em carga ('+t(al.aloc)+'). Alterar aqui não mexe nas caixas.</div>':"")+formPedidoHTML(p,id)+'<div class="sh-f">'+(id?'<button class="btn btn-r" onclick="cancelarPedido(\''+id+'\')">'+(p.cancelado?"Reativar":"Cancelar pedido")+'</button>':'<button class="btn btn-o" onclick="fecharSheet()">Fechar</button>')+'<button class="btn btn-g" onclick="salvarPedido('+(id?"'"+id+"'":"")+')">Salvar pedido</button></div>');
  if(p&&p.clienteId)atualizarContratosForm(p.clienteId);
}
function salvarPedido(id){
  const d=lerFormPedido();if(!d)return;
  if(d.contratoId){const s=saldoContrato(d.contratoId,id);if(d.kg>s.livre+1&&!confirm("O pedido ("+t(d.kg)+") passa do saldo livre do contrato ("+t(s.livre)+"). Salvar assim mesmo?"))return}
  garantirCliente(d);
  const pr=id?db.ref("cargas_pedidos/"+id).update(Object.assign(d,{atualizadoEm:Date.now()})):db.ref("cargas_pedidos").push(Object.assign(d,{criadoEm:Date.now(),criadoPor:USER.email}));
  pr.then(()=>{toast("Pedido salvo");fecharSheet()}).catch(e=>toast("Não salvou: "+e.message,true));
}
function cancelarPedido(id){const p=S.pedidos[id];if(!p.cancelado&&!confirm("Cancelar este pedido?"))return;db.ref("cargas_pedidos/"+id+"/cancelado").set(!p.cancelado).then(()=>{toast(p.cancelado?"Pedido reativado":"Pedido cancelado");fecharSheet()})}

/* programação de cargas com datas definidas (ex: milho do Zito toda sexta) */
function abrirProgramacao(contratoId){
  const ct=contratoId?S.contratos[contratoId]:null;
  const base=ct?{clienteId:ct.clienteId,cliente:ct.cliente,cidade:ct.cidade,vendedor:ct.vendedor,produto:ct.produto,tabela:ct.tabela,contratoId,prazo:"CONTRATO "+(ct.numero||"")}:null;
  abrirSheet('<div class="sh-h"><h3>Programar entregas</h3><button class="x" onclick="fecharSheet()">×</button></div><div class="small muted">Cria um pedido para cada data. Cada um entra na lista "A montar" no seu dia.</div>'+formPedidoHTML(base)+'<label class="f">Repetir</label><div class="grid3"><div><select class="inp" id="pg-tipo" onchange="prevProg()"><option value="7">Toda semana</option><option value="14">A cada 2 semanas</option><option value="0">Datas avulsas</option></select></div><div><label class="small muted">Até</label><input class="inp" type="date" id="pg-ate" value="'+addDias(hoje(),28)+'" onchange="prevProg()"></div><div><label class="small muted">Datas avulsas (dd/mm, separadas por vírgula)</label><input class="inp" id="pg-av" placeholder="09/10, 16/10" oninput="prevProg()"></div></div><div id="pg-prev" class="small" style="margin-top:10px"></div><div class="sh-f"><button class="btn btn-o" onclick="fecharSheet()">Fechar</button><button class="btn btn-g" onclick="salvarProgramacao()">Criar pedidos</button></div>');
  if(base)atualizarContratosForm(base.clienteId);
  document.getElementById("pf").dataEntrega.addEventListener("change",prevProg);prevProg();
}
function datasProg(){
  const f=document.getElementById("pf");const tipo=+document.getElementById("pg-tipo").value;const out=[];
  if(tipo){let d=f.dataEntrega.value;const ate=document.getElementById("pg-ate").value;while(d&&d<=ate&&out.length<40){out.push(d);d=addDias(d,tipo)}}
  else{const y=new Date().getFullYear();document.getElementById("pg-av").value.split(/[,;\s]+/).forEach(s=>{const m=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);if(m){let yy=m[3]?+m[3]:y;if(yy<100)yy+=2000;const d=yy+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");if(!out.includes(d))out.push(d)}})}
  return out.sort();
}
function prevProg(){const d=datasProg();document.getElementById("pg-prev").innerHTML=d.length?"<b>"+d.length+" entrega"+(d.length>1?"s":"")+":</b> "+d.map(fData).join(", "):"Nenhuma data."}
function salvarProgramacao(){
  const d=lerFormPedido();if(!d)return;const datas=datasProg();if(!datas.length){toast("Defina as datas",true);return}
  if(d.contratoId){const s=saldoContrato(d.contratoId);if(d.kg*datas.length>s.livre+1&&!confirm("Total programado ("+t(d.kg*datas.length)+") passa do saldo livre do contrato ("+t(s.livre)+"). Criar assim mesmo?"))return}
  garantirCliente(d);const g=db.ref("cargas_pedidos").push().key;const up={};
  datas.forEach(dt=>{const k=db.ref("cargas_pedidos").push().key;up[k]=Object.assign({},d,{dataEntrega:dt,programado:true,grupoProg:g,criadoEm:Date.now(),criadoPor:USER.email})});
  db.ref("cargas_pedidos").update(up).then(()=>{toast(datas.length+" pedidos programados");fecharSheet()}).catch(e=>toast("Não salvou: "+e.message,true));
}

/* ================= CONTRATOS ================= */
function saldoContrato(id,ignorarPedido){
  const c=S.contratos[id]||{};const al=alocacoes();let entregue=+c.retiradoAnteriorKg||0,pend=0;
  Object.entries(S.pedidos).forEach(([pid,p])=>{if(p.contratoId!==id||p.cancelado||pid===ignorarPedido)return;const a=al[pid]||{entregue:0};entregue+=Math.min(a.entregue,+p.kg||0);pend+=Math.max(0,(+p.kg||0)-a.entregue)});
  const total=+c.totalKg||0;return{total,entregue,pendente:pend,aRetirar:Math.max(0,total-entregue),livre:Math.max(0,total-entregue-pend)};
}
let CQ="",CF="ativos";
function renderContratos(){
  const el=document.getElementById("v-contratos");
  let l=Object.entries(S.contratos).filter(([,c])=>CF==="todos"||(CF==="ativos"?c.ativo!==false:c.ativo===false));
  if(CQ){const q=norm(CQ);l=l.filter(([,c])=>norm(c.cliente+" "+c.numero+" "+c.produto+" "+c.cidade).includes(q))}
  l=l.map(([id,c])=>({id,c,s:saldoContrato(id)})).sort((a,b)=>b.s.aRetirar-a.s.aRetirar);
  const tot=l.reduce((a,x)=>({r:a.r+x.s.aRetirar,p:a.p+x.s.pendente,l:a.l+x.s.livre}),{r:0,p:0,l:0});
  let html='<div class="bar"><h2>Contratos</h2><button class="btn btn-g" onclick="abrirContrato()">+ Novo contrato</button></div><div class="bar"><div class="chips">'+[["ativos","Ativos"],["encerrados","Encerrados"],["todos","Todos"]].map(([k,lb])=>'<button class="chip'+(CF===k?" on":"")+'" onclick="CF=\''+k+'\';renderContratos()">'+lb+'</button>').join("")+'</div><input class="inp" style="max-width:260px" placeholder="Buscar" value="'+esc(CQ)+'" oninput="CQ=this.value;clearTimeout(this._t);this._t=setTimeout(renderContratos,250)"></div>';
  if(l.length)html+='<div class="stat"><div>Saldo a retirar<b>'+t(tot.r)+'</b></div><div>Pendente de entrega (já programado)<b>'+t(tot.p)+'</b></div><div>Sem programação<b>'+t(tot.l)+'</b></div></div>';
  html+=l.length?l.map(({id,c,s})=>{const pe=s.total?s.entregue/s.total*100:0,pp=s.total?s.pendente/s.total*100:0;return'<div class="card" style="cursor:pointer" onclick="abrirContrato(\''+id+'\')"><div class="row" style="padding:0;border:none"><div class="main"><b>'+esc(c.cliente)+'</b><span>Contrato '+esc(c.numero||"s/nº")+' · '+esc(c.produto)+' · '+esc(c.cidade||"")+' · '+esc(c.vendedor||"")+'</span></div><div class="r t-big">'+t(s.total)+'</div></div><div class="prog"><i style="width:'+pe+'%;background:var(--G)"></i><i style="width:'+pp+'%;background:#fbbf24"></i></div><div class="kv"><div>Entregue<b>'+t(s.entregue)+'</b></div><div>Pendente de entrega<b>'+t(s.pendente)+'</b></div><div>Saldo a retirar<b>'+t(s.aRetirar)+'</b></div><div>Sem programação<b>'+t(s.livre)+'</b></div></div></div>'}).join(""):'<div class="empty"><b>Nenhum contrato</b>Cadastre os contratos para acompanhar o saldo de retirada.</div>';
  el.innerHTML=html;
}

const IND={mes:hoje().slice(0,7),dados:null,peds:{},ini:null,fim:null,charts:[],carregando:false};
function mesIni(m){return m+"-01"}
function mesFim(m){const d=new Date(m+"-01T12:00:00");d.setMonth(d.getMonth()+1);d.setDate(0);return iso(d)}
function addMes(m,n){const d=new Date(m+"-15T12:00:00");d.setMonth(d.getMonth()+n);return iso(d).slice(0,7)}

function camDaCarga(c){return S.caminhoes[camKey(c)]||null}
function capCargaH(c){const cam=camDaCarga(c);if(!cam)return 0;return arr(c.caixas).reduce((s,b,i)=>s+capCaixa(cam,i,b&&b.produto),0)}
function camLabel(c){const cam=camDaCarga(c);return cam?(cam.apelido||cam.placa):(c.placa||"Sem placa")}
function catProd(p){p=norm(p);if(/MILHO/.test(p))return"Milho";if(/PNDR|FARELO|SOJA/.test(p))return"Farelos / PNDR";if(/PRE.?PARTO|BEZERR|CORTE|AVES|SUIN|POEDEIR/.test(p))return"Outras rações";if(/FAREL/.test(p))return"Ração farelada";if(/PELET|ORION|LEITE/.test(p))return"Ração peletizada";return"Outros"}
function prodNome(p){return norm(p).replace(/^\d+\s*-\s*/,"").slice(0,32)}
function addTo(o,k,v){o[k]=(o[k]||0)+v}
function cargasIndicadores(){const C=Object.assign({},IND.dados||{});Object.entries(S.cargas).forEach(([k,c])=>{if(c.data>=IND.ini&&c.data<=IND.fim)C[k]=c});return C}

function statsMes(C,m,ateDia){
  const ini=mesIni(m);let fim=mesFim(m);if(ateDia){const f=m+"-"+String(ateDia).padStart(2,"0");if(f<fim)fim=f}const L=Object.entries(C).filter(([,c])=>c.data>=ini&&c.data<=fim);
  const r={kgKm:0,nKm:0,nKmReal:0,custo:0,desp:0,n:L.length,kg:0,kgEnt:0,ocS:0,ocN:0,baixa:0,km:0,fr:0,paradas:0,atrasoReg:0,cli:new Set(),noPrazo:0,avaliadas:0,leadS:0,leadN:0,porDia:{},porDiaEnt:{},porCam:{},camOc:{},porCli:{},porCid:{},porVend:{},porProd:{},porCat:{}};
  L.forEach(([id,c])=>{const k=kgTotal(c);r.kg+=k;const ent=c.entregas||{};
    const cap=capCargaH(c);if(cap&&k){const o=Math.min(1,k/cap);r.ocS+=o;r.ocN++;if(o<0.8)r.baixa++;const lb=camLabel(c);(r.camOc[lb]=r.camOc[lb]||[]).push(o)}
    const cc=custoCarga(id,c);if(cc.km){r.km+=cc.km;r.kgKm+=k;r.nKm++;if(cc.kmReal)r.nKmReal++}r.custo+=cc.total;r.desp+=cc.desp;r.fr+=freteCarga(c);if(Object.keys(c.atrasos||{}).length)r.atrasoReg++;

/* previsão de recompra: intervalo mediano entre entregas de cada cliente */
function previsaoClientes(C){
  const ent={};Object.values(C).forEach(c=>{const kgCli={};arr(c.caixas).forEach(b=>{if(b&&b.clienteId)addTo(kgCli,b.clienteId,+b.kg||0)});Object.entries(kgCli).forEach(([k,kg])=>{(ent[k]=ent[k]||{})[c.data]=(ent[k][c.data]||0)+kg})});
  const al=alocacoes();const temPedido={};Object.entries(S.pedidos).forEach(([id,p])=>{if(!p.cancelado&&p.dataEntrega>=addDias(hoje(),-3)&&(+p.kg||0)-(((al[id]||{}).entregue)||0)>50)temPedido[p.clienteId]=p.dataEntrega});
  const med=a=>{const s=a.slice().sort((x,y)=>x-y);const n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0};
  const out=[];
  Object.entries(ent).forEach(([k,o])=>{const ds=Object.keys(o).sort();if(ds.length<3)return;const iv=[];for(let i=1;i<ds.length;i++){const d=difDias(ds[i],ds[i-1]);if(d>0)iv.push(d)}if(iv.length<2)return;const f=Math.max(1,Math.round(med(iv)));const ult=ds[ds.length-1];const prev=addDias(ult,f);const falta=difDias(prev,hoje());
    if(falta>7||falta<-Math.max(20,f))return;out.push({k,f,ult,prev,falta,kg:med(Object.values(o)),ped:temPedido[k]})});
  return out.sort((a,b)=>a.falta-b.falta);
}

function kmCarroMes(lanc,mes){
  const L=Object.values(lanc||{});const tot=L.find(x=>x.tipo==="total"&&x.mes===mes);
  const porDia={};L.forEach(x=>{if(x.tipo!=="total"&&x.km&&x.data&&(!porDia[x.data]||(x.ts||0)>=(porDia[x.data].ts||0)))porDia[x.data]=x});

const KMC={iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")},hoje(){return KMC.iso(new Date())},add(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return KMC.iso(d)},dif(a,b){return Math.round((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/864e5)},segunda(){const d=new Date();const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return KMC.iso(d)}};

}
function nums(s){return s.split(/[,;\s]+/).map(x=>parseInt(x.replace(/\./g,""),10)).filter(x=>x>0)}
function salvarCaminhao(k){const m=document.getElementById("cm-m-"+k).value;const d={apelido:document.getElementById("cm-a-"+k).value.trim(),placa:document.getElementById("cm-p-"+k).value.trim().toUpperCase(),caixas:nums(document.getElementById("cm-c-"+k).value),caixasFarel:nums(document.getElementById("cm-f-"+k).value),obs:document.getElementById("cm-o-"+k).value.trim(),cidadesBloq:document.getElementById("cm-cb-"+k).value.trim(),motoristaUid:m,motoristaNome:m?(S.motoristas[m].nome||S.motoristas[m].email):(S.caminhoes[k].motoristaNome||"")};if(!d.caixas.length){toast("Informe as caixas",true);return}db.ref("cargas_caminhoes/"+k).update(d).then(()=>toast("Caminhão salvo"))}
function novoCaminhao(){const p=prompt("Placa do caminhão");if(!p)return;const k=p.toUpperCase().replace(/[^A-Z0-9]/g,"");db.ref("cargas_caminhoes/"+k).set({apelido:k,placa:k,caixas:[3000,3000,3000,3000,3000,3000],caixasFarel:[]}).then(abrirCaminhoes)}

/* ================= Sheet ================= */
function abrirSheet(h){document.getElementById("sh").innerHTML=h;document.getElementById("sheet").classList.add("on")}
function fecharSheet(){document.getElementById("sheet").classList.remove("on")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")fecharSheet()});
</script>
