  const resumo='<table><thead><tr><th>Vendedor</th><th class="r">Parcelas</th><th class="r">A receber dos clientes</th><th class="r">Comissão prevista</th><th class="r">Vendido no mês</th><th class="r">Ticket médio</th></tr></thead><tbody>'+blocos.map(b=>'<tr><td>'+comEsc(comNome(b.v))+'</td><td class="r">'+b.r.parcelas.length+'</td><td class="r">'+comBrl(b.r.receb)+'</td><td class="r"><b>'+comBrl(b.r.comMes)+'</b></td><td class="r">'+comBrl(b.r.valor)+' · '+(b.r.kg/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+' t</td><td class="r">'+comBrl(b.r.ticket)+'</td></tr>').join("")+'<tr><td colspan="3"><b>Total</b></td><td class="r"><b>'+comBrl(tot)+'</b></td><td colspan="2"></td></tr></tbody></table>';
  const det=blocos.map(b=>'<section><h2>'+comEsc(comNome(b.v))+' — comissão prevista '+comBrl(b.r.comMes)+'</h2>'+(b.r.parcelas.length?'<table><thead><tr><th>Vencimento</th><th>Cliente</th><th>Pedido</th><th>Ração</th><th class="r">Parcela</th><th class="r">%</th><th class="r">Comissão</th></tr></thead><tbody>'+b.r.parcelas.map(p=>'<tr><td>'+fd(p.data)+'</td><td>'+comEsc(p.cliente)+'</td><td>'+comEsc((p.tipo==="contrato"?"contrato ":"")+(p.crm||""))+'</td><td>'+comEsc(String(p.produto).replace(/^\d+\s*-\s*/,""))+'</td><td class="r">'+comBrl(p.valor)+'</td><td class="r">'+(p.pct!=null?p.pct.toLocaleString("pt-BR")+"%":"—")+'</td><td class="r"><b>'+comBrl(p.comissao)+'</b></td></tr>').join("")+'</tbody></table>':'<p>Sem parcelas vencendo neste mês.</p>')+'</section>').join("");
  w.document.write('<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Previsão de comissões '+mes+'</title><style>@page{size:A4;margin:14mm 12mm}body{font-family:Arial,sans-serif;color:#0f172a;font-size:11px}h1{font-size:18px;margin:0}h2{font-size:13px;margin:18px 0 6px;color:#052e16}.s{color:#475569;font-size:11px;margin:2px 0 12px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #e2e8f0;padding:4px 6px;text-align:left;vertical-align:top}th{background:#f0fdf4;font-size:10px}.r{text-align:right}section{page-break-inside:avoid}.k{font-size:10.5px;color:#475569;margin-top:14px}</style></head><body><img src="meta_logo.jpg" style="height:30px" onerror="this.remove()"><h1>Previsão de recebimento de comissões — '+comNomeMes(mes)+'</h1><div class="s">Pelos vencimentos das parcelas dos pedidos do CRM · gerado em '+new Date().toLocaleString("pt-BR")+'</div>'+resumo+det+'<div class="k">Taxas: tabela A '+cfg.A+'% · B '+cfg.B+'% · C '+cfg.C+'% · milho moído '+cfg.milho+'%. Previsão: a comissão de cada parcela entra no mês do vencimento; depende do pagamento do cliente em dia.</div><script>setTimeout(function(){print()},500)<\/script></body></html>');w.document.close()}

  h+='<div class="card tbl"><table><thead><tr><th>Vendedor</th><th class="r">Comissão prevista no mês</th><th class="r">Parcelas</th><th class="r">Próximo mês</th><th class="r">Vendido no mês</th><th class="r">Toneladas</th><th class="r">Pedidos</th><th class="r">Ticket médio</th><th class="r">R$/t</th><th></th></tr></thead><tbody>'+
    vends.map(v=>{const r=comResumo(L,m,v),n=comResumo(L,comAddMes(m,1),v);if(!r.parcelas.length&&!r.nPed&&!n.comMes)return"";return'<tr style="cursor:pointer" onclick="comfVend(\''+v+'\')"><td><b>'+esc(comNome(v))+'</b></td><td class="r num"><b>'+comBrl(r.comMes)+'</b></td><td class="r num">'+r.parcelas.length+'</td><td class="r num muted">'+comBrl(n.comMes)+'</td><td class="r num">'+comBrl(r.valor)+'</td><td class="r num">'+(r.kg/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+'</td><td class="r num">'+r.nPed+'</td><td class="r num">'+(r.nPed?comBrl(r.ticket):"—")+'</td><td class="r num">'+(r.kg?comBrl(r.precoT):"—")+'</td><td><button class="btn btn-o btn-sm" onclick="event.stopPropagation();comPdf(comfLista(),COMF.mes,[\''+v+'\'],COMF.cfg)">PDF</button></td></tr>'}).join("")+'</tbody></table></div>';
  h+='<div class="small muted" style="margin:-4px 0 12px">Taxas: tabela A '+cfg.A+'% · B '+cfg.B+'% · C '+cfg.C+'% · milho moído '+cfg.milho+'%. Considera os pedidos e contratos lançados pelo PDF do CRM (que trazem valor e vencimentos). A comissão de cada parcela entra no mês do vencimento.</div>';
  h+='<div class="charts"><div class="chc wide"><div class="chh"><b>Comissão prevista — próximos 6 meses</b></div><div class="cv" style="height:250px"><canvas id="cc-6"></canvas></div></div></div>';
  el.innerHTML=h;if(!window.Chart)return;const ms=[];for(let i=0;i<6;i++)ms.push(comAddMes(m,i));const pal=["#15803d","#2563eb","#d97706","#7c3aed","#0e7490","#be123c","#65a30d","#475569"];
  COMCH.push(new Chart(document.getElementById("cc-6"),{type:"bar",data:{labels:ms.map(x=>comNomeMes(x).split(" ")[0].slice(0,3)+"/"+x.slice(2,4)),datasets:vends.slice(0,8).map((v,i)=>({label:comNome(v),data:ms.map(x=>Math.round(comResumo(L,x,v).comMes)),backgroundColor:pal[i],stack:"a"}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10}},tooltip:{callbacks:{label:c=>c.dataset.label+": "+comBrl(c.raw)}}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,ticks:{callback:v=>"R$ "+v.toLocaleString("pt-BR")}}}}}));
}
function comfVend(v){const m=COMF.mes;const L=comfLista();const r=comResumo(L,m,v);const vendidos=L.filter(x=>x.vendedor===v&&(x.emissao||"").slice(0,7)===m);
  abrirSheet('<div class="sh-h"><h3>'+esc(comNome(v))+' — '+comNomeMes(m)+'</h3><button class="x" onclick="fecharSheet()">×</button></div><div class="stat"><div>Comissão prevista<b>'+comBrl(r.comMes)+'</b></div><div>A receber dos clientes<b>'+comBrl(r.receb)+'</b></div><div>Vendido no mês<b>'+comBrl(r.valor)+'</b></div><div>Ticket médio<b>'+(r.nPed?comBrl(r.ticket):"—")+'</b></div></div>'+
  '<b style="display:block;margin:12px 0 4px">Parcelas vencendo no mês</b>'+(r.parcelas.map(p=>'<div class="row"><div class="main"><b>'+esc(p.cliente)+'</b><span>vence '+fData(p.data)+' · '+(p.tipo==="contrato"?"contrato ":"pedido ")+esc(p.crm)+' · '+esc(String(p.produto).replace(/^\d+\s*-\s*/,""))+'</span></div><div style="text-align:right"><b class="num">'+comBrl(p.comissao)+'</b><div class="small muted num">'+comBrl(p.valor)+' × '+(p.pct!=null?p.pct+"%":"?")+'</div></div></div>').join("")||'<div class="vazio">Nenhuma parcela vence neste mês.</div>')+
  '<b style="display:block;margin:14px 0 4px">Vendas do mês</b>'+(vendidos.map(x=>'<div class="row"><div class="main"><b>'+esc(x.cliente)+'</b><span>'+fData(x.emissao)+' · '+esc(String(x.produto).replace(/^\d+\s*-\s*/,""))+' · tabela '+esc(x.tabela||"?")+' ('+(x.pct!=null?x.pct+"%":"?")+')</span></div><div style="text-align:right"><b class="num">'+comBrl(x.total)+'</b><div class="small muted num">'+(x.kg/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+' t</div></div></div>').join("")||'<div class="vazio">Nenhuma venda lançada neste mês.</div>')+
  '<div class="sh-f"><button class="btn btn-g" onclick="comPdf(comfLista(),COMF.mes,[\''+v+'\'],COMF.cfg)">PDF da previsão</button></div>')}
function comfTaxas(){const c=Object.assign({},COM_PADRAO,COMF.cfg);if(ROLE!=="admin"){toast("Só o administrador altera as taxas",true);return}
  abrirSheet('<div class="sh-h"><h3>Taxas de comissão (%)</h3><button class="x" onclick="fecharSheet()">×</button></div><div class="small muted">Valem para pedidos sem taxa gravada. Pedidos já lançados guardam a taxa do dia do lançamento.</div><div class="grid2"><div><label class="f">Tabela A</label><input class="inp num" id="ct-A" type="number" step="0.1" value="'+c.A+'"></div><div><label class="f">Tabela B</label><input class="inp num" id="ct-B" type="number" step="0.1" value="'+c.B+'"></div><div><label class="f">Tabela C</label><input class="inp num" id="ct-C" type="number" step="0.1" value="'+c.C+'"></div><div><label class="f">Milho moído</label><input class="inp num" id="ct-m" type="number" step="0.1" value="'+c.milho+'"></div></div><div class="sh-f"><button class="btn btn-g" onclick="const v=k=>parseFloat(document.getElementById(k).value);const o={A:v(\'ct-A\'),B:v(\'ct-B\'),C:v(\'ct-C\'),milho:v(\'ct-m\')};if(Object.values(o).some(x=>!(x>=0))){toast(\'Valores inválidos\',true);return}db.ref(\'comissao_config\').set(o).then(()=>{fecharSheet();toast(\'Taxas salvas\')})">Salvar</button></div>')}
/* ===== Rio Bonito: liberado para todos os caminhões; bloqueio só em dia de chuva (correção feita uma vez) ===== */
function cidadesChuva(){return String((S.config&&S.config.cidadesChuva)||"").split(",").map(x=>norm(x)).filter(Boolean)}
function migrarRioBonito(){if(!S.config||S.config.migRioBonito||(ROLE!=="admin"&&ROLE!=="logistica"))return;const up={};
  Object.entries(S.caminhoes).forEach(([k,c])=>{if(c.cidadesBloq){const l=String(c.cidadesBloq).split(",").map(x=>x.trim()).filter(x=>x&&!/RIO\s*BONITO/i.test(norm(x)));const nv=l.join(", ");if(nv!==String(c.cidadesBloq).trim())up["cargas_caminhoes/"+k+"/cidadesBloq"]=nv||null}
    if(c.obs&&/n[aã]o vai (?:para|pra) [^.;]*rio\s*bonito/i.test(c.obs))up["cargas_caminhoes/"+k+"/obs"]=String(c.obs).replace(/n[aã]o vai (?:para|pra) [^.;]*rio\s*bonito[^.;]*[.;]?\s*/i,"").trim()||null});
  const cc=cidadesChuva();if(!cc.some(x=>x.includes("RIO BONITO")))up["cargas_config/cidadesChuva"]=[...String((S.config&&S.config.cidadesChuva)||"").split(",").map(x=>x.trim()).filter(Boolean),"Rio Bonito"].join(", ");
  up["cargas_config/migRioBonito"]=true;db.ref().update(up).then(()=>{if(Object.keys(up).length>2)toast("Rio Bonito liberado para todos os caminhões (exceto em dia de chuva)")})}

/* ================= CAMINHÕES ================= */
function abrirCaminhoes(){
  abrirSheet('<div class="sh-h"><h3>Caminhões</h3><button class="x" onclick="fecharSheet()">×</button></div><div class="card" style="margin-top:8px"><b>Cidades sem acesso em dia de chuva</b><div class="small muted" style="margin:2px 0 8px">Vale para todos os caminhões. Com o dia marcado como chuvoso, entregas nessas cidades ficam bloqueadas.</div><div style="display:flex;gap:8px"><input class="inp" id="cid-chuva" value="'+esc((S.config&&S.config.cidadesChuva)||"")+'" placeholder="ex: Rio Bonito, Laranjeiras"><button class="btn btn-o btn-sm" onclick="db.ref(\'cargas_config/cidadesChuva\').set(document.getElementById(\'cid-chuva\').value.trim()||null).then(()=>toast(\'Salvo\'))">Salvar</button></div></div><div class="card" style="margin-top:8px"><b>Ponto de saída (fábrica)</b><div class="small muted" style="margin:2px 0 8px">'+(origem()?esc(origem().nome)+' · '+origem().lat.toFixed(5)+', '+origem().lng.toFixed(5):'Usando o centro de Candói-PR. Cole o link da fábrica no Maps (ou use o GPS estando lá) para ficar exato.')+'</div><input class="inp" id="or-n" placeholder="Nome (ex: Fábrica Coacan)" value="'+esc((S.config.origem||{}).nome||"")+'"><input class="inp" id="or-ll" placeholder="Link do Google Maps ou lat, lng" style="margin-top:6px"><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-g btn-sm" onclick="salvarOrigem()">Salvar</button><button class="btn btn-o btn-sm" onclick="salvarOrigem(1)">Usar minha localização</button></div></div><div class="small muted">Capacidade por caixa para ração peletizada, milho moído e PNDR. A farelada usa a coluna própria (ou −10% se vazia).</div>'+Object.entries(S.caminhoes).map(([k,v])=>'<div class="card" style="margin-top:10px"><div class="grid3"><div><label class="f">Apelido</label><input class="inp" id="cm-a-'+k+'" value="'+esc(v.apelido||"")+'"></div><div><label class="f">Placa</label><input class="inp" id="cm-p-'+k+'" value="'+esc(v.placa||"")+'"></div><div><label class="f">Motorista padrão</label><select class="inp" id="cm-m-'+k+'"><option value="">—</option>'+Object.entries(S.motoristas).map(([u,m])=>'<option value="'+u+'"'+(u===v.motoristaUid?" selected":"")+'>'+esc(m.nome||m.email)+'</option>').join("")+'</select></div></div><label class="f">Caixas pelet (kg, separadas por vírgula)</label><input class="inp num" id="cm-c-'+k+'" value="'+(v.caixas||[]).join(", ")+'"><label class="f">Caixas farelada (kg)</label><input class="inp num" id="cm-f-'+k+'" value="'+(v.caixasFarel||[]).join(", ")+'"><label class="f">Custo fixo mensal (R$) — parcela, seguro, salário do motorista…</label><input class="inp num" type="number" step="0.01" id="cm-fx-'+k+'" value="'+(v.custoFixoMensal||"")+'"><label class="f">Cidades onde não entra (separadas por vírgula)</label><input class="inp" id="cm-cb-'+k+'" value="'+esc(v.cidadesBloq||"")+'" placeholder="ex: Rio Bonito"><label class="f">Observação</label><input class="inp" id="cm-o-'+k+'" value="'+esc(v.obs||"")+'"><button class="btn btn-g btn-sm" style="margin-top:10px" onclick="salvarCaminhao(\''+k+'\')">Salvar</button></div>').join("")+'<button class="btn btn-o" style="width:100%;margin-top:10px" onclick="novoCaminhao()">+ Adicionar caminhão</button>');
}
function salvarOrigem(gps){
  const nome=document.getElementById("or-n").value.trim()||"Fábrica";
  const grava=(lat,lng)=>db.ref("cargas_config/origem").set({nome,lat,lng}).then(()=>{toast("Ponto de saída salvo");abrirCaminhoes()});
  if(gps){navigator.geolocation.getCurrentPosition(p=>grava(p.coords.latitude,p.coords.longitude),()=>toast("Não consegui o GPS",true),{enableHighAccuracy:true,timeout:15000});return}
  const v=document.getElementById("or-ll").value;const m=v.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||v.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||v.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  if(!m){if(origem()){db.ref("cargas_config/origem/nome").set(nome).then(()=>toast("Nome salvo"));return}toast("Cole o link do Maps ou 'lat, lng'",true);return}grava(+m[1],+m[2]);
}
function nums(s){return s.split(/[,;\s]+/).map(x=>parseInt(x.replace(/\./g,""),10)).filter(x=>x>0)}
function salvarCaminhao(k){const m=document.getElementById("cm-m-"+k).value;const d={apelido:document.getElementById("cm-a-"+k).value.trim(),placa:document.getElementById("cm-p-"+k).value.trim().toUpperCase(),caixas:nums(document.getElementById("cm-c-"+k).value),caixasFarel:nums(document.getElementById("cm-f-"+k).value),obs:document.getElementById("cm-o-"+k).value.trim(),cidadesBloq:document.getElementById("cm-cb-"+k).value.trim(),custoFixoMensal:parseFloat(document.getElementById("cm-fx-"+k).value)||null,motoristaUid:m,motoristaNome:m?(S.motoristas[m].nome||S.motoristas[m].email):(S.caminhoes[k].motoristaNome||"")};if(!d.caixas.length){toast("Informe as caixas",true);return}db.ref("cargas_caminhoes/"+k).update(d).then(()=>toast("Caminhão salvo"))}
function novoCaminhao(){const p=prompt("Placa do caminhão");if(!p)return;const k=p.toUpperCase().replace(/[^A-Z0-9]/g,"");db.ref("cargas_caminhoes/"+k).set({apelido:k,placa:k,caixas:[3000,3000,3000,3000,3000,3000],caixasFarel:[]}).then(abrirCaminhoes)}

/* ================= Sheet ================= */
function abrirSheet(h){document.getElementById("sh").innerHTML=h;document.getElementById("sheet").classList.add("on")}
function fecharSheet(){document.getElementById("sheet").classList.remove("on")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")fecharSheet()});
</script>
</body>
</html>
