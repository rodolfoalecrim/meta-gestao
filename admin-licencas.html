<style>
:root{--bg:#f3f6f3;--card:#fff;--border:#e2e8f0;--line:#f1f5f9;--text:#0f172a;--muted:#64748b;--faint:#94a3b8;--G:#15803d;--GD:#12305c;--GL:#f0fdf4;--amber:#b45309;--amberL:#fffbeb;--red:#dc2626;--redL:#fef2f2;--blue:#2a78d6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}button{cursor:pointer}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}.num{text-align:right;white-space:nowrap}
.inp,.sel{border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:#fff;width:100%;min-width:0}.inp:focus,.sel:focus{border-color:var(--G);outline:none}
.btn{border:1px solid transparent;border-radius:9px;padding:9px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;justify-content:center}
.btn-g{background:var(--G);color:#fff}.btn-o{background:#fff;border-color:var(--border)}.btn-r{background:#fff;color:var(--red);border-color:#fecaca}.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}.btn:disabled{opacity:.5}
#login{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;background:var(--GD)}
.lb{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:360px}.lb h1{font-size:20px;margin-bottom:4px}.lb p{color:var(--muted);font-size:13px;margin-bottom:14px}.lb .inp{margin-bottom:8px;padding:12px;font-size:15px}.lb .btn{width:100%;padding:12px;font-size:15px}
#app{display:none}
.top{background:var(--GD);color:#fff;position:sticky;top:0;z-index:5}.top-in{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}.top b{font-size:16px;margin-right:auto}.top .btn-o{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
main{max-width:1200px;margin:0 auto;padding:16px 16px 80px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin-bottom:4px}h3{font-size:15px;margin-bottom:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer}.kpi.on{border-color:var(--G);box-shadow:inset 0 0 0 1px var(--G)}.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}.kpi .v{font-size:24px;font-weight:800;margin-top:2px}.kpi .v small{font-size:12px;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}tr.cl{cursor:pointer}tr.cl:hover td{background:#fafcfa}
.tw{overflow-x:auto}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap}.chip.ok{background:#dcfce7;color:#166534}.chip.warn{background:var(--amberL);color:var(--amber)}.chip.bad{background:var(--redL);color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}.fld.w2{grid-column:1/-1}
@media(max-width:640px){.grid{grid-template-columns:1fr}.hide-m{display:none}}
#mdw{display:none;position:fixed;inset:0;background:rgba(2,20,10,.45);z-index:30;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}#md{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:640px}#md.lg{max-width:920px}
.md-f{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.cred{white-space:pre-wrap;user-select:all;border:1px solid var(--border);border-radius:9px;padding:12px;font-family:ui-monospace,monospace;background:#fafafa;margin:8px 0}
.sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--G);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;transition:.25s;z-index:50;max-width:90vw}#toast.on{transform:translateX(-50%) translateY(0)}
.vnav{display:flex;gap:2px;margin-right:auto;margin-left:14px}.vnav button{background:none;border:none;color:#fff;opacity:.7;font-weight:700;padding:7px 11px;border-radius:8px}.vnav button.on{opacity:1;background:rgba(255,255,255,.14)}
.top b{margin-right:0!important}.err-st{font-family:ui-monospace,monospace;font-size:11.5px;white-space:pre-wrap;background:#f7f8fa;border:1px solid var(--border);border-radius:8px;padding:8px;max-height:220px;overflow:auto;margin-top:6px}
tr.ex>td{background:#fafbfc}.bk-st{list-style:decimal;margin:6px 0 0 20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.45}
.empty{text-align:center;padding:30px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
</style>

const firebaseConfig={apiKey:"AIzaSyClpsHjO8OLThD--hDOfg7Fg3t6hhuM-To",authDomain:"meta-gestao-608d7.firebaseapp.com",databaseURL:"https://meta-gestao-608d7-default-rtdb.firebaseio.com",projectId:"meta-gestao-608d7",storageBucket:"meta-gestao-608d7.firebasestorage.app",messagingSenderId:"318618053627",appId:"1:318618053627:web:ae289200bd1e87be29395e"};
/* endereço do formulador que vai na mensagem para o comprador — ajuste quando publicar */
let URL_FORMULADOR=location.origin+"/app-formulador.html";try{URL_FORMULADOR=localStorage.getItem("lic_url")||URL_FORMULADOR}catch(e){}
function configURL(){const v=prompt("Endereço onde o formulador está publicado (vai na mensagem para o comprador):",URL_FORMULADOR);if(v&&v.trim()){URL_FORMULADOR=v.trim();try{localStorage.setItem("lic_url",URL_FORMULADOR)}catch(e){}toast("Endereço salvo")}}
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();
/* RDS Gestão: licença com contas_info/{id}/gestao = true usa o painel e o app RDS Fazenda (dados em contas/{id}/gestao).
   Cobrança por fazenda ativa: a função rdsGestaoUso grava todo dia contas_info/{id}/gestao_uso e o maior número do mês em contas_uso/{id}/gestao/{AAAA-MM}. */
const GEST_VALOR=100,URL_GESTAO="https://rds-gestao.web.app/painel";
const gestN=c=>((c.gestao_uso||{}).fazendas_ativas)||0;
const gestV=c=>c.gestao_valor!=null?+c.gestao_valor:GEST_VALOR;
const gestAtiva=c=>c.gestao===true&&situacao(c)[1]!=="bad";
function gestaoBloco(id,c){if(c.gestao!==true)return'<div class="small muted">Não liberado. Para liberar, escolha “RDS Gestão: Liberado” nos dados do cliente, aqui embaixo, e salve.</div>';
  const u=c.gestao_uso||{};return'<div class="kpis" style="margin:0 0 8px"><div class="kpi"><div class="l">Fazendas ativas</div><div class="v">'+(u.fazendas_ativas||0)+'</div></div><div class="kpi"><div class="l">Com o app do produtor</div><div class="v">'+(u.com_app||0)+'</div></div><div class="kpi"><div class="l">Valor por fazenda</div><div class="v"><small>R$</small> '+f(gestV(c),0)+'</div></div><div class="kpi"><div class="l">Estimado no mês</div><div class="v"><small>R$</small> '+f((u.fazendas_ativas||0)*gestV(c),0)+'</div></div></div>'+
    '<div class="small muted">Contagem atualizada todo dia de madrugada'+(u.em?' (última: '+fData(u.em)+')':' (ainda não rodou)')+'. Painel: <a href="'+URL_GESTAO+'" target="_blank" rel="noopener">'+esc(URL_GESTAO.replace(/^https:\/\//,""))+'</a> · os logins são os mesmos desta licença.</div><div id="gest-hist" class="small" style="margin-top:6px"></div>'}
function gestHist(id){const c=LIC[id];if(!c||c.gestao!==true)return;db.ref("contas_uso/"+id+"/gestao").once("value").then(s=>{const v=s.val()||{};const ms=Object.keys(v).sort().reverse().slice(0,12);const el=$("gest-hist");if(!el||!ms.length)return;
  el.innerHTML='<table><thead><tr><th>Mês</th><th class="num">Fazendas (máximo no mês)</th><th class="num">Valor</th></tr></thead><tbody>'+ms.map(m=>'<tr><td>'+m.slice(5)+"/"+m.slice(0,4)+'</td><td class="num">'+v[m]+'</td><td class="num">R$ '+f(v[m]*gestV(c),0)+'</td></tr>').join("")+'</tbody></table>'}).catch(()=>{})}
const PLANOS=[["Teste 7 dias",0],["Mensal",1],["Trimestral",3],["Semestral",6],["Anual",12],["Cortesia",12]];
const TESTE="Teste 7 dias";
let LIC_WA="";try{LIC_WA=localStorage.getItem("lic_wa")||""}catch(e){}
function configWA(){const v=prompt("WhatsApp do suporte (só números, com DDD). Vai nas licenças novas: o cliente em teste usa para contratar.",LIC_WA);if(v==null)return;LIC_WA=v.replace(/\D/g,"");try{localStorage.setItem("lic_wa",LIC_WA)}catch(e){}toast(LIC_WA?"WhatsApp salvo":"WhatsApp removido")}
function somaDias(data,n){const d=new Date((data||hoje())+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
/* fim da validade em milissegundos (23h59 de Brasília): as regras do banco cortam o acesso sozinhas depois disso */
function fimMs(v){return v?new Date(v+"T23:59:59-03:00").getTime():null}
const PAPEIS={admin:"Administrador",tecnico:"Técnico",leitura:"Consulta"};
let LIC={},EQ={},USR={},APAR={},SUPL={},FILTRO="",BUSCA="",NOME="";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f=(x,d)=>x==null||!isFinite(x)?"—":(+x).toLocaleString("pt-BR",{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d});
const hoje=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())};
const fData=s=>{if(!s)return"—";const d=String(s).slice(0,10).split("-");return d.length===3?d[2]+"/"+d[1]+"/"+d[0]:s};
const dias=s=>s?Math.round((new Date(s+"T12:00:00")-new Date(hoje()+"T12:00:00"))/864e5):null;
function somaMeses(data,m){const d=new Date((data||hoje())+"T12:00:00");d.setMonth(d.getMonth()+m);return d.toISOString().slice(0,10)}
function toast(m,err){const e=$("toast");e.textContent=m;e.style.background=err?"var(--red)":"var(--G)";e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),3200)}
function abrirModal(h,lg){$("md").className=lg?"lg":"";$("md").innerHTML=h;$("mdw").style.display="flex"}
function fecharModal(){$("mdw").style.display="none"}
function senhaAleatoria(){const c="abcdefghjkmnpqrstuvwxyz23456789";let s="";for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function msgErro(e){return e.code==="auth/email-already-in-use"?"este e-mail já tem login.":e.code==="auth/invalid-email"?"e-mail inválido.":e.code==="auth/weak-password"?"senha fraca (mín. 6 caracteres).":e.message}
function login(){const e=$("l-e").value.trim(),s=$("l-s").value;if(e&&s)auth.signInWithEmailAndPassword(e,s).catch(()=>$("l-m").textContent="E-mail ou senha incorretos.")}
auth.onAuthStateChanged(async u=>{if(!u){$("login").style.display="flex";$("app").style.display="none";return}
  let us={};try{us=(await db.ref("usuarios/"+u.uid).once("value")).val()||{}}catch(e){}
  if(us.plataforma!==true){$("l-m").textContent="Este usuário não administra a plataforma.";auth.signOut();return}
  NOME=us.nome||u.email;$("login").style.display="none";$("app").style.display="block";carregar()});
async function carregar(){$("m").innerHTML='<div class="empty"><b>Carregando…</b></div>';
  try{const[a,b]=await Promise.all([db.ref("contas_info").once("value"),db.ref("contas_equipe").once("value")]);LIC=a.val()||{};EQ=b.val()||{};
    const uids=new Set();Object.values(EQ).forEach(c=>Object.keys(c||{}).forEach(k=>uids.add(k)));
    const rs=await Promise.all([...uids].map(k=>db.ref("usuarios/"+k).once("value").then(s=>[k,s.val()]).catch(()=>[k,null])));USR={};rs.forEach(([k,v])=>{if(v)USR[k]=v});try{APAR=(await db.ref("aparelhos").once("value")).val()||{}}catch(e){APAR={}}try{SUPL=(await db.ref("contas_suporte").once("value")).val()||{}}catch(e){SUPL={}}
    {const up={};Object.entries(LIC).forEach(([id,c])=>{const f=fimMs(c.validade);if(f&&c.fim!==f){up[id+"/fim"]=f;c.fim=f}});if(Object.keys(up).length)db.ref("contas_info").update(up).catch(e=>console.warn("fim",e))}
    render()}

function supLog(id){db.ref("contas_suporte_log/"+id).orderByKey().limitToLast(8).once("value").then(s=>{const l=Object.values(s.val()||{}).sort((a,b)=>b.ts-a.ts);const el=$("sup-log");if(!el||!l.length)return;
  el.innerHTML='<table><tbody>'+l.map(x=>'<tr><td class="small">'+new Date(x.ts).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})+'</td><td class="small">'+esc(SUP_TIPO[x.tipo]||x.tipo)+(x.det?' · '+esc(x.det):'')+'</td><td class="tiny muted">'+esc(x.quem||"")+'</td></tr>').join("")+'</tbody></table>'}).catch(()=>{})}
async function renovar(id,plano,m){const c=LIC[id];const base=c.validade&&c.validade>hoje()?c.validade:hoje();const nova=somaMeses(base,m);const v=prompt("Valor recebido pela renovação "+plano+" (R$):",c.plano===plano&&c.valor?c.valor:"");if(v===null)return;
  const up={validade:nova,plano,ativo:true,fim:fimMs(nova)};if(c.tipo==="teste"){up.tipo=null;if(!c.suporte_wa&&LIC_WA)up.suporte_wa=LIC_WA}if(v!=="")up.valor=+String(v).replace(",",".");up["historico/"+db.ref().push().key]={data:new Date().toISOString(),tipo:c.tipo==="teste"?"conversao":"renovacao",plano,valor:v!==""?+String(v).replace(",","."):0,validade:nova,por:NOME};
  await db.ref("contas_info/"+id).update(up);toast("Renovada até "+fData(nova));await carregar();abrirLicenca(id)}
async function ativar(id,on){if(!on&&!confirm("Suspender o acesso de "+LIC[id].nome+"? Ninguém da conta consegue entrar até reativar. Os dados ficam guardados."))return;
  await db.ref("contas_info/"+id).update({ativo:!!on,["historico/"+db.ref().push().key]:{data:new Date().toISOString(),tipo:on?"reativacao":"suspensao",por:NOME}});toast(on?"Acesso reativado":"Acesso suspenso");await carregar();abrirLicenca(id)}
async function salvarDados(id){const c=lerForm();if(!c.nome){toast("Informe o nome da conta",true);return}const up={};Object.entries(c).forEach(([k,v])=>up[k]=v===""?null:v);up.fim=fimMs(c.validade);await db.ref("contas_info/"+id).update(up);toast("Dados salvos");await carregar();abrirLicenca(id)}
function novoLogin(id){const c=LIC[id];const n=Object.keys(EQ[id]||{}).length;
  if(n&&!supLib(id)){toast("Esta conta já está em uso: o novo login é criado pelo administrador da licença (Opções → Licença → Equipe e logins). Para a administração criar, ele precisa liberar o suporte.",true);return}if(c.max_logins&&n>=c.max_logins&&!confirm("Esta licença já tem "+n+" de "+c.max_logins+" logins. Criar mesmo assim?"))return;
  abrirModal('<h2>Novo login — '+esc(c.nome)+'</h2><div class="grid"><div class="fld"><label>Nome</label><input class="inp" id="n-nome"></div><div class="fld"><label>E-mail</label><input class="inp" id="n-email" type="email"></div><div class="fld"><label>Senha inicial</label><input class="inp" id="n-senha" value="'+senhaAleatoria()+'"></div><div class="fld"><label>Perfil</label><select class="sel" id="n-papel">'+Object.entries(PAPEIS).map(([k,l])=>'<option value="'+k+'"'+(k==="tecnico"?" selected":"")+'>'+l+'</option>').join("")+'</select></div></div><p class="small" id="n-m" style="color:var(--red);margin-top:8px"></p><div class="md-f"><button class="btn btn-o" onclick="abrirLicenca(\''+id+'\')">Voltar</button><button class="btn btn-g" onclick="criarLogin(\''+id+'\')">Criar login</button></div>')}
async function criarLogin(id){const nome=$("n-nome").value.trim(),email=$("n-email").value.trim().toLowerCase(),senha=$("n-senha").value,papel=$("n-papel").value;const m=t=>{$("n-m").textContent=t};
  if(!nome||!email){m("Informe nome e e-mail.");return}if(senha.length<6){m("A senha precisa de 6 caracteres ou mais.");return}
  try{const uid=await criarUsuarioAuth(email,senha);const agora=new Date().toISOString();const up={};up["usuarios/"+uid]={nome,email,conta:id,papel};up["contas_equipe/"+id+"/"+uid]={nome,email,papel,criado_em:agora,criado_por:NOME};await db.ref().update(up);await carregar();credenciais(nome,"",email,senha,"Login criado")}
  catch(e){if(e.code!=="auth/email-already-in-use"){m("Não criou: "+msgErro(e));return}
    m("Este e-mail já tem login. Vinculando…");try{const r=await loginExistente(email,{conta:id,papel,nome});await carregar();
      abrirModal('<h2>Login vinculado</h2>'+msgLoginExistente(email,r)+'<div class="md-f"><button class="btn btn-g" onclick="abrirLicenca(\''+id+'\')">Ok</button></div>')}catch(e2){m("Não vinculou: "+e2.message)}}}
/* aparelhos registrados de um login (vagas 1..5) e liberação de vaga para trocar de máquina */
function aparLista(id,uid,c){const vs=Object.entries(APAR[uid]||{}).filter(([,v])=>v&&v.dev).sort((a,b)=>a[0].localeCompare(b[0]));const max=c.max_dispositivos||1;
  return(vs.length?vs.map(([k,v])=>'<div style="display:flex;gap:6px;align-items:center;white-space:nowrap"><span title="registrado em '+fData(v.criado_em)+'">'+esc(v.nome||"aparelho")+'</span><span class="tiny muted">'+fData(v.ultimo||v.criado_em)+'</span><button class="btn btn-o btn-sm" style="padding:2px 7px" title="Liberar esta vaga para outro aparelho" onclick="aparLiberar(\''+id+'\',\''+uid+'\',\''+k+'\')">liberar</button></div>').join(""):'<span class="muted">nenhum</span>')+'<div class="tiny muted">'+vs.length+' de '+max+'</div>'}
async function aparLiberar(id,uid,k){const v=(APAR[uid]||{})[k]||{};if(!confirm("Liberar a vaga de \""+(v.nome||"aparelho")+"\"? Esse aparelho deixa de entrar e o próximo aparelho que fizer login ocupa a vaga."))return;
  try{await db.ref("aparelhos/"+uid+"/"+k).remove();await db.ref("sessoes/"+uid).remove().catch(()=>{});toast("Vaga liberada");await carregar();abrirLicenca(id)}catch(e){toast("Não liberou: "+msgErro(e),true)}}
/* e-mail que já tem login no Firebase (ex.: quem já usou o painel): em vez de dar erro, vincula à licença.
   Acha o uid pelo índice emails/; grava também um convite em convites/{email} — se o uid não estiver no índice
   (ou quem cria não puder gravar o usuário), a própria pessoa assume o vínculo no próximo login.
   Envia o e-mail de "criar nova senha", porque a senha antiga não é conhecida. */
function chaveEmailL(e){return String(e||"").trim().toLowerCase().replace(/\./g,",")}
async function loginExistente(email,o){const k=chaveEmailL(email);let uid=null,us=null;
  try{uid=(await db.ref("emails/"+k).once("value")).val()}catch(e){}
  if(uid){try{us=(await db.ref("usuarios/"+uid).once("value")).val()}catch(e){}}
  if(us&&us.conta&&us.conta!==o.conta){let n=us.conta;try{n=((await db.ref("contas_info/"+us.conta).once("value")).val()||{}).nome||n}catch(e){}throw new Error("este e-mail já é login da licença "+n+".")}
  if(us&&us.plataforma)throw new Error("este e-mail é da administração da plataforma.");
  if(us&&us.role&&!confirm(email+" já é usuário do painel da META ("+us.role+"). Vincular também à licença? No formulador ela passa a entrar pela licença; o acesso ao painel continua igual."))throw new Error("cancelado.");
  const agora=new Date().toISOString();
  await db.ref("convites/"+k).set({conta:o.conta,papel:o.papel,nome:o.nome||"",email,criado_em:agora,criado_por:NOME||""});
  let vinculado=false;
  if(uid){const up={};up["usuarios/"+uid+"/conta"]=o.conta;up["usuarios/"+uid+"/papel"]=o.papel;up["usuarios/"+uid+"/email"]=email;if(!(us&&us.nome))up["usuarios/"+uid+"/nome"]=o.nome||email;up["usuarios/"+uid+"/bloqueado"]=null;
    up["contas_equipe/"+o.conta+"/"+uid]={nome:(us&&us.nome)||o.nome||email,email,papel:o.papel,criado_em:agora,criado_por:NOME||"",existente:true};
    try{await db.ref().update(up);vinculado=true;await db.ref("convites/"+k).remove().catch(()=>{})}catch(e){}}
  try{await auth.sendPasswordResetEmail(email)}catch(e){}
  return{uid:vinculado?uid:null,vinculado}}
function msgLoginExistente(email,r){return'<p><b>'+esc(email)+'</b> já tinha login no sistema'+(r.vinculado?' e foi vinculado a esta licença.':'. O vínculo fica pendente e é feito sozinho no primeiro acesso dela ao formulador.')+'</p>'+
  '<p class="small">Ela entra com a senha que já usava. Se não lembrar, mandamos agora um e-mail para ela criar uma senha nova (veja também a caixa de spam).</p>'}
function resetSenha(email){auth.sendPasswordResetEmail(email).then(()=>toast("E-mail de nova senha enviado para "+email)).catch(e=>toast("Não enviou: "+msgErro(e),true))}
async function bloquear(id,uid,b){const up={};up["usuarios/"+uid+"/bloqueado"]=b||null;up["contas_equipe/"+id+"/"+uid+"/bloqueado"]=b||null;await db.ref().update(up);toast(b?"Login bloqueado":"Login liberado");await carregar();abrirLicenca(id)}

/* ---------- erros do programa (erros_app/{dia}/{id}, gravados pelo formulador) ---------- */
let ERROS={},ERR_DIAS=7,ERR_AVISOS=false,ERR_ABERTO=null;
async function carregarErros(){$("m").innerHTML='<div class="card empty"><b>Carregando…</b></div>';const d0=somaDias(hoje(),-(ERR_DIAS-1));
  try{ERROS=(await db.ref("erros_app").orderByKey().startAt(d0).once("value")).val()||{}}catch(e){$("m").innerHTML='<div class="card empty"><b>Sem permissão para ler os erros</b>'+esc(e.message)+'<br>Publique as regras novas do banco.</div>';return}
  /* guarda 30 dias */
  const lim=somaDias(hoje(),-30);db.ref("erros_app").orderByKey().endAt(lim).once("value").then(x=>{const up={};Object.keys(x.val()||{}).forEach(k=>{if(k<lim)up[k]=null});if(Object.keys(up).length)return db.ref("erros_app").update(up)}).catch(()=>{});
  renderErros()}
function gruposErro(){const G={};Object.entries(ERROS||{}).forEach(([dia,xs])=>Object.values(xs||{}).forEach(e=>{if(!e||(!ERR_AVISOS&&e.tipo==="aviso"))return;const k=(e.tipo||"")+"|"+(e.msg||"");
    const g=G[k]||(G[k]={k,tipo:e.tipo,msg:e.msg,n:0,us:new Set(),contas:new Set(),telas:new Set(),vers:new Set(),ult:"",ex:null});
    g.n++;if(e.email)g.us.add(e.email);if(e.conta)g.contas.add(e.conta);if(e.tela)g.telas.add(e.tela);if(e.versao)g.vers.add(e.versao);if((e.ts||"")>g.ult){g.ult=e.ts||"";g.ex=e}}));
  return Object.values(G).sort((a,b)=>b.ult.localeCompare(a.ult))}
const ERR_TIPO={erro:"Erro de tela",promessa:"Falha de operação",aviso:"Aviso ao usuário"};
function renderErros(){if(VIEW!=="err")return;const gs=gruposErro();const tot=gs.reduce((s,g)=>s+g.n,0),us=new Set();gs.forEach(g=>g.us.forEach(u=>us.add(u)));
  const hora=t=>t?fData(t)+" "+String(t).slice(11,16):"—";const nomeC=id=>id?((LIC[id]||{}).nome||id):"META";
  $("m").innerHTML='<div class="kpis"><div class="kpi"><div class="l">Ocorrências</div><div class="v">'+tot+'</div></div><div class="kpi"><div class="l">Erros diferentes</div><div class="v">'+gs.length+'</div></div><div class="kpi"><div class="l">Usuários afetados</div><div class="v">'+us.size+'</div></div></div>'+
    '<div class="card"><div class="row" style="margin-bottom:10px"><h3 style="margin:0;flex:1">Erros do programa</h3>'+
    [1,7,30].map(d=>'<button class="btn btn-sm '+(ERR_DIAS===d?"btn-g":"btn-o")+'" onclick="ERR_DIAS='+d+';carregarErros()">'+(d===1?"Hoje":d+" dias")+'</button>').join("")+
    '<label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" '+(ERR_AVISOS?"checked":"")+' onchange="ERR_AVISOS=this.checked;renderErros()"> incluir avisos ao usuário</label></div>'+
    (gs.length?'<div class="tw"><table><thead><tr><th>Mensagem</th><th>Tipo</th><th class="num">Vezes</th><th>Quem</th><th>Tela</th><th>Último</th></tr></thead><tbody>'+gs.map((g,i)=>'<tr class="cl'+(ERR_ABERTO===g.k?" ex":"")+'" onclick="ERR_ABERTO=ERR_ABERTO===\''+i+'\'?null:\''+i+'\';abrirErro('+i+')"><td style="max-width:420px"><b>'+esc(g.msg)+'</b></td><td class="small">'+esc(ERR_TIPO[g.tipo]||g.tipo)+'</td><td class="num">'+g.n+'</td><td class="small">'+esc([...g.us].slice(0,2).join(", "))+(g.us.size>2?" +"+(g.us.size-2):"")+'<div class="tiny muted">'+esc([...g.contas].map(nomeC).slice(0,2).join(", "))+'</div></td><td class="small">'+esc([...g.telas].join(", "))+'</td><td class="small">'+hora(g.ult)+'</td></tr><tr id="er-'+i+'" style="display:none"><td colspan="6"></td></tr>').join("")+'</tbody></table></div>'
      :'<div class="empty"><b>Nenhum erro registrado no período</b>Quando algo quebrar na tela de um usuário, aparece aqui com a mensagem, quem foi e em que tela.</div>')+
    (tot?'<div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn btn-o btn-sm" onclick="limparErros()">Limpar os registros do período</button></div>':'')+'</div>'}
function abrirErro(i){const g=gruposErro()[i];const tr=$("er-"+i);if(!g||!tr)return;const vis=tr.style.display!=="none";document.querySelectorAll('[id^="er-"]').forEach(x=>x.style.display="none");if(vis)return;const e=g.ex||{};
  tr.style.display="";tr.firstChild.innerHTML='<div class="small"><b>Versão:</b> '+esc([...g.vers].join(", ")||"—")+' · <b>Onde:</b> '+esc(e.onde||"—")+' · <b>Navegador:</b> '+esc(e.nav||"—")+(e.online===false?' · <b>sem internet</b>':'')+'</div>'+(e.stack?'<div class="err-st">'+esc(e.stack)+'</div>':'')}
async function limparErros(){if(!confirm("Apagar os registros de erro do período mostrado?"))return;const up={};Object.keys(ERROS||{}).forEach(k=>up[k]=null);await db.ref("erros_app").update(up);toast("Registros apagados");carregarErros()}

/* ---------- backup: cópia diária automática do banco + restauração de uma licença ou fazenda ---------- */
let BK=null,BK_NOME="",BK_LIC="",BK_FAZ="";
function renderBackup(){if(VIEW!=="bk")return;
  let h='<div class="card"><h3>Cópia de segurança diária</h3><p class="small muted" style="margin-bottom:6px">O servidor do programa faz uma cópia completa do banco (dados e regras) todos os dias, guardada por 30 dias. Para ligar (uma vez só):</p><ol class="bk-st">'+
    '<li>No console do Firebase, abra <b>Realtime Database</b> e a aba <b>Backups</b>.</li><li>Clique em <b>Configurar backups automatizados</b>: deixe marcada a <b>compactação Gzip</b> e ligue a <b>regra de 30 dias</b>.</li><li>Pronto. A lista de cópias e o botão de baixar ficam nessa mesma aba.</li></ol>'+
    '<p class="small muted" style="margin-top:8px">O backup automático é do plano Blaze, que o projeto já usa (leitura com IA). O custo é só o armazenamento das cópias, centavos por mês.</p></div>';
  h+='<div class="card"><h3>Restaurar de uma cópia</h3><p class="small muted" style="margin-bottom:10px">Baixe a cópia do dia no console (arquivo <b>…_data.json.gz</b>), escolha abaixo e restaure só a licença ou só a fazenda que precisa. Antes de gravar, o painel baixa no seu computador uma cópia do estado atual, para desfazer se precisar.</p>'+
    '<label class="btn btn-o">Escolher arquivo da cópia<input type="file" accept=".json,.gz" style="display:none" onchange="bkLer(this)"></label> <span class="small muted" id="bk-f">'+esc(BK_NOME||"nenhum arquivo")+'</span>';
  if(BK){const cs=Object.keys(BK.contas||{});const info=BK.contas_info||{};
    h+=cs.length?'<div class="grid" style="margin-top:12px"><div class="fld"><label>Licença</label><select class="sel" onchange="BK_LIC=this.value;BK_FAZ=\'\';renderBackup()"><option value="">Escolha…</option>'+cs.map(id=>'<option value="'+id+'"'+(id===BK_LIC?" selected":"")+'>'+esc((info[id]||LIC[id]||{}).nome||id)+'</option>').join("")+'</select></div>'+
      (BK_LIC?'<div class="fld"><label>O que restaurar</label><select class="sel" onchange="BK_FAZ=this.value;renderBackup()"><option value="">A licença inteira (todas as fazendas e cadastros)</option>'+Object.entries(((BK.contas[BK_LIC]||{}).formulador||{}).fazendas||{}).map(([k,f])=>'<option value="'+k+'"'+(k===BK_FAZ?" selected":"")+'>Só a fazenda '+esc((f||{}).propriedade||(f||{}).produtor||k)+'</option>').join("")+'</select></div>':'')+'</div>'+
      (BK_LIC?'<div class="row" style="margin-top:12px"><span class="small muted" style="flex:1">'+bkResumo()+'</span><button class="btn btn-r" onclick="bkRestaurar()">Restaurar</button></div>':'')
      :'<div class="empty"><b>Esta cópia não tem licenças</b>Confira se é o arquivo de dados (_data.json), não o de regras.</div>'}
  $("m").innerHTML=h+'</div>'}
async function bkLer(inp){const f=inp.files&&inp.files[0];if(!f)return;$("bk-f").textContent="lendo "+f.name+"…";
  try{let txt;if(/\.gz$/i.test(f.name)){if(typeof DecompressionStream==="undefined")throw new Error("este navegador não abre .gz; use o Chrome atualizado");txt=await new Response(f.stream().pipeThrough(new DecompressionStream("gzip"))).text()}else txt=await f.text();
    BK=JSON.parse(txt);BK_NOME=f.name+" · "+(txt.length/1048576).toFixed(1)+" MB";BK_LIC="";BK_FAZ="";renderBackup()}catch(e){BK=null;BK_NOME="";$("bk-f").textContent="Não abriu: "+e.message}}
function bkCaminhos(lic,faz){const B=(BK.contas||{})[lic]||{};const out={};const fz="fz_"+faz;
  const visita=(o,base)=>{if(!o||typeof o!=="object")return;Object.keys(o).forEach(k=>{if(k===fz)out[base+k]=1})};
  Object.keys(B).forEach(c=>{if(c==="formulador"){Object.keys(B.formulador||{}).forEach(sub=>{if(sub==="fazendas"){if(B.formulador.fazendas&&B.formulador.fazendas[faz])out["formulador/fazendas/"+faz]=1}else visita(B.formulador[sub],"formulador/"+sub+"/")})}else visita(B[c],c+"/")});
  return Object.keys(out)}
function bkVal(lic,p){let o=(BK.contas||{})[lic];for(const k of p.split("/")){if(o==null)return null;o=o[k]}return o==null?null:o}
function bkResumo(){if(!BK_LIC)return"";if(!BK_FAZ){const B=BK.contas[BK_LIC]||{};return"Volta toda a licença para o estado da cópia ("+Object.keys(((B.formulador||{}).fazendas)||{}).length+" fazendas). Os logins e a validade não mudam."}
  return"Volta "+bkCaminhos(BK_LIC,BK_FAZ).length+" cadastros desta fazenda (lotes, dietas, laudos, controles…) para o estado da cópia."}
function baixarJSON(nome,obj){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:"application/json"}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function bkRestaurar(){const nome=((BK.contas_info||{})[BK_LIC]||LIC[BK_LIC]||{}).nome||BK_LIC;
  if(!supLib(BK_LIC)){toast("Para restaurar, o administrador de "+nome+" precisa liberar o suporte em Opções → Privacidade.",true);return}
  const alvo=BK_FAZ?"a fazenda "+(((BK.contas[BK_LIC].formulador||{}).fazendas||{})[BK_FAZ]||{}).propriedade+" de "+nome:"toda a licença "+nome;
  if(prompt("Isto substitui "+alvo+" pelo conteúdo da cópia. Digite RESTAURAR para confirmar:")!=="RESTAURAR")return;
  try{const atual=(await db.ref("contas/"+BK_LIC).once("value")).val();baixarJSON("antes-da-restauracao-"+BK_LIC+"-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".json",atual||{});
    if(!BK_FAZ)await db.ref("contas/"+BK_LIC).set(BK.contas[BK_LIC]);
    else{const ps=new Set(bkCaminhos(BK_LIC,BK_FAZ));/* cadastros que a fazenda tem hoje e não tinha na cópia também voltam (ficam vazios) */
      const fz="fz_"+BK_FAZ;Object.keys(atual||{}).forEach(c=>{if(c==="formulador")Object.keys(atual.formulador||{}).forEach(sub=>{if(sub!=="fazendas"&&atual.formulador[sub]&&atual.formulador[sub][fz]!=null)ps.add("formulador/"+sub+"/"+fz)});else if(atual[c]&&typeof atual[c]==="object"&&atual[c][fz]!=null)ps.add(c+"/"+fz)});
      const up={};ps.forEach(p=>up[p]=bkVal(BK_LIC,p));await db.ref("contas/"+BK_LIC).update(up)}
    db.ref("contas_suporte_log/"+BK_LIC+"/"+db.ref().push().key).set({ts:firebase.database.ServerValue.TIMESTAMP,tipo:"restaurou",uid:auth.currentUser.uid,quem:String(NOME||"").slice(0,80),det:(BK_FAZ?"fazenda "+((((BK.contas[BK_LIC].formulador||{}).fazendas||{})[BK_FAZ]||{}).propriedade||BK_FAZ):"licença inteira").slice(0,200)}).catch(()=>{});
    toast("Restaurado");renderBackup()}catch(e){toast("Não restaurou: "+e.message,true)}}
</script>
