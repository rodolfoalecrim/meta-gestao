function rpHtmlTaxas(){
  var R=_rp.res;
  function k(ic,v,l,cor,dica){return '<div class="kpi-card" style="--kpi-color:'+cor+'"><div class="kpi-icon">'+ic+'</div><div class="kpi-val">'+v+'</div><div class="kpi-lbl">'+l+'</div>'+(dica?'<div style="font-size:10px;color:var(--dim);margin-top:2px">'+dica+'</div>':'')+'</div>'}
  var h='<div class="kpi-grid">'+k("🎯",rpPct(R.tp),"Taxa de prenhez","#15803d","meta ≥ 20%")+k("💉",rpPct(R.ts),"Taxa de serviço","#2563eb","meta ≥ 60%")+k("✅",rpPct(R.tc),"Taxa de concepção","#7c3aed","meta ≥ 35%")+k("🔁",R.servPorConc!=null?R.servPorConc.toFixed(1).replace(".",","):"—","Serviços por prenhez","#d97706","meta ≤ 2,5")+k("📅",R.delMedio!=null?Math.round(R.delMedio):"—","DEL médio","#0891b2","meta 150–170")+k("⏱️",R.iepProj!=null?(R.iepProj/30.4).toFixed(1).replace(".",",")+" m":"—","Intervalo entre partos (projetado)","#64748b","meta ≤ 13 meses")+'</div>';
  if(R.pctPerdas!=null||R.vazias150)h+='<div class="chart-card" style="font-size:12.5px;line-height:1.7">'+(R.pctPerdas!=null?'⚠️ Perdas de gestação (12 meses): <b>'+rpPct(R.pctPerdas)+'</b> ('+R.perdas+')<br>':'')+'🐄 Vazias com mais de 150 dias de lactação: <b>'+R.vazias150+'</b>'+(R.primServico!=null?'<br>⏳ Do parto ao 1º serviço: <b>'+Math.round(R.primServico)+' dias</b>':'')+'</div>';
  h+='<div class="chart-card"><div class="chart-card-title">Ciclos de 21 dias</div><div class="chart-card-sub">Cada linha é um ciclo de cio. <b style="color:#2563eb">Serviço</b> = vacas aptas inseminadas. <b style="color:#15803d">Prenhez</b> = vacas aptas que emprenharam. Os ciclos mais recentes aguardam o DG.</div>';
  _rp.res.ciclos.slice().reverse().forEach(function(cy){
    h+='<div style="display:grid;grid-template-columns:64px 1fr 40px;gap:4px 8px;align-items:center;font-size:11px;margin-bottom:8px"><div style="color:var(--muted);grid-row:span 2">'+rpBR(cy.ini).slice(0,5)+'<br><span style="font-size:10px">'+cy.eleg+' aptas</span></div><div class="rp-bar"><i style="width:'+(cy.ts||0)+'%;background:#2563eb"></i></div><b>'+rpPct(cy.ts)+'</b><div class="rp-bar"><i style="width:'+(cy.tp||0)+'%;background:#15803d"></i></div><b>'+(cy.completo?rpPct(cy.tp):'<span style="color:var(--dim);font-weight:500">DG</span>')+'</b></div>'});
  h+='</div><div style="font-size:11px;color:var(--muted);line-height:1.5;padding:0 4px 10px"><b>Taxa de prenhez</b> = taxa de serviço × taxa de concepção. Mostra quantas vacas aptas emprenham a cada 21 dias. Considera apta a vaca com mais de '+_rp.dados.config.pev+' dias de parida, vazia.</div>';
  return h;
}
/* ---------- bottom sheet ---------- */
function rpSheet(html){var s=document.getElementById("rp-sheet");if(!s){s=document.createElement("div");s.id="rp-sheet";s.onclick=function(e){if(e.target===s)rpFecharSheet()};document.body.appendChild(s)}s.innerHTML='<div class="box">'+html+'</div>';s.classList.add("on")}
function rpFecharSheet(){var s=document.getElementById("rp-sheet");if(s)s.classList.remove("on")}
function rpCab(t){return '<div style="display:flex;align-items:center;margin-bottom:14px"><div style="font-size:16px;font-weight:800;flex:1">'+t+'</div><button class="rp-mini" style="background:#f1f5f9;font-size:15px" onclick="rpFecharSheet()">✕</button></div>'}
function rpAbrirFicha(id){
  var r=_rp.reb.filter(function(x){return x.id===id})[0];if(!r)return;var st=r.st;
  var pv=[];
  if(st.del!=null)pv.push(["Dias em lactação",st.del]);
  if(st.prenhe){pv.push(["Prenhe desde",rpBR(st.concepcao)+'<div style="font-size:11px;color:#64748b;font-weight:500">'+st.diasGest+' dias</div>']);if(st.dgData)pv.push(["Confirmada em",rpBR(st.dgData)]);if(st.prev.secagem&&!st.seca)pv.push(["Secar em",rpBR(st.prev.secagem)]);pv.push(["Parto previsto",rpBR(st.prev.parto)])}
  if(st.status==="inseminada"){pv.push(["Última IA",rpBR(st.ultimoServico.data)]);pv.push(["Observar cio",rpBR(st.prev.retornoIni)+" a "+rpBR(st.prev.retornoFim).slice(0,5)]);pv.push(["Fazer DG a partir de",rpBR(st.prev.dg)])}
  if(st.status==="pev")pv.push(["Apta a inseminar em",rpBR(st.prev.aptaEm)]);
  if(st.ultimoParto)pv.push(["Último parto",rpBR(st.ultimoParto)]);
  pv.push(["Serviços nesta lactação",st.nServicos]);
  rpSheet(rpCab("Vaca "+rpEsc(r.a.brinco)+(r.a.nome?' · '+rpEsc(r.a.nome):''))+
   '<div style="display:flex;gap:8px;align-items:center;margin:-6px 0 12px">'+rpChip(st.status)+'<span style="font-size:12px;color:#64748b">'+(st.novilha?"Novilha":st.lact+"ª lactação")+'</span></div>'+
   '<div class="rp-prev">'+pv.map(function(p){return '<div><small>'+p[0]+'</small><b>'+p[1]+'</b></div>'}).join("")+'</div>'+
   '<button class="btn-action btn-primary" style="margin-top:14px" onclick="rpAbrirLancar(\''+id+'\')">+ Lançar evento para esta vaca</button>'+
   '<div class="rp-sec" style="margin-top:6px">🕓 Histórico</div>'+rpTimelineHtml(r,{acoes:function(e){return (e.conferido===false&&e.por==="produtor")?'<button class="rp-mini" style="background:#fee2e2;color:#dc2626" onclick="rpExcluirEvento(\''+e.id+'\',\''+id+'\')">🗑</button>':''}}));
}
async function rpExcluirEvento(ek,animalId){if(!confirm("Excluir este lançamento?"))return;try{await rpRef(farmId,"eventos/"+ek).remove();await rpProdRecarregar();rpProdRender();rpAbrirFicha(animalId);showToast("Lançamento excluído")}catch(e){showToast("Erro: "+e.message,true)}}
var _rpL={};
function rpAbrirLancar(animalId,tipo){
  var r=animalId?_rp.reb.filter(function(x){return x.id===animalId})[0]:null;
  _rpL={animal:animalId||null,tipo:tipo||(r?rpTipoSugerido(r):"ia"),res:"+"};
  var touros={};Object.values(_rp.dados.eventos).forEach(function(e){if(e.touro)touros[e.touro]=1});
  rpSheet(rpCab("Lançar evento")+
   '<div class="form-field"><label class="form-label">Vaca (brinco)</label><input class="form-input" id="rpl-br" list="rpl-brs" value="'+(r?rpEsc(r.a.brinco):"")+'" placeholder="Ex.: 245" oninput="rpLBrinco()" autocomplete="off"><datalist id="rpl-brs">'+_rp.reb.filter(function(x){return x.st.status!=="saiu"}).map(function(x){return '<option value="'+rpEsc(x.a.brinco)+'">'}).join("")+'</datalist><div id="rpl-br-info" style="font-size:11.5px;margin-top:5px;color:var(--muted)"></div></div>'+
   '<div class="form-field"><label class="form-label">O que aconteceu?</label><div class="rp-tipos">'+Object.keys(RP_TIPOS).map(function(t){return '<button type="button" data-t="'+t+'" onclick="_rpL.tipo=\''+t+'\';rpLTipo()"><span>'+RP_TIPOS[t].i+'</span>'+RP_TIPOS[t].l.replace(" (touro)","").replace("Saída do rebanho","Saída").replace("Aborto / perda","Aborto")+'</button>'}).join("")+'</div></div>'+
   '<div class="form-field"><label class="form-label">Data</label><input class="form-input" type="date" id="rpl-data" value="'+rpHoje()+'" max="'+rpHoje()+'"></div>'+
   '<div id="rpl-extra"></div>'+
   '<div class="form-field"><label class="form-label">Observação (opcional)</label><input class="form-input" id="rpl-obs" maxlength="140"></div>'+
   '<div id="rpl-aviso" style="font-size:12px;color:#b45309;margin-bottom:10px"></div>'+
   '<button class="btn-action btn-primary" id="rpl-salvar" onclick="rpSalvarLancamento()">💾 Salvar</button><datalist id="rpl-touros">'+Object.keys(touros).map(function(t){return '<option value="'+rpEsc(t)+'">'}).join("")+'</datalist>');
  rpLBrinco();rpLTipo();
}
function rpTipoSugerido(r){var s=r.st.status;return s==="inseminada"?"dg":s==="prenhe"?(r.st.prev.secagem&&r.st.prev.secagem<=rpAdd(rpHoje(),14)?"secagem":"parto"):s==="seca"?"parto":s==="sem_dados"?"parto":"ia"}
function rpLBrinco(){var v=document.getElementById("rpl-br").value;var id=rpAnimalPorBrinco(_rp.dados.animais,v);_rpL.animal=id;var info=document.getElementById("rpl-br-info");
  if(!v.trim()){info.innerHTML="";return}
  if(!id){info.innerHTML='<span style="color:#d97706">Vaca nova — será cadastrada ao salvar.</span>';return}
  var r=_rp.reb.filter(function(x){return x.id===id})[0];info.innerHTML=rpChip(r.st.status)+' '+rpLinhaPrevisao(r.st);rpLAviso()}
function rpLTipo(){document.querySelectorAll(".rp-tipos button").forEach(function(b){b.classList.toggle("on",b.dataset.t===_rpL.tipo)});
  var t=_rpL.tipo,h="";
  if(t==="ia"||t==="cobertura")h='<div class="form-field"><label class="form-label">'+(t==="ia"?"Touro / sêmen":"Touro")+'</label><input class="form-input" id="rpl-touro" list="rpl-touros" placeholder="Nome ou código"></div>';
  if(t==="dg")h='<div class="form-field"><label class="form-label">Resultado</label><div class="rp-seg"><button type="button" class="pos'+(_rpL.res==="+"?" on":"")+'" onclick="_rpL.res=\'+\';rpLTipo()">✅ Prenhe</button><button type="button" class="neg'+(_rpL.res==="-"?" on":"")+'" onclick="_rpL.res=\'-\';rpLTipo()">✖ Vazia</button></div></div>'+(_rpL.res==="+"?'<div class="form-field"><label class="form-label">Dias de gestação (se o veterinário informou)</label><input class="form-input" id="rpl-dgest" type="number" min="20" max="280" placeholder="Em branco = usa a data da última IA"></div>':'');
  if(t==="parto")h='<div class="form-field"><label class="form-label">Cria</label><div class="rp-seg" id="rpl-cria">'+[["F","♀ Fêmea"],["M","♂ Macho"],["N","Natimorto"],["G","Gêmeos"]].map(function(x){return '<button type="button" data-c="'+x[0]+'" class="'+(_rpL.cria===x[0]?"on":"")+'" onclick="_rpL.cria=\''+x[0]+'\';rpLTipo()">'+x[1]+'</button>'}).join("")+'</div></div>';
  if(t==="descarte")h='<div class="form-field"><label class="form-label">Motivo</label><select class="form-input" id="rpl-motivo"><option>Venda</option><option>Descarte reprodutivo</option><option>Descarte por mastite</option><option>Descarte por casco</option><option>Baixa produção</option><option>Morte</option><option>Outro</option></select></div>';
  var ex=document.getElementById("rpl-extra");var keep={};ex.querySelectorAll("input,select").forEach(function(i){keep[i.id]=i.value});ex.innerHTML=h;Object.keys(keep).forEach(function(k){var el=document.getElementById(k);if(el)el.value=keep[k]});rpLAviso();
}
function rpLAviso(){var a=document.getElementById("rpl-aviso");if(!a)return;var msg="";var r=_rpL.animal?_rp.reb.filter(function(x){return x.id===_rpL.animal})[0]:null;
  if(r){var s=r.st;
    if((_rpL.tipo==="ia"||_rpL.tipo==="cobertura")&&s.prenhe)msg="Atenção: esta vaca está registrada como prenhe ("+s.diasGest+" dias).";
    else if((_rpL.tipo==="ia"||_rpL.tipo==="cobertura")&&s.status==="pev")msg="Atenção: só "+s.del+" dias de parida (período voluntário de espera é "+_rp.dados.config.pev+" dias).";
    else if(_rpL.tipo==="dg"&&!s.ultimoServico)msg="Não há IA lançada nesta lactação. Se ela está prenhe, informe os dias de gestação.";
    else if(_rpL.tipo==="secagem"&&!s.prenhe)msg="Esta vaca não consta como prenhe.";
  }a.textContent=msg}
async function rpSalvarLancamento(){
  var br=rpNormBrinco(document.getElementById("rpl-br").value);var data=document.getElementById("rpl-data").value;var t=_rpL.tipo;
  if(!br){showToast("Informe o brinco da vaca",true);return}
  if(!data||data>rpHoje()){showToast("Data inválida",true);return}
  var ev={tipo:t,data:data};
  var obs=(document.getElementById("rpl-obs").value||"").trim();if(obs)ev.obs=obs;
  if(t==="ia"||t==="cobertura"){var tr=(document.getElementById("rpl-touro").value||"").trim();if(tr)ev.touro=tr}
  if(t==="dg"){ev.resultado=_rpL.res;var dg=document.getElementById("rpl-dgest");if(dg&&dg.value)ev.dias_gestacao=+dg.value}
  if(t==="parto"&&_rpL.cria)ev.cria=_rpL.cria;
  if(t==="descarte")ev.motivo=document.getElementById("rpl-motivo").value;
  var btn=document.getElementById("rpl-salvar");btn.disabled=true;btn.textContent="Salvando...";
  try{
    var novo=!_rpL.animal;
    var r=await rpGravarLote(farmId,_rp.dados,[{brinco:br,categoria:"vaca",eventos:[ev]}],{origem:"app",por:"produtor"});
    if(!r.eventos){showToast("Esse evento já estava lançado nessa data",true);btn.disabled=false;btn.textContent="💾 Salvar";return}
    rpFecharSheet();await rpProdRecarregar();rpProdRender();
    showToast("✓ "+RP_TIPOS[t].l+" salvo(a)"+(novo?" · vaca "+br+" cadastrada":""));
    if(t==="parto"&&(ev.cria==="F"||ev.cria==="G")&&typeof toggleFormRecria==="function"&&confirm("Nasceu uma bezerra. Quer cadastrá-la agora na Recria (com foto e colostro)?")){navScreen("recria");setTimeout(function(){try{toggleFormRecria("novo")}catch(e){}},500)}
  }catch(e){console.error(e);showToast("Erro ao salvar: "+e.message,true);btn.disabled=false;btn.textContent="💾 Salvar"}
}
async function rpLancarRapido(id,tipo){var r=_rp.reb.filter(function(x){return x.id===id})[0];if(!r)return;if(!confirm((tipo==="secagem"?"Confirmar secagem":"Confirmar")+" da vaca "+r.a.brinco+" hoje?"))return;
  try{await rpGravarLote(farmId,_rp.dados,[{brinco:r.a.brinco,eventos:[{tipo:tipo,data:rpHoje()}]}],{origem:"app",por:"produtor"});await rpProdRecarregar();rpProdRender();showToast("Vaca "+r.a.brinco+": "+RP_TIPOS[tipo].l.toLowerCase()+" lançada")}catch(e){showToast("Erro: "+e.message,true)}}
function rpAbrirDGLote(){var L=_rp.ag.dg;_rpL.lote={};
  rpSheet(rpCab("Resultado do DG em lote")+'<div class="form-field"><label class="form-label">Data do diagnóstico</label><input class="form-input" type="date" id="rpd-data" value="'+rpHoje()+'" max="'+rpHoje()+'"></div><div style="font-size:11.5px;color:var(--muted);margin-bottom:8px">Marque o resultado de cada vaca. As que ficarem em branco não são lançadas.</div>'+
   L.map(function(x){var r=x.r;return '<div class="rp-row" style="cursor:default"><div class="rp-br">'+rpEsc(r.a.brinco)+'</div><div class="info">IA '+rpBR(r.st.ultimoServico.data)+'</div><div class="rp-seg" style="width:150px" data-id="'+r.id+'"><button type="button" class="pos" onclick="rpDGMarca(this,\'+\')">Prenhe</button><button type="button" class="neg" onclick="rpDGMarca(this,\'-\')">Vazia</button></div></div>'}).join("")+
   '<button class="btn-action btn-primary" style="margin-top:12px" id="rpd-salvar" onclick="rpSalvarDGLote()">💾 Salvar resultados</button>');
}
function rpDGMarca(btn,v){var seg=btn.parentNode;var id=seg.dataset.id;var ja=_rpL.lote[id]===v;seg.querySelectorAll("button").forEach(function(b){b.classList.remove("on")});if(ja)delete _rpL.lote[id];else{_rpL.lote[id]=v;btn.classList.add("on")}document.getElementById("rpd-salvar").textContent="💾 Salvar "+Object.keys(_rpL.lote).length+" resultado(s)"}
async function rpSalvarDGLote(){var ids=Object.keys(_rpL.lote);if(!ids.length){showToast("Marque ao menos uma vaca",true);return}var data=document.getElementById("rpd-data").value;
  var lista=ids.map(function(id){return {brinco:_rp.dados.animais[id].brinco,eventos:[{tipo:"dg",data:data,resultado:_rpL.lote[id]}]}});
  try{var r=await rpGravarLote(farmId,_rp.dados,lista,{origem:"app",por:"produtor"});rpFecharSheet();await rpProdRecarregar();rpProdRender();showToast(r.eventos+" diagnóstico(s) lançado(s)")}catch(e){showToast("Erro: "+e.message,true)}}
function rpAbrirCadastro(){
  rpSheet(rpCab("Cadastrar vaca")+
   '<div class="form-field"><label class="form-label">Brinco</label><input class="form-input" id="rpc-br" placeholder="Ex.: 245"></div>'+
   '<div class="form-field"><label class="form-label">Categoria</label><div class="rp-seg"><button type="button" id="rpc-v" class="on" onclick="rpCCat(\'vaca\')">Vaca</button><button type="button" id="rpc-n" onclick="rpCCat(\'novilha\')">Novilha</button></div></div>'+
   '<div id="rpc-vaca"><div class="form-field"><label class="form-label">Data do último parto</label><input class="form-input" type="date" id="rpc-parto" max="'+rpHoje()+'"></div><div class="form-field"><label class="form-label">Lactação atual (1ª, 2ª…)</label><input class="form-input" type="number" id="rpc-lac" min="1" max="15" placeholder="Ex.: 2"></div></div>'+
   '<div class="form-field"><label class="form-label">Nome (opcional)</label><input class="form-input" id="rpc-nome"></div>'+
   '<div style="font-size:11.5px;color:var(--muted);margin-bottom:12px">Depois de cadastrar, lance a última IA e o diagnóstico para o app calcular as previsões.</div>'+
   '<button class="btn-action btn-primary" id="rpc-salvar" onclick="rpSalvarCadastro()">💾 Cadastrar</button>');_rpL.cat="vaca";
}
function rpCCat(c){_rpL.cat=c;document.getElementById("rpc-v").classList.toggle("on",c==="vaca");document.getElementById("rpc-n").classList.toggle("on",c==="novilha");document.getElementById("rpc-vaca").style.display=c==="vaca"?"":"none"}
async function rpSalvarCadastro(){var br=rpNormBrinco(document.getElementById("rpc-br").value);if(!br){showToast("Informe o brinco",true);return}
  if(rpAnimalPorBrinco(_rp.dados.animais,br)){showToast("Já existe uma vaca com o brinco "+br,true);return}
  var r={brinco:br,categoria:_rpL.cat,nome:(document.getElementById("rpc-nome").value||"").trim(),eventos:[]};
  if(_rpL.cat==="vaca"){var p=document.getElementById("rpc-parto").value;var lac=parseInt(document.getElementById("rpc-lac").value,10);if(p)r.eventos.push({tipo:"parto",data:p});if(!isNaN(lac))r.lactacao_base=Math.max(0,lac-(p?1:0))}
  try{await rpGravarLote(farmId,_rp.dados,[r],{origem:"app",por:"produtor"});rpFecharSheet();await rpProdRecarregar();_rp.tab="vacas";rpProdRender();showToast("Vaca "+br+" cadastrada")}catch(e){showToast("Erro: "+e.message,true)}}
/* aviso no início do app */
async function rpDashAviso(){try{if(!farmId)return;var d=await rpCarregar(farmId);if(!Object.keys(d.animais).length)return;var reb=rpMontarRebanho(d.animais,d.eventos,d.config);var ag=rpAgenda(reb,d.config);var it=[];
  if(ag.dg.length)it.push(ag.dg.length+" DG a fazer");if(ag.secar.length)it.push(ag.secar.length+" para secar");if(ag.partos.length)it.push(ag.partos.length+" parto(s) em 30 dias");
  if(!it.length)return;var body=document.getElementById("dash-body");if(!body||document.getElementById("rp-dash-aviso"))return;
  var el=document.createElement("div");el.id="rp-dash-aviso";el.className="chart-card";el.style.cssText="display:flex;align-items:center;gap:12px;cursor:pointer;border-left:4px solid #15803d";el.onclick=function(){_rp.tab="agenda";navScreen("reproducao")};
  el.innerHTML='<div style="font-size:26px">🐄</div><div style="flex:1"><div style="font-weight:800;font-size:13px">Reprodução: '+it.join(" · ")+'</div><div style="font-size:11.5px;color:var(--muted)">Toque para ver a agenda</div></div><div style="font-size:18px;color:var(--muted)">›</div>';
  var ref=body.children[1]||null;body.insertBefore(el,ref)}catch(e){console.warn("rpDashAviso",e)}}

</script>
