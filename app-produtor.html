<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f3f6f3;--surface:#fff;--surface2:#f8fafc;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--dim:#94a3b8;--G:#15803d;--GD:#052e16;--GM:#16a34a;--GL:#f0fdf4;--yellow:#d97706;--red:#dc2626;--blue:#2563eb;--shadow:0 2px 8px rgba(15,23,42,.06);--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
#loading-screen{position:fixed;inset:0;background:var(--GD);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
#erro-screen{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:998;text-align:center}
#pin-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--GD),var(--G));display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:997}
.pin-box{background:#fff;border-radius:20px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 20px 60px #0000004d;text-align:center}
.pin-title{font-size:19px;font-weight:800;color:var(--text);margin-bottom:6px}
.pin-sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.5}
.pin-input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:16px;font-size:26px;text-align:center;letter-spacing:10px;font-family:'Inter',monospace;outline:none;margin-bottom:14px}
.pin-input:focus{border-color:var(--G)}
.btn-pin{width:100%;background:linear-gradient(135deg,var(--G),var(--GD));color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;font-family:Inter,sans-serif;cursor:pointer}
.pin-err{color:var(--red);font-size:12px;font-weight:600;margin-top:10px;min-height:16px}
#app{display:none;flex-direction:column;min-height:100dvh}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 18px;height:60px;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:var(--safe-top);box-shadow:0 1px 3px rgba(15,23,42,.04)}
.topbar-logo-img{height:32px;width:auto;object-fit:contain}
.topbar-title{font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface2);padding:5px 12px;border-radius:20px}
.topbar-logo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--GD)}
.content{flex:1;padding:16px 16px 40px;max-width:560px;margin:0 auto;width:100%}
.screen{display:none}
.screen.active{display:block;animation:screenIn .28s cubic-bezier(.16,1,.3,1)}
@keyframes screenIn{0%{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hero-card{background:linear-gradient(135deg,var(--GD),var(--G) 70%,#22c55e);border-radius:20px;padding:24px;color:#fff;margin-bottom:16px;box-shadow:0 8px 24px rgba(5,46,22,.25);position:relative;overflow:hidden}
.hero-card:before{content:"";position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-title{font-size:19px;font-weight:800}
.hero-sub{font-size:12px;opacity:.8;margin-top:3px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:box-shadow .2s ease,transform .2s ease}
.kpi-card:active{transform:scale(.97)}
.kpi-card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--kpi-color,var(--G))}
.kpi-icon{font-size:20px;margin-bottom:6px}
.kpi-val{font-size:24px;font-weight:900;color:var(--kpi-color,var(--text));line-height:1}
.kpi-lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
.qual-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.qual-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.qual-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.qual-item{text-align:center}
.qual-val{font-size:19px;font-weight:900}
.qual-lbl{font-size:9.5px;color:var(--muted);margin-top:2px}
.visita-card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.visita-hdr{background:var(--surface2);padding:12px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.visita-body{padding:14px 16px}
.visita-data{font-size:13px;font-weight:800;color:var(--text)}
.visita-tec{font-size:11px;color:var(--muted);margin-top:2px}
.visita-txt-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:12px;margin-bottom:4px}
.visita-txt{font-size:12.5px;color:var(--text);line-height:1.5;background:var(--surface2);border-radius:8px;padding:10px 12px}
.visita-acoes{color:#0891b2;font-weight:600}
.btn-action{width:100%;border:none;border-radius:14px;padding:15px;font-size:14px;font-weight:700;font-family:Inter,sans-serif;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--G),var(--GD));color:#fff}
.btn-secondary{background:#fff;border:1.5px solid var(--border)!important;color:var(--text)}
.form-field{margin-bottom:14px}
.form-label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
.form-input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;font-family:Inter,sans-serif;outline:none;background:#fff;color:var(--text)}
.form-input:focus{border-color:var(--G)}
.form-section{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px}
.toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%) translateY(20px);background:#1e293b;color:#fff;padding:11px 22px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%) translateY(0)}
@keyframes spin{to{transform:rotate(360deg)}}
.mg-spinner{width:24px;height:24px;border:3px solid #e2e8f0;border-top-color:var(--G);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
button{transition:transform .12s ease}
button:active{transform:scale(.96)}
.bottom-nav{background:#fff;border-top:1.5px solid var(--border);display:flex;padding-bottom:var(--safe-bot);flex-shrink:0;position:sticky;bottom:0}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;background:none;border:none;color:var(--muted);font-size:9.5px;font-family:Inter,sans-serif;cursor:pointer;font-weight:600}
.nav-btn.active{color:var(--GD)}
.nav-btn.active .ico{background:var(--GL);border-radius:10px;padding:2px 10px;transform:translateY(-1px)}
.nav-btn{transition:color .15s ease}
.nav-btn .ico{font-size:19px;line-height:1}
.chart-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.rotate-hint{display:none;background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1.5px dashed #93c5fd;border-radius:14px;padding:16px;margin-bottom:14px;text-align:center;color:#1d4ed8;font-size:12.5px;font-weight:700}
.rotate-hint .ico{font-size:26px;display:block;margin-bottom:6px;animation:rotateHintPulse 1.8s ease-in-out infinite}
@keyframes rotateHintPulse{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-90deg)}}
@media (orientation:portrait){
  .tela-grafico-landscape .rotate-hint{display:block}
}
@media (orientation:landscape){
  .tela-grafico-landscape .content{max-width:920px}
  .tela-grafico-landscape .chart-card canvas{min-height:340px!important}
  .tela-grafico-landscape .bottom-nav{display:none}
  .tela-grafico-landscape .topbar{height:44px}
  body:has(.tela-grafico-landscape){padding-bottom:0}
}
.chart-card-title{font-size:12.5px;font-weight:800;margin-bottom:2px}
.chart-card-sub{font-size:10.5px;color:var(--muted);margin-bottom:10px;line-height:1.4}
</style>
<style id="idc-css">
/* ===== Ficha (carteira de identidade) do animal da recria ===== */
.idc{border:1px solid #d6e4da;border-radius:18px;overflow:hidden;background:#fff;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.idc-top{display:flex;justify-content:space-between;gap:10px;background:#143f2a;color:#e9f3ec;font-size:11.5px;font-weight:600;padding:8px 14px}

.idc-body{display:flex;gap:14px;padding:14px}
.idc-foto{position:relative;flex:0 0 112px;width:112px;height:136px;border-radius:12px;background:#eef4f0 center/cover no-repeat;border:1.5px dashed #b8d0c0;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden}

.idc-dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:10px 0 0}

.idc-col{border-top:1px solid #e6eee9;padding:10px 14px 12px;background:#f8fbf9}
.idc-col-t{font-size:11px;font-weight:700;color:#3d6b52;margin-bottom:6px}
.idc-chips{display:flex;flex-wrap:wrap;gap:6px}
.idc-chip{font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 10px;background:#eef2f6;color:#334155}
.idc-chip.ok{background:#dcfce7;color:#166534}
.idc-chip.ruim{background:#fee2e2;color:#b91c1c}
.idc-vazio{font-size:12px;color:#64748b}
.idc-link{background:none;border:none;color:#1f8149;font-weight:700;text-decoration:underline;cursor:pointer;padding:0;font-size:12px;font-family:inherit}
@media (max-width:380px){.idc-foto{flex-basis:92px;width:92px;height:116px}.idc-num{font-size:21px}}
.idf{border:1px solid #d6e4da;border-radius:14px;padding:12px;margin-bottom:12px;background:#fbfdfb}
.idf-foto{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:150px;border-radius:12px;border:1.5px dashed #b8d0c0;background:#eef4f0 center/cover no-repeat;cursor:pointer;margin-bottom:10px;text-align:center}
.idf-foto span{font-size:13px;font-weight:700;color:#3d6b52}

.idf-sec{font-size:11px;font-weight:700;color:#3d6b52;margin:6px 0 8px;padding-top:8px;border-top:1px solid #e6eee9}

.idf-g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.idf-hint{font-size:11.5px;color:#475569;line-height:1.45;margin-top:2px}
.idf-hint .idc-chips{margin-top:6px}
.id-av{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1.5px solid #d6e4da}
</style>

<script>
const firebaseConfig={apiKey:"AIzaSyClpsHjO8OLThD--hDOfg7Fg3t6hhuM-To",authDomain:"meta-gestao-608d7.firebaseapp.com",databaseURL:"https://meta-gestao-608d7-default-rtdb.firebaseio.com",projectId:"meta-gestao-608d7",storageBucket:"meta-gestao-608d7.firebasestorage.app",messagingSenderId:"318618053627",appId:"1:318618053627:web:ae289200bd1e87be29395e"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
const fns=firebase.app().functions("southamerica-east1");

let farmId=null;
let farmData=null;

function showToast(msg,err){const t=document.getElementById("toast");t.textContent=msg;t.style.background=err?"#dc2626":"#15803d";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000)}

function getTokenFromUrl(){
  const params=new URLSearchParams(location.search);
  return params.get("f")||"";
}

async function iniciar(){
  await new Promise(r=>{const u=auth.onAuthStateChanged(()=>{u();r()})});
  try{
    if(!auth.currentUser){
      await auth.signInAnonymously();
    }
  }catch(e){
    console.error("Erro ao autenticar anonimamente:",e);
    mostrarErro("auth: "+(e.code||e.message));
    return;
  }
  let token=getTokenFromUrl();
  if(!token)token=localStorage.getItem("meta_produtor_token")||"";
  if(!token){mostrarErro("sem token na URL nem salvo");return}
  try{
    const trocarClaim=fns.httpsCallable("trocarTokenPorClaim");
    const claimRes=await trocarClaim({token});
    farmId=claimRes.data.farmId;
    await auth.currentUser.getIdToken(true);
    const snap=await db.ref("propriedades/"+farmId).once("value");
    const val=snap.val();
    if(!val){mostrarErro("fazenda "+farmId+" vazia ou sem permissão");return}

    mostrarErro((e.code||"erro")+": "+(e.message||"")+(e.details?" | "+JSON.stringify(e.details):""));

async function tentarTravarPaisagem(){

    if(!document.fullscreenElement&&elem.requestFullscreen){
      await elem.requestFullscreen();
    }
    if(screen.orientation&&screen.orientation.lock){
      await screen.orientation.lock("landscape");
    }
  }catch(e){
    console.log("Não foi possível forçar a orientação automaticamente (normal em alguns navegadores, ex: iPhone) — o aviso de girar manual continua ativo:",e);
  }
}
function liberarOrientacao(){

  }catch(e){}
}

function calcularConsumoLC(){
  const animais=parseFloat(document.getElementById("lc-animais")?.value)||0;
  const tratados=parseFloat(document.getElementById("lc-tratados")?.value)||0;
  const ofertado=parseFloat(document.getElementById("lc-ofertado")?.value)||0;
  const sobra=parseFloat(document.getElementById("lc-sobra")?.value)||0;
  const msSobraPct=parseFloat(document.getElementById("lc-ms-sobra")?.value)||0;
  const msOfertadoPct=parseFloat(lcLoteAtual?.ms_dieta)||0;
  const mediaLeite=parseFloat(document.getElementById("lc-media-leite")?.value)||0;
  const racaoRobo=parseFloat(document.getElementById("lc-racao-robo")?.value)||0;
  if(!(ofertado>0)||!(animais>0))return null;
  const pctSobra=ofertado>0?sobra/ofertado*100:0;
  const msDietaCadastrada=msOfertadoPct>0;
  const msOfertadaKg=msDietaCadastrada?ofertado*msOfertadoPct/100:null;
  const msSobraKg=msDietaCadastrada?sobra*msSobraPct/100:null;
  const msIngeridaBunkKg=msDietaCadastrada?Math.max(0,msOfertadaKg-msSobraKg):null;
  const msBunkAnimal=(msDietaCadastrada&&animais>0)?msIngeridaBunkKg/animais:null;
  const msRoboAnimal=racaoRobo>0?racaoRobo*.89:0;
  const msTotalAnimal=msBunkAnimal!=null?msBunkAnimal+msRoboAnimal:null;
  const leiteMs=(mediaLeite>0&&msTotalAnimal>0)?mediaLeite/msTotalAnimal:0;
  return{animais,tratados,ofertado,sobra,msSobraPct,msOfertadoPct,mediaLeite,racaoRobo,pctSobra,msDietaCadastrada,msOfertadaKg,msSobraKg,msIngeridaBunkKg,msBunkAnimal,msRoboAnimal,msTotalAnimal,leiteMs};
}

function atualizarPreviewLC(){
  const r=calcularConsumoLC();
  const wrap=document.getElementById("lc-preview-wrap");
  if(!wrap)return;
  if(!r){wrap.style.display="none";lcUltimoCalculo=null;return}
  lcUltimoCalculo=r;
  wrap.style.display="block";
  document.getElementById("lc-pv-sobra").textContent=r.pctSobra.toFixed(1)+"%";
  const avisoEl=document.getElementById("lc-aviso-ms");
  const msRows=document.getElementById("lc-ms-rows");
  if(!r.msDietaCadastrada){
    avisoEl.style.display="block";
    msRows.style.display="none";
    return;
  }
  avisoEl.style.display="none";
  msRows.style.display="block";
  document.getElementById("lc-pv-ms-animal").textContent=r.msBunkAnimal.toFixed(1)+" kg";
  const leiteRow=document.getElementById("lc-pv-leite-row");
  if(r.leiteMs>0){leiteRow.style.display="flex";document.getElementById("lc-pv-leite-ms").textContent=r.leiteMs.toFixed(2)}
  else{leiteRow.style.display="none"}
}

async function salvarConsumoProdutor(){
  const r=calcularConsumoLC();
  if(!r){showToast("Preencha nº de animais e quantidade ofertada",true);return}
  if(!r.msDietaCadastrada){
    const ok=confirm("O MS% da dieta oferecida não está cadastrado pra esse lote (peça pro técnico cadastrar em Dieta & Custos no painel). Esse lançamento vai salvar só a % de sobra"+(r.racaoRobo>0?" e a ração do robô":"")+" — a MS ingerida do cocho e o total NÃO vão ser calculados até o MS% ser cadastrado. Salvar mesmo assim?");
    if(!ok)return;
  }
  const data=document.getElementById("lc-data").value||new Date().toISOString().slice(0,10);
  const registro={
    data,animais:r.animais,tratados:r.tratados||r.animais,ofertado:r.ofertado,sobra:r.sobra,
    ms_sobra_pct:r.msSobraPct,ms_oferecido_pct:r.msOfertadoPct,media_leite:r.mediaLeite,racao_robo:r.racaoRobo,
    pct_sobra:+r.pctSobra.toFixed(2),ms_dieta_incompleta:!r.msDietaCadastrada,
    ms_ofertada_kg:r.msOfertadaKg!=null?+r.msOfertadaKg.toFixed(2):null,
    ms_sobra_kg:r.msSobraKg!=null?+r.msSobraKg.toFixed(2):null,
    ms_ingerida_kg:r.msIngeridaBunkKg!=null?+r.msIngeridaBunkKg.toFixed(2):null,
    ms_ingerida_animal:r.msBunkAnimal!=null?+r.msBunkAnimal.toFixed(2):null,
    ms_robo_animal:+r.msRoboAnimal.toFixed(2),
    ms_total_animal:r.msTotalAnimal!=null?+r.msTotalAnimal.toFixed(2):null,
    leite_ms:r.leiteMs>0?+r.leiteMs.toFixed(2):null,
    tratador:(farmData&&farmData.produtor?farmData.produtor:"Produtor")+" (app produtor)",
    salvo_em:new Date().toISOString()
  };
  try{
    if(lcEditandoId){
      registro.editado_em=new Date().toISOString();
      await db.ref("consumo_ms/"+farmId+"/"+lcLoteAtual.id+"/"+lcEditandoId).update(registro);
      showToast("✅ Lançamento atualizado!");
      lcEditandoId=null;
      navScreen("consumo");
      renderConsumoScreen();
    }else{
      await db.ref("consumo_ms/"+farmId+"/"+lcLoteAtual.id).push(registro);
      showToast("✅ Lançamento salvo!");
      document.getElementById("lc-ofertado").value="";
      document.getElementById("lc-sobra").value="";
      document.getElementById("lc-ms-sobra").value="";
      document.getElementById("lc-racao-robo").value="";
      document.getElementById("lc-preview-wrap").style.display="none";
    }
  }catch(e){
    console.error(e);
    showToast("Erro ao salvar: "+e.message,true);
  }
}

function calcScoreSaude(ccs,mediaProd){
  if(ccs==null&&mediaProd==null)return null;
  let score=100;
  if(ccs!=null){
    if(ccs>400)score-=30;
    else if(ccs>200)score-=15;
  }
  if(mediaProd!=null){
    if(mediaProd<25)score-=20;
    else if(mediaProd>=35)score+=10;
  }
  return Math.max(0,Math.min(100,Math.round(score)));
}

// Tabela de perda por CCS — referência pública consolidada (baseada em Hortet & Seegers 1998
// e material técnico usado amplamente no setor leiteiro brasileiro). Ajustável se a Meta tiver
// uma tabela própria.
function pctPerdaPorCCS(ccs){
  if(ccs==null||ccs<=200)return 0;
  if(ccs<=400)return .06;
  if(ccs<=800)return .09;
  if(ccs<=1600)return .12;
  return .15;
}
// Perda por DEL — 85 mL/dia (ponto médio de 80–90 mL) por dia acima de 180 dias em lactação.
const PERDA_ML_POR_DIA_DEL=85;
const DEL_REFERENCIA_PERDA=180;

async function carregarPerdasOcultas(){
  const wrap=document.getElementById("perdas-ocultas-wrap");
  if(!wrap)return;
  const d=farmData||{};
  const ccs=parseFloat(d.ccs)||null;
  const del=parseFloat(d.del)||null;
  const vacas=parseFloat(d.vacas)||0;
  const mediaProd=parseFloat(d.media_prod)||0;
  if(!vacas||(!ccs&&!del)){wrap.innerHTML="";return}
  let precoLitro=null;
  try{
    const fnSnap=await db.ref("financeiro/"+farmId).once("value");
    const fnData=fnSnap.val()||{};
    const fnDatas=Object.keys(fnData).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
    if(fnDatas.length)precoLitro=parseFloat(fnData[fnDatas[fnDatas.length-1]].preco_litro)||null;
  }catch(e){console.error("Erro ao buscar preço do litro para estimativa de perdas:",e)}

  const itens=[];
  if(ccs!=null&&mediaProd>0){
    const pct=pctPerdaPorCCS(ccs);
    if(pct>0){
      const litrosPorVacaDia=mediaProd*pct;
      const litrosDia=litrosPorVacaDia*vacas;
      itens.push({icone:"🩸",titulo:"Perda estimada por CCS alta ("+ccs.toFixed(0)+"k)",litrosPorVacaDia,litrosDia});
    }
  }
  if(del!=null&&del>DEL_REFERENCIA_PERDA){
    const litrosPorVacaDia=(del-DEL_REFERENCIA_PERDA)*(PERDA_ML_POR_DIA_DEL/1000);
    const litrosDia=litrosPorVacaDia*vacas;
    itens.push({icone:"📅",titulo:"Perda estimada por DEL acima de "+DEL_REFERENCIA_PERDA+"d",litrosPorVacaDia,litrosDia});
  }
  if(!itens.length){wrap.innerHTML="";return}
  wrap.innerHTML=`<div class="chart-card" style="background:#fef2f2;border-color:#fecaca;margin-bottom:16px">
    <div style="font-size:11px;font-weight:800;color:#991b1b;text-transform:uppercase;margin-bottom:8px">💸 Perdas Ocultas Estimadas</div>
    ${itens.map(it=>{
      const litrosMes=it.litrosDia*30;
      const valorTxt=precoLitro>0?" · R$ "+(it.litrosDia*precoLitro).toFixed(0)+"/dia (≈R$ "+(litrosMes*precoLitro).toFixed(0)+"/mês)":"";
      return `<div style="padding:8px 0;border-bottom:1px solid #fecaca;font-size:12.5px;color:#7f1d1d">
        <b>${it.icone} ${it.titulo}</b>
        <div style="display:flex;gap:14px;margin-top:4px;flex-wrap:wrap">
          <div><span style="font-size:15px;font-weight:900">${it.litrosPorVacaDia.toFixed(2)}L</span> <span style="font-size:10px">/vaca/dia</span></div>
          <div><span style="font-size:15px;font-weight:900">${it.litrosDia.toFixed(0)}L</span> <span style="font-size:10px">/dia no rebanho</span></div>
        </div>
        ${valorTxt?`<div style="font-size:11px;margin-top:2px;font-weight:700">${valorTxt.replace(" · ","")}</div>`:""}
      </div>`;
    }).join("")}
    <div style="font-size:9.5px;color:#991b1b;opacity:.75;margin-top:6px">Estimativa baseada em referência técnica pública — não substitui o diagnóstico do seu técnico.</div>
  </div>`;
}

async function verificarTHIPrevisao(){
  const wrap=document.getElementById("thi-previsao-wrap");
  if(!wrap)return;
  const lat=parseFloat(farmData.lat);
  const lng=parseFloat(farmData.lng);
  if(!lat||!lng){wrap.innerHTML="";return}
  try{
    const url="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lng+"&daily=temperature_2m_mean,relative_humidity_2m_mean&forecast_days=3&timezone=America%2FSao_Paulo";
    const res=await fetch(url);
    const json=await res.json();
    if(!json||!json.daily||!json.daily.time){wrap.innerHTML="";return}
    let maxThi=0,diaMax="";
    json.daily.time.forEach((dt,i)=>{
      const t=json.daily.temperature_2m_mean[i];
      const rh=json.daily.relative_humidity_2m_mean?json.daily.relative_humidity_2m_mean[i]:null;
      const thi=calcTHI(t,rh);
      if(thi!=null&&thi>maxThi){maxThi=thi;diaMax=dt}
    });
    if(maxThi>=72){
      wrap.innerHTML=`<div class="chart-card" style="background:#fff7ed;border-color:#fdba74;margin-bottom:16px">
        <div style="display:flex;gap:10px;align-items:flex-start">
          <div style="font-size:22px">🌡️</div>
          <div>
            <div style="font-size:12.5px;font-weight:800;color:#9a3412">Estresse térmico previsto — ${new Date(diaMax+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long"})}</div>
            <div style="font-size:11.5px;color:#9a3412;margin-top:2px">THI previsto de ${maxThi.toFixed(0)} — vale ativar aspersão/ventilação preventivamente antes do calor chegar.</div>
          </div>
        </div>
      </div>`;
    }else{
      wrap.innerHTML="";
    }
  }catch(e){
    console.error("Erro ao buscar previsão de THI:",e);
    wrap.innerHTML="";
  }
}

async function carregarComparativoMensal(){
  const wrap=document.getElementById("comparativo-mensal-wrap");
  if(!wrap)return;
  try{
    const snap=await db.ref("historico/"+farmId).once("value");
    const entradas=[];
    snap.forEach(child=>entradas.push(child.val()));
    const hoje=new Date();
    const mesAtual=hoje.toISOString().slice(0,7);
    const mesPassadoDate=new Date(hoje.getFullYear(),hoje.getMonth()-1,1);
    const mesPassado=mesPassadoDate.toISOString().slice(0,7);
    const porMes={};
    entradas.forEach(e=>{
      if(!e.data||!e.media_prod)return;
      const mes=String(e.data).slice(0,7);
      if(mes!==mesAtual&&mes!==mesPassado)return;
      if(!porMes[mes])porMes[mes]={soma:0,n:0};
      porMes[mes].soma+=parseFloat(e.media_prod);
      porMes[mes].n++;
    });
    const atual=porMes[mesAtual];
    const passado=porMes[mesPassado];
    if(!atual||!passado){wrap.innerHTML="";return}
    const mediaAtual=atual.soma/atual.n;
    const mediaPassada=passado.soma/passado.n;
    const diffPct=mediaPassada>0?(mediaAtual-mediaPassada)/mediaPassada*100:0;
    const cor=diffPct>=0?"#15803d":"#dc2626";
    const seta=diffPct>=0?"↑":"↓";
    wrap.innerHTML=`<div class="chart-card" style="margin-bottom:16px">
      <div class="chart-card-title">📊 Este Mês vs Mês Passado</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-top:6px">
        <div style="text-align:center"><div style="font-size:20px;font-weight:900">${mediaAtual.toFixed(1)}L</div><div style="font-size:9.5px;color:var(--muted)">Este mês</div></div>
        <div style="font-size:18px;font-weight:900;color:${cor}">${seta} ${Math.abs(diffPct).toFixed(0)}%</div>
        <div style="text-align:center"><div style="font-size:20px;font-weight:900;color:var(--muted)">${mediaPassada.toFixed(1)}L</div><div style="font-size:9.5px;color:var(--muted)">Mês passado</div></div>
      </div>
    </div>`;
  }catch(e){
    console.error("Erro ao carregar comparativo mensal:",e);
    wrap.innerHTML="";
  }
}

function renderScoreRingHtml(score,gradeLabel,subtitle){
  if(score==null)return"";
  const cor=score>=80?"#4ade80":score>=60?"#60a5fa":score>=40?"#fbbf24":"#f87171";
  const label=gradeLabel||(score>=80?"excelente":score>=60?"bom":score>=40?"regular":"atenção");
  const raio=32,circ=2*Math.PI*raio,offset=circ*(1-score/100);
  return `<div class="chart-card" style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
    <svg width="76" height="76" viewBox="0 0 76 76" style="flex-shrink:0">
      <circle cx="38" cy="38" r="${raio}" fill="none" stroke="#f1f5f9" stroke-width="7"/>
      <circle cx="38" cy="38" r="${raio}" fill="none" stroke="${cor}" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
        transform="rotate(-90 38 38)" style="transition:stroke-dashoffset 1s ease"/>
      <text x="38" y="34" text-anchor="middle" font-size="20" font-weight="900" fill="${cor}" font-family="Inter,sans-serif">${score}</text>
      <text x="38" y="48" text-anchor="middle" font-size="8" fill="${cor}" font-family="Inter,sans-serif" font-weight="700">${label}</text>
    </svg>
    <div>
      <div style="font-size:12.5px;font-weight:800">Índice Meta de Performance</div>
      <div style="font-size:10.5px;color:var(--muted)">${subtitle||""}</div>
    </div>
  </div>`;
}

function abrirEditorMetaPessoal(){
  const atual=parseFloat(farmData.meta_producao_pessoal)||"";

  const num=parseFloat(valor.replace(",","."));

  const alertas=[];
  try{
    const fnSnap=await db.ref("financeiro/"+farmId).once("value");
    const fnData=fnSnap.val()||{};
    const fnDatas=Object.keys(fnData).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
    if(fnDatas.length){
      const reg=fnData[fnDatas[fnDatas.length-1]];
      if(reg.receita_bruta_mensal>0){
        if(reg.lucro_mensal<0)alertas.push({icone:"📉",texto:"Prejuízo identificado no mês — fale com seu técnico"});
        else if(reg.rentabilidade_pct!=null&&reg.rentabilidade_pct<10)alertas.push({icone:"💰",texto:"Rentabilidade abaixo de 10% no último cálculo"});
      }
    }
  }catch(e){console.error("Erro ao checar financeiro para alertas:",e)}
  try{
    const fgSnap=await db.ref("forragem/"+farmId).once("value");
    const fgData=fgSnap.val()||{};
    Object.keys(fgData).forEach(k=>{
      const dadosTipo=fgData[k];
      let ultimo=dadosTipo;
      if(!(dadosTipo.tipo||dadosTipo.estoque_ton!=null)){
        const datas=Object.keys(dadosTipo).filter(dk=>/^\d{4}-\d{2}-\d{2}$/.test(dk)).sort();
        ultimo=datas.length?dadosTipo[datas[datas.length-1]]:null;
      }
      if(!ultimo)return;
      const estoqueTon=ultimo.estoque_ton||0;
      const consumoDia=ultimo.consumo_dia_manual||0;
      if(consumoDia>0){
        const dias=estoqueTon*1000/consumoDia;
        if(dias<15)alertas.push({icone:"🌾",texto:"Estoque de "+(ultimo.tipo||"forragem")+" acabando em "+dias.toFixed(0)+" dias"});
      }
    });
  }catch(e){console.error("Erro ao checar forragem para alertas:",e)}
  try{
    const insSnap=await db.ref("estoque_insumos/"+farmId).once("value");
    const insData=insSnap.val()||{};
    for(const id of Object.keys(insData)){
      const insumo=insData[id];
      const consumoDiario=await calcConsumoDiarioInsumo(insumo.nome);
      const{diasRestantes}=calcEstoqueAtualInsumo(insumo,consumoDiario);
      if(diasRestantes!=null&&diasRestantes<=7){
        alertas.push({icone:"📦",texto:"Estoque de "+insumo.nome+" acaba em "+Math.max(0,Math.round(diasRestantes))+" dia(s) — hora de pedir mais"});
      }
    }
  }catch(e){console.error("Erro ao checar estoque de insumos para alertas:",e)}
  try{
    const cmSnap=await db.ref("consumo_ms/"+farmId).once("value");
    const porLote=cmSnap.val()||{};
    const cutoff=Date.now()-14*864e5;
    let somaSobra=0,nSobra=0;
    Object.values(porLote).forEach(entradas=>{
      Object.values(entradas||{}).forEach(e=>{
        if(!e.data||new Date(e.data+"T12:00:00").getTime()<cutoff)return;
        if(e.pct_sobra!=null){somaSobra+=e.pct_sobra;nSobra++}
      });
    });
    if(nSobra){
      const media=somaSobra/nSobra;
      if(media>10)alertas.push({icone:"🗑️",texto:"Sobra do cocho alta ("+media.toFixed(1)+"%) — desperdício de dieta"});
      else if(media<2)alertas.push({icone:"⚠️",texto:"Sobra do cocho muito baixa ("+media.toFixed(1)+"%) — risco de restrição alimentar"});
    }
  }catch(e){console.error("Erro ao checar consumo para alertas:",e)}
  if(!alertas.length){wrap.innerHTML="";return}
  wrap.innerHTML=`<div class="chart-card" style="background:#fffbeb;border-color:#fcd34d;margin-bottom:16px">
    <div style="font-size:11px;font-weight:800;color:#92400e;text-transform:uppercase;margin-bottom:8px">⚡ Vale sua atenção</div>
    ${alertas.map(a=>`<div style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:12.5px;color:#78350f"><span>${a.icone}</span><span>${a.texto}</span></div>`).join("")}
  </div>`;
}

function explicarTermo(termo){
  const explicacoes={
    ccs:"CCS (Contagem de Células Somáticas) mede a saúde da glândula mamária. Quanto menor, melhor — valores altos indicam risco de mastite subclínica.",
    nul:"NUL (Nitrogênio Ureico no Leite) mostra o aproveitamento de proteína da dieta. Faixa ideal costuma ficar entre 12 e 18.",
    cbt:"CBT (Contagem Bacteriana Total) mede a limpeza da ordenha e do resfriamento do leite. Quanto menor, melhor.",
    gordura:"% de gordura do leite — junto com a proteína, define a qualidade do leite entregue e pode influenciar o preço pago.",
    proteina:"% de proteína do leite — indicador de qualidade nutricional e também pode influenciar o preço pago pelo laticínio.",
    del:"DEL (Dias em Lactação) é há quantos dias a vaca pariu. Vacas com DEL muito alto (bem acima de 180-200 dias) já deveriam estar sendo preparadas pra secagem.",
    gmd:"GMD (Ganho Médio Diário) é o quanto o animal está ganhando de peso por dia, em gramas. Ajuda a acompanhar se a recria está indo bem."
  };
  const texto=explicacoes[termo]||"Sem explicação disponível pra esse termo.";
  alert(texto);
}

function normalizarNomeInsumo(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
}

async function calcConsumoDiarioInsumo(nomeInsumo){
  try{
    const snap=await db.ref("dietas/"+farmId).once("value");
    const data=snap.val();
    const lotes=data&&data.lotes?Object.values(data.lotes):[];
    const alvo=normalizarNomeInsumo(nomeInsumo);
    let totalKgDia=0;
    lotes.forEach(l=>{
      const vacas=parseFloat(l.vacas)||0;
      (l.alimentos||[]).forEach(a=>{
        if(normalizarNomeInsumo(a.nome)===alvo){
          totalKgDia+=(parseFloat(a.kg)||0)*vacas;
        }
      });
    });
    return totalKgDia;
  }catch(e){
    console.error("Erro ao calcular consumo diário do insumo:",e);
    return 0;
  }
}

function calcEstoqueAtualInsumo(insumo,consumoDiario){
  const diasDesde=Math.max(0,Math.floor((Date.now()-new Date(insumo.data_registro+"T12:00:00").getTime())/864e5));
  const consumido=diasDesde*consumoDiario;
  const atual=Math.max(0,(insumo.saldo_kg||0)-consumido);
  const diasRestantes=consumoDiario>0?atual/consumoDiario:null;
  return{atual,diasRestantes};
}

async function salvarEntradaInsumo(){
  const sel=document.getElementById("ins-nome-sel")?.value;
  const nome=sel==="__outro__"?document.getElementById("ins-nome-outro")?.value.trim():sel;
  const qtd=parseFloat(document.getElementById("ins-qtd")?.value);
  const data=document.getElementById("ins-data")?.value;
  if(!nome||isNaN(qtd)||qtd<=0||!data){showToast("❌ Preencha nome, quantidade e data",true);return}
  try{
    const idExistente=Object.keys(_insumosCache).find(id=>normalizarNomeInsumo(_insumosCache[id].nome)===normalizarNomeInsumo(nome));
    if(idExistente){
      const insumoAtual=_insumosCache[idExistente];
      const consumoDiario=await calcConsumoDiarioInsumo(insumoAtual.nome);
      const{atual}=calcEstoqueAtualInsumo(insumoAtual,consumoDiario);
      const novoSaldo=atual+qtd;
      await db.ref("estoque_insumos/"+farmId+"/"+idExistente).update({saldo_kg:novoSaldo,data_registro:data,nome});
      await db.ref("estoque_insumos/"+farmId+"/"+idExistente+"/historico").push({data,tipo:"entrada",quantidade_kg:qtd});
    }else{
      const novoRef=db.ref("estoque_insumos/"+farmId).push();
      await novoRef.set({nome,saldo_kg:qtd,data_registro:data});
      await novoRef.child("historico").push({data,tipo:"entrada",quantidade_kg:qtd});
    }
    showToast("✅ Entrada registrada!");
    document.getElementById("form-insumo-wrap").style.display="none";
    renderInsumosScreen();
  }catch(e){
    console.error("Erro ao salvar entrada de insumo:",e);
    showToast("❌ Erro ao salvar: "+e.message,true);
  }
}

async function salvarDadosProdutor(){
  const num=id=>{const v=parseFloat(document.getElementById(id)?.value);return isNaN(v)?null:v};
  const vacas=num("pf-vacas");
  const secas=num("pf-secas");
  const mediaProd=num("pf-media-prod");
  const del=num("pf-del");
  const gordura=num("pf-gordura");
  const proteina=num("pf-proteina");
  const ccs=num("pf-ccs");

  const upd={ultima_atualizacao_por:"produtor",atualizado_em:new Date().toISOString()};
  if(vacas!=null){upd.vacas=vacas;upd.lactacao=vacas}
  if(secas!=null)upd.secas=secas;
  if(mediaProd!=null){
    upd.media_prod=mediaProd;
    const vacasParaCalculo=vacas!=null?vacas:(parseFloat(farmData.vacas)||0);
    if(vacasParaCalculo>0)upd.prod_diaria=+(mediaProd*vacasParaCalculo).toFixed(1);
  }
  if(del!=null)upd.del=del;
  if(gordura!=null)upd.gordura=gordura;
  if(proteina!=null)upd.proteina=proteina;
  if(ccs!=null)upd.ccs=ccs;

  const btn=document.getElementById("pf-save-btn");
  btn.disabled=true;
  btn.textContent="Salvando...";

  if(!navigator.onLine){
    guardarNaFilaOffline(upd);
    farmData={...farmData,...upd};
    showToast("📶 Sem internet — salvo no celular, será enviado quando voltar o sinal");
    btn.disabled=false;
    btn.textContent="💾 Salvar Atualização";
    navScreen("dash");
    return;
  }

  try{
    await db.ref("propriedades/"+farmId).update(upd);
    db.ref("propriedades/"+farmId+"/log_atualizacoes").push({data:new Date().toISOString(),campos:upd}).catch(e=>console.error("Erro ao registrar log de atualização:",e));
    farmData={...farmData,...upd};
    showToast("✅ Dados atualizados!");
    navScreen("dash");
  }catch(e){
    console.error("Erro ao salvar, guardando na fila offline:",e);
    guardarNaFilaOffline(upd);
    farmData={...farmData,...upd};
    showToast("📶 Não consegui enviar agora — salvo no celular, tento de novo automaticamente");
    navScreen("dash");
  }finally{
    btn.disabled=false;
    btn.textContent="💾 Salvar Atualização";
  }
}

const FILA_OFFLINE_KEY="meta_produtor_fila_offline";
function guardarNaFilaOffline(upd){
  const fila=JSON.parse(localStorage.getItem(FILA_OFFLINE_KEY)||"[]");
  fila.push({farmId,upd,ts:Date.now()});
  localStorage.setItem(FILA_OFFLINE_KEY,JSON.stringify(fila));
  atualizarBadgeFilaOffline();
}
function atualizarBadgeFilaOffline(){
  const fila=JSON.parse(localStorage.getItem(FILA_OFFLINE_KEY)||"[]").filter(item=>item.farmId===farmId);
  const badge=document.getElementById("fila-offline-badge");
  if(badge)badge.textContent=fila.length?fila.length+" atualização(ões) aguardando envio":"";
}
async function sincronizarFilaOffline(){
  if(!navigator.onLine)return;
  let fila=JSON.parse(localStorage.getItem(FILA_OFFLINE_KEY)||"[]");
  if(!fila.length)return;
  const restantes=[];
  for(const item of fila){
    try{
      await db.ref("propriedades/"+item.farmId).update(item.upd);
      db.ref("propriedades/"+item.farmId+"/log_atualizacoes").push({data:new Date().toISOString(),campos:item.upd}).catch(e=>console.error("Erro ao registrar log de atualização:",e));
    }catch(e){
      console.error("Erro ao sincronizar item da fila offline:",e);
      restantes.push(item);
    }
  }
  localStorage.setItem(FILA_OFFLINE_KEY,JSON.stringify(restantes));
  atualizarBadgeFilaOffline();
  if(restantes.length<fila.length&&restantes.length===0)showToast("✅ Atualizações pendentes enviadas com sucesso!");
}
window.addEventListener("online",sincronizarFilaOffline);

let chartInstances={};
let TEMP_CACHE={};
function calcTHI(t,rh){if(t==null||rh==null)return null;return(1.8*t+32)-((.55-.0055*rh)*(1.8*t-26))}
async function fetchTemperaturaHistorica(lat,lng,startDate,endDate){
  const cacheKey=lat.toFixed(2)+","+lng.toFixed(2)+","+startDate+","+endDate;
  if(TEMP_CACHE[cacheKey])return TEMP_CACHE[cacheKey];
  try{
    const url="https://archive-api.open-meteo.com/v1/archive?latitude="+lat+"&longitude="+lng+"&start_date="+startDate+"&end_date="+endDate+"&daily=temperature_2m_mean,relative_humidity_2m_mean&timezone=America%2FSao_Paulo";
    const res=await fetch(url);
    const json=await res.json();
    const tempMap={},humidMap={},thiMap={};
    if(json&&json.daily&&json.daily.time){
      json.daily.time.forEach((d,i)=>{
        const t=json.daily.temperature_2m_mean[i];
        const rh=json.daily.relative_humidity_2m_mean?json.daily.relative_humidity_2m_mean[i]:null;
        if(t!=null)tempMap[d]=t;
        if(rh!=null)humidMap[d]=rh;
        const thi=calcTHI(t,rh);
        if(thi!=null)thiMap[d]=thi;
      });
    }
    const result={temp:tempMap,humidity:humidMap,thi:thiMap};
    TEMP_CACHE[cacheKey]=result;
    return result;
  }catch(e){
    console.error("Erro ao buscar dados climáticos:",e);
    return{temp:{},humidity:{},thi:{}};
  }
}
function destroyChart(id){if(chartInstances[id]){chartInstances[id].destroy();delete chartInstances[id]}}
function mkChart(id,type,data,options){
  destroyChart(id);
  const ctx=document.getElementById(id);
  if(!ctx)return;
  chartInstances[id]=new Chart(ctx,{type,data,options:{responsive:true,maintainAspectRatio:false,...options}});
}

function renderLeiteiroDispersao(dataEscolhida){
  const wrap=document.getElementById("leiteiro-dispersao-wrap");
  if(!wrap||!_leiteiroDataCache)return;
  const {data}=_leiteiroDataCache;
  const registro=data[dataEscolhida];
  const vacas=(registro.vacas||[]).filter(v=>v.litros>0&&v.del>0);
  if(!vacas.length){
    wrap.innerHTML=`<div class="chart-card" style="text-align:center;color:var(--muted);padding:30px 16px">Esse controle (${new Date(dataEscolhida+"T12:00:00").toLocaleDateString("pt-BR")}) não tem dados de produção suficientes pra montar o gráfico.</div>`;
    return;
  }
  const mediaProd=vacas.reduce((s,v)=>s+v.litros,0)/vacas.length;
  const mediaDel=vacas.reduce((s,v)=>s+v.del,0)/vacas.length;
  const lotes=[...new Set(vacas.map(v=>v.lote||1))].sort((a,b)=>a-b);
  const cores=["#15803d","#0891b2","#7c3aed","#d97706","#dc2626","#db2777"];
  const datasets=lotes.map((lote,i)=>({
    label:"Lote "+lote,
    data:vacas.filter(v=>(v.lote||1)===lote).map(v=>({x:v.del,y:v.litros})),
    backgroundColor:cores[i%cores.length]+"cc",
    borderColor:"white",
    borderWidth:1,
    pointRadius:6
  }));
  wrap.innerHTML=`
    <div class="chart-card">
      <div class="chart-card-title">Dispersão — Produção (L) × DEL (dias)</div>
      <div class="chart-card-sub">Controle de ${new Date(dataEscolhida+"T12:00:00").toLocaleDateString("pt-BR")} · ${vacas.length} vacas · média ${mediaProd.toFixed(1)} L · DEL médio ${mediaDel.toFixed(0)}d</div>
      <div style="height:280px"><canvas id="ch-leiteiro-scatter"></canvas></div>
    </div>
  `;
  mkChart("ch-leiteiro-scatter","scatter",{datasets},{
    plugins:{
      legend:{labels:{boxWidth:10,font:{size:10}}},
      tooltip:{callbacks:{label:c=>"DEL "+c.raw.x+" · "+c.raw.y.toFixed(1)+" L"}},
      annotation:{annotations:{
        mediaProdLine:{type:"line",yMin:mediaProd,yMax:mediaProd,borderColor:"#dc2626",borderWidth:1.5,borderDash:[6,4],label:{display:true,content:"Média "+mediaProd.toFixed(1)+"L",color:"#dc2626",font:{size:8,weight:"bold"},position:"end",backgroundColor:"rgba(254,242,242,.9)",padding:{x:4,y:2},borderRadius:4}},
        mediaDelLine:{type:"line",xMin:mediaDel,xMax:mediaDel,borderColor:"#7c3aed",borderWidth:1.5,borderDash:[6,4],label:{display:true,content:"DEL médio "+mediaDel.toFixed(0)+"d",color:"#7c3aed",font:{size:8,weight:"bold"},position:"start",backgroundColor:"rgba(245,243,255,.9)",padding:{x:4,y:2},borderRadius:4}}
      }}
    },
    scales:{
      x:{title:{display:true,text:"DEL (dias)",font:{size:10}}},
      y:{title:{display:true,text:"Litros/dia",font:{size:10}}}
    }
  });

function buscarVacaLeiteiro(){
  const input=document.getElementById("leiteiro-busca-input");
  const resultWrap=document.getElementById("leiteiro-busca-resultado");
  if(!input||!resultWrap||!_leiteiroDataCache)return;
  const numeroBusca=input.value.trim();
  if(!numeroBusca){resultWrap.innerHTML="";return}
  const{data,datas}=_leiteiroDataCache;
  const historico=[];
  datas.forEach(dt=>{
    const reg=data[dt];
    const v=(reg.vacas||[]).find(x=>String(x.vaca).trim()===numeroBusca);
    if(v)historico.push({data:dt,...v});
  });
  if(!historico.length){
    resultWrap.innerHTML=`<div style="text-align:center;color:var(--muted);font-size:12px;padding:12px 0">Vaca ${numeroBusca} não encontrada em nenhum controle registrado.</div>`;
    return;
  }
  const ultima=historico[historico.length-1];
  const mediaHist=historico.filter(h=>h.litros>0).reduce((s,h,_,arr)=>s+h.litros/arr.length,0);
  resultWrap.innerHTML=`
    <div style="background:var(--surface2);border-radius:10px;padding:12px;margin-bottom:8px">
      <div style="font-size:13px;font-weight:800">Vaca ${numeroBusca}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">${historico.length} registro(s) · Lactação ${ultima.lactacao||"—"} · Média histórica: ${mediaHist>0?mediaHist.toFixed(1)+"L":"—"}</div>
    </div>
    ${[...historico].reverse().map(h=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:12px">
      <span style="color:var(--muted)">${new Date(h.data+"T12:00:00").toLocaleDateString("pt-BR")}</span>
      <span>${h.del>0?"DEL "+h.del+"d":""}</span>
      <span style="font-weight:700">${h.litros>0?h.litros.toFixed(1)+"L":(h.obs||"sem produção")}</span>
    </div>`).join("")}
  `;
}

async function renderLeiteiroTHI(){
  const wrap=document.getElementById("thi-wrap");
  if(!wrap||!_leiteiroDataCache)return;
  const {data,datas}=_leiteiroDataCache;
  const lat=parseFloat(farmData.lat);
  const lng=parseFloat(farmData.lng);
  if(!lat||!lng){wrap.innerHTML="";return}
  wrap.innerHTML=`<div class="chart-card" id="thi-card">
    <div class="chart-card-title">Produção × THI (Índice de Temperatura e Umidade)</div>
    <div class="chart-card-sub" id="thi-sub">Calculando...</div>
    <div style="height:260px"><canvas id="ch-leiteiro-thi"></canvas></div>
  </div>`;
  try{
    const porData={};
    datas.forEach(dt=>{
      const reg=data[dt];
      const comLeite=(reg.vacas||[]).filter(v=>v.litros>0);
      if(comLeite.length)porData[dt]=comLeite.reduce((s,v)=>s+v.litros,0)/comLeite.length;
    });
    const datasComProd=Object.keys(porData).sort();
    if(datasComProd.length>=3){
      const clima=await fetchTemperaturaHistorica(lat,lng,datasComProd[0],datasComProd[datasComProd.length-1]);
      const labels=datasComProd.map(d=>new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}));
      const prodVals=datasComProd.map(d=>+porData[d].toFixed(1));
      const thiVals=datasComProd.map(d=>clima.thi[d]!=null?+clima.thi[d].toFixed(1):null);
      const thiValidos=thiVals.filter(v=>v!=null);
      const diasCriticos=thiValidos.filter(v=>v>=72).length;
      const subEl=document.getElementById("thi-sub");
      if(subEl)subEl.textContent=thiValidos.length?diasCriticos+" dia(s) em estresse térmico (THI≥72) nos controles do período":"Sem dado climático disponível pro período";
      mkChart("ch-leiteiro-thi","line",{
        labels,
        datasets:[
          {label:"Produção Média (L)",data:prodVals,borderColor:"#2563eb",backgroundColor:"rgba(37,99,235,.08)",borderWidth:2,tension:.3,yAxisID:"y"},
          {label:"THI",data:thiVals,borderColor:"#dc2626",backgroundColor:"rgba(220,38,38,.06)",borderWidth:2,borderDash:[4,2],tension:.3,spanGaps:true,yAxisID:"y1"}
        ]
      },{
        plugins:{legend:{labels:{boxWidth:10,font:{size:10}}}},
        scales:{
          y:{position:"left",title:{display:true,text:"Produção (L)",font:{size:9}}},
          y1:{position:"right",title:{display:true,text:"THI",font:{size:9}},grid:{display:false}}
        }
      });
    }else{
      const thiCard=document.getElementById("thi-card");
      if(thiCard)thiCard.innerHTML=`<div style="text-align:center;color:var(--muted);padding:20px 0;font-size:12px">Precisa de pelo menos 3 controles em datas diferentes pra montar esse gráfico.</div>`;
    }
  }catch(e2){
    console.error("Erro ao montar gráfico de THI:",e2);
    const thiCard=document.getElementById("thi-card");
    if(thiCard)thiCard.innerHTML=`<div style="text-align:center;color:#dc2626;padding:20px 0;font-size:12px">Erro ao buscar dados climáticos.</div>`;
  }
}

async function renderEvolucaoCombinada(){
  const wrap=document.getElementById("evolucao-combinada-wrap");
  if(!wrap)return;
  try{
    const pontos=[];
    // Fonte 1: histórico de visitas técnicas
    const histSnap=await db.ref("historico/"+farmId).once("value");
    histSnap.forEach(child=>{
      const e=child.val();
      if(e.data&&e.media_prod>0)pontos.push({data:e.data,valor:parseFloat(e.media_prod),origem:"tecnico"});
    });
    // Fonte 2: lançamentos do próprio produtor
    const logSnap=await db.ref("propriedades/"+farmId+"/log_atualizacoes").once("value");
    logSnap.forEach(child=>{
      const e=child.val();
      if(e.data&&e.campos&&e.campos.media_prod>0)pontos.push({data:e.data.slice(0,10),valor:parseFloat(e.campos.media_prod),origem:"produtor"});
    });
    // Fonte 3: controles leiteiros (média do dia)
    const clSnap=await db.ref("controle_leiteiro/"+farmId).once("value");
    const clData=clSnap.val()||{};
    Object.keys(clData).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).forEach(dt=>{
      const comLeite=(clData[dt].vacas||[]).filter(v=>v.litros>0);
      if(comLeite.length)pontos.push({data:dt,valor:comLeite.reduce((s,v)=>s+v.litros,0)/comLeite.length,origem:"controle"});
    });

    if(pontos.length<2){wrap.innerHTML="";return}
    pontos.sort((a,b)=>a.data.localeCompare(b.data));

    const labels=pontos.map(p=>new Date(p.data+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"}));
    const valores=pontos.map(p=>+p.valor.toFixed(1));
    const coresPorOrigem={tecnico:"#2563eb",produtor:"#15803d",controle:"#7c3aed"};
    const pointColors=pontos.map(p=>coresPorOrigem[p.origem]);

    wrap.innerHTML=`<div class="chart-card">
      <div class="chart-card-title">📊 Produção — Todos os Lançamentos e Controles</div>
      <div class="chart-card-sub">🔵 Visita técnica · 🟢 Você mesmo atualizou · 🟣 Controle leiteiro</div>
      <div style="height:240px"><canvas id="ch-evol-combinada"></canvas></div>
    </div>`;
    mkChart("ch-evol-combinada","line",{
      labels,
      datasets:[{
        label:"Produção Média (L/vaca/dia)",
        data:valores,
        borderColor:"#94a3b8",
        backgroundColor:"rgba(148,163,184,.06)",
        borderWidth:2,
        tension:.25,
        pointRadius:5,
        pointBackgroundColor:pointColors,
        pointBorderColor:pointColors,
        spanGaps:true
      }]
    },{
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>{
          const p=pontos[ctx.dataIndex];
          const origemLabel=p.origem==="tecnico"?"Visita técnica":p.origem==="produtor"?"Você atualizou":"Controle leiteiro";
          return origemLabel+": "+p.valor.toFixed(1)+"L";
        }}}
      },
      scales:{x:{ticks:{maxRotation:45,minRotation:45,font:{size:8}}},y:{title:{display:true,text:"L/vaca/dia",font:{size:9}}}}
    });
  }catch(e){
    console.error("Erro ao montar evolução combinada:",e);
    wrap.innerHTML="";
  }
}

      const e=child.val();
      if(!e.data)return;
      if(e.media_prod>0)pontosProd.push({data:e.data,valor:parseFloat(e.media_prod)});
      if(e.del>0)pontosDel.push({data:e.data,valor:parseFloat(e.del)});
    });

    const logSnap=await db.ref("propriedades/"+farmId+"/log_atualizacoes").once("value");
    logSnap.forEach(child=>{
      const e=child.val();
      if(!e.data||!e.campos)return;
      const dt=e.data.slice(0,10);
      if(e.campos.media_prod>0)pontosProd.push({data:dt,valor:parseFloat(e.campos.media_prod)});
      if(e.campos.del>0)pontosDel.push({data:dt,valor:parseFloat(e.campos.del)});
    });

    const clSnap=await db.ref("controle_leiteiro/"+farmId).once("value");
    const clData=clSnap.val()||{};
    Object.keys(clData).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).forEach(dt=>{
      const vacas=clData[dt].vacas||[];
      const comLeite=vacas.filter(v=>v.litros>0);
      if(comLeite.length)pontosProd.push({data:dt,valor:comLeite.reduce((s,v)=>s+v.litros,0)/comLeite.length});
      const comDel=vacas.filter(v=>v.del>0);
      if(comDel.length)pontosDel.push({data:dt,valor:comDel.reduce((s,v)=>s+v.del,0)/comDel.length});
    });

    const agruparPorAno=pontos=>{
      const porAno={};
      pontos.forEach(p=>{
        const ano=p.data.slice(0,4);
        if(!porAno[ano])porAno[ano]={soma:0,n:0};
        porAno[ano].soma+=p.valor;
        porAno[ano].n++;
      });
      return porAno;
    };
    const prodPorAno=agruparPorAno(pontosProd);
    const delPorAno=agruparPorAno(pontosDel);
    const anos=[...new Set([...Object.keys(prodPorAno),...Object.keys(delPorAno)])].sort();

    if(anos.length<1){wrap.innerHTML="";return}

    const anoAtual=new Date().getFullYear().toString();
    const mediaProdAnoAtual=prodPorAno[anoAtual]?prodPorAno[anoAtual].soma/prodPorAno[anoAtual].n:null;
    const mediaDelAnoAtual=delPorAno[anoAtual]?delPorAno[anoAtual].soma/delPorAno[anoAtual].n:null;

    let html=`<div class="chart-card">
      <div class="chart-card-title">📅 Média do Ano</div>
      <div class="chart-card-sub">Médias de ${anoAtual} até agora</div>
      <div class="kpi-grid" style="margin-top:6px;margin-bottom:0">
        <div class="kpi-card" style="--kpi-color:#15803d"><div class="kpi-icon">🥛</div><div class="kpi-val">${mediaProdAnoAtual!=null?mediaProdAnoAtual.toFixed(1):"—"}</div><div class="kpi-lbl">L/vaca/dia (média ${anoAtual})</div></div>
        <div class="kpi-card" style="--kpi-color:#d97706"><div class="kpi-icon">📅</div><div class="kpi-val">${mediaDelAnoAtual!=null?mediaDelAnoAtual.toFixed(0):"—"}</div><div class="kpi-lbl">DEL médio (média ${anoAtual})</div></div>
      </div>
    </div>`;

    if(anos.length>=2){
      html+=`<div class="chart-card">
        <div class="chart-card-title">Médias por Ano</div>
        <div class="chart-card-sub">Produção e DEL médios, ano a ano</div>
        <div style="height:220px"><canvas id="ch-media-anual"></canvas></div>
      </div>`;
    }

    wrap.innerHTML=html;

    if(anos.length>=2){
      const prodVals=anos.map(a=>prodPorAno[a]?+(prodPorAno[a].soma/prodPorAno[a].n).toFixed(1):null);
      const delVals=anos.map(a=>delPorAno[a]?+(delPorAno[a].soma/delPorAno[a].n).toFixed(0):null);
      mkChart("ch-media-anual","bar",{
        labels:anos,
        datasets:[
          {label:"Produção Média (L/vaca/dia)",data:prodVals,backgroundColor:"#15803d",borderRadius:5,yAxisID:"y"},
          {label:"DEL Médio",data:delVals,type:"line",borderColor:"#d97706",backgroundColor:"#d97706",borderWidth:2.5,pointRadius:5,tension:.2,yAxisID:"y1"}
        ]
      },{
        plugins:{legend:{labels:{boxWidth:10,font:{size:10}}}},
        scales:{
          y:{position:"left",title:{display:true,text:"L/vaca/dia",font:{size:9}}},
          y1:{position:"right",title:{display:true,text:"DEL (dias)",font:{size:9}},grid:{display:false}}
        }
      });
    }
  }catch(e){
    console.error("Erro ao montar média anual:",e);
    wrap.innerHTML="";
  }
}

async function renderEvolucaoScreen(){
  const body=document.getElementById("evolucao-body");
  if(!body)return;
  body.innerHTML=`
    <div style="font-size:17px;font-weight:800;margin-bottom:4px">📈 Evolução Mês a Mês</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:14px">Histórico de produção e qualidade do leite ao longo do tempo</div>
    <div id="evolucao-combinada-wrap"></div>
    <div id="media-anual-wrap"></div>
    <div id="evolucao-content"><div style="text-align:center;padding:40px"><div class="mg-spinner"></div></div></div>
  `;
  renderEvolucaoCombinada();
  renderMediaAnual();
  try{
    const snap=await db.ref("historico/"+farmId).once("value");
    const entradas=[];
    snap.forEach(child=>entradas.push(child.val()));
    const cont=document.getElementById("evolucao-content");
    if(entradas.length<2){
      cont.innerHTML=`<div class="chart-card" style="text-align:center;color:var(--muted);padding:30px 16px">Ainda não há histórico suficiente (precisa de pelo menos 2 registros em datas diferentes).</div>`;
      return;
    }
    const porMes={};
    entradas.forEach(e=>{
      if(!e.data)return;
      const mes=String(e.data).slice(0,7);
      if(!/^\d{4}-\d{2}$/.test(mes))return;
      if(!porMes[mes])porMes[mes]={somaProd:0,nProd:0,somaGord:0,nGord:0,somaProt:0,nProt:0};
      if(e.media_prod>0){porMes[mes].somaProd+=parseFloat(e.media_prod);porMes[mes].nProd++}
      if(e.gordura>0){porMes[mes].somaGord+=parseFloat(e.gordura);porMes[mes].nGord++}
      if(e.proteina>0){porMes[mes].somaProt+=parseFloat(e.proteina);porMes[mes].nProt++}
    });
    const meses=Object.keys(porMes).sort();
    if(meses.length<2){
      cont.innerHTML=`<div class="chart-card" style="text-align:center;color:var(--muted);padding:30px 16px">Ainda não há registros em pelo menos 2 meses diferentes.</div>`;
      return;
    }
    const nomesMes=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
    const labels=meses.map(m=>nomesMes[parseInt(m.slice(5,7),10)-1]+"/"+m.slice(2,4));
    const prodData=meses.map(m=>porMes[m].nProd?+(porMes[m].somaProd/porMes[m].nProd).toFixed(1):null);
    const gordData=meses.map(m=>porMes[m].nGord?+(porMes[m].somaGord/porMes[m].nGord).toFixed(2):null);
    const protData=meses.map(m=>porMes[m].nProt?+(porMes[m].somaProt/porMes[m].nProt).toFixed(2):null);
    cont.innerHTML=`
      <div class="chart-card">
        <div class="chart-card-title">Produção Média (L/vaca/dia)</div>
        <div class="chart-card-sub">Média mensal, mês a mês</div>
        <div style="height:220px"><canvas id="ch-evol-prod"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">Qualidade do Leite</div>
        <div class="chart-card-sub">Gordura e proteína médias, mês a mês</div>
        <div style="height:220px"><canvas id="ch-evol-qual"></canvas></div>
      </div>
    `;
    mkChart("ch-evol-prod","bar",{
      labels,
      datasets:[{label:"L/vaca/dia",data:prodData,backgroundColor:"#15803d",borderRadius:5}]
    },{plugins:{legend:{display:false}}});
    mkChart("ch-evol-qual","line",{
      labels,
      datasets:[
        {label:"Gordura %",data:gordData,borderColor:"#b45309",backgroundColor:"rgba(180,83,9,.06)",borderWidth:2,pointRadius:4,tension:.3,spanGaps:true},
        {label:"Proteína %",data:protData,borderColor:"#1d4ed8",backgroundColor:"rgba(29,78,216,.06)",borderWidth:2,pointRadius:4,tension:.3,spanGaps:true}
      ]
    },{plugins:{legend:{labels:{boxWidth:10,font:{size:10}}}}});
  }catch(e){
    console.error("Erro ao carregar evolução:",e);
    document.getElementById("evolucao-content").innerHTML=`<div class="chart-card" style="text-align:center;color:#dc2626">Erro ao carregar dados.</div>`;
  }
}

async function renderDietaScreen(){

  `;

    const snap=await db.ref("dietas/"+farmId).once("value");

    const cont=document.getElementById("dieta-content");

      cont.innerHTML=`<div class="chart-card" style="text-align:center;color:var(--muted);padding:30px 16px">Nenhuma dieta cadastrada ainda pra essa fazenda.</div>`;

      totalCusto+=cvd*vacas;
      totalVacas+=vacas;
      html+=`<div class="chart-card">
        <div class="chart-card-title">${lote.nomeDieta||lote.nome||"Lote"}</div>

          const kg=parseFloat(a.kg)||0,custo=parseFloat(a.custo)||0,sub=kg*custo;
          return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9">
            <div style="flex:1;font-size:12.5px;font-weight:600">${a.nome||"Alimento"}</div>
            <div style="font-size:11.5px;color:var(--muted);min-width:60px;text-align:right">${kg.toFixed(1)} kg</div>
            <div style="font-size:12px;font-weight:700;color:#15803d;min-width:70px;text-align:right">R$${sub.toFixed(2)}</div>
          </div>`;
        }).join("")}
        <div style="text-align:right;margin-top:10px;font-size:13px;font-weight:800;color:#15803d">CVD: R$ ${cvd.toFixed(2)}/vaca/dia</div>
      </div>`;
    });
    const cvdGeral=totalVacas>0?totalCusto/totalVacas:0;
    cont.innerHTML=`
      <div class="hero-card" style="margin-bottom:16px">
        <div class="hero-sub" style="opacity:.85">Custo médio de alimentação</div>
        <div style="font-size:26px;font-weight:900;margin-top:4px">R$ ${cvdGeral.toFixed(2)} <span style="font-size:13px;font-weight:600;opacity:.8">/ vaca / dia</span></div>
        <div style="font-size:11px;opacity:.75;margin-top:4px">R$ ${totalCusto.toFixed(0)}/dia no total · ${totalVacas} vacas</div>
      </div>
      ${html}
    `;
  }catch(e){
    console.error("Erro ao carregar dieta:",e);
    document.getElementById("dieta-content").innerHTML=`<div class="chart-card" style="text-align:center;color:#dc2626">Erro ao carregar dados.</div>`;
  }
}

function recAtualizarCamposPeso(){const n=document.getElementById("rec-novo-nascimento");const w=document.getElementById("rec-novo-atual-wrap");const lbl=document.getElementById("rec-novo-peso-lbl");if(!n||!w)return;const dias=n.value?Math.round((new Date(new Date().toISOString().slice(0,10)+"T12:00:00")-new Date(n.value+"T12:00:00"))/864e5):0;const antiga=dias>3;w.style.display=antiga?"block":"none";if(lbl)lbl.textContent=antiga?"Peso ao nascer (kg) — só se souber":"Peso ao nascer (kg) — se pesou"}
function calcGmdAnimalSimples(a){
  const pesagens=Object.values(a.pesagens||{}).sort((x,y)=>(x.data||"")>(y.data||"")?1:-1);
  const ultima=pesagens[pesagens.length-1];
  const pesoAtual=ultima?ultima.peso:a.peso_nascimento;
  const diasVida=a.nascimento?Math.floor((Date.now()-new Date(a.nascimento+"T12:00:00").getTime())/864e5):0;
  const gmdGeral=diasVida>0&&pesoAtual!=null&&a.peso_nascimento!=null?(pesoAtual-a.peso_nascimento)/diasVida*1000:null;
  const pesagensComAltura=pesagens.filter(p=>p.altura!=null);
  const alturaAtual=pesagensComAltura.length?pesagensComAltura[pesagensComAltura.length-1].altura:a.altura_nascimento;
  return{gmdGeral,pesoAtual,alturaAtual};
}

async function salvarLancamentoRecria(){
  const tipo=document.getElementById("rec-tipo")?.value||"pesagem";
  try{
    if(tipo==="pesagem"){
      const animalId=document.getElementById("rec-animal-sel")?.value;
      const data=document.getElementById("rec-pesagem-data")?.value;
      const peso=parseFloat(document.getElementById("rec-pesagem-peso")?.value);
      const alturaRaw=document.getElementById("rec-pesagem-altura")?.value;
      const altura=alturaRaw?parseFloat(alturaRaw):null;
      if(!animalId||!data||isNaN(peso)||peso<=0){showToast("❌ Preencha animal, data e peso",true);return}
      const registroPesagem={data,peso};
      if(altura>0)registroPesagem.altura=altura;
      await db.ref("recria/"+farmId+"/"+animalId+"/pesagens").push(registroPesagem);
      showToast("✅ Pesagem lançada!");
    }else{
      const numero=document.getElementById("rec-novo-numero")?.value.trim();
      const nascimento=document.getElementById("rec-novo-nascimento")?.value;
      const pesoNasc=parseFloat(document.getElementById("rec-novo-peso")?.value);
      const alturaNascRaw=document.getElementById("rec-novo-altura")?.value;
      const alturaNasc=alturaNascRaw?parseFloat(alturaNascRaw):null;
      if(!numero||!nascimento){showToast("❌ Preencha o número e a data de nascimento",true);return}
      if(nascimento>new Date().toISOString().slice(0,10)){showToast("❌ A data de nascimento está no futuro",true);return}
      if(!isNaN(pesoNasc)&&(pesoNasc<15||pesoNasc>70)){showToast("❌ Peso ao nascer fora do esperado (15 a 70 kg)",true);return}
      const idc=idLerCampos("rec-id-");const ide=idValidarCampos(idc);if(ide){showToast("❌ "+ide,true);return}
      const pesoOk=!isNaN(pesoNasc)&&pesoNasc>0;
      const registroAnimal={numero,nascimento,peso_nascimento:pesoOk?pesoNasc:idPesoNascRefProd(),status:"ativo",aleitamento:true,origem:"produtor",criado_em:new Date().toISOString()};
      if(pesoOk)registroAnimal.peso_nascimento_informado=true;else registroAnimal.peso_nascimento_estimado=true;
      if(alturaNasc>0)registroAnimal.altura_nascimento=alturaNasc;
      Object.keys(idc).forEach(k=>{if(idc[k]!=null)registroAnimal[k]=idc[k]});
      const hojeIso=new Date().toISOString().slice(0,10);
      const diasVida=Math.round((new Date(hojeIso+"T12:00:00")-new Date(nascimento+"T12:00:00"))/864e5);
      const pesoAtual=parseFloat(document.getElementById("rec-novo-peso-atual")?.value);
      const alturaAtual=parseFloat(document.getElementById("rec-novo-altura-atual")?.value);
      if(diasVida>3&&pesoAtual>0){if(pesoAtual<20||pesoAtual>800){showToast("❌ Peso atual fora do esperado",true);return}const pes={data:hojeIso,peso:pesoAtual,registrado_por:"PRODUTOR"};if(alturaAtual>0)pes.altura=alturaAtual;registroAnimal.pesagens={primeiro_registro:pes}}
      registroAnimal.aleitamento=diasVida<=60;
      const novoRef=await db.ref("recria/"+farmId).push(registroAnimal);
      if(_idFotoPendente["rec-id-"]){showToast("Enviando foto…");try{await idSalvarFotoAnimal(farmId,novoRef.key,_idFotoPendente["rec-id-"])}catch(eF){console.error(eF);showToast("Bezerra salva, mas a foto não foi enviada.",true)}delete _idFotoPendente["rec-id-"]}
      showToast("✅ Bezerra cadastrada!");
    }
    document.getElementById("form-recria-wrap").style.display="none";
    renderRecriaScreen();
  }catch(e){
    console.error("Erro ao salvar lançamento de recria:",e);
    showToast("❌ Erro ao salvar: "+e.message,true);
  }
}

function rpParseData(v){
  if(v==null||v==="")return null;

/* ---------- taxas por ciclo de 21 dias ---------- */
function rpCiclos(reb,cfg,hoje,nCiclos){
  cfg=rpCfg(cfg);hoje=hoje||rpHoje();nCiclos=nCiclos||12;
  var fimUlt=rpAdd(hoje,0);var ciclos=[];
  for(var c=nCiclos-1;c>=0;c--){var fim=rpAdd(fimUlt,-21*c);var ini=rpAdd(fim,-20);ciclos.push({ini:ini,fim:fim,eleg:0,insem:0,prenhas:0,serv:0,servConc:0,servDiag:0})}
  reb.forEach(function(r){var st=r.st;
    /* reconstrói janelas de aptidão: de parto+PEV até concepção/saída/próximo parto */
    var partos=st.partos.slice();
    partos.forEach(function(p,ix){
      var apta=rpAdd(p,cfg.pev);var prox=partos[ix+1]||null;
      var conc=null;st.concepcoes.forEach(function(cc){if(cc.data>=p&&(!prox||cc.data<prox)&&(!conc||cc.data<conc))conc=cc.data});
      /* se houve perda, a vaca volta a ser elegível depois da perda */
      var perdas=st.perdas.filter(function(pe){return pe.data>=p&&(!prox||pe.data<prox)});
      var fimJan=conc||prox||(st.saiu?st.saiu.data:null);
      var secaEm=(st.dataSecagem&&st.dataSecagem>=p&&(!prox||st.dataSecagem<prox))?st.dataSecagem:null;
      if(secaEm&&(!fimJan||secaEm<fimJan))fimJan=secaEm;
      var janelas=[[apta,fimJan]];
      perdas.forEach(function(pe){var c2=null;st.concepcoes.forEach(function(cc){if(cc.data>pe.data&&(!prox||cc.data<prox)&&(!c2||cc.data<c2))c2=cc.data});janelas.push([pe.data,c2||prox||(st.saiu?st.saiu.data:null)])});
      janelas.forEach(function(j){
        ciclos.forEach(function(cy){
          if(cy.ini<j[0])return;/* precisa estar apta no início do ciclo */
          if(j[1]&&j[1]<cy.ini)return;
          var concAqui=!!(j[1]&&j[1]>=cy.ini&&j[1]<=cy.fim&&st.concepcoes.some(function(cc){return cc.data===j[1]}));
          if(st.saiu&&st.saiu.data<=cy.fim&&!concAqui)return;/* saiu antes/durante o ciclo sem emprenhar */
          cy.eleg++;

      });
    });
    /* taxa de concepção: todos os serviços de vacas (por data do serviço) */
    st.todosServicos.forEach(function(s){if(!s.parto)return;ciclos.forEach(function(cy){if(s.data>=cy.ini&&s.data<=cy.fim){cy.serv++;if(s.res==="concepcao"||s.res==="falha"){cy.servDiag++;if(s.res==="concepcao")cy.servConc++}}})});
  });

  ciclos.forEach(function(cy){
    cy.completo=cy.fim<=limiteDiag;
    cy.ts=cy.eleg?cy.insem/cy.eleg*100:null;
    cy.tc=cy.servDiag?cy.servConc/cy.servDiag*100:null;
    cy.tp=(cy.eleg&&cy.completo)?cy.prenhas/cy.eleg*100:null;
  });
  return ciclos;
}

    pctPerdas:conc12b?perd12/conc12b*100:null,perdas:perd12,
    primServico:media(primServ),
    vazias150:ativos.filter(function(r){return r.st.status==="vazia"&&r.st.del>150}).length,

function rpDetectarColunas(linhas){

  var map={},usados={};
  var cab=(linhas[hi]||[]).map(function(c){return String(c==null?"":c).trim()});

  ["prevparto","parto","ia","nserv","dg","secagem","nasc","del","lactacao","touro","situacao","categoria","nome","brinco"].forEach(function(k){
    var col=RP_COLS.filter(function(c){return c.k===k})[0];

function rpSituacao(v){var s=String(v||"").toLowerCase();

  if(/n[aã]o\s*prenh|negat|vazia|^vz|^v$|falha/.test(s))return "vazia";
  if(/seca/.test(s)&&/prenh|gest|pr\b/.test(s))return "seca_prenhe";
  if(/seca/.test(s))return "seca";
  if(/prenh|gest|positiv|^pr\b|^p$|confirm|prenha/.test(s))return "prenhe";

function rpRef(farm,sub){return db.ref("repro/"+farm+(sub?"/"+sub:""))}
async function rpCarregar(farm){var s=await rpRef(farm).once("value");var v=s.val()||{};return {animais:v.animais||{},eventos:v.eventos||{},config:rpCfg(v.config)}}
function rpAnimalPorBrinco(animais,br){br=rpNormBrinco(br);for(var k in animais){if(rpNormBrinco(animais[k].brinco)===br)return k}return null}
function rpEventoDuplicado(eventos,animalId,ev){for(var k in eventos){var e=eventos[k];if(e.animal===animalId&&e.tipo===ev.tipo&&e.data===ev.data)return true;if(e.animal===animalId&&e.tipo===ev.tipo&&ev.tipo==="parto"&&Math.abs(rpDif(e.data,ev.data))<=20)return true}return false}
/* aplica lista {brinco,..., eventos:[]} → retorna contagem */
async function rpGravarLote(farm,dados,lista,meta){
  var upd={},novosA=0,novosE=0,ign=0;var agora=Date.now();
  lista.forEach(function(r){
    var id=rpAnimalPorBrinco(dados.animais,r.brinco);
    if(!id){id=rpRef(farm,"animais").push().key;var an={brinco:r.brinco,categoria:r.categoria||"vaca",ativo:true,origem:meta.origem,criado_em:agora};if(r.nome)an.nome=r.nome;if(r.nasc)an.nasc=r.nasc;if(r.lactacao_base!=null)an.lactacao_base=r.lactacao_base;upd["animais/"+id]=an;dados.animais[id]=an;novosA++}
    else if(r.lactacao_base!=null&&dados.animais[id].lactacao_base==null&&!Object.keys(dados.eventos).some(function(k){return dados.eventos[k].animal===id&&dados.eventos[k].tipo==="parto"})){upd["animais/"+id+"/lactacao_base"]=r.lactacao_base}
    (r.eventos||[]).forEach(function(ev){
      if(rpEventoDuplicado(dados.eventos,id,ev)){ign++;return}
      var ek=rpRef(farm,"eventos").push().key;var e=Object.assign({},ev,{animal:id,brinco:r.brinco,por:meta.por,conferido:meta.por!=="produtor",origem:meta.origem,criado_em:agora});
      Object.keys(e).forEach(function(x){if(e[x]===undefined||e[x]==="")delete e[x]});
      upd["eventos/"+ek]=e;dados.eventos[ek]=e;novosE++;
    });
  });
  if(Object.keys(upd).length)await rpRef(farm).update(upd);
  return {animais:novosA,eventos:novosE,ignorados:ign};
}
/* puxa vacas + parto (data − DEL) do controle leiteiro mais recente */
async function rpPuxarControle(farm,dados){
  var s=await db.ref("controle_leiteiro/"+farm).orderByKey().limitToLast(1).once("value");var v=s.val()||{};
  var dt=Object.keys(v).filter(function(k){return /^\d{4}-\d{2}-\d{2}$/.test(k)}).sort().pop();
  if(!dt)return {erro:"Nenhum controle leiteiro encontrado para esta fazenda."};
  var vacas=v[dt].vacas||[];if(!Array.isArray(vacas))vacas=Object.values(vacas);
  var lista=[];
  var conflitos=[];
  vacas.forEach(function(x){var br=rpNormBrinco(x.vaca||x.brinco);if(!br)return;var r={brinco:br,categoria:"vaca",eventos:[]};var del=parseInt(x.del,10);
    var lac=parseInt(x.lactacao!=null?x.lactacao:x.lact,10);
    if(!isNaN(del)&&del>=0&&del<800){var pc=rpAdd(dt,-del);var id=rpAnimalPorBrinco(dados.animais,br);var ult=null;
      if(id)Object.keys(dados.eventos).forEach(function(k){var e=dados.eventos[k];if(e.animal===id&&e.tipo==="parto"&&(!ult||e.data>ult))ult=e.data});
      /* só lança parto se a vaca não tem parto, ou se é claramente um parto novo (200+ dias depois do último) */
      if(!ult||rpDif(pc,ult)>=200)r.eventos.push({tipo:"parto",data:pc});
      else if(Math.abs(rpDif(pc,ult))>20)conflitos.push(br+": controle indica parto em "+rpBR(pc)+", sistema tem "+rpBR(ult));}
    if(!isNaN(lac)&&lac>0)r.lactacao_base=lac-1;
    lista.push(r)});
  var res=await rpGravarLote(farm,dados,lista,{origem:"controle",por:"tecnico"});
  res.data=dt;res.vacas=vacas.length;res.conflitos=conflitos;return res;
}
function rpChip(status){var s=RP_STATUS[status]||RP_STATUS.sem_dados;return '<span class="rp-chip" style="color:'+s.c+';background:'+s.bg+'">'+s.l+'</span>'}
function rpPct(v){return v==null?"—":Math.round(v)+"%"}
function rpLinhaPrevisao(st){
  if(st.status==="saiu")return "Saiu em "+rpBR(st.saiu.data);
  if(st.prenhe)return st.diasGest+" dias de gestação · parto "+rpBR(st.prev.parto)+(st.prev.secagem&&!st.seca?" · secar "+rpBR(st.prev.secagem):"");
  if(st.status==="inseminada")return "IA "+rpBR(st.ultimoServico.data)+" · DG a partir de "+rpBR(st.prev.dg);
  if(st.status==="vazia")return "DEL "+st.del+" · "+(st.nServicos?st.nServicos+" serviço(s) nesta lactação":"sem serviço ainda");
  if(st.status==="pev")return "DEL "+st.del+" · apta em "+rpBR(st.prev.aptaEm);
  if(st.status==="novilha")return "Novilha · sem serviço registrado";
  return "Lance o último parto para calcular";
}
/* timeline HTML de uma vaca */
function rpTimelineHtml(r,opts){opts=opts||{};
  var evs=rpOrdenarEventos(r.evs).reverse();
  if(!evs.length)return '<div style="color:#94a3b8;font-size:12px;padding:8px 0">Nenhum evento lançado ainda.</div>';
  return evs.map(function(e){var t=RP_TIPOS[e.tipo]||{l:e.tipo,i:"•"};
    var det=[];if(e.touro)det.push("Touro: "+rpEsc(e.touro));if(e.tipo==="dg")det.push(e.resultado==="+"?"<b style='color:#15803d'>Prenhe</b>":"<b style='color:#dc2626'>Vazia</b>");if(e.concepcao)det.push("concepção "+rpBR(e.concepcao));if(e.motivo)det.push(rpEsc(e.motivo));if(e.obs)det.push(rpEsc(e.obs));
    var sv=null;if(e.tipo==="ia"||e.tipo==="cobertura"){r.st.todosServicos.forEach(function(s){if(s.id===e.id)sv=s})}
    if(sv&&sv.res==="concepcao")det.push("✅ emprenhou");else if(sv&&sv.res==="falha")det.push("✖ não emprenhou");
    return '<div class="rp-tl"><div class="rp-tl-i">'+t.i+'</div><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px">'+t.l+' <span style="font-weight:500;color:#64748b">· '+rpBR(e.data)+'</span>'+(e.conferido===false?' <span class="rp-chip" style="background:#fef3c7;color:#b45309">a conferir</span>':'')+'</div>'+(det.length?'<div style="font-size:12px;color:#475569">'+det.join(" · ")+'</div>':'')+'</div>'+(opts.acoes?opts.acoes(e):'')+'</div>'}).join("");
}

'.rp-tl{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f1f5f9}.rp-tl:last-child{border-bottom:none}'+
'.rp-tl-i{width:30px;height:30px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}'+
'.rp-prev{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.rp-prev>div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px}.rp-prev small{display:block;font-size:10.5px;color:#64748b;font-weight:600}.rp-prev b{font-size:15px}';
(function(){try{var st=document.createElement("style");st.id="rp-core-css";st.textContent=RP_CSS;document.head.appendChild(st)}catch(e){}})();

var RP_FILTROS=[["todas","Todas"],["prenhe","Prenhes"],["inseminada","Aguardando DG"],["vazia","Vazias"],["pev","Recém-paridas"],["seca","Secas"],["novilha","Novilhas"],["sem_dados","Sem parto"]];
function rpResumoCompacto(R,ag,eventos){var r1=function(v){return v!=null?Math.round(v*10)/10:null};var pend=0;for(var k in eventos){if(eventos[k].conferido===false)pend++}
  return {atualizado:Date.now(),data:rpHoje(),nVacas:R.nVacas,pctPrenhes:r1(R.pctPrenhes),tp:r1(R.tp),ts:r1(R.ts),tc:r1(R.tc),del:R.delMedio!=null?Math.round(R.delMedio):null,dg:ag.dg.length,secar:ag.secar.length,pend:pend}}
function rpPublicarResumo(farm,R,ag,eventos){try{if(!R.nAtivos)return;db.ref("repro_resumo/"+farm).set(rpResumoCompacto(R,ag,eventos)).catch(function(){})}catch(e){}}
