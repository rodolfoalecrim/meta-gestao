<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meta Agenda</title>
<meta name="theme-color" content="#12331d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meta Agenda">
<link rel="apple-touch-icon" href="meta_logo.jpg">
<link rel="icon" href="meta_logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* paleta — caderno de campo, não SaaS genérico */
  --paper:#EEF1E6;--paper2:#E4E9DA;--surface:#fff;--surface2:#F6F7F1;--border:#DCE1D3;
  --ink:#152016;--muted:#5B6B57;--dim:#93A08C;
  --pasture:#2F6B3C;--pasture-dark:#122B18;--pasture-mid:#3D8449;--pasture-light:#E4EFDD;
  --clover:#8FBF2E;--clay:#B5541F;--clay-light:#FBEAE0;--sky:#3E6E8E;
  --yellow:#B5541F;--red:#B0362B;--blue:#3E6E8E;
  --G:var(--pasture);--GD:var(--pasture-dark);--GM:var(--pasture-mid);--GL:var(--pasture-light);
  --text:var(--ink);--bg:var(--paper);
  --font-ui:'Inter',sans-serif;--font-display:'Space Grotesk',sans-serif;--font-mono:'IBM Plex Mono',monospace;
  --shadow:0 2px 10px rgba(18,43,24,.08);--shadow-lg:0 12px 30px rgba(18,43,24,.16);
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
body{font-family:var(--font-ui);background:var(--paper);color:var(--ink);height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px,rgba(18,43,24,.05) 1px,transparent 0);background-size:16px 16px}
button{transition:transform .15s cubic-bezier(.34,1.56,.64,1);font-family:var(--font-ui)}
button:active{transform:scale(.95)}
h1,h2,h3,.font-display{font-family:var(--font-display)}
.mono{font-family:var(--font-mono)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
#loading-screen{position:fixed;inset:0;background:var(--GD);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;color:#fff;font-weight:700;font-family:var(--font-display)}
#login-screen{position:fixed;inset:0;background:linear-gradient(160deg,var(--GD) 0%,var(--pasture-mid) 55%,var(--clover) 130%);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:998}
.login-box{background:#fff;border-radius:22px;padding:34px 28px;width:100%;max-width:380px;box-shadow:0 24px 70px #00000055;animation:riseIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.login-title{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--ink);margin-bottom:4px;text-align:center;letter-spacing:-.3px}
.login-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:26px}
.login-field{margin-bottom:14px}
.login-field label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px}
.login-field input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;font-family:var(--font-ui);outline:none;transition:border-color .15s}
.login-field input:focus{border-color:var(--G)}
.btn-login{width:100%;background:linear-gradient(135deg,var(--pasture-mid),var(--GD));color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;font-family:var(--font-display);letter-spacing:.2px}
#app{display:none;flex-direction:column;height:100dvh;overflow:hidden}
.topbar{background:var(--GD);border-bottom:none;padding:0 16px;height:56px;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:var(--safe-top)}
.topbar-title{font-family:var(--font-display);font-size:16px;font-weight:700;color:#fff;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
.topbar-title .stamp-dot{width:8px;height:8px;border-radius:50%;background:var(--clover);box-shadow:0 0 0 3px rgba(143,191,46,.25)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.topbar-vend{font-size:12px;font-weight:600;color:var(--clover)}
.btn-logout{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.7);font-size:16px;padding:4px}
.content{flex:1;overflow-y:auto;padding:14px 14px 100px;touch-action:pan-y}
.week-nav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.week-nav button{background:var(--pasture-light);color:var(--G);border:none;border-radius:8px;padding:8px 13px;font-weight:700;font-size:14px;cursor:pointer;font-family:var(--font-display)}
.week-nav .wk-label{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--ink);text-align:center;flex:1;letter-spacing:.2px}
.admin-sel{width:100%;margin-bottom:12px;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--GD);background:var(--surface)}
.day-tabs{display:flex;gap:5px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;touch-action:pan-x}
.day-tab{flex:1;text-align:center;background:var(--surface);border:1.5px solid var(--border);border-bottom:none;border-radius:10px 10px 3px 3px;padding:8px 4px 9px;cursor:pointer;font-size:10px;font-weight:700;color:var(--muted);min-width:52px;position:relative;
  border-image:none;box-shadow:0 1px 0 var(--border);text-transform:uppercase;letter-spacing:.3px;transition:background .15s,color .15s,transform .15s}
.day-tab::after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:1px;background:repeating-linear-gradient(90deg,var(--border) 0 4px,transparent 4px 8px)}
.day-tab .dt-num{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--ink);margin-top:1px}
.day-tab.on{background:var(--GD);border-color:var(--GD);color:var(--clover);transform:translateY(-2px)}
.day-tab.on::after{background:repeating-linear-gradient(90deg,rgba(143,191,46,.5) 0 4px,transparent 4px 8px)}
.day-tab.on .dt-num{color:#fff}
.day-tab.today:not(.on){border-color:var(--G);color:var(--G)}
.day-tab.today:not(.on) .dt-num{color:var(--G)}
.day-tab.today:not(.on)::before{content:"";position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--clay)}
.sugg-wrap{background:var(--surface);border:1.5px dashed var(--dim);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.sugg-hdr{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.sugg-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-family:var(--font-display)}
.sugg-count{background:var(--clay);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;font-family:var(--font-mono)}
.sugg-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--border)}
.sugg-item-info{min-width:0}
.sugg-item-nome{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-display)}
.sugg-item-sub{font-size:11px;color:var(--clay);font-weight:600;font-family:var(--font-mono)}
.btn-add-sugg{background:var(--G);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;font-family:var(--font-display)}
.lista-titulo{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--ink);font-family:var(--font-display);display:flex;align-items:center;justify-content:space-between}
.lista-titulo .progresso{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--muted);background:var(--surface2);padding:3px 9px;border-radius:20px;border:1px solid var(--border)}
.item-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--area-color,var(--G));border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:cardIn .35s cubic-bezier(.16,1,.3,1) backwards}
.item-card:nth-child(1){animation-delay:.02s}.item-card:nth-child(2){animation-delay:.06s}.item-card:nth-child(3){animation-delay:.1s}.item-card:nth-child(4){animation-delay:.14s}.item-card:nth-child(5){animation-delay:.18s}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item-farm{font-size:14px;font-weight:700;font-family:var(--font-display)}
.item-area{font-size:10px;font-weight:700;color:var(--area-color,var(--G));text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.item-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;font-family:var(--font-mono)}
.item-meta{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}
.item-meta b{color:var(--ink);font-weight:600;font-family:var(--font-mono)}
.item-actions{display:flex;gap:8px;margin-top:10px}
.btn-checkin{flex:1;background:var(--G);color:#fff;border:none;border-radius:9px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-display);letter-spacing:.2px}
.btn-ghost{background:var(--surface2);color:var(--muted);border:none;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer}
.empty-state{text-align:center;padding:40px 12px;color:var(--muted)}
.empty-state .es-emoji{font-size:34px;margin-bottom:10px;display:block}
.fab{position:fixed;right:18px;bottom:calc(78px + var(--safe-bot));width:56px;height:56px;border-radius:50%;background:var(--clover);color:var(--pasture-dark);border:none;font-size:26px;font-weight:700;box-shadow:0 10px 24px rgba(143,191,46,.45);cursor:pointer;z-index:50}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:var(--GD);display:flex;padding-bottom:var(--safe-bot);z-index:60;box-shadow:0 -4px 16px rgba(18,43,24,.25)}
.bn-tab{flex:1;border:none;background:none;color:rgba(255,255,255,.55);padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;cursor:pointer;font-family:var(--font-display);letter-spacing:.2px}
.bn-tab .bn-ic{font-size:19px}
.bn-tab.on{color:#fff}
.bn-tab.on .bn-ic{transform:translateY(-1px)}
.bn-indicator{position:absolute;top:0;height:2.5px;background:var(--clover);border-radius:0 0 4px 4px;transition:left .25s cubic-bezier(.34,1.56,.64,1),width .25s}
.modal-bg{position:fixed;inset:0;background:rgba(18,43,24,.55);display:none;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(2px)}
.modal-bg.on{display:flex}
.modal-box{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:18px 18px calc(18px + var(--safe-bot));animation:sheetUp .32s cubic-bezier(.16,1,.3,1)}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-title{font-size:17px;font-weight:700;font-family:var(--font-display)}
.modal-close{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer}
.f-field{margin-bottom:12px}
.f-field label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px}
.f-field select,.f-field input,.f-field textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:var(--font-ui);outline:none;background:var(--surface);color:var(--ink)}
.f-field select:focus,.f-field input:focus,.f-field textarea:focus{border-color:var(--G)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.area-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.area-opt{border:1.5px solid var(--border);border-radius:10px;padding:9px 4px;text-align:center;cursor:pointer;font-size:10px;font-weight:700;color:var(--muted)}
.area-opt .ao-ic{font-size:18px;display:block;margin-bottom:3px}
.area-opt.on{border-color:var(--area-color,var(--G));background:color-mix(in srgb,var(--area-color,var(--G)) 12%,#fff);color:var(--area-color,var(--G))}
.btn-save{width:100%;background:linear-gradient(135deg,var(--pasture-mid),var(--GD));color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;font-family:var(--font-display);letter-spacing:.2px}
.gps-box{background:var(--pasture-light);border:1.5px solid var(--G);border-radius:12px;padding:12px;margin-bottom:14px;text-align:center;font-size:12px;font-weight:600;color:var(--GD);font-family:var(--font-mono)}
.gps-box.warn{background:#F7EAD2;border-color:#C98A2E;color:#7A4F0F}
.gps-box.err{background:var(--clay-light);border-color:var(--clay);color:var(--clay)}
.status-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.status-opt{border:1.5px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
.status-opt.on{border-color:var(--G);background:var(--pasture-light);color:var(--GD)}
.foto-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.foto-thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;border:1.5px solid var(--border);position:relative}
.foto-thumb img{width:100%;height:100%;object-fit:cover}
.foto-add-btn{width:56px;height:56px;border-radius:10px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;font-size:22px}
.toast{position:fixed;bottom:calc(84px + var(--safe-bot));left:50%;transform:translateX(-50%) translateY(120px);background:var(--GD);color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== assinatura visual: carimbo de check-in ===== */
.stamp-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:300;pointer-events:none}
.stamp-mark{border:4px solid var(--clover);color:var(--clover);border-radius:50%;width:150px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:1px;background:rgba(238,241,230,.9);
  transform:scale(2.2) rotate(-16deg);opacity:0;animation:stampThump .6s cubic-bezier(.2,1.4,.5,1) forwards}
.stamp-mark .sm-check{font-size:36px;line-height:1}
.stamp-mark .sm-txt{font-size:12px;margin-top:2px}
.stamp-mark.negativo{border-color:var(--clay);color:var(--clay)}
@keyframes stampThump{0%{transform:scale(2.2) rotate(-16deg);opacity:0}55%{transform:scale(.92) rotate(-8deg);opacity:1}75%{transform:scale(1.05) rotate(-10deg)}100%{transform:scale(1) rotate(-10deg);opacity:1}}
@keyframes stampOut{to{opacity:0;transform:scale(1) rotate(-10deg) translateY(-14px)}}
.stamp-mark.out{animation:stampOut .35s ease forwards}

.skeleton{background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 37%,var(--surface2) 63%);background-size:400% 100%;animation:skelWave 1.4s ease infinite;border-radius:14px;height:78px;margin-bottom:10px}
@keyframes skelWave{0%{background-position:100% 0}100%{background-position:0 0}}
</style>
</head>
<body>

<div id="loading-screen">Carregando...</div>

<div id="login-screen">
  <div class="login-box">
    <div class="login-title">📅 Meta Agenda</div>
    <div class="login-sub">Planejamento semanal de visitas</div>
    <div class="login-field"><label>Email</label><input type="email" id="l-email" placeholder="seu@email.com"></div>
    <div class="login-field"><label>Senha</label><input type="password" id="l-senha" placeholder="••••••••"></div>
    <button class="btn-login" onclick="fazerLogin()">Entrar</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-title"><span class="stamp-dot"></span>Meta Agenda</div>
    <div class="topbar-right">
      <span class="topbar-vend" id="tvendedor"></span>
      <button class="btn-logout" onclick="fazerLogout()" title="Sair">⏻</button>
    </div>
  </div>
  <div class="content" id="main-content">

    <select class="admin-sel" id="admin-vend-sel" style="display:none" onchange="onAdminVendMudou()"></select>

    <div id="view-semana">
      <div class="week-nav">
        <button onclick="mudarSemana(-1)">←</button>
        <div class="wk-label" id="wk-label">—</div>
        <button onclick="mudarSemana(1)">→</button>
      </div>

      <div class="day-tabs" id="day-tabs"></div>

      <div class="sugg-wrap" id="sugg-wrap" style="display:none">
        <div class="sugg-hdr" onclick="toggleSugg()">
          <span class="sugg-title">⏰ Sugestões — fazendas sem visita recente</span>
          <span class="sugg-count" id="sugg-count">0</span>
        </div>
        <div id="sugg-body" style="display:none;margin-top:8px"></div>
      </div>

      <div class="lista-titulo" id="lista-titulo">Planejamento do dia</div>
      <div id="itens-lista"></div>
    </div>

    <div id="view-hoje" style="display:none">
      <div class="lista-titulo" id="hoje-titulo">Hoje</div>
      <div id="hoje-lista"></div>
    </div>

  </div>

  <button class="fab" id="fab-add" onclick="abrirModalItem()">+</button>

  <div class="bottom-nav">
    <button class="bn-tab on" id="bn-semana" onclick="trocarView('semana')"><span class="bn-ic">🗂️</span>Planejamento</button>
    <button class="bn-tab" id="bn-hoje" onclick="trocarView('hoje')"><span class="bn-ic">📍</span>Hoje</button>
  </div>
</div>

<div id="stamp-overlay-holder"></div>

<!-- MODAL: novo/editar item -->
<div class="modal-bg" id="modal-item">
  <div class="modal-box">
    <div class="modal-hdr">
      <div class="modal-title">Nova visita planejada</div>
      <button class="modal-close" onclick="fecharModal('modal-item')">✕</button>
    </div>

    <div class="f-field"><label>Área</label>
      <div class="area-pick" id="area-pick"></div>
    </div>

    <div class="f-field"><label>Fazenda</label>
      <input id="mi-farm-input" list="mi-farm-datalist" placeholder="Digite o nome do produtor" autocomplete="off" oninput="onFarmInputMudou()">
      <datalist id="mi-farm-datalist"></datalist>
    </div>

    <div class="f-field"><label>Cidade</label>
      <input id="mi-farm-cidade" placeholder="Cidade da visita">
    </div>

    <div class="f-field"><label>Dia da visita</label>
      <select id="mi-dia"></select>
    </div>

    <div class="f-field"><label>Produto</label>
      <select id="mi-produto-sel" onchange="onProdutoSelMudou()"></select>
      <input id="mi-produto-livre" placeholder="Descreva o produto" style="display:none;margin-top:6px">
    </div>

    <div class="f-field"><label>Objetivo da visita</label>
      <select id="mi-objetivo-sel" onchange="onObjetivoSelMudou()"></select>
      <input id="mi-objetivo-livre" placeholder="Descreva o objetivo" style="display:none;margin-top:6px">
    </div>

    <div class="f-row">
      <div class="f-field"><label>Vai acompanhado?</label>
        <select id="mi-acomp-tipo" onchange="onAcompMudou()">
          <option value="">Nenhum</option>
          <option value="supervisor">Supervisor técnico</option>
          <option value="promotor_externo">Promotor externo</option>
        </select>
      </div>
      <div class="f-field" id="mi-acomp-nome-wrap" style="display:none">
        <label id="mi-acomp-nome-lbl">Nome</label>
        <select id="mi-acomp-nome-sel" style="display:none"></select>
        <input id="mi-acomp-nome-livre" placeholder="Nome do promotor" style="display:none">
      </div>
    </div>

    <button class="btn-save" onclick="salvarItem()">💾 Salvar no planejamento</button>
  </div>
</div>

<!-- MODAL: check-in -->
<div class="modal-bg" id="modal-checkin">

function calcularEstadoInicialSemana(){
  const hoje=new Date();const dow=hoje.getDay();// 0=domingo,6=sábado
  const ehFimDeSemana=dow===6||dow===0;
  let seg=getMonday(hoje);
  if(ehFimDeSemana)seg=addDays(seg,7);
  return{seg,sel:ehFimDeSemana?toISODate(seg):toISODate(hoje)};
}

/* ===================== HELPERS ===================== */
function toISODate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function getMonday(d){const date=new Date(d);const day=date.getDay();const diff=date.getDate()-day+(day===0?-6:1);const m=new Date(date.setDate(diff));m.setHours(0,0,0,0);return m}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function weekKeyOf(monday){const d=new Date(Date.UTC(monday.getFullYear(),monday.getMonth(),monday.getDate()));const dayNum=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-dayNum);const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));const weekNo=Math.ceil((((d-yearStart)/86400000)+1)/7);return d.getUTCFullYear()+"-W"+String(weekNo).padStart(2,"0")}
function showToast(msg,err){const t=document.getElementById("toast");t.textContent=msg;t.style.background=err?"#dc2626":"#052e16";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000)}
function distKm(lat1,lng1,lat2,lng2){const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function getFarmCoords(d){if(!d)return null;if(d.lat&&d.lng)return{lat:parseFloat(d.lat),lng:parseFloat(d.lng)};const key=(d.produtor||"").toUpperCase().trim();if(key&&mapCoordsIndex[key])return mapCoordsIndex[key];return null}
function obterItem(id){return itensSemana[id]||hojeItens[id]}

  document.getElementById("hoje-lista").innerHTML=sk;

function montarSeletorAdmin(){

  const emails=Object.keys(VENDEDOR_MAP);
  sel.innerHTML='<option value="'+usuarioAtual.email.toLowerCase()+'">👤 Minha agenda</option>'+

function onAdminVendMudou(){
  vendedorAlvoEmail=document.getElementById("admin-vend-sel").value;
  somenteLeitura=vendedorAlvoEmail!==usuarioAtual.email.toLowerCase();
  if(somenteLeitura){

function carregarMapCoords(){
  db.ref("map_coords").once("value").then(snap=>{
    const obj=snap.val();if(!obj)return;
    const arr=Array.isArray(obj)?obj:Object.values(obj);
    arr.filter(Boolean).forEach(c=>{if(c.lat&&(c.nome||c.produtor))mapCoordsIndex[(c.nome||c.produtor).toUpperCase().trim()]={lat:parseFloat(c.lat),lng:parseFloat(c.lng)}});
  }).catch(()=>{});
}
function carregarPortfolio(email){
  const nomes=(VENDEDOR_MAP[email]||[]).concat([email.split("@")[0].toUpperCase(),(NOME_AMIGAVEL[email]||"").toUpperCase()]);
  db.ref("propriedades").once("value").then(snap=>{
    clientesById={};meusClientes=[];
    snap.forEach(child=>{
      const d={id:child.key,...child.val()};clientesById[child.key]=d;
      const vNome=(d.nome_vendedor||d.vendedor||"").toUpperCase().trim();
      const vEmail=(d.vendedor||"").toLowerCase().trim();
      const match=nomes.some(n=>vNome===n||vEmail===n.toLowerCase());
      if(match)meusClientes.push(d);
    });
    meusClientes.sort((a,b)=>(a.produtor||"").localeCompare(b.produtor||""));
    renderDayTabs();
    carregarSemana();
    carregarHoje();
  });
}

/* ===================== SEMANA / DIAS ===================== */
function renderWeekLabel(){
  const fim=addDays(currentMonday,5);
  document.getElementById("wk-label").textContent=String(currentMonday.getDate()).padStart(2,"0")+"/"+String(currentMonday.getMonth()+1).padStart(2,"0")+" a "+String(fim.getDate()).padStart(2,"0")+"/"+String(fim.getMonth()+1).padStart(2,"0");
}
function renderDayTabs(){
  const wrap=document.getElementById("day-tabs");
  const hojeISO=toISODate(new Date());
  wrap.innerHTML=DIAS_SEMANA.map(dia=>{
    const dt=addDays(currentMonday,dia.off);
    const iso=toISODate(dt);
    const isToday=iso===hojeISO;
    const isOn=iso===selectedDate;
    return '<div class="day-tab'+(isOn?" on":"")+(isToday?" today":"")+'" onclick="selecionarDia(\''+iso+'\')"><div>'+dia.l+'</div><div class="dt-num">'+String(dt.getDate()).padStart(2,"0")+'</div></div>';
  }).join("");
}
function selecionarDia(iso){selectedDate=iso;renderDayTabs();renderItens()}
function mudarSemana(delta){
  currentMonday=addDays(currentMonday,delta*7);
  const hojeISO=toISODate(new Date());
  const primeiraISO=toISODate(currentMonday);
  selectedDate=(delta===0)?hojeISO:primeiraISO;
  // se a semana atual contém hoje, seleciona hoje; senão seleciona segunda
  const domISO=toISODate(addDays(currentMonday,5));
  selectedDate=(hojeISO>=primeiraISO&&hojeISO<=domISO)?hojeISO:primeiraISO;
  renderDayTabs();
  carregarSemana();
}
function carregarSemana(){
  renderWeekLabel();
  const wk=weekKeyOf(currentMonday);
  if(agendaRefAtual)agendaRefAtual.off();
  agendaRefAtual=db.ref("agendas/"+vendedorAlvoUid+"/"+wk+"/itens");
  agendaRefAtual.on("value",snap=>{
    itensSemana={};
    snap.forEach(c=>{itensSemana[c.key]={id:c.key,...c.val()}});
    renderItens();
    renderSugestoes();
  });
}
function carregarHoje(){
  const wk=weekKeyOf(getMonday(new Date()));
  if(hojeRefAtual)hojeRefAtual.off();
  hojeRefAtual=db.ref("agendas/"+vendedorAlvoUid+"/"+wk+"/itens");
  hojeRefAtual.on("value",snap=>{
    hojeItens={};
    snap.forEach(c=>{hojeItens[c.key]={id:c.key,...c.val()}});
    renderHoje();
  });
}
function trocarView(v){
  viewAtual=v;
  document.getElementById("view-semana").style.display=v==="semana"?"block":"none";
  document.getElementById("view-hoje").style.display=v==="hoje"?"block":"none";

  document.getElementById("bn-hoje").classList.toggle("on",v==="hoje");
  document.getElementById("fab-add").style.display=(v==="semana"&&!somenteLeitura)?"block":"none";
}

/* ===================== SUGESTÕES ===================== */
function renderSugestoes(){
  const wrap=document.getElementById("sugg-wrap");
  if(somenteLeitura){wrap.style.display="none";return}
  const hoje=Date.now();
  const farmIdsJaNaAgenda=new Set(Object.values(itensSemana).map(i=>i.farmId));
  const candidatas=meusClientes.filter(d=>(d.situacao||"").toUpperCase()==="ATIVO"&&!farmIdsJaNaAgenda.has(d.id)).map(d=>{
    const dataRef=d.data_visita||d.atualizado_em;
    const dias=dataRef?Math.floor((hoje-new Date(dataRef).getTime())/864e5):9999;
    return{d,dias};
  }).filter(x=>x.dias>30).sort((a,b)=>b.dias-a.dias).slice(0,8);
  if(!candidatas.length){wrap.style.display="none";return}
  wrap.style.display="block";
  document.getElementById("sugg-count").textContent=candidatas.length;
  document.getElementById("sugg-body").innerHTML=candidatas.map(x=>
    '<div class="sugg-item"><div class="sugg-item-info"><div class="sugg-item-nome">'+(x.d.produtor||"—")+'</div><div class="sugg-item-sub">'+(x.dias>=9000?"sem registro":x.dias+" dias sem visita")+'</div></div>'+
    '<button class="btn-add-sugg" onclick="abrirModalItem(\''+x.d.id+'\')">+ Agendar</button></div>'
  ).join("");
}
function toggleSugg(){const b=document.getElementById("sugg-body");b.style.display=b.style.display==="none"?"block":"none"}

/* ===================== RENDER ITENS DO DIA ===================== */
function renderItens(){
  const dt=new Date(selectedDate+"T00:00:00");
  document.getElementById("lista-titulo").textContent="Planejamento — "+dt.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"});
  const itens=Object.values(itensSemana).filter(i=>i.data===selectedDate).sort((a,b)=>(a.criado_em||"").localeCompare(b.criado_em||""));
  const wrap=document.getElementById("itens-lista");
  if(!itens.length){
    wrap.innerHTML='<div class="empty-state"><div class="es-emoji">🗓️</div>Nenhuma visita planejada para este dia'+(somenteLeitura?"":'<br><br><button class="btn-add-sugg" onclick="abrirModalItem()">+ Adicionar visita</button>')+'</div>';
    return;
  }
  wrap.innerHTML=itens.map(montarCardItem).join("");
}
function montarCardItem(item){
  const hojeISO=toISODate(new Date());
  const area=AREAS[item.area]||AREAS.nutricao;
  const st=STATUS_LABEL[item.status]||STATUS_LABEL.planejado;
  const produto=item.produtoLivre||item.produto||"—";
  const objetivo=item.objetivoLivre||item.objetivo||"—";
  const acomp=item.acompanhante&&item.acompanhante.nome?("<br>👥 <b>Acompanhado por:</b> "+item.acompanhante.nome):"";
  const podeCheckin=!somenteLeitura&&item.status==="planejado"&&item.data<=hojeISO;
  const checkinInfo=item.checkin?('<div class="item-meta">📝 '+(item.checkin.resumo||"")+(item.checkin.localizacaoValidada===false?' <span style="color:var(--clay)">· sem validação de localização</span>':"")+'</div>'):"";
  return '<div class="item-card" style="--area-color:'+area.color+'">'+
    '<div class="item-top"><div><div class="item-farm">'+(item.farmNome||"—")+(item.farmCidade?' <span style="font-weight:600;color:var(--muted);font-size:11px">— '+item.farmCidade+'</span>':"")+'</div><div class="item-area">'+area.icon+' '+area.label+'</div></div>'+
    '<span class="item-badge" style="background:'+st.bg+';color:'+st.c+'">'+st.t+'</span></div>'+
    '<div class="item-meta">📦 <b>Produto:</b> '+produto+'<br>🎯 <b>Objetivo:</b> '+objetivo+acomp+'</div>'+
    checkinInfo+
    (podeCheckin?'<div class="item-actions"><button class="btn-checkin" onclick="abrirModalCheckin(\''+item.id+'\')">📍 Fazer check-in</button></div>':'')+
    '</div>';
}
function renderHoje(){
  const hojeISO=toISODate(new Date());
  const itens=Object.values(hojeItens).filter(i=>i.data===hojeISO).sort((a,b)=>(a.criado_em||"").localeCompare(b.criado_em||""));
  const feitas=itens.filter(i=>i.status!=="planejado").length;
  const titulo=document.getElementById("hoje-titulo");
  titulo.innerHTML="Hoje — "+new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"})+
    (itens.length?'<span class="progresso">'+feitas+" de "+itens.length+"</span>":"");
  const wrap=document.getElementById("hoje-lista");
  if(!itens.length){
    wrap.innerHTML='<div class="empty-state"><div class="es-emoji">☀️</div>Nenhuma visita planejada para hoje'+(somenteLeitura?"":'<br><br><button class="btn-add-sugg" onclick="abrirModalItem()">+ Adicionar visita</button>')+'</div>';
    return;
  }
  wrap.innerHTML=itens.map(montarCardItem).join("");
}

/* ===================== MODAL: NOVO ITEM ===================== */
function farmLabel(d){return d.produtor||"—"}
function abrirModalItem(farmIdPreSelecionado){
  itemEditandoId=null;
  farmLabelToId={};
  meusClientes.forEach(d=>{farmLabelToId[farmLabel(d)]=d.id});
  document.getElementById("mi-farm-datalist").innerHTML=meusClientes.map(d=>'<option value="'+farmLabel(d)+'">').join("");

  document.getElementById("mi-farm-input").value=farmPre?farmLabel(farmPre):"";
  document.getElementById("mi-farm-cidade").value=farmPre?(farmPre.cidade||""):"";
  document.getElementById("mi-dia").innerHTML=DIAS_SEMANA.map(dia=>{const iso=toISODate(addDays(currentMonday,dia.off));return '<option value="'+iso+'"'+(iso===selectedDate?" selected":"")+'>'+dia.l+" ("+String(addDays(currentMonday,dia.off).getDate()).padStart(2,"0")+")"+'</option>'}).join("");
  montarAreaPick("nutricao");
  document.getElementById("mi-produto-livre").style.display="none";document.getElementById("mi-produto-livre").value="";
  document.getElementById("mi-objetivo-livre").style.display="none";document.getElementById("mi-objetivo-livre").value="";
  document.getElementById("mi-acomp-tipo").value="";
  document.getElementById("mi-acomp-nome-wrap").style.display="none";
  document.getElementById("modal-item").classList.add("on");
}
function onFarmInputMudou(){
  const texto=document.getElementById("mi-farm-input").value.trim();
  const farmId=farmLabelToId[texto];
  if(farmId){
    const farm=clientesById[farmId];
    document.getElementById("mi-farm-cidade").value=farm.cidade||"";
  }
}
function montarAreaPick(areaSelecionada){
  const pick=document.getElementById("area-pick");
  pick.innerHTML=Object.entries(AREAS).map(([k,a])=>
    '<div class="area-opt'+(k===areaSelecionada?" on":"")+'" style="--area-color:'+a.color+'" onclick="selecionarArea(\''+k+'\')" data-area="'+k+'"><span class="ao-ic">'+a.icon+'</span>'+a.label+'</div>'
  ).join("");
  window._areaAtual=areaSelecionada;
  carregarListasArea(areaSelecionada);
}
function selecionarArea(k){
  document.querySelectorAll("#area-pick .area-opt").forEach(el=>el.classList.toggle("on",el.dataset.area===k));
  window._areaAtual=k;
  carregarListasArea(k);
}
function carregarListasArea(area){
  const montarSelectProduto=(lista)=>{
    const sel=document.getElementById("mi-produto-sel");
    sel.innerHTML=lista.map(p=>'<option>'+p+'</option>').join("")+'<option value="__outro__">Outro (descrever)</option>';
    sel.value=lista[0]||"__outro__";
    onProdutoSelMudou();
  };
  if(produtosCustomCache[area]){montarSelectProduto(produtosCustomCache[area]);}
  else{
    db.ref("produtosCustom/"+area).once("value").then(snap=>{
      const custom=[];snap.forEach(c=>{if(c.val()&&c.val().valor)custom.push(c.val().valor)});
      const seed=SEED_PRODUTOS[area]||[];
      const todos=[...seed,...custom.filter(c=>!seed.some(s=>s.toUpperCase()===c.toUpperCase()))];
      produtosCustomCache[area]=todos;
      montarSelectProduto(todos);
    }).catch(()=>montarSelectProduto(SEED_PRODUTOS[area]||[]));
  }
  const selObj=document.getElementById("mi-objetivo-sel");
  const montarSelectObjetivo=(lista)=>{
    selObj.innerHTML=lista.map(o=>'<option>'+o+'</option>').join("")+'<option value="__outro__">Outro (descrever)</option>';
    selObj.value=lista[0]||"__outro__";
    onObjetivoSelMudou();
  };
  if(objetivosCustomCache[area]){montarSelectObjetivo(objetivosCustomCache[area]);}
  else{
    db.ref("objetivosCustom/"+area).once("value").then(snap=>{
      const custom=[];snap.forEach(c=>{if(c.val()&&c.val().valor)custom.push(c.val().valor)});
      const todos=[...OBJETIVOS_FIXOS,...custom.filter(c=>!OBJETIVOS_FIXOS.some(s=>s.toUpperCase()===c.toUpperCase()))];
      objetivosCustomCache[area]=todos;
      montarSelectObjetivo(todos);
    }).catch(()=>montarSelectObjetivo(OBJETIVOS_FIXOS));
  }
}
function onProdutoSelMudou(){
  const v=document.getElementById("mi-produto-sel").value;
  document.getElementById("mi-produto-livre").style.display=v==="__outro__"?"block":"none";
}
function onObjetivoSelMudou(){
  const v=document.getElementById("mi-objetivo-sel").value;
  document.getElementById("mi-objetivo-livre").style.display=v==="__outro__"?"block":"none";
}
function onAcompMudou(){
  const tipo=document.getElementById("mi-acomp-tipo").value;
  const wrap=document.getElementById("mi-acomp-nome-wrap");
  const sel=document.getElementById("mi-acomp-nome-sel");
  const livre=document.getElementById("mi-acomp-nome-livre");
  if(!tipo){wrap.style.display="none";return}
  wrap.style.display="block";
  if(tipo==="supervisor"){
    const nomes=Object.values(SUPERVISORES).flat();
    sel.innerHTML=nomes.map(n=>'<option>'+n+'</option>').join("");
    sel.style.display="block";livre.style.display="none";
  }else{
    sel.style.display="none";livre.style.display="block";livre.value="";
  }
}
function fecharModal(id){document.getElementById(id).classList.remove("on")}

async function salvarItem(){
  const farmTexto=document.getElementById("mi-farm-input").value.trim();
  const farmCidade=document.getElementById("mi-farm-cidade").value.trim();
  const farmId=farmLabelToId[farmTexto]||null;
  const farm=farmId?clientesById[farmId]:null;
  if(!farmTexto){showToast("Informe o nome do produtor",true);return}
  if(!farm&&!farmCidade){showToast("Essa fazenda não está no seu portfólio — informe a cidade",true);return}
  const area=window._areaAtual||"nutricao";
  const dia=document.getElementById("mi-dia").value;
  const produtoSel=document.getElementById("mi-produto-sel").value;
  const produtoLivre=document.getElementById("mi-produto-livre").value.trim();
  const objetivoSel=document.getElementById("mi-objetivo-sel").value;
  const objetivoLivre=document.getElementById("mi-objetivo-livre").value.trim();
  const acompTipo=document.getElementById("mi-acomp-tipo").value;
  let acompanhante=null;
  if(acompTipo==="supervisor"){
    acompanhante={tipo:"supervisor",nome:document.getElementById("mi-acomp-nome-sel").value};
  }else if(acompTipo==="promotor_externo"){
    const nome=document.getElementById("mi-acomp-nome-livre").value.trim();
    if(!nome){showToast("Informe o nome do promotor externo",true);return}
    acompanhante={tipo:"promotor_externo",nome};
  }
  if(produtoSel==="__outro__"&&!produtoLivre){showToast("Descreva o produto",true);return}
  if(objetivoSel==="__outro__"&&!objetivoLivre){showToast("Descreva o objetivo",true);return}

  const item={
    farmId,farmNome:(farm?farm.produtor:farmTexto.toUpperCase())||"—",
    farmCidade:farmCidade||(farm?farm.cidade||"":"")||null,
    area,data:dia,
    produto:produtoSel==="__outro__"?null:produtoSel,
    produtoLivre:produtoSel==="__outro__"?produtoLivre.toUpperCase():null,
    objetivo:objetivoSel==="__outro__"?null:objetivoSel,
    objetivoLivre:objetivoSel==="__outro__"?objetivoLivre.toUpperCase():null,
    acompanhante,status:"planejado",criado_em:new Date().toISOString()
  };
  try{
    const wk=weekKeyOf(currentMonday);
    await db.ref("agendas/"+vendedorAlvoUid+"/"+wk+"/itens").push(item);
    if(produtoSel==="__outro__")await db.ref("produtosCustom/"+area).push({valor:produtoLivre.toUpperCase()}).catch(()=>{});
    if(objetivoSel==="__outro__")await db.ref("objetivosCustom/"+area).push({valor:objetivoLivre.toUpperCase()}).catch(()=>{});
    fecharModal("modal-item");
    showToast("✅ Visita adicionada ao planejamento");
  }catch(e){showToast("Erro ao salvar: "+(e.message||""),true)}
}

/* ===================== MODAL: CHECK-IN ===================== */
function abrirModalCheckin(itemId){
  itemEditandoId=itemId;
  ciFotoBase64=null;
  document.getElementById("ci-foto-preview").innerHTML="";
  document.getElementById("ci-obs").value="";
  ciStatusSelecionado="realizado";
  document.getElementById("ci-status-pick").innerHTML=[
    {k:"realizado",l:"✅ Realizada"},{k:"nao_realizado",l:"❌ Não realizada"},
    {k:"remarcado",l:"🔁 Remarcada"},{k:"produtor_ausente",l:"🚫 Produtor ausente"}
  ].map(s=>'<div class="status-opt'+(s.k===ciStatusSelecionado?" on":"")+'" data-st="'+s.k+'" onclick="selecionarStatusCheckin(\''+s.k+'\')">'+s.l+'</div>').join("");

  const item=obterItem(itemId);
  const area=item.area||"nutricao";
  const montarSelectProdutoCi=(lista)=>{
    const sel=document.getElementById("ci-produto-sel");
    sel.innerHTML=lista.map(p=>'<option>'+p+'</option>').join("")+'<option value="__outro__">Outro (descrever)</option>';
    sel.value=item.produtoLivre?"__outro__":(item.produto||lista[0]);
    onCiProdutoSelMudou();
    if(item.produtoLivre)document.getElementById("ci-produto-livre").value=item.produtoLivre;
  };
  if(produtosCustomCache[area])montarSelectProdutoCi(produtosCustomCache[area]);
  else db.ref("produtosCustom/"+area).once("value").then(snap=>{
    const custom=[];snap.forEach(c=>{if(c.val()&&c.val().valor)custom.push(c.val().valor)});
    const seed=SEED_PRODUTOS[area]||[];
    const todos=[...seed,...custom.filter(c=>!seed.some(s=>s.toUpperCase()===c.toUpperCase()))];
    produtosCustomCache[area]=todos;montarSelectProdutoCi(todos);
  }).catch(()=>montarSelectProdutoCi(SEED_PRODUTOS[area]||[]));

  document.getElementById("modal-checkin").classList.add("on");
  obterGeolocalizacaoCheckin(item);
}
function selecionarStatusCheckin(k){
  ciStatusSelecionado=k;
  document.querySelectorAll("#ci-status-pick .status-opt").forEach(el=>el.classList.toggle("on",el.dataset.st===k));
}
function onCiProdutoSelMudou(){
  const v=document.getElementById("ci-produto-sel").value;
  document.getElementById("ci-produto-livre").style.display=v==="__outro__"?"block":"none";
}
function onCiFotoSelecionada(event){
  const file=event.target.files&&event.target.files[0];event.target.value="";
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX_W=800;const escala=Math.min(1,MAX_W/img.width);
      const w=Math.round(img.width*escala),h=Math.round(img.height*escala);
      const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      ciFotoBase64=canvas.toDataURL("image/jpeg",.6);
      document.getElementById("ci-foto-preview").innerHTML='<div class="foto-thumb"><img src="'+ciFotoBase64+'"></div>';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function obterGeolocalizacaoCheckin(item){
  const box=document.getElementById("ci-gps-box");
  ciGeo=null;
  if(!navigator.geolocation){
    box.className="gps-box warn";box.textContent="⚠️ GPS indisponível neste dispositivo — check-in seguirá sem validação de localização";
    return;
  }
  box.className="gps-box";box.textContent="📍 Obtendo localização...";
  navigator.geolocation.getCurrentPosition(pos=>{
    ciGeo={lat:pos.coords.latitude,lng:pos.coords.longitude};
    const farmCoords=getFarmCoords(clientesById[item.farmId]);
    if(!farmCoords){
      box.className="gps-box warn";box.textContent="⚠️ Fazenda sem coordenadas cadastradas — check-in seguirá sem validação de localização";
      return;
    }
    const d=distKm(ciGeo.lat,ciGeo.lng,farmCoords.lat,farmCoords.lng);
    if(d<=CHECKIN_RAIO_KM){
      box.className="gps-box";box.textContent="✅ Localização confirmada — você está a "+d.toFixed(1)+" km da fazenda";
    }else{
      box.className="gps-box warn";box.textContent="⚠️ Você está a "+d.toFixed(1)+" km da fazenda (fora do raio) — check-in seguirá com aviso";
    }
  },err=>{
    box.className="gps-box err";box.textContent="⚠️ Não foi possível obter o GPS — check-in seguirá sem validação de localização";
  },{enableHighAccuracy:true,timeout:10000,maximumAge:0});
}
async function salvarCheckin(){
  const item=obterItem(itemEditandoId);
  if(!item)return;
  const produtoSel=document.getElementById("ci-produto-sel").value;
  const produtoLivre=document.getElementById("ci-produto-livre").value.trim();
  if(produtoSel==="__outro__"&&!produtoLivre){showToast("Descreva o produto",true);return}
  const obs=document.getElementById("ci-obs").value.trim();

  const farmCoords=getFarmCoords(clientesById[item.farmId]);
  let localizacaoValidada=false,distanciaKm=null,motivo="sem_coordenada";
  if(ciGeo&&farmCoords){
    distanciaKm=Number(distKm(ciGeo.lat,ciGeo.lng,farmCoords.lat,farmCoords.lng).toFixed(2));
    localizacaoValidada=distanciaKm<=CHECKIN_RAIO_KM;
    motivo=localizacaoValidada?"ok":"fora_do_raio";
  }else if(!ciGeo){
    motivo="gps_indisponivel";
  }

  const statusMap={realizado:"realizado",nao_realizado:"nao_realizado",remarcado:"remarcado",produtor_ausente:"nao_realizado"};
  const checkin={
    timestamp:new Date().toISOString(),
    lat:ciGeo?ciGeo.lat:null,lng:ciGeo?ciGeo.lng:null,
    localizacaoValidada,distanciaKm,motivo,
    resumo:(ciStatusSelecionado==="produtor_ausente"?"Produtor ausente. ":"")+obs,
    produtoConfirmado:produtoSel==="__outro__"?produtoLivre.toUpperCase():produtoSel
  };

  const wk=weekKeyOf(getMonday(new Date(item.data+"T00:00:00")));
  const ref=db.ref("agendas/"+vendedorAlvoUid+"/"+wk+"/itens/"+itemEditandoId);
  try{
    await ref.update({status:statusMap[ciStatusSelecionado]||"realizado",checkin});
    if(produtoSel==="__outro__")await db.ref("produtosCustom/"+item.area).push({valor:produtoLivre.toUpperCase()}).catch(()=>{});
    if(ciFotoBase64){
      const blob=await(await fetch(ciFotoBase64)).blob();
      const path="agenda_checkins/"+item.farmId+"/"+Date.now()+".jpg";
      const sref=storage.ref().child(path);
      await sref.put(blob,{contentType:"image/jpeg"});
      const url=await sref.getDownloadURL();
      await ref.update({"checkin/fotoUrl":url});
    }
    fecharModal("modal-checkin");
    mostrarCarimbo(ciStatusSelecionado==="realizado");
    showToast("✅ Check-in registrado");
  }catch(e){showToast("Erro ao registrar check-in: "+(e.message||""),true)}
}
function mostrarCarimbo(sucesso){
  const holder=document.getElementById("stamp-overlay-holder");
  const overlay=document.createElement("div");
  overlay.className="stamp-overlay";
  overlay.innerHTML='<div class="stamp-mark'+(sucesso?"":" negativo")+'"><div class="sm-check">'+(sucesso?"✓":"✕")+'</div><div class="sm-txt">'+(sucesso?"Visitado":"Registrado")+'</div></div>';
  holder.appendChild(overlay);
  const mark=overlay.querySelector(".stamp-mark");
  setTimeout(()=>{mark.classList.add("out")},900);
  setTimeout(()=>{overlay.remove()},1300);
}

/* ===================== GESTO: arrastar pra trocar de dia ===================== */
(function initSwipeDias(){
  const el=document.getElementById("itens-lista");
  if(!el)return;
  let sx=0,sy=0,st=0;
  el.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
  el.addEventListener("touchend",e=>{
    const t=e.changedTouches[0];
    const dx=t.clientX-sx,dy=t.clientY-sy,dt=Date.now()-st;
    if(Math.abs(dx)>60&&Math.abs(dy)<50&&dt<600){
      const idx=DIAS_SEMANA.findIndex(d=>toISODate(addDays(currentMonday,d.off))===selectedDate);
      if(idx===-1)return;
      if(dx<0&&idx<DIAS_SEMANA.length-1)selecionarDia(toISODate(addDays(currentMonday,DIAS_SEMANA[idx+1].off)));
      else if(dx>0&&idx>0)selecionarDia(toISODate(addDays(currentMonday,DIAS_SEMANA[idx-1].off)));
    }
  },{passive:true});
})();
</script>
